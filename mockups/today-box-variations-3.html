<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today box, round 3</title>

<link rel="stylesheet" href="../memento-app/css/base.css?v=r3a" onerror="this.href='../css/base.css?v=r3a'">
<link rel="stylesheet" href="../memento-app/css/dashboard.css?v=r3a" onerror="this.href='../css/dashboard.css?v=r3a'">

<style>
  html, body { margin:0; background:#08090b; color:#f5f5f7;
    font-family:-apple-system, system-ui, sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:26px 20px 120px; }
  h1 { font-size:23px; font-weight:750; letter-spacing:-.02em; margin:0 0 6px; }
  .lede { font-size:14px; line-height:1.6; color:rgba(245,245,247,.62); max-width:76ch; margin:0 0 4px; }
  .sect { font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(245,245,247,.40); margin:38px 0 20px; padding-top:20px;
    border-top:1px solid rgba(255,255,255,.09); }
  .v { margin:0 0 46px; }
  .v__name { font-size:15.5px; font-weight:700; letter-spacing:-.01em; margin:0 0 3px; }
  .v__why  { font-size:13px; line-height:1.55; color:rgba(245,245,247,.56); margin:0 0 15px; max-width:80ch; }
  .try { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:#0b1112; background:#f5f5f7; border-radius:4px;
    padding:2px 7px; margin-left:8px; vertical-align:2px; }
  .pair { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
  .cap { font-size:11px; font-weight:650; letter-spacing:.06em; text-transform:uppercase;
    color:rgba(245,245,247,.34); margin:0 0 8px; }
  .phone { width:340px; flex:none; }
  .desk  { flex:1 1 440px; min-width:400px; max-width:540px; }
  .stage { border-radius:16px; background:#000; padding:16px; }

  .tb { border-radius:16px; background:var(--surface-1); padding:20px;
        box-shadow:var(--shadow-card), inset 0 1px 0 rgba(255,255,255,.06); }
  .tb__move { font-size:19px; font-weight:700; line-height:1.3; letter-spacing:-.015em;
              color:var(--text-hi); margin:0 0 16px; }
  .tb__go { font:inherit; font-weight:700; font-size:15px; border:0; cursor:pointer;
            border-radius:10px; padding:13px 22px; background:var(--solid-bg); color:var(--solid-fg); }
  .desk .tb { padding:26px 28px; }
  .desk .tb__move { font-size:31px; letter-spacing:-.028em; line-height:1.14; }

  /* ══ 26 · THE INVERT WIPE (his idea) ══════════════════════════════════
     Two identical cards stacked. The top one is the negative, revealed by a
     clip that grows with the hold, so the card turns inside out edge to edge
     and the finished state IS the inverse. */
  .inv { position:relative; border-radius:16px; overflow:hidden; cursor:pointer;
         touch-action:none; user-select:none; }
  .inv__face { padding:20px; }
  .desk .inv__face { padding:26px 28px; }
  .inv__base { background:var(--surface-1); box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
  .inv__base .m { color:var(--text-hi); }
  .inv__base .g { background:#f5f5f7; color:#0b1112; }
  .inv__on { position:absolute; inset:0; background:#f5f5f7;
             clip-path:inset(0 100% 0 0); will-change:clip-path; }
  .inv__on .m { color:#0b1112; }
  .inv__on .g { background:#0b1112; color:#f5f5f7; }
  .m { font-size:19px; font-weight:700; line-height:1.3; letter-spacing:-.015em; margin:0 0 16px; }
  .desk .m { font-size:31px; letter-spacing:-.028em; line-height:1.14; }
  .g { display:inline-block; font-weight:700; font-size:15px; border-radius:10px; padding:13px 22px; }

  /* ══ 27 / 28 · SWIPE AWAY + WHAT IS LEFT ═════════════════════════════ */
  .sw { position:relative; }
  .sw__card { touch-action:none; user-select:none; cursor:grab; will-change:transform; }
  .sw__after { position:absolute; inset:0; display:flex; align-items:center;
               opacity:0; pointer-events:none; }
  .sw__line { font-size:15px; color:var(--text-2); }
  .sw__hint { font-size:12px; color:var(--text-lo); margin:10px 0 0; }
  /* 28's after-state: the Memento alone */
  .memcard { width:96px; height:130px; border-radius:12px; flex:none;
    background:linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.05));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 18px 40px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; }
  .memcard svg { width:26px; height:27px; }
  .memcard path { fill:rgba(245,245,247,.55); }
  .after-row { display:flex; align-items:center; gap:18px; }

  /* ══ THE PILLAR SWAP ═════════════════════════════════════════════════ */
  .pil__body { min-height:118px; }
  .desk .pil__body { min-height:150px; }
  .pil__lab { font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
              color:var(--text-lo); margin:0 0 8px; }
  .pil__why { font-size:13.5px; line-height:1.5; color:var(--text-2); margin:8px 0 0; }
  .desk .pil__why { font-size:15px; }
  .pil__ticks { display:flex; align-items:flex-end; gap:6px; height:26px; margin:0 0 14px; }
  .pil__ticks i { display:block; width:2px; height:12px; background:rgba(255,255,255,.20); border-radius:1px; }
  .pil__ticks i.on { background:rgba(255,255,255,.50); }
  .pil__ticks i.now { height:26px; background:#fff; }

  /* 29 · page dots */
  .dots { display:flex; gap:7px; justify-content:center; margin:16px 0 0; }
  .dots i { width:6px; height:6px; border-radius:999px; background:rgba(255,255,255,.22); cursor:pointer; }
  .dots i.on { background:#fff; }

  /* 30 · hairline tabs */
  .tabs { display:flex; gap:22px; margin:0 0 16px; }
  .tabs button { font:inherit; font-size:12.5px; font-weight:650; letter-spacing:.01em;
    background:none; border:0; padding:0 0 7px; cursor:pointer; color:var(--text-lo); }
  .tabs button.on { color:var(--text-hi); box-shadow:0 1.5px 0 #fff; }

  /* 31 · no chrome, swipe only */
  .ghost .dots { opacity:0; transition:opacity .25s ease; }
  .ghost:hover .dots, .ghost.is-live .dots { opacity:1; }

  /* 32 · stacked deck */
  .deck { position:relative; }
  .deck__peek { position:absolute; left:8px; right:8px; top:-7px; height:22px; border-radius:14px;
    background:var(--surface-1); box-shadow:inset 0 1px 0 rgba(255,255,255,.05); opacity:.55; }
  .deck__peek--2 { left:16px; right:16px; top:-13px; opacity:.28; }

  /* 33 · the label is the switch */
  .swaplab { font:inherit; font-size:11px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:var(--text-lo); background:none; border:0; padding:0;
    cursor:pointer; margin:0 0 8px; display:inline-flex; align-items:center; gap:6px; }
  .swaplab svg { width:11px; height:11px; opacity:.7; }
</style>
</head>
<body class="ns-bloom">
<div class="wrap">
  <h1>Today box, round 3</h1>
  <p class="lede">Three things: your invert idea built for real, a proper answer to &ldquo;what happens after the swipe&rdquo;, and five tasteful ways to swap the box between Action, Clarity and Consistency.</p>

  <div class="sect">Your invert idea</div>
  <div id="a"></div>

  <div class="sect">Swipe away, and what is left</div>
  <div id="b"></div>

  <div class="sect">Swapping between the three pillars</div>
  <div id="c"></div>
</div>

<script>
const MOVE = "Write the first draft of this week's video script";
const MARK = '<svg viewBox="140 136 232 240"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>';

/* the three pillars, same shape every time */
const PILLARS = {
  action: (d) => `<p class="pil__lab">Today</p><p class="tb__move" style="margin-bottom:14px">${MOVE}</p><button class="tb__go">Mark Complete</button>`,
  clarity: (d) => `<p class="pil__lab">Your Neutron Star</p><p class="tb__move" style="margin-bottom:0">Build Memento into something thousands of people actually use.</p><p class="pil__why">Because watching people scroll their lives away is the thing you cannot let stand.</p>`,
  consistency: (d) => `<p class="pil__lab">Rhythm</p><div class="pil__ticks"><i class="on"></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="now"></i></div><p class="tb__move" style="margin-bottom:0">8 days in a row.</p><p class="pil__why">20 active days since you started. Longest run so far: 8.</p>`
};
const ORDER = ['action', 'clarity', 'consistency'];
const NAMES = { action:'Action', clarity:'Clarity', consistency:'Consistency' };

const A = [
  { k:'v26', n:26, name:'The invert wipe', try:true,
    why:'Your idea, built. Hold anywhere on the card and it turns inside out from left to right: dark card with light text becomes light card with dark text, button included. When it lands, the finished state IS the negative, so &ldquo;done&rdquo; needs no tick, no colour and no extra word. Hold it.',
    body:(d)=>`<div class="inv" data-inv>
        <div class="inv__face inv__base"><p class="m">${MOVE}</p><span class="g">Hold to complete</span></div>
        <div class="inv__face inv__on" aria-hidden="true"><p class="m">${MOVE}</p><span class="g">Hold to complete</span></div>
      </div>` }
];

const B = [
  { k:'v27', n:27, name:'Swipe away &rarr; the quiet line', try:true,
    why:'Drag the card off and what stays is one sentence, no card, no button. The screen gets emptier as a reward. Let go before the edge and it springs back, so it can never happen by accident.',
    body:(d)=>`<div class="sw">
        <div class="tb sw__card" data-sw><p class="tb__move" style="margin-bottom:0">${MOVE}</p><p class="sw__hint">Drag right to finish &rarr;</p></div>
        <div class="sw__after"><p class="sw__line">Done for today. See you tomorrow.</p></div>
      </div>` },
  { k:'v28', n:28, name:'Swipe away &rarr; your Memento alone', try:true,
    why:'Same drag, better payoff: the task leaves and the only thing left on the home is your Memento. Finishing literally clears the screen down to the object you are building. This is the one I would ship.',
    body:(d)=>`<div class="sw">
        <div class="tb sw__card" data-sw><p class="tb__move" style="margin-bottom:0">${MOVE}</p><p class="sw__hint">Drag right to finish &rarr;</p></div>
        <div class="sw__after"><div class="after-row"><span class="memcard">${MARK}</span><span class="sw__line">That is today.</span></div></div>
      </div>` }
];

const C = [
  { k:'v29', n:29, name:'Page dots', try:true,
    why:'Three dots under the card, exactly like a photo carousel. Universally understood, costs six pixels of chrome, and nothing is labelled until you land on it.',
    body:(d)=>`<div data-pil="dots"><div class="pil__body">${PILLARS.action(d)}</div>
      <div class="dots"><i class="on"></i><i></i><i></i></div></div>` },
  { k:'v30', n:30, name:'Hairline tabs', try:true,
    why:'The three words sit above the content, and only the live one is lit with a hairline under it. No pills, no fills, no colour. Reads like a magazine contents line.',
    body:(d)=>`<div data-pil="tabs"><div class="tabs">${ORDER.map((p,i)=>`<button class="${i===0?'on':''}">${NAMES[p]}</button>`).join('')}</div>
      <div class="pil__body">${PILLARS.action(d)}</div></div>` },
  { k:'v31', n:31, name:'No chrome at all', try:true,
    why:'Nothing on screen. You just swipe the card sideways and the dots fade in only while you are moving between them, then disappear. The calmest possible version, at the cost of being discoverable.',
    body:(d)=>`<div class="ghost" data-pil="ghost"><div class="pil__body">${PILLARS.action(d)}</div>
      <div class="dots"><i class="on"></i><i></i><i></i></div></div>` },
  { k:'v32', n:32, name:'Stacked deck', try:true,
    why:'The other two pillars peek out behind the live one like a deck of cards. You can see there is more without being told, and swapping feels like dealing the next card.',
    body:(d)=>`<div class="deck" data-pil="deck"><span class="deck__peek deck__peek--2"></span><span class="deck__peek"></span>
      <div class="pil__body" style="position:relative">${PILLARS.action(d)}</div>
      <div class="dots"><i class="on"></i><i></i><i></i></div></div>` },
  { k:'v33', n:33, name:'The label is the switch', try:true,
    why:'Zero added elements: the small word already at the top of the card becomes the control. Tap &ldquo;Today&rdquo; and it cycles to &ldquo;Your Neutron Star&rdquo;, then &ldquo;Rhythm&rdquo;. The chrome is the label you were already showing.',
    body:(d)=>`<div data-pil="label"><div class="pil__body">${PILLARS.action(d)}</div></div>` }
];

const render = (list) => list.map(v => `
  <div class="v">
    <p class="v__name">${v.n} &middot; ${v.name}${v.try ? '<span class="try">Try me</span>' : ''}</p>
    <p class="v__why">${v.why}</p>
    <div class="pair">
      <div class="phone ${v.k}"><p class="cap">Phone</p><div class="stage">${v.k==='v26'?v.body(false):`<div class="tb">${v.body(false)}</div>`}</div></div>
      <div class="desk ${v.k}"><p class="cap">Desktop &amp; iPad</p><div class="stage">${v.k==='v26'?v.body(true):`<div class="tb">${v.body(true)}</div>`}</div></div>
    </div>
  </div>`).join('');

document.getElementById('a').innerHTML = render(A);
document.getElementById('b').innerHTML = render(B);
document.getElementById('c').innerHTML = render(C);

/* ── the invert wipe ─────────────────────────────────────────────────── */
const HOLD_MS = 1100;
document.querySelectorAll('[data-inv]').forEach(card => {
  const on = card.querySelector('.inv__on');
  let raf = null, t0 = 0, done = false;
  const set = p => { on.style.clipPath = 'inset(0 ' + ((1 - p) * 100).toFixed(2) + '% 0 0)'; };
  const step = now => {
    const p = Math.min(1, (now - t0) / HOLD_MS);
    set(p);
    if (p >= 1) { done = true; return; }
    raf = requestAnimationFrame(step);
  };
  card.addEventListener('pointerdown', e => {
    if (done) { done = false; set(0); return; }
    e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(step);
  });
  const release = () => { if (done) return; if (raf) cancelAnimationFrame(raf); raf = null; set(0); };
  document.addEventListener('pointerup', release);
  document.addEventListener('pointercancel', release);
});

/* ── swipe away, with a real after-state ─────────────────────────────── */
document.querySelectorAll('[data-sw]').forEach(card => {
  const after = card.parentElement.querySelector('.sw__after');
  let dragging = false, startX = 0, w = 0;
  card.addEventListener('pointerdown', e => {
    dragging = true; startX = e.clientX; w = card.offsetWidth;
    card.style.transition = 'none'; card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = Math.max(0, e.clientX - startX);
    card.style.transform = 'translateX(' + dx + 'px)';
    card.style.opacity = String(Math.max(0, 1 - dx / (w * 0.6)));
    after.style.opacity = String(Math.min(1, dx / (w * 0.5)));
  });
  const end = e => {
    if (!dragging) return; dragging = false;
    const dx = Math.max(0, (e.clientX || 0) - startX);
    card.style.transition = 'transform .34s cubic-bezier(.3,.8,.3,1), opacity .34s ease-out';
    after.style.transition = 'opacity .34s ease-out';
    if (dx > w * 0.42) {            // committed: it leaves
      card.style.transform = 'translateX(' + (w + 60) + 'px)';
      card.style.opacity = '0'; after.style.opacity = '1';
      setTimeout(() => {            // reset so he can try it again
        card.style.transition = 'none'; card.style.transform = 'translateX(0)';
        after.style.opacity = '0';
        setTimeout(() => { card.style.transition = 'opacity .4s ease-out'; card.style.opacity = '1'; }, 900);
      }, 2200);
    } else {                        // sprang back
      card.style.transform = 'translateX(0)'; card.style.opacity = '1'; after.style.opacity = '0';
    }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
});

/* ── pillar swapping ─────────────────────────────────────────────────── */
const isDesk = el => !!el.closest('.desk');
document.querySelectorAll('[data-pil]').forEach(root => {
  const kind = root.getAttribute('data-pil');
  const body = root.querySelector('.pil__body');
  const dots = root.querySelector('.dots');
  const tabs = root.querySelector('.tabs');
  let i = 0;
  const paint = () => {
    body.innerHTML = PILLARS[ORDER[i]](isDesk(root));
    if (dots) [...dots.children].forEach((d, n) => d.classList.toggle('on', n === i));
    if (tabs) [...tabs.children].forEach((b, n) => b.classList.toggle('on', n === i));
    if (kind === 'label') wireLabel();
    body.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: 'ease-out' });
  };
  const go = n => { i = (n + ORDER.length) % ORDER.length; paint(); };

  function wireLabel() {
    const lab = body.querySelector('.pil__lab');
    if (!lab) return;
    const b = document.createElement('button');
    b.className = 'swaplab';
    b.innerHTML = lab.textContent + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
    b.addEventListener('click', () => go(i + 1));
    lab.replaceWith(b);
  }

  if (dots) [...dots.children].forEach((d, n) => d.addEventListener('click', () => go(n)));
  if (tabs) [...tabs.children].forEach((b, n) => b.addEventListener('click', () => go(n)));
  if (kind === 'label') wireLabel();

  // horizontal drag switches on every version, the way it would on a phone
  let sx = null;
  root.addEventListener('pointerdown', e => { sx = e.clientX; if (kind === 'ghost') root.classList.add('is-live'); });
  root.addEventListener('pointerup', e => {
    if (sx === null) return;
    const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1));
    if (kind === 'ghost') setTimeout(() => root.classList.remove('is-live'), 900);
  });
});
</script>
</body>
</html>
