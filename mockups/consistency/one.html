<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consistency, the merged page</title>
<link rel="stylesheet" href="_kit.css">
<style>
  html, body { background: #060708; }
  body { margin: 0; color: var(--text-hi, #fff); font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; }

  /* pinned lab controls */
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: rgba(6,7,10,0.94);
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
    border-bottom: 1px solid var(--hairline, rgba(255,255,255,0.09)); padding: 10px 16px; }
  .bar__in { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .bar__row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar__row input[type=range] { flex: 1; min-width: 120px; accent-color: #3fd94e; height: 4px; }
  .bar__day { font-size: 14px; font-weight: 700; min-width: 74px; font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { font: inherit; font-size: 11.5px; font-weight: 600; color: var(--text-mid, rgba(255,255,255,0.8));
    background: rgba(255,255,255,0.05); border: 0; border-radius: 7px; padding: 5px 10px; cursor: pointer;
    font-variant-numeric: tabular-nums; }
  .chips button.on { color: #06140a; background: #3fd94e; }

  /* ============ mobile: two snap pages ============ */
  #snap { height: 100dvh; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; }
  #snap::-webkit-scrollbar { display: none; }
  .pg { scroll-snap-align: start; scroll-snap-stop: always; min-height: 100dvh; box-sizing: border-box; }

  /* page one: the number, left aligned */
  #pgOne { display: grid; align-content: center; justify-items: start; text-align: left;
    padding: 100px 26px 70px; position: relative; }
  .one__brand { position: absolute; top: 100px; left: 26px; color: rgba(255,255,255,0.22); }
  .one__num { font-weight: 700; color: var(--text-hi, #fff); line-height: 0.86; letter-spacing: -0.05em;
    font-variant-numeric: tabular-nums; margin: 0 0 14px; }
  .one__sub { font-size: 17px; color: var(--text-mid, rgba(255,255,255,0.8)); line-height: 1.45; max-width: 320px; }
  .one__today { display: flex; align-items: center; gap: 9px; margin-top: 22px;
    font-size: 13.5px; color: var(--text-mid, rgba(255,255,255,0.8)); }
  .one__today u { width: 9px; height: 9px; border-radius: 50%; background: #3fd94e; display: block; flex: 0 0 auto; }
  .one__today.off u { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.28); }
  .one__hint { position: absolute; bottom: 28px; left: 26px; right: 26px;
    font-size: 12px; color: var(--text-lo, rgba(255,255,255,0.46)); }
  .one__hint svg { display: block; margin: 5px 0 0; opacity: 0.6; }

  /* page two: the evidence room */
  #pgTwo { padding: 86px 18px 90px; }
  .ev { max-width: 430px; margin: 0 auto; }
  .ev__hero { margin-bottom: 4px; }
  .ev__say { font-size: 15px; color: var(--text-mid, rgba(255,255,255,0.8)); font-weight: 500; }
  .ev__num { font-size: 56px; font-weight: 700; letter-spacing: -0.04em; line-height: 0.95;
    font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
  .ev__since { font-size: 13px; color: var(--text-lo, rgba(255,255,255,0.46)); }
  .sec { margin-top: 28px; }
  .sec__h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .sec__h b { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .sec__h i { font-style: normal; font-size: 12px; color: var(--text-lo, rgba(255,255,255,0.46));
    font-variant-numeric: tabular-nums; }

  /* at a glance: the pattern value + bar + the recent strip, one block */
  .glance { background: rgba(255,255,255,0.05); border-radius: 18px; padding: 16px;
    -webkit-backdrop-filter: blur(28px) saturate(1.4); backdrop-filter: blur(28px) saturate(1.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 30px rgba(0,0,0,0.38); }
  .glance__v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .glance__bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.07); margin: 12px 0 16px;
    overflow: hidden; position: relative; }
  .glance__bar u { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: #3fd94e; }
  .glance__bar i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: rgba(255,255,255,0.35);
    border-radius: 1px; }
  .glance__strip { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; }
  .glance__strip b { aspect-ratio: 1; border-radius: 5px; background: rgba(255,255,255,0.05); }
  .glance__strip b.kept { background: rgba(63,217,78,0.62); }
  .glance__strip b.rest { background: rgba(255,255,255,0.02); }
  .glance__strip b.sup { background: rgba(63,217,78,0.22); }
  .glance__strip b.today { outline: 1.5px solid rgba(63,217,78,0.95); outline-offset: -1.5px; }
  .glance { position: relative; overflow: hidden; }
  .glance__m { position: absolute; right: -22px; bottom: -30px; color: rgba(63,217,78,0.06); pointer-events: none; }
  .score { display: flex; align-items: baseline; gap: 12px; position: relative; }
  .score__n { font-size: 54px; font-weight: 750; letter-spacing: -0.04em; line-height: 0.9;
    color: var(--text-hi, #fff); font-variant-numeric: tabular-nums; }
  .score__lbl { font-size: 13px; color: var(--text-mid, rgba(255,255,255,0.8)); }
  .score__hm { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; margin-top: 16px; position: relative; }
  .score__hm b { aspect-ratio: 1; border-radius: 5px; background: rgba(255,255,255,0.05); }

  /* ---- the calendar, month view ---- */
  .scale { display: inline-flex; gap: 2px; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 2px; }
  .scale button { font: inherit; font-size: 12px; font-weight: 650; color: var(--text-mid, rgba(255,255,255,0.8));
    background: transparent; border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  .scale button.on { color: var(--text-hi, #fff); background: rgba(255,255,255,0.1); }
  .mh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .mh b { font-size: 27px; font-weight: 700; letter-spacing: -0.03em; }
  .mh i { font-style: normal; font-size: 14px; color: var(--text-mid, rgba(255,255,255,0.8));
    font-variant-numeric: tabular-nums; }
  .mh i em { font-style: normal; font-weight: 700; font-size: 18px; color: var(--text-hi, #fff); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr) 34px; gap: 6px; position: relative; }
  .cal-thread { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .cal > * { position: relative; z-index: 1; }
  .cal .wd { font-size: 11px; color: var(--text-lo, rgba(255,255,255,0.46)); text-align: center;
    padding-bottom: 2px; }
  .cal .wd.g { color: var(--text-lo, rgba(255,255,255,0.32)); }
  .cal .d { aspect-ratio: 1; border-radius: 50%; background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 650; color: var(--text-lo, rgba(255,255,255,0.34));
    font-variant-numeric: tabular-nums; }
  .cal .d.pad { background: transparent; }
  .cal .d.kept { background: rgba(63,217,78,0.62); color: #06140a; }
  .cal .d.sup { background: rgba(63,217,78,0.2); color: rgba(255,255,255,0.72); }
  .cal .d.missed { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.12); color: var(--text-lo, rgba(255,255,255,0.34)); }
  /* a day the goal never asked for is not a miss: no fill, just a quiet number */
  .cal .d.rest { background: transparent; color: rgba(255,255,255,0.2); }
  .cal .d.ahead { background: transparent; color: rgba(255,255,255,0.13); }
  .cal .d.today { outline: 2px solid rgba(63,217,78,0.95); outline-offset: -2px; }
  .key u.r { background: rgba(255,255,255,0.02); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
  .cal .d.rest, .cal .d.ahead { font-weight: 500; }
  .cal .wc { display: flex; align-items: center; justify-content: flex-end;
    font-size: 12.5px; font-weight: 650; color: var(--text-mid, rgba(255,255,255,0.8));
    font-variant-numeric: tabular-nums; }
  .key { display: flex; flex-wrap: wrap; gap: 7px 16px; margin-top: 14px; }
  .key span { display: flex; align-items: center; gap: 7px; font-size: 11.5px;
    color: var(--text-mid, rgba(255,255,255,0.8)); }
  .key u { width: 10px; height: 10px; border-radius: 3px; display: block; flex: 0 0 auto; }
  .key u.a { background: rgba(63,217,78,0.55); }
  .key u.b { background: rgba(63,217,78,0.2); }
  .key u.c { background: rgba(255,255,255,0.05); }
  .runline { font-size: 13.5px; color: var(--text-mid, rgba(255,255,255,0.8)); margin-top: 14px; }
  .runline b { color: var(--text-hi, #fff); font-weight: 700; font-variant-numeric: tabular-nums; }
  /* earlier months log */
  .mlog { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 12px; }
  .mlog__m span { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11.5px; color: var(--text-lo, rgba(255,255,255,0.46)); margin-bottom: 5px; }
  .mlog__m span b { font-size: 13px; font-weight: 700; color: var(--text-mid, rgba(255,255,255,0.8));
    font-variant-numeric: tabular-nums; }
  .mlog__g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .mlog__g b { aspect-ratio: 1; border-radius: 3px; background: rgba(255,255,255,0.05); }
  .mlog__g b.on { background: rgba(63,217,78,0.55); }
  .mlog__g b.sup { background: rgba(63,217,78,0.2); }
  .mlog__g b.kept { background: rgba(63,217,78,0.55); }
  .mlog__g b.rest { background: rgba(255,255,255,0.02); }
  .mlog__g b.ahead { background: rgba(255,255,255,0.032); }
  .mlog__g b.pad { background: transparent; }
  /* week view */
  .wk7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
  .wk7 > div { text-align: center; }
  .wk7 b { display: block; aspect-ratio: 1; border-radius: 14px; background: rgba(255,255,255,0.045); }
  .wk7 b.kept { background: rgba(63,217,78,0.55); }
  .wk7 b.rest { background: rgba(255,255,255,0.02); }
  .wk7 b.sup { background: rgba(63,217,78,0.2); }
  .wk7 b.today { outline: 2px solid rgba(63,217,78,0.95); outline-offset: -2px; }
  .wk7 b.pad { background: transparent; }
  .wk7 span { display: block; font-size: 10.5px; color: var(--text-lo, rgba(255,255,255,0.46)); margin-top: 6px; }

  /* ---- the tracks heat map: actions, deep work, reflections ---- */
  /* label above so the strip gets the full column width; sub pixel cells are unreadable */
  .trk { display: flex; flex-direction: column; gap: 14px; }
  .trk__h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .trk__l { font-size: 12.5px; color: var(--text-mid, rgba(255,255,255,0.8)); }
  .trk__n { font-size: 13px; font-weight: 700; color: var(--text-hi, #fff); font-variant-numeric: tabular-nums; }
  .trk__c { display: grid; gap: 1.5px; }
  .trk__c b { height: 17px; border-radius: 3px; background: rgba(255,255,255,0.05); }

  /* ---- weekly chapters ---- */
  /* chapters, L07 grammar: date label, weekday header, rounded cells, count right */
  .chap { display: flex; flex-direction: column; }
  .chap__head, .chap__r { display: grid; grid-template-columns: 60px 1fr 52px; align-items: center; gap: 12px; }
  .chap__head { margin-bottom: 7px; }
  .chap__wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .chap__wd span { font-size: 10px; text-align: center; color: var(--text-lo, rgba(255,255,255,0.4)); }
  .chap__r { padding: 7px 0; }
  .chap__w { font-size: 12px; color: var(--text-mid, rgba(255,255,255,0.8)); font-variant-numeric: tabular-nums; }
  .chap__g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .chap__g b { aspect-ratio: 1; border-radius: 7px; background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center; color: rgba(63,217,78,0.9); }
  .chap__g b.kept { background: rgba(63,217,78,0.14); }
  .chap__g b.kept svg { width: 64%; height: 64%; }
  .chap__g b.sup .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(63,217,78,0.4); }
  .chap__g b.missed { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
  .chap__g b.rest { background: rgba(255,255,255,0.015); }
  .chap__g b.pad { background: transparent; }
  .chap__n { font-size: 12.5px; font-weight: 650; font-variant-numeric: tabular-nums; text-align: right;
    color: var(--text-mid, rgba(255,255,255,0.8)); }
  .chap__n.full { color: var(--text-hi, #fff); }

  /* step arrows for month / week / year */
  .nav { display: inline-flex; align-items: center; gap: 3px; }
  .nav button { width: 27px; height: 27px; border-radius: 9px; background: rgba(255,255,255,0.05);
    border: 0; color: var(--text-mid, rgba(255,255,255,0.8)); cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  .nav button:disabled { opacity: 0.25; cursor: default; }

  /* the week as a day list */
  .dl__r { display: grid; grid-template-columns: 74px 14px 1fr auto; align-items: center; gap: 11px;
    padding: 9px 0; border-bottom: 1px solid var(--hairline, rgba(255,255,255,0.09)); }
  .dl__r:last-child { border-bottom: 0; }
  .dl__d { font-size: 13px; color: var(--text-mid, rgba(255,255,255,0.8)); font-variant-numeric: tabular-nums; }
  .dl__d.now { color: var(--text-hi, #fff); font-weight: 650; }
  .dl__s { width: 12px; height: 12px; border-radius: 50%; }
  .dl__s.kept { background: rgba(63,217,78,0.8); }
  .dl__s.sup { background: rgba(63,217,78,0.3); }
  .dl__s.missed { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.2); }
  .dl__s.rest { background: rgba(255,255,255,0.1); transform: scale(0.45); }
  .dl__w { font-size: 12.5px; color: var(--text-lo, rgba(255,255,255,0.5)); }
  .dl__t { font-size: 12px; color: var(--text-lo, rgba(255,255,255,0.4));
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dl__foot { font-size: 13.5px; color: var(--text-mid, rgba(255,255,255,0.8)); margin-top: 14px; }
  .dl__foot b { color: var(--text-hi, #fff); font-weight: 700; font-variant-numeric: tabular-nums; }
  /* year scale switch */
  .yrsw { display: inline-flex; gap: 2px; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 2px; }
  .yrsw button { font: inherit; font-size: 11px; font-weight: 600; color: var(--text-mid, rgba(255,255,255,0.8));
    background: transparent; border: 0; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  .yrsw button.on { color: var(--text-hi, #fff); background: rgba(255,255,255,0.1); }
  .yrgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; }

  /* month bars */
  .mb { display: flex; gap: 7px; align-items: flex-end; height: 74px; }
  .mb > div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%;
    text-align: center; gap: 4px; }
  .mb u { display: block; border-radius: 4px 4px 2px 2px; background: rgba(63,217,78,0.4); text-decoration: none; }
  .mb u.top { background: #3fd94e; }
  .mb span { font-size: 10px; color: var(--text-lo, rgba(255,255,255,0.46)); }
  .mb b { font-size: 10.5px; font-weight: 650; color: var(--text-mid, rgba(255,255,255,0.8));
    font-variant-numeric: tabular-nums; }

  /* ledger */
  .led { border-top: 1px solid var(--hairline, rgba(255,255,255,0.09)); }
  .led__r { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0;
    border-bottom: 1px solid var(--hairline, rgba(255,255,255,0.09)); }
  .led__r span { font-size: 13.5px; color: var(--text-mid, rgba(255,255,255,0.8)); }
  .led__r b { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
    white-space: nowrap; }

  /* ============ desktop: rail + grid (html.vm-desk) ============ */
  html.vm-desk #snap { height: auto; overflow: visible; scroll-snap-type: none; display: grid;
    grid-template-columns: 430px 1fr; max-width: 1280px; margin: 0 auto; gap: 0 46px; padding: 0 26px; }
  html.vm-desk .pg { min-height: 0; scroll-snap-align: none; }
  html.vm-desk #pgOne { position: sticky; top: 0; height: 100vh; padding: 40px 10px;
    display: grid; align-content: center; justify-items: start; }
  html.vm-desk .one__num { font-size: clamp(120px, 13vw, 190px) !important; }
  html.vm-desk .one__hint { display: none; }
  html.vm-desk #pgTwo { padding: 96px 0 110px; }
  html.vm-desk .ev { max-width: none; margin: 0; }
  html.vm-desk .ev__hero { display: none; }
  html.vm-desk .ev__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 34px; align-items: start; }
  html.vm-desk .ev__col { min-width: 0; }

  /* ============ phone view forced on a wide screen ============ */
  html.vm-framed body { display: flex; justify-content: center; }
  html.vm-framed #snap { width: 390px; height: 780px; margin: 118px auto 40px; border-radius: 30px;
    outline: 1px solid var(--hairline, rgba(255,255,255,0.09));
    box-shadow: 0 30px 80px rgba(0,0,0,0.55); background: #060708; }
  html.vm-framed .pg { min-height: 780px; }
  html.vm-framed #pgOne { padding-top: 40px; }
</style>
</head>
<body>
<div id="bar"><div class="bar__in">
  <div class="bar__row">
    <span class="bar__day" id="day">Day 168</span>
    <input type="range" id="slider" min="1" max="365" value="168">
    <div class="chips" id="dayChips"></div>
  </div>
  <div class="bar__row"><div class="chips" id="shapeChips"></div><div class="chips" id="viewChips" style="margin-left:auto"></div></div>
</div></div>

<div id="snap">
  <section class="pg" id="pgOne"></section>
  <section class="pg" id="pgTwo"><div class="ev" id="ev"></div></section>
</div>

<script src="_kit.js"></script>
<script src="one.js"></script>
</body>
</html>
