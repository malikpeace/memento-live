<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consistency, the merged page</title>
<link rel="stylesheet" href="_kit.css">
<style>
  :root { --acc: #3fd94e; --acc-rgb: 63,217,78; --accent: var(--acc); --accent-rgb: var(--acc-rgb); }
  html, body { background: #060708; }
  body { margin: 0; color: var(--text-hi, #fff); font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; }

  /* ============ GLASS MODE (html.glass) ============ */
  /* an ambient backdrop so the glass has something real to refract */
  html.glass body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(58% 46% at 14% 8%, rgba(var(--acc-rgb),0.13), transparent 62%),
      radial-gradient(52% 50% at 88% 92%, rgba(90,130,255,0.10), transparent 60%),
      radial-gradient(44% 40% at 78% 16%, rgba(var(--acc-rgb),0.06), transparent 60%),
      radial-gradient(50% 44% at 30% 80%, rgba(120,90,255,0.06), transparent 60%),
      #060708;
  }
  /* every deep-stat section becomes a frosted panel */
  html.glass .sec:not(.sec--score):not(.sec--pill) {
    background: rgba(255,255,255,0.045); border-radius: 18px; padding: 17px 17px 18px;
    border: 1px solid rgba(255,255,255,0.08);
    -webkit-backdrop-filter: blur(30px) saturate(1.5); backdrop-filter: blur(30px) saturate(1.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 10px 34px rgba(0,0,0,0.34);
  }
  html.glass .sec:not(.sec--score):not(.sec--pill) .sec__h { margin-top: 0; }
  /* inner tiles lift a touch so they read against the frosted panel */
  html.glass .wkstat, html.glass .wkc b { background: rgba(255,255,255,0.06); }
  /* the score chip stays bright, frosted white */
  html.glass .glance--score {
    background: rgba(249,251,248,0.85);
    -webkit-backdrop-filter: blur(26px) saturate(1.4); backdrop-filter: blur(26px) saturate(1.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 12px 36px rgba(0,0,0,0.44); }
  /* the pinned control bar reads as glass too */
  html.glass #bar { background: rgba(6,7,10,0.55); }

  /* ============ GLASS + : black glass over a live green backdrop ============ */
  html.glassplus body { background: #030405; }
  html.glassplus body::before {
    content: ''; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background: radial-gradient(120% 90% at 50% -10%, rgba(var(--acc-rgb),0.05), transparent 60%), #030405;
  }
  /* drifting green auras behind the black glass, so it feels alive */
  .gplus-fx { display: none; }
  html.glassplus .gplus-fx { display: block; position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  /* lift the whole page above the aura layer so content sits on top of the green */
  html.glassplus #snap { position: relative; z-index: 1; }
  html.glassplus .gplus-fx i { position: absolute; border-radius: 50%; filter: blur(58px); }
  html.glassplus .gplus-fx i:nth-child(1) { width: 560px; height: 560px; left: -8%; top: -12%;
    background: radial-gradient(circle, rgba(var(--acc-rgb),0.9), transparent 68%); }
  html.glassplus .gplus-fx i:nth-child(2) { width: 500px; height: 500px; right: -6%; bottom: -10%;
    background: radial-gradient(circle, rgba(var(--acc-rgb),0.7), transparent 68%); }
  html.glassplus .gplus-fx i:nth-child(3) { width: 420px; height: 420px; left: 50%; top: 44%;
    background: radial-gradient(circle, rgba(var(--acc-rgb),0.6), transparent 68%); }
  /* the panels themselves are BLACK glass, letting the green glow through */
  html.glassplus .sec:not(.sec--score):not(.sec--pill) {
    background: rgba(6,9,10,0.44); border-radius: 20px; padding: 18px; border: 0;
    -webkit-backdrop-filter: blur(40px) saturate(1.7); backdrop-filter: blur(40px) saturate(1.7);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 16px 44px rgba(0,0,0,0.4);
  }
  html.glassplus .sec:not(.sec--score):not(.sec--pill) .sec__h { margin-top: 0; }
  html.glassplus .wkstat, html.glassplus .wkc b { background: rgba(255,255,255,0.05); }
  /* the score chip stays bright, frosted white */
  html.glassplus .glance--score {
    background: rgba(250,252,249,0.86);
    -webkit-backdrop-filter: blur(30px) saturate(1.4); backdrop-filter: blur(30px) saturate(1.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 16px 44px rgba(0,0,0,0.5); }
  html.glassplus #bar { background: rgba(3,4,5,0.5); }

  /* ============ LIGHT MODE (html.light). The score box inverts to black. ============ */
  html.light { --text-hi: #0c0e0c; --text-mid: rgba(10,14,10,0.74); --text-lo: rgba(10,14,10,0.46);
    --hairline: rgba(10,14,10,0.12); }
  html.light, html.light body { background: #f2f3f0; color: #0c0e0c; }
  html.light #bar { background: rgba(242,243,240,0.92); border-bottom-color: rgba(10,14,10,0.1); }
  html.light .chips button, html.light .scale button, html.light .nav button, html.light .yrsw button {
    background: rgba(10,14,10,0.06); color: rgba(10,14,10,0.74); }
  html.light .chips button.on { color: #06140a; background: var(--acc); }
  html.light .scale button.on, html.light .yrsw button.on { color: #0c0e0c; background: rgba(10,14,10,0.1); }
  html.light .wkstat, html.light .wkc b, html.light .heropill { background: rgba(10,14,10,0.05);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5); }
  html.light .cal .d { color: rgba(10,14,10,0.36); }
  html.light .cal .d.kept { color: var(--acc); }
  html.light .cal .d.missed { box-shadow: inset 0 0 0 1.5px rgba(10,14,10,0.28); color: rgba(10,14,10,0.55); }
  html.light .cal .d.rest { color: rgba(10,14,10,0.15); }
  html.light .cal .d.ahead { color: rgba(10,14,10,0.15); }
  html.light .trk__c b, html.light .mlog__g b, html.light .glance__strip b { background: rgba(10,14,10,0.07); }
  html.light .mlog__g b.ahead { background: rgba(10,14,10,0.045); }
  html.light .mlog__g b.pad { background: transparent; }
  html.light .wkc b.missed { box-shadow: inset 0 0 0 1.5px rgba(10,14,10,0.14); }
  /* the score box inverts: black slab, light elements */
  html.light .glance--score { background: linear-gradient(180deg, #131513 0%, #060807 100%); color: #f4fff7;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 12px 36px rgba(0,0,0,0.28); }
  html.light .score__m { color: #f4fff7; }
  html.light .score__lbl { color: rgba(244,255,247,0.55); }
  html.light .score__n { color: #f4fff7; }
  html.light .score__hm b.e { background: rgba(255,255,255,0.1); }
  html.light .score__note { color: rgba(244,255,247,0.55); }
  html.light .one__crown { color: rgba(10,14,10,0.35); }
  html.light .one__today.off u { box-shadow: inset 0 0 0 1.5px rgba(10,14,10,0.3); }
  html.light .one__hint { color: rgba(10,14,10,0.45); }
  html.light .key u.c { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(10,14,10,0.28); }
  html.light .key u.r { background: rgba(10,14,10,0.03); box-shadow: inset 0 0 0 1px rgba(10,14,10,0.16); }
  html.light .heropill { color: rgba(10,14,10,0.74); }
  html.light .heropill b { color: #0c0e0c; }
  /* the kit rhythm chart was designed dark; relabel it for a light ground */
  html.light .ck-dow__bar { background: rgba(var(--acc-rgb),0.38); }
  html.light .ck-dow__bar.top { background: rgba(var(--acc-rgb),0.85); }
  html.light .ck-dow__bar u { color: rgba(10,14,10,0.82); }
  html.light .ck-dow__c span { color: rgba(10,14,10,0.46); }
  html.light .nav button:disabled { opacity: 0.35; }
  /* glass panels on light sample a light ground */
  html.light.glass body::before { background:
      radial-gradient(58% 46% at 14% 8%, rgba(var(--acc-rgb),0.13), transparent 62%),
      radial-gradient(52% 50% at 88% 92%, rgba(90,130,255,0.08), transparent 60%), #eef0ec; }
  html.light.glass .sec:not(.sec--score):not(.sec--pill) { background: rgba(255,255,255,0.5);
    border-color: rgba(10,14,10,0.08); box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 10px 30px rgba(20,30,20,0.1); }
  /* glass+ stays the black-glass look by design, even in light mode */
  html.light.glassplus, html.light.glassplus body { background: #030405; color: var(--text-hi); }
  html.light.glassplus { --text-hi: rgba(235,238,248,0.96); --text-mid: rgba(235,238,248,0.74);
    --text-lo: rgba(235,238,248,0.46); --hairline: rgba(255,255,255,0.09); }
  html.light.glassplus #bar { background: rgba(3,4,5,0.5); border-bottom-color: rgba(255,255,255,0.09); }
  html.light.glassplus .glance--score { background: rgba(250,252,249,0.86); color: #08130a; }
  html.light.glassplus .score__m { color: #08130a; }
  html.light.glassplus .score__lbl { color: rgba(8,19,10,0.55); }
  html.light.glassplus .score__n { color: #08130a; }
  html.light.glassplus .score__hm b.e { background: rgba(8,19,10,0.08); }
  html.light.glassplus .score__note { color: rgba(8,19,10,0.5); }
  html.light.glassplus .chips button { background: rgba(255,255,255,0.05); color: var(--text-mid); }
  html.light.glassplus .wkstat, html.light.glassplus .wkc b, html.light.glassplus .heropill { background: rgba(255,255,255,0.05); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
  html.light.glassplus .cal .d { color: rgba(255,255,255,0.3); }
  html.light.glassplus .cal .d.kept { color: var(--acc); }
  html.light.glassplus .trk__c b, html.light.glassplus .mlog__g b { background: rgba(255,255,255,0.05); }

  .nav__today { font: inherit; font-size: 11.5px; font-weight: 650; color: var(--text-mid, rgba(255,255,255,0.8));
    background: rgba(255,255,255,0.05); border: 0; border-radius: 9px; padding: 0 11px; height: 27px; cursor: pointer; }
  html.light .nav__today { background: rgba(10,14,10,0.06); color: rgba(10,14,10,0.74); }
  /* for the hard days: the record talking back */
  .hard p { font-size: 14.5px; line-height: 1.55; color: var(--text-mid, rgba(255,255,255,0.8)); margin: 0 0 13px; }
  .hard p:last-child { margin-bottom: 0; }
  .hard b { color: var(--text-hi, #fff); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* tap a past day: a small honest receipt of that day */
  .daypop { position: fixed; z-index: 300; min-width: 168px; max-width: 240px; padding: 12px 14px;
    border-radius: 14px; background: rgba(14,16,15,0.97); color: rgba(235,238,248,0.96);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 18px 50px rgba(0,0,0,0.55);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .daypop__d { font-size: 12px; color: rgba(235,238,248,0.5); margin-bottom: 3px;
    font-variant-numeric: tabular-nums; }
  .daypop__s { font-size: 14px; font-weight: 700; }
  .daypop__s.kept { color: var(--acc); }
  .daypop ul { list-style: none; margin: 8px 0 0; padding: 8px 0 0;
    border-top: 1px solid rgba(255,255,255,0.09); }
  .daypop li { font-size: 12.5px; color: rgba(235,238,248,0.74); padding: 2.5px 0; }
  html.light .daypop { background: rgba(250,251,249,0.98); color: #0c0e0c;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 18px 50px rgba(20,30,20,0.25); }
  html.light .daypop__d { color: rgba(10,14,10,0.5); }
  html.light .daypop ul { border-top-color: rgba(10,14,10,0.1); }
  html.light .daypop li { color: rgba(10,14,10,0.72); }
  .cal .d[data-k] { cursor: pointer; }

  /* accent dots */
  .accdot { width: 20px; height: 20px; border-radius: 50%; border: 0; cursor: pointer; padding: 0; }
  .accdot.on { outline: 2px solid rgba(127,127,127,0.8); outline-offset: 2px; }

  /* pinned lab controls */
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: rgba(6,7,10,0.94);
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
    border-bottom: 1px solid var(--hairline, rgba(255,255,255,0.09)); padding: 10px 16px; }
  .bar__in { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .bar__row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar__row input[type=range] { flex: 1; min-width: 120px; accent-color: var(--acc); height: 4px; }
  .bar__day { font-size: 14px; font-weight: 700; min-width: 74px; font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { font: inherit; font-size: 11.5px; font-weight: 600; color: var(--text-mid, rgba(255,255,255,0.8));
    background: rgba(255,255,255,0.05); border: 0; border-radius: 7px; padding: 5px 10px; cursor: pointer;
    font-variant-numeric: tabular-nums; }
  .chips button.on { color: #06140a; background: var(--acc); }

  /* ============ mobile: two snap pages ============ */
  #snap { height: 100dvh; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; }
  #snap::-webkit-scrollbar { display: none; }
  .pg { scroll-snap-align: start; scroll-snap-stop: always; min-height: 100dvh; box-sizing: border-box; }

  /* page one: the number, left aligned */
  #pgOne { display: grid; align-content: center; justify-items: start; text-align: left;
    padding: calc(var(--barh, 92px) + 26px) 26px 70px; position: relative; }
  .one__crown { line-height: 0; margin: 0 0 6px 7px; color: rgba(255,255,255,0.34); }
  .one__num { font-weight: 700; color: var(--text-hi, #fff); line-height: 0.86; letter-spacing: -0.05em;
    font-variant-numeric: tabular-nums; margin: 0 0 14px; }
  .one__sub { font-size: 17px; color: var(--text-mid, rgba(255,255,255,0.8)); line-height: 1.45; max-width: 320px; }
  .one__today { display: flex; align-items: center; gap: 9px; margin-top: 22px;
    font-size: 13.5px; color: var(--text-mid, rgba(255,255,255,0.8)); }
  .one__today u { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); display: block; flex: 0 0 auto; }
  .one__today.off u { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.28); }
  .one__hint { position: absolute; bottom: 28px; left: 26px; right: 26px;
    font-size: 12px; color: var(--text-lo, rgba(255,255,255,0.46)); }
  .one__hint svg { display: block; margin: 5px 0 0; opacity: 0.6; }

  /* page two: the evidence room */
  #pgTwo { padding: calc(var(--barh, 92px) + 14px) 18px 90px; }
  .ev { max-width: 430px; margin: 0 auto; }
  .ev__hero { margin-bottom: 4px; }
  .ev__say { font-size: 15px; color: var(--text-mid, rgba(255,255,255,0.8)); font-weight: 500; }
  .ev__num { font-size: 56px; font-weight: 700; letter-spacing: -0.04em; line-height: 0.95;
    font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
  .ev__since { font-size: 13px; color: var(--text-lo, rgba(255,255,255,0.46)); }
  .sec { margin-top: 28px; }
  .sec__h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .sec__h b { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .sec__h i { font-style: normal; font-size: 12px; color: var(--text-lo, rgba(255,255,255,0.46));
    font-variant-numeric: tabular-nums; }

  /* at a glance: the pattern value + bar + the recent strip, one block */
  .glance { background: rgba(255,255,255,0.05); border-radius: 18px; padding: 16px;
    -webkit-backdrop-filter: blur(28px) saturate(1.4); backdrop-filter: blur(28px) saturate(1.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 30px rgba(0,0,0,0.38); }
  .glance__v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .glance__bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.07); margin: 12px 0 16px;
    overflow: hidden; position: relative; }
  .glance__bar u { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--acc); }
  .glance__bar i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: rgba(255,255,255,0.35);
    border-radius: 1px; }
  .glance__strip { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; }
  .glance__strip b { aspect-ratio: 1; border-radius: 5px; background: rgba(255,255,255,0.05); }
  .glance__strip b.kept { background: rgba(var(--acc-rgb),0.62); }
  .glance__strip b.rest { background: rgba(255,255,255,0.02); }
  .glance__strip b.sup { background: rgba(var(--acc-rgb),0.22); }
  .glance__strip b.today { outline: 1.5px solid rgba(var(--acc-rgb),0.95); outline-offset: -1.5px; }
  .glance { position: relative; overflow: hidden; }
  /* the score card is inverted: a white slab with black elements */
  /* a bright white slab with a subtle top sheen, not a flat grey */
  .glance--score { background: linear-gradient(180deg, #fdfefc 0%, #eef1ec 100%); color: #08130a;
    border-radius: 18px; padding: 18px 18px 20px; -webkit-backdrop-filter: none; backdrop-filter: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 12px 36px rgba(0,0,0,0.44); position: relative; overflow: hidden; }
  .score__m { position: absolute; top: 13px; right: 14px; line-height: 0; color: #08130a; }
  .score__lbl { font-size: 13px; font-weight: 600; color: rgba(8,19,10,0.55); }
  .score__delta { font-size: 15px; font-weight: 750; vertical-align: top; position: relative; top: 7px;
    margin-left: 7px; display: inline-flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
  .score__delta svg { width: 8.5px; height: 8.5px; fill: currentColor; }
  .score__delta.up { color: #1f9e2a; }
  .score__delta.down { color: rgba(8,19,10,0.42); }
  html.light:not(.glassplus) .score__delta.up { color: var(--acc); }
  html.light:not(.glassplus) .score__delta.down { color: rgba(244,255,247,0.5); }
  .score__n { font-size: 60px; font-weight: 780; letter-spacing: -0.045em; line-height: 0.88;
    color: #08130a; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .score__hm { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; margin-top: 18px; }
  .score__hm b { aspect-ratio: 1; border-radius: 5px; }
  .score__hm b.e { background: rgba(8,19,10,0.08); }
  .score__note { font-size: 11.5px; color: rgba(8,19,10,0.5); margin-top: 12px; line-height: 1.45; }
  /* the shown-up pill under the calendar */
  .heropill { display: block; text-align: center; background: rgba(255,255,255,0.045); border-radius: 999px;
    padding: 13px 22px; font-size: 13.5px; color: var(--text-mid, rgba(255,255,255,0.8));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
  .heropill b { color: var(--text-hi, #fff); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---- the calendar, month view ---- */
  .scale { display: inline-flex; gap: 2px; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 2px; }
  .scale button { font: inherit; font-size: 12px; font-weight: 650; color: var(--text-mid, rgba(255,255,255,0.8));
    background: transparent; border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  .scale button.on { color: var(--text-hi, #fff); background: rgba(255,255,255,0.1); }
  .mh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .mh b { font-size: 27px; font-weight: 700; letter-spacing: -0.03em; }
  .mh i { font-style: normal; font-size: 14px; color: var(--text-mid, rgba(255,255,255,0.8));
    font-variant-numeric: tabular-nums; }
  .mh i em { font-style: normal; font-weight: 700; font-size: 18px; color: var(--text-hi, #fff); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr) 34px; gap: 6px; position: relative; }
  .cal-thread { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .cal .wd, .cal .d, .cal .wc { position: relative; z-index: 1; }
  .cal .wd { font-size: 11px; color: var(--text-lo, rgba(255,255,255,0.46)); text-align: center;
    padding-bottom: 2px; }
  .cal .wd.g { color: var(--text-lo, rgba(255,255,255,0.32)); }
  .cal .d { aspect-ratio: 1; border-radius: 11px; background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 13.5px; font-weight: 600; color: rgba(255,255,255,0.3);
    font-variant-numeric: tabular-nums; }
  .cal .d.pad { background: transparent; }
  /* kept days are not filled; the green line under them does the marking */
  .cal .d.kept { color: var(--acc); font-weight: 800; }
  .cal .d.sup { color: rgba(var(--acc-rgb),0.72); font-weight: 650; }
  .cal .d.missed { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.22); color: rgba(255,255,255,0.5); }
  /* a day the goal never asked for is not a miss: no fill, just a quiet number */
  .cal .d.rest { background: transparent; color: rgba(255,255,255,0.15); }
  .cal .d.ahead { background: transparent; color: rgba(255,255,255,0.13); }
  .cal .d.today { outline: 2px solid rgba(255,255,255,0.28); outline-offset: -2px; border-radius: 9px; }
  .cal .d.today.done { outline-color: rgba(var(--acc-rgb),0.95); background: rgba(var(--acc-rgb),0.13); }
  html.light .cal .d.today { outline-color: rgba(10,14,10,0.3); }
  html.light .cal .d.today.done { outline-color: rgba(var(--acc-rgb),0.95); background: rgba(var(--acc-rgb),0.16); }
  @keyframes ringpop { 0% { transform: scale(1); } 42% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .cal .d.today.justfilled { animation: ringpop 0.42s ease-out; }
  @media (prefers-reduced-motion: reduce) { .cal .d.today.justfilled { animation: none; } }
  .key u.r { background: rgba(255,255,255,0.02); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
  .cal .d.rest, .cal .d.ahead { font-weight: 500; }
  .cal .wc { display: flex; align-items: center; justify-content: flex-end;

  .key { display: flex; flex-wrap: wrap; gap: 7px 16px; margin-top: 14px; }

  .key u { width: 10px; height: 10px; border-radius: 3px; display: block; flex: 0 0 auto; }
  .key u.a { background: rgba(var(--acc-rgb),0.55); }
  .key u.b { background: rgba(var(--acc-rgb),0.2); }
  .key u.c { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.22); }
  .runline { font-size: 13.5px; color: var(--text-mid, rgba(255,255,255,0.8)); margin-top: 14px; }
  .runline b { color: var(--text-hi, #fff); font-weight: 700; font-variant-numeric: tabular-nums; }
  /* earlier months log */
  .mlog { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 12px; }
  .mlog__m span { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11.5px; color: var(--text-lo, rgba(255,255,255,0.46)); margin-bottom: 5px; }
  .mlog__m span b { font-size: 13px; font-weight: 700; color: var(--text-mid, rgba(255,255,255,0.8));

  .mlog__g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .mlog__g b { aspect-ratio: 1; border-radius: 3px; background: rgba(255,255,255,0.05); }
  .mlog__g b.on { background: rgba(var(--acc-rgb),0.55); }
  .mlog__g b.sup { background: rgba(var(--acc-rgb),0.2); }
  .mlog__g b.kept { background: rgba(var(--acc-rgb),0.55); }

  .mlog__g b.ahead { background: rgba(255,255,255,0.032); }
  .mlog__g b.pad { background: transparent; }
  /* week view: a real detailed week */
  .wkstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-bottom: 18px; }
  .wkc { text-align: center; }
  .wkc span { display: block; font-size: 10.5px; color: var(--text-lo, rgba(255,255,255,0.4)); margin-bottom: 6px; }

    font-variant-numeric: tabular-nums; }

  .wkc b.sup { color: rgba(var(--acc-rgb),0.72); }

  .wkstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 14px; }

    font-variant-numeric: tabular-nums; }

  .wkstat span { display: block; font-size: 11px; color: var(--text-lo, rgba(255,255,255,0.46)); margin-top: 6px; line-height: 1.35; }
  .wkdid { font-size: 13px; color: var(--text-mid, rgba(255,255,255,0.7)); }
  /* legacy day list (unused now) */
  .wk7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
  .wk7 > div { text-align: center; }
  .wk7 b { display: block; aspect-ratio: 1; border-radius: 14px; background: rgba(255,255,255,0.045); }
  .wk7 b.kept { background: rgba(var(--acc-rgb),0.55); }
  .wk7 b.rest { background: rgba(255,255,255,0.02); }

  .wk7 span { display: block; font-size: 10.5px; color: var(--text-lo, rgba(255,255,255,0.46)); margin-top: 6px; }

  /* ---- the tracks heat map: actions, deep work, reflections ---- */
  /* label above so the strip gets the full column width; sub pixel cells are unreadable */
  .trk { display: flex; flex-direction: column; gap: 14px; }
  .trk__h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .trk__l { font-size: 12.5px; color: var(--text-mid, rgba(255,255,255,0.8)); }

  .trk__c { display: grid; gap: 1.5px; }
  .trk__c b { height: 17px; border-radius: 3px; background: rgba(255,255,255,0.05); }

  /* ---- weekly chapters ---- */
  /* chapters, L07 grammar: date label, weekday header, rounded cells, count right */
  .chap { display: flex; flex-direction: column; }
  .chap__head, .chap__r { display: grid; grid-template-columns: 60px 1fr 52px; align-items: center; gap: 12px; }
  .chap__head { margin-bottom: 7px; }
  .chap__wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .chap__wd span { font-size: 10px; text-align: center; color: var(--text-lo, rgba(255,255,255,0.4)); }
  .chap__r { padding: 7px 0; }
  .chap__w { font-size: 12px; color: var(--text-mid, rgba(255,255,255,0.8)); font-variant-numeric: tabular-nums; }
  .chap__g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .chap__g b { aspect-ratio: 1; border-radius: 7px; background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center; color: rgba(var(--acc-rgb),0.9); }
  .chap__g b.kept { background: rgba(var(--acc-rgb),0.14); }
  .chap__g b.kept svg { width: 64%; height: 64%; }
  .chap__g b.sup .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(var(--acc-rgb),0.4); }
  .chap__g b.missed { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
  .chap__g b.rest { background: rgba(255,255,255,0.015); }
  .chap__g b.pad { background: transparent; }
  .chap__n { font-size: 12.5px; font-weight: 650; font-variant-numeric: tabular-nums; text-align: right;
    color: var(--text-mid, rgba(255,255,255,0.8)); }
  .chap__n.full { color: var(--text-hi, #fff); }

  /* step arrows for month / week / year */
  .nav { display: inline-flex; align-items: center; gap: 3px; }
  .nav button { width: 27px; height: 27px; border-radius: 9px; background: rgba(255,255,255,0.05);
    border: 0; color: var(--text-mid, rgba(255,255,255,0.8)); cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  .nav button:disabled { opacity: 0.4; cursor: default; }

  /* the week as a day list */
  .dl__r { display: grid; grid-template-columns: 74px 14px 1fr auto; align-items: center; gap: 11px;

  .dl__r:last-child { border-bottom: 0; }
  .dl__d { font-size: 13px; color: var(--text-mid, rgba(255,255,255,0.8)); font-variant-numeric: tabular-nums; }
  .dl__d.now { color: var(--text-hi, #fff); font-weight: 650; }
  .dl__s { width: 12px; height: 12px; border-radius: 50%; }
  .dl__s.kept { background: rgba(var(--acc-rgb),0.8); }
  .dl__s.sup { background: rgba(var(--acc-rgb),0.3); }
  .dl__s.missed { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.2); }

  .dl__w { font-size: 12.5px; color: var(--text-lo, rgba(255,255,255,0.5)); }
  .dl__t { font-size: 12px; color: var(--text-lo, rgba(255,255,255,0.4));
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dl__foot { font-size: 13.5px; color: var(--text-mid, rgba(255,255,255,0.8)); margin-top: 14px; }
  .dl__foot b { color: var(--text-hi, #fff); font-weight: 700; font-variant-numeric: tabular-nums; }
  /* year scale switch */
  .yrsw { display: inline-flex; gap: 2px; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 2px; }
  .yrsw button { font: inherit; font-size: 11px; font-weight: 600; color: var(--text-mid, rgba(255,255,255,0.8));
    background: transparent; border: 0; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  .yrsw button.on { color: var(--text-hi, #fff); background: rgba(255,255,255,0.1); }
  .yrgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; }

  /* month bars */
  .mb { display: flex; gap: 7px; align-items: flex-end; height: 74px; }
  .mb > div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%;
    text-align: center; gap: 4px; }
  .mb u { display: block; border-radius: 4px 4px 2px 2px; background: rgba(var(--acc-rgb),0.4); text-decoration: none; }
  .mb u.top { background: var(--acc); }
  .mb span { font-size: 10px; color: var(--text-lo, rgba(255,255,255,0.46)); }
  .mb b { font-size: 10.5px; font-weight: 650; color: var(--text-mid, rgba(255,255,255,0.8));
    font-variant-numeric: tabular-nums; }

  /* ledger */
  .led { border-top: 1px solid var(--hairline, rgba(255,255,255,0.09)); }
  .led__r { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0;
    border-bottom: 1px solid var(--hairline, rgba(255,255,255,0.09)); }
  .led__r span { font-size: 13.5px; color: var(--text-mid, rgba(255,255,255,0.8)); }
  .led__r b { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
    white-space: nowrap; }

  /* ============ desktop: a centered dashboard (html.vm-desk) ============ */
  html.vm-desk #snap { height: auto; overflow: visible; scroll-snap-type: none; display: block;
    max-width: 1160px; margin: 0 auto; padding: 0 30px; }
  html.vm-desk .pg { min-height: 0; scroll-snap-align: none; }
  /* the number is a header band, not a full-height rail */

  html.vm-desk .one__crown { margin-left: 10px; }
  html.vm-desk .one__num { font-size: clamp(96px, 12vw, 150px) !important; margin-bottom: 10px; }
  html.vm-desk .one__sub { font-size: 18px; }
  html.vm-desk .one__hint { display: none; }
  html.vm-desk #pgTwo { padding: 26px 0 110px; }
  html.vm-desk .ev__hero { display: none; }
  /* the section cards tile into a balanced two-column masonry */
  html.vm-desk .ev { max-width: none; margin: 0; column-count: 2; column-gap: 26px; }
  html.vm-desk .ev > .sec { margin: 0 0 22px; break-inside: avoid; width: 100%; }
  /* the score is a full-width banner across the top, number left, heatmap right */

  /* ============ phone view forced on a wide screen ============ */
  html.vm-framed body { display: flex; justify-content: center; }
  html.vm-framed #snap { width: 390px; height: 780px; margin: calc(var(--barh, 90px) + 28px) auto 40px; border-radius: 30px;
    outline: 1px solid var(--hairline, rgba(255,255,255,0.09));

  html.vm-framed #pgTwo { padding-top: 26px; }
</style>
