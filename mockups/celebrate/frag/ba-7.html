<style>
/* ba-7 "The Ten Thousand". The wall is the star (Malik loved it): their move
   word printed once per move, a page of proof, every tenth lit. The opening
   was rebuilt on his note (the old triple-echo is gone): the colour is there
   from the first frame and the goal line DROPS IN letter by letter, each one
   landing with a bounce, then the M rises under it. */
[data-c="ba-7"] .ba7-flood{position:absolute;inset:0;background:var(--accent)}
[data-c="ba-7"] .b1.on .ba7-flood{animation:ba7Wash .3s ease-out both}
@keyframes ba7Wash{from{opacity:0}to{opacity:1}}
[data-c="ba-7"] .ba7-line{position:relative;font-size:46px;font-weight:750;letter-spacing:-.042em;
  line-height:1.06;color:#0b0e12;max-width:10ch}
[data-c="ba-7"] .ba7-line i{display:inline-block;font-style:normal;opacity:0}
[data-c="ba-7"] .b1.on .ba7-line i{animation:ba7Drop .5s cubic-bezier(.16,1.35,.3,1) calc(.35s + var(--i)*.055s) both}
@keyframes ba7Drop{from{opacity:0;transform:translateY(-46px) scale(1.2)}to{opacity:1;transform:none}}
[data-c="ba-7"] .ba7-m{position:relative;width:74px;height:74px;fill:#0b0e12;margin-top:30px;opacity:0}
[data-c="ba-7"] .b1.on .ba7-m{animation:ba7MUp .6s cubic-bezier(.16,1.25,.3,1) 1.5s both}
@keyframes ba7MUp{from{opacity:0;transform:translateY(20px) scale(.8)}to{opacity:1;transform:none}}
[data-c="ba-7"] .ba7-said{position:relative;margin-top:22px;font-size:14.5px;font-weight:650;
  color:rgba(11,14,18,.78);opacity:0}
[data-c="ba-7"] .b1.on .ba7-said{animation:ba7Up .5s ease-out 1.9s both}
@keyframes ba7Up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
[data-c="ba-7"] .ba7-fw{position:absolute;left:50%;top:22%;width:0;height:0}
[data-c="ba-7"] .ba7-fw i{position:absolute;width:6px;height:6px;border-radius:50%;background:#0b0e12;opacity:0}
[data-c="ba-7"] .ba7-fw i:nth-child(2n){background:#fff}
[data-c="ba-7"] .b1.on .ba7-fw i{animation:ba7Spk 1s cubic-bezier(.15,.6,.3,1) 1.55s both}
@keyframes ba7Spk{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}

/* THE TEN THOUSAND: the move word printed once per move, a wall of text. */
[data-c="ba-7"] .b2{padding:26px 18px}
[data-c="ba-7"] .ba7-wall{width:100%;display:flex;flex-wrap:wrap;gap:3px 6px;justify-content:center;
  align-content:center;max-height:70%;overflow:hidden}
[data-c="ba-7"] .ba7-wall s{text-decoration:none;font-weight:600;letter-spacing:0;
  color:rgba(11,14,18,.44);opacity:0}
[data-c="ba-7"] .ba7-wall s.hot{color:rgba(11,14,18,.96);font-weight:700}
[data-c="ba-7"] .b2.on .ba7-wall s{animation:ba7In .25s ease-out calc(var(--i)*.005s) forwards}
@keyframes ba7In{to{opacity:1}}
[data-c="ba-7"] .b2.on .ba7-wall s.hot{animation:ba7In .25s ease-out calc(var(--i)*.005s) forwards,
  baTwinkle 5s ease-in-out calc(2s + var(--i)*.01s) infinite}
[data-c="ba-7"] .ba7-tot{margin-top:22px;text-align:center;opacity:0}
[data-c="ba-7"] .ba7-tot b{font-size:46px;font-weight:750;letter-spacing:-.04em;color:var(--text-hi);
  font-variant-numeric:tabular-nums}
[data-c="ba-7"] .ba7-tot span{display:block;margin-top:6px;font-size:12.5px;color:var(--text-lo)}
[data-c="ba-7"] .b2.on .ba7-tot{animation:ba7Up .5s ease-out 1.5s both}

[data-c="ba-7"] .ba7-fin{font-size:28px;font-weight:750;letter-spacing:-.03em;max-width:11ch;color:var(--text-hi)}
[data-c="ba-7"] .b3.on .ba7-fin{animation:ba7Up .5s ease-out .15s both}
[data-c="ba-7"] .ba7-close{margin-top:14px;font-size:14px;color:var(--text-mid)}
[data-c="ba-7"] .b3.on .ba7-close{animation:ba7Up .5s ease-out .55s both}
@media (prefers-reduced-motion:reduce){
  [data-c="ba-7"] .ba7-fw{display:none}
  [data-c="ba-7"] .ba7-line i,[data-c="ba-7"] .ba7-m,[data-c="ba-7"] .ba7-said,
  [data-c="ba-7"] .ba7-wall s,[data-c="ba-7"] .ba7-tot,
  [data-c="ba-7"] .ba7-fin,[data-c="ba-7"] .ba7-close{opacity:1;transform:none;animation:none}
}
</style>
<div class="ph" data-c="ba-7">
  <div class="st">

    <div class="b b1" data-confetti>
      <div class="ba7-flood"></div>
      <div class="ba7-fw" aria-hidden="true">
        <i style="--dx:-52px;--dy:-36px"></i><i style="--dx:50px;--dy:-40px"></i><i style="--dx:-60px;--dy:14px"></i>
        <i style="--dx:58px;--dy:18px"></i><i style="--dx:-22px;--dy:-56px"></i><i style="--dx:24px;--dy:-54px"></i>
        <i style="--dx:-40px;--dy:46px"></i><i style="--dx:42px;--dy:48px"></i><i style="--dx:0px;--dy:-64px"></i>
      </div>
      <div class="ba7-line"></div>
      <svg class="ba7-m" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
      <div class="ba7-said">Every single one of them counted.</div>
    </div>

    <div class="b b2">
      <div class="ba7-wall"></div>
      <div class="ba7-tot"></div>
    </div>

    <div class="b b3">
      <div class="ba7-fin">You lost 30 lbs!</div>
      <div class="ba7-close">This goal closes. The record stays.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
