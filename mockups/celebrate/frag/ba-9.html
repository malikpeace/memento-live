<style>
/* ba-9 "The Wall". Every mark they ever passed comes back at once: chips
   slamming into a wall, fast, stacking the whole climb in front of them,
   and the goal chip lands last, biggest, in their colour, detonating the
   flood. The receipts AS the spectacle; nothing here is decoration, every
   chip is a day that happened. */
[data-c="ba-9"] .ba9-cap{font-size:13px;color:var(--text-lo);margin-bottom:20px}
[data-c="ba-9"] .b1.on .ba9-cap{animation:ba9Fade .5s ease-out both}
@keyframes ba9Fade{from{opacity:0}to{opacity:1}}
[data-c="ba-9"] .ba9-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:290px}
[data-c="ba-9"] .ba9-chip{padding:9px 13px;border-radius:9px;background:rgba(var(--ink),.07);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.06);font-size:15px;font-weight:700;
  letter-spacing:-.02em;color:var(--text-mid);font-variant-numeric:tabular-nums;opacity:0}
[data-c="ba-9"] .b1.on .ba9-chip{animation:ba9Slam .4s cubic-bezier(.16,1.3,.3,1) calc(.25s + var(--i)*.13s) both}
@keyframes ba9Slam{from{opacity:0;transform:scale(1.7)}to{opacity:1;transform:scale(1)}}
[data-c="ba-9"] .ba9-chip--goal{background:rgba(var(--accent-rgb),.2);color:var(--accent);
  font-size:18px;padding:11px 16px}
/* the goal chip detonates the flood */
[data-c="ba-9"] .ba9-flood{position:absolute;inset:0;background:var(--accent);opacity:0}
[data-c="ba-9"] .b1.on .ba9-flood{animation:ba9Flood .3s cubic-bezier(.2,.8,.3,1) var(--boom,2.4s) forwards}
@keyframes ba9Flood{from{opacity:0}to{opacity:1}}
[data-c="ba-9"] .ba9-fw{position:absolute;left:50%;top:24%;width:0;height:0}
[data-c="ba-9"] .ba9-fw i{position:absolute;width:6px;height:6px;border-radius:50%;background:#0b0e12;opacity:0}
[data-c="ba-9"] .ba9-fw i:nth-child(2n){background:#fff}
[data-c="ba-9"] .b1.on .ba9-fw i{animation:ba9Spark 1s cubic-bezier(.15,.6,.3,1) calc(var(--boom,2.4s) + .2s) both}
@keyframes ba9Spark{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
[data-c="ba-9"] .ba9-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;opacity:0;padding:34px}
[data-c="ba-9"] .b1.on .ba9-stage{animation:ba9In .01s linear calc(var(--boom,2.4s) + .15s) forwards,
  ba9Shake .45s linear calc(var(--boom,2.4s) + .17s)}
@keyframes ba9In{to{opacity:1}}
@keyframes ba9Shake{0%,100%{transform:none}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}
  75%{transform:translate(2px,1px)}}
[data-c="ba-9"] .ba9-m{width:78px;height:78px;fill:#0b0e12}
[data-c="ba-9"] .b1.on .ba9-m{animation:ba9MSlam .5s cubic-bezier(.16,1.35,.3,1) calc(var(--boom,2.4s) + .17s) both}
@keyframes ba9MSlam{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:scale(1)}}
[data-c="ba-9"] .ba9-line{margin-top:22px;font-size:42px;font-weight:750;letter-spacing:-.04em;
  line-height:1.05;color:#0b0e12;max-width:10ch}
[data-c="ba-9"] .b1.on .ba9-line{animation:ba9SlamL .5s cubic-bezier(.16,1.3,.3,1) calc(var(--boom,2.4s) + .4s) both}
@keyframes ba9SlamL{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:scale(1)}}
[data-c="ba-9"] .ba9-every{margin-top:18px;font-size:14.5px;font-weight:650;color:rgba(11,14,18,.78)}
[data-c="ba-9"] .b1.on .ba9-every{animation:ba9Up .5s ease-out calc(var(--boom,2.4s) + .8s) both}
@keyframes ba9Up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

[data-c="ba-9"] .ba9-cost{font-size:19px;line-height:2.05;color:var(--text-mid)}
[data-c="ba-9"] .ba9-cost b{color:var(--text-hi);font-size:26px;font-variant-numeric:tabular-nums}
[data-c="ba-9"] .b2.on .ba9-cost{animation:ba9Up .55s ease-out .15s both}
[data-c="ba-9"] .ba9-fin{font-size:28px;font-weight:750;letter-spacing:-.03em;max-width:11ch;color:var(--text-hi)}
[data-c="ba-9"] .b3.on .ba9-fin{animation:ba9Up .5s ease-out .15s both}
[data-c="ba-9"] .ba9-close{margin-top:14px;font-size:14px;color:var(--text-mid)}
[data-c="ba-9"] .b3.on .ba9-close{animation:ba9Up .5s ease-out .55s both}
@media (prefers-reduced-motion:reduce){
  [data-c="ba-9"] .ba9-cap,[data-c="ba-9"] .ba9-chip{opacity:1;animation:none}
  [data-c="ba-9"] .ba9-fw{display:none}
  [data-c="ba-9"] .ba9-flood{opacity:1;animation:none}
  [data-c="ba-9"] .ba9-stage{opacity:1;animation:none}
  [data-c="ba-9"] .ba9-m,[data-c="ba-9"] .ba9-line,[data-c="ba-9"] .ba9-every,
  [data-c="ba-9"] .ba9-cost,[data-c="ba-9"] .ba9-fin,[data-c="ba-9"] .ba9-close{opacity:1;transform:none;animation:none}
}
/* THE FULL WALL: the chips return and take the WHOLE screen. */
[data-c="ba-9"] .b2{padding:26px 16px}
[data-c="ba-9"] .ba9-wall{width:100%;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-content:center}
[data-c="ba-9"] .ba9-wc{padding:9px 12px;border-radius:9px;background:rgba(var(--ink),.06);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.06);font-size:14px;font-weight:700;letter-spacing:-.02em;
  color:var(--text-mid);font-variant-numeric:tabular-nums;opacity:0}
[data-c="ba-9"] .ba9-wc--hot{background:rgba(var(--accent-rgb),.16);color:var(--accent)}
[data-c="ba-9"] .ba9-wc--big{font-size:19px;padding:12px 16px}
[data-c="ba-9"] .b2.on .ba9-wc{animation:ba9C .3s cubic-bezier(.16,1.3,.3,1) calc(.06s + var(--i)*.05s) both}
@keyframes ba9C{from{opacity:0;transform:scale(1.4)}to{opacity:1;transform:scale(1)}}
[data-c="ba-9"] .ba9-wc--sm{font-size:12px;padding:7px 10px}
[data-c="ba-9"] .ba9-wc--xl{font-size:25px;padding:14px 19px;letter-spacing:-.03em}
[data-c="ba-9"] .b2.on .ba9-wc{animation:ba9C .3s cubic-bezier(.16,1.3,.3,1) calc(.06s + var(--i)*.05s) both,
  baFloat 4.6s ease-in-out calc(1.2s + var(--i)*.11s) infinite}
@media (prefers-reduced-motion:reduce){ [data-c="ba-9"] .ba9-wc{opacity:1;animation:none} }
</style>
<div class="ph" data-c="ba-9">
  <div class="st">

    <div class="b b1" data-confetti>
      <div class="ba9-cap">Every mark you passed</div>
      <div class="ba9-chips">
        <span class="ba9-chip" style="--i:0">229</span><span class="ba9-chip" style="--i:1">228</span>
        <span class="ba9-chip" style="--i:2">227</span><span class="ba9-chip" style="--i:3">224</span>
        <span class="ba9-chip" style="--i:4">223</span><span class="ba9-chip" style="--i:5">221</span>
        <span class="ba9-chip" style="--i:6">218</span><span class="ba9-chip" style="--i:7">215</span>
        <span class="ba9-chip" style="--i:8">212</span><span class="ba9-chip" style="--i:9">207</span>
        <span class="ba9-chip" style="--i:10">206</span><span class="ba9-chip" style="--i:11">203</span>
        <span class="ba9-chip" style="--i:12">202</span><span class="ba9-chip ba9-chip--goal" style="--i:13">200</span>
      </div>
      <div class="ba9-flood"></div>
      <div class="ba9-fw" aria-hidden="true">
        <i style="--dx:-52px;--dy:-36px"></i><i style="--dx:50px;--dy:-40px"></i><i style="--dx:-60px;--dy:14px"></i>
        <i style="--dx:58px;--dy:18px"></i><i style="--dx:-22px;--dy:-56px"></i><i style="--dx:24px;--dy:-54px"></i>
        <i style="--dx:-40px;--dy:46px"></i><i style="--dx:42px;--dy:48px"></i><i style="--dx:0px;--dy:-64px"></i>
      </div>
      <div class="ba9-stage">
        <svg class="ba9-m" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
        <div class="ba9-line">Lost 30 lbs!</div>
        <div class="ba9-every">Every one of them was a day you showed up!</div>
      </div>
    </div>

    <div class="b b2">
      <div class="ba9-wall"></div>
    </div>

    <div class="b b3">
      <div class="ba9-fin">Lost 30 lbs!</div>
      <div class="ba9-close">This goal closes. The record stays.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
