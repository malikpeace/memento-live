<style>
/* qu-1. the marker posts. Fifths of a target, each one dated. */
[data-c="qu-1"] .qu1-hero{font-size:104px}
[data-c="qu-1"] .qu1-hero2{font-size:72px}
[data-c="qu-1"] .qu1-sub2{margin-bottom:26px}
[data-c="qu-1"] .qu1-sub{max-width:24ch}
[data-c="qu-1"] .qu1-cap{max-width:24ch}
/* THE AXIS, rebuilt to Malik's 2026-08-16 notes: a LINEAR distance axis
   (~10 ticks spread by real distance, labels only at the quarters), SHARP
   ticks (no radius) whose height grows with the value (10,000 reads small
   next to 90,000), a baseline with real weight, and the accent line for
   today with NO "today" text under it. Big goals shrink the label font so
   100,000-scale numbers never collide. */
[data-c="qu-1"] .qu1-axis{position:relative;width:302px;margin:2px auto 24px}
[data-c="qu-1"] .qu1-rail{position:relative;height:34px}
[data-c="qu-1"] .qu1-base{position:absolute;left:0;right:0;bottom:0;height:2.5px;
  background:rgba(var(--ink),.16)}
[data-c="qu-1"] .qu1-gone{position:absolute;left:0;bottom:0;height:2.5px;
  background:rgba(var(--ink),.48)}
/* ticks are ROOTED at the axis floor (bottom:0) and FULLY OPAQUE (Malik
   2026-08-16: no see-through crossover where a tick meets the line). The
   growing height carries the distance; the accent tick marks today. */
[data-c="qu-1"] .qu1-t{position:absolute;bottom:0;width:2px;transform:translateX(-50%);
  background:var(--tick,#6b7180)}
[data-c="qu-1"] .qu1-t.is-past{background:var(--tick-past,#9aa0ad)}
[data-c="qu-1"] .qu1-t.is-now{width:3px;background:var(--accent)}
@media (prefers-color-scheme:light){
  [data-c="qu-1"]{--tick:#c2c7d0;--tick-past:#8b93a1}
}
[data-c="qu-1"] .qu1-labels{position:relative;height:36px;margin-top:8px;
  font-size:var(--lfs,13px)}
[data-c="qu-1"] .qu1-l{position:absolute;top:0;transform:translateX(-50%);text-align:center;
  white-space:nowrap}
[data-c="qu-1"] .qu1-l--a{transform:none;text-align:left}
[data-c="qu-1"] .qu1-l--z{transform:translateX(-100%);text-align:right}
[data-c="qu-1"] .qu1-num{font-size:inherit;font-weight:650;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;color:var(--text-lo)}
[data-c="qu-1"] .qu1-l.is-past .qu1-num{color:rgba(var(--ink),.62)}
[data-c="qu-1"] .qu1-l.is-now .qu1-num{color:var(--text-hi);font-weight:750}
[data-c="qu-1"] .qu1-date{font-size:10.5px;color:var(--text-lo);margin-top:4px;
  font-variant-numeric:tabular-nums}
[data-c="qu-1"] .b3{padding-bottom:96px}

[data-c="qu-1"] .b.on .qu1-t{animation:qu1Rise .44s cubic-bezier(.2,.8,.3,1) var(--d,0s) both}
@keyframes qu1Rise{from{opacity:0;transform:translateX(-50%) translateY(6px)}
  to{opacity:1;transform:translateX(-50%)}}
</style>

<div class="ph" data-c="qu-1">
  <div class="st">

    <div class="b b1">
      <div class="n qu1-hero" data-count="0|60">60</div>
      <div class="sub">paying users.</div>
    </div>

    <div class="b b2">
      <div class="n qu1-hero2" data-count="0|60">60</div>
      <div class="sub qu1-sub2">paying users</div>
      <div class="qu1-axis">
        <div class="qu1-rail">
          <div class="qu1-base"></div>
          <div class="qu1-gone"></div>
        </div>
        <div class="qu1-labels"></div>
      </div>
      <div class="cap qu1-cap">40 to go.</div>
    </div>

    <div class="b b3">
      <div class="deposit">On this day, you passed <b>60 of 100</b> paying users.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
