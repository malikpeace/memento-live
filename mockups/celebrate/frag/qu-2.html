<style>
/* qu-2. four figures. No target on the goal, so the win is the digit
   the number just grew. The lit rule is the thousand line. */
[data-c="qu-2"] .qu2-hero{font-size:78px}
[data-c="qu-2"] .qu2-ledger{width:212px;margin:0 auto 22px;text-align:left}
[data-c="qu-2"] .qu2-row{display:flex;align-items:baseline;justify-content:space-between;
  padding:5px 0}
[data-c="qu-2"] .qu2-m{font-size:12.5px;color:var(--text-lo);letter-spacing:-.01em}
[data-c="qu-2"] .qu2-v{font-size:16px;font-weight:600;color:rgba(var(--ink),.60);
  font-variant-numeric:tabular-nums;letter-spacing:-.025em}
[data-c="qu-2"] .qu2-row.is-new .qu2-m{color:var(--text-mid)}
[data-c="qu-2"] .qu2-row.is-new .qu2-v{color:var(--text-hi);font-size:21px;font-weight:700}
[data-c="qu-2"] .qu2-line{position:relative;height:2px;border-radius:1px;margin:9px 0 11px;
  background:var(--accent)}
[data-c="qu-2"] .qu2-line::after{content:'';position:absolute;left:50%;top:50%;
  width:246px;height:66px;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(ellipse at center,
    rgba(var(--accent-rgb),.42) 0%,
    rgba(var(--accent-rgb),.11) 34%,
    rgba(var(--accent-rgb),0) 68%)}
[data-c="qu-2"] .qu2-sub{max-width:27ch}
[data-c="qu-2"] .qu2-cap{max-width:34ch}
[data-c="qu-2"] .b3{padding-bottom:96px}

[data-c="qu-2"] .b.on .qu2-row{animation:qu2In .42s cubic-bezier(.2,.8,.3,1) both}
[data-c="qu-2"] .b.on .qu2-row.is-new{animation-delay:.02s}
[data-c="qu-2"] .b.on .qu2-line{animation:qu2Wipe .46s cubic-bezier(.2,.8,.3,1) both;
  animation-delay:.16s;transform-origin:left center}
[data-c="qu-2"] .b.on .qu2-row:nth-of-type(3){animation-delay:.24s}
[data-c="qu-2"] .b.on .qu2-row:nth-of-type(4){animation-delay:.32s}
[data-c="qu-2"] .b.on .qu2-row:nth-of-type(5){animation-delay:.40s}
[data-c="qu-2"] .b.on .qu2-row:nth-of-type(6){animation-delay:.48s}
@keyframes qu2In{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes qu2Wipe{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
</style>

<div class="ph" data-c="qu-2">
  <div class="st">

    <div class="b b1">
      <div class="n qu2-hero">$1,000</div>
      <div class="sub">in one month, from writing.</div>
    </div>

    <div class="b b2">
      <div class="qu2-ledger">
        <div class="qu2-row is-new"><span class="qu2-m">August</span><span class="qu2-v">$1,000</span></div>
        <div class="qu2-line"></div>
        <div class="qu2-row"><span class="qu2-m">July</span><span class="qu2-v">$840</span></div>
        <div class="qu2-row"><span class="qu2-m">June</span><span class="qu2-v">$612</span></div>
        <div class="qu2-row"><span class="qu2-m">May</span><span class="qu2-v">$704</span></div>
        <div class="qu2-row"><span class="qu2-m">April</span><span class="qu2-v">$355</span></div>
      </div>
      <div class="sub qu2-sub"><b>14 months</b> to add a digit.</div>
      <div class="cap qu2-cap">$840 was the best month before it.</div>
    </div>

    <div class="b b3">
      <div class="deposit">On this day, you had your first <b>$1,000</b> month.</div>
      <svg class="mark--foot" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
