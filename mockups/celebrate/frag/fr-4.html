<style>
[data-c="fr-4"] .b1 .fr4-sub{max-width:30ch}
[data-c="fr-4"] .b2 .fr4-sub{max-width:21ch}

[data-c="fr-4"] .fr4-chart{display:flex;gap:9px;align-items:flex-end;height:80px;
  padding-bottom:9px;border-bottom:1px solid var(--hairline);margin-bottom:22px}
[data-c="fr-4"] .fr4-b{width:14px;border-radius:4px;background:rgba(var(--ink),.58);transform-origin:50% 100%}
[data-c="fr-4"] .fr4-b.w4{height:71px}
[data-c="fr-4"] .fr4-b.w3{height:54px}
[data-c="fr-4"] .fr4-b.w0{height:4px;background:rgba(var(--ink),.16)}
[data-c="fr-4"] .fr4-b.now{background:var(--accent)}

[data-c="fr-4"] .b2.on .fr4-b{animation:fr4Rise .42s cubic-bezier(.2,.8,.3,1) backwards}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(1){animation-delay:.02s}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(2){animation-delay:.05s}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(3){animation-delay:.08s}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(4){animation-delay:.11s}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(5){animation-delay:.14s}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(6){animation-delay:.17s}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(7){animation-delay:.20s}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(8){animation-delay:.23s}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(9){animation-delay:.26s}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(10){animation-delay:.29s}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(11){animation-delay:.32s}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(12){animation-delay:.35s}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(13){animation-delay:.38s}
[data-c="fr-4"] .b2.on .fr4-b:nth-child(14){animation-delay:.44s}
@keyframes fr4Rise{from{transform:scaleY(.08);opacity:0}to{transform:scaleY(1);opacity:1}}

[data-c="fr-4"] .b3.on .deposit{animation:fr4Settle .5s cubic-bezier(.2,.8,.3,1) .1s backwards}
@keyframes fr4Settle{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
</style>

<div class="ph" data-c="fr-4"><div class="st">

  <div class="b b1">
    <div class="n n--hero" data-count="0|12">12</div>
    <div class="sub fr4-sub">Weeks at rate, of the last 14.</div>

  <div class="b b2">

      <i class="fr4-b w4"></i><i class="fr4-b w4"></i><i class="fr4-b w4"></i><i class="fr4-b w3"></i>

      <i class="fr4-b w4"></i><i class="fr4-b w0"></i><i class="fr4-b w4"></i><i class="fr4-b w4"></i>
      <i class="fr4-b w4"></i><i class="fr4-b w4 now"></i>
    </div>
    <div class="sub fr4-sub">You took a week in July. Nothing to make up.</div>
    <div class="cap">51 runs across the 14 weeks</div>
  </div>

  <div class="b b3">

</div>
