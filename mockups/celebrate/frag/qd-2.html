<style>
[data-c="qd-2"] .lead{display:flex;align-items:baseline;gap:10px}
[data-c="qd-2"] .lead .u{font-size:26px;font-weight:650;letter-spacing:-.02em;color:var(--text-mid)}

[data-c="qd-2"] .log{width:216px;margin-bottom:10px}
[data-c="qd-2"] .lgr{display:flex;align-items:baseline;justify-content:space-between;
  padding:9px 0;opacity:0;transform:translateY(5px)}
[data-c="qd-2"] .lgr .d{font-size:12.5px;letter-spacing:-.01em;color:var(--text-lo)}
[data-c="qd-2"] .lgr .v{font-size:17px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:rgba(var(--ink),.56)}
[data-c="qd-2"] .lgr--now{padding-top:13px}
[data-c="qd-2"] .lgr--now .d{color:var(--text-mid)}
[data-c="qd-2"] .lgr--now .v{font-size:23px;color:var(--accent)}

[data-c="qd-2"] .b.on .lgr{animation:qd2row .5s cubic-bezier(.2,.8,.3,1) forwards}
[data-c="qd-2"] .b.on .lgr:nth-child(1){animation-delay:.05s}
[data-c="qd-2"] .b.on .lgr:nth-child(2){animation-delay:.12s}
[data-c="qd-2"] .b.on .lgr:nth-child(3){animation-delay:.19s}
[data-c="qd-2"] .b.on .lgr:nth-child(4){animation-delay:.26s}
[data-c="qd-2"] .b.on .lgr:nth-child(5){animation-delay:.36s}
@keyframes qd2row{to{opacity:1;transform:translateY(0)}}

[data-c="qd-2"] .sub{text-wrap:balance}
[data-c="qd-2"] .sub + .sub{margin-top:7px}
[data-c="qd-2"] .deposit{max-width:23ch;text-wrap:balance}

@media (prefers-reduced-motion:reduce){
  [data-c="qd-2"] .lgr{opacity:1;transform:none}
}
</style>
<div class="ph" data-c="qd-2">
  <div class="st">

    <div class="b b1">
      <div class="lead">
        <span class="n n--hero">3</span>
        <span class="u">a day</span>
      </div>
      <div class="sub">your lowest week yet</div>
    </div>

    <div class="b b2">
      <div class="log">
        <div class="lgr"><span class="d">Mar 4</span><span class="v">11</span></div>
        <div class="lgr"><span class="d">Apr 22</span><span class="v">8</span></div>
        <div class="lgr"><span class="d">Jun 3</span><span class="v">6</span></div>
        <div class="lgr"><span class="d">Jul 15</span><span class="v">4</span></div>
        <div class="lgr lgr--now"><span class="d">this week</span><span class="v">3</span></div>
      </div>
      <div class="sub">19 weeks of counting made this.</div>
      <div class="sub">No number on this goal. Each new low is the marker.</div>
    </div>

    <div class="b b3">
      <div class="deposit">On this day, your week came in at <b>3 a day</b>. A new low.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
