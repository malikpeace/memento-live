<style>
/* ex-3 TRANSLUCENCY RESOLVING INTO SOLIDITY. On day one the card is nearly not
   there: the room reads straight through it. Marks give it body. By day 300 it
   is opaque and blocks what is behind it, which is the whole argument for an
   open goal that can never be counted. */
[data-c="ex-3"] .b{padding:24px 22px 42px}
[data-c="ex-3"] .exhd{font-size:18px;font-weight:650;letter-spacing:-.022em;color:var(--text-hi)}
[data-c="ex-3"] .exsub{font-size:13.5px;line-height:1.5;color:var(--text-mid);margin-top:8px;max-width:31ch}

[data-c="ex-3"] .exstage{position:relative;margin-top:24px}
[data-c="ex-3"] .exwall{position:absolute;left:-10px;right:-10px;top:-14px;height:134px;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(235,238,248,.19) 0 1px,rgba(235,238,248,0) 1px 11px);
  -webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 50%,#000 34%,transparent 84%);
          mask-image:radial-gradient(ellipse 62% 58% at 50% 50%,#000 34%,transparent 84%)}
[data-c="ex-3"] .exrow{position:relative;display:flex;justify-content:center;gap:14px}
[data-c="ex-3"] .excol{width:96px;display:flex;flex-direction:column;align-items:center}

[data-c="ex-3"] .exc{position:relative;width:78px;height:106px;border-radius:10px;overflow:hidden;
  clip-path:inset(0 round 10px)}
[data-c="ex-3"] .exfill{position:absolute;inset:0;background:#0b0d11}
[data-c="ex-3"] .exfilm{position:absolute;inset:0;
  background:linear-gradient(165deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 48%,rgba(255,255,255,.06))}
[data-c="ex-3"] .exrim{position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.55),rgba(255,255,255,.10) 26%,
    rgba(255,255,255,.02) 52%,rgba(255,255,255,.20) 80%,rgba(255,255,255,.42));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}

[data-c="ex-3"] .a7 .exfill{opacity:.05}
[data-c="ex-3"] .a7 .exfilm{opacity:.30}
[data-c="ex-3"] .a7 .exrim{opacity:.22}
[data-c="ex-3"] .a90 .exfill{opacity:.56}
[data-c="ex-3"] .a90 .exfilm{opacity:.70}
[data-c="ex-3"] .a90 .exrim{opacity:.62}
[data-c="ex-3"] .a300 .exfill{opacity:.94}
[data-c="ex-3"] .a300 .exfilm{opacity:1}
[data-c="ex-3"] .a300 .exrim{opacity:1}
[data-c="ex-3"] .a90{box-shadow:0 10px 22px rgba(0,0,0,.35)}
[data-c="ex-3"] .a300{box-shadow:0 14px 30px rgba(0,0,0,.6)}

[data-c="ex-3"] .exlab{font-size:11px;color:var(--text-lo);margin-top:13px;line-height:1.35}
[data-c="ex-3"] .exlab b{display:block;color:var(--text-mid);font-weight:600;font-size:11.5px;
  font-variant-numeric:tabular-nums;letter-spacing:-.005em}

[data-c="ex-3"] .exrule{width:56px;height:1px;background:var(--hairline);margin:22px 0 16px}
[data-c="ex-3"] .extod{font-size:11.5px;color:var(--text-lo);margin-bottom:12px}

[data-c="ex-3"] .exstage.big{margin-top:0}
[data-c="ex-3"] .exstage.big .exwall{top:-12px;height:186px;left:14px;right:14px;
  -webkit-mask-image:radial-gradient(ellipse 68% 62% at 50% 50%,#000 42%,transparent 88%);
          mask-image:radial-gradient(ellipse 68% 62% at 50% 50%,#000 42%,transparent 88%)}
[data-c="ex-3"] .exc.big{width:118px;height:160px;border-radius:13px;clip-path:inset(0 round 13px);
  box-shadow:0 20px 40px rgba(0,0,0,.62)}
[data-c="ex-3"] .exc.big .exfill{opacity:.96;animation:ex3body .8s cubic-bezier(.2,.8,.3,1) .5s both}
@keyframes ex3body{from{opacity:.80}to{opacity:.96}}

/* THE ONE ACCENT MOMENT: the edge finally catching light, the day the object
   becomes solid enough to have one. */
/* on today's card the lit edge IS the edge, so the neutral rim steps back and
   the one accent moment is the only thing catching light. */
[data-c="ex-3"] .exc.big .exrim{opacity:.3}
[data-c="ex-3"] .exlit{position:absolute;inset:0;border-radius:inherit;padding:1.6px;pointer-events:none;
  background:linear-gradient(140deg,rgba(var(--accent-rgb),.95),rgba(var(--accent-rgb),.18) 34%,
    rgba(var(--accent-rgb),.06) 58%,rgba(var(--accent-rgb),.55) 84%,rgba(var(--accent-rgb),.9));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  opacity:.95;animation:ex3edge .7s cubic-bezier(.2,.8,.3,1) .62s both}
@keyframes ex3edge{from{opacity:0;transform:scale(.985)}to{opacity:.95;transform:scale(1)}}

[data-c="ex-3"] .exdep{font-size:14.5px;color:var(--text-mid);line-height:1.5;margin-top:16px;max-width:26ch}
[data-c="ex-3"] .exdep b{color:var(--text-hi);font-weight:650}
[data-c="ex-3"] .excap{font-size:12px;color:var(--text-mid);line-height:1.5;margin-top:8px;max-width:33ch}
</style>
<div class="ph" data-c="ex-3"><div class="st">
  <div class="b b1">
    <div class="exhd">Be a better father.</div>
    <div class="exsub">Nothing here can be counted, so the card earns a body instead of a number.</div>

    <div class="exstage">
      <div class="exwall"></div>
      <div class="exrow">
        <div class="excol">
          <div class="exc a7"><div class="exfill"></div><div class="exfilm"></div><div class="exrim"></div></div>
          <div class="exlab"><b>Day 7</b>4 marks</div>
        </div>
        <div class="excol">
          <div class="exc a90"><div class="exfill"></div><div class="exfilm"></div><div class="exrim"></div></div>
          <div class="exlab"><b>Day 90</b>61 marks</div>
        </div>
        <div class="excol">
          <div class="exc a300"><div class="exfill"></div><div class="exfilm"></div><div class="exrim"></div></div>
          <div class="exlab"><b>Day 300</b>214 marks</div>
        </div>
      </div>
    </div>

    <div class="exrule"></div>
    <div class="extod">Today</div>

    <div class="exstage big">
      <div class="exwall"></div>
      <div class="exc big a300">
        <div class="exfill"></div><div class="exfilm"></div><div class="exrim"></div><div class="exlit"></div>
      </div>
    </div>

    <div class="exdep">On this day, you wrote about <b>Theo</b> again.</div>
    <div class="excap">At a week it is a rumour you can see through. At 300 days it blocks the light behind it.</div>
  </div>
</div>
<div class="hint">Tap to replay</div></div>
