<style>
/* ba-2 "The Rise". The number they chased rises up THROUGH the screen,
   enormous, edge to edge, and the instant it locks the whole screen pulses
   their colour, shakes, and rains. The goal made monumental: nothing on
   screen but the thing they said they would do, now true. */
[data-c="ba-2"] .ba2-from{font-size:14px;color:var(--text-lo);margin-bottom:10px}
[data-c="ba-2"] .b1.on .ba2-from{animation:ba2Fade .5s ease-out both}
@keyframes ba2Fade{from{opacity:0}to{opacity:1}}
[data-c="ba-2"] .ba2-clip{overflow:hidden;padding:10px 0}
[data-c="ba-2"] .ba2-hero{font-size:132px;font-weight:750;letter-spacing:-.055em;line-height:1;
  color:var(--text-hi);font-variant-numeric:tabular-nums}
[data-c="ba-2"] .b1.on .ba2-hero{animation:ba2Rise 1.1s cubic-bezier(.16,1.12,.3,1) .35s both}
@keyframes ba2Rise{from{transform:translateY(115%)}to{transform:none}}
/* the lock: a full-screen colour pulse + shake + underline snap */
[data-c="ba-2"] .ba2-pulse{position:absolute;inset:0;background:var(--accent);opacity:0}
[data-c="ba-2"] .b1.on .ba2-pulse{animation:ba2Pulse .9s cubic-bezier(.2,.8,.3,1) 1.4s both}
@keyframes ba2Pulse{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}
[data-c="ba-2"] .ba2-stage{position:relative;display:flex;flex-direction:column;align-items:center}
[data-c="ba-2"] .b1.on .ba2-stage{animation:ba2Shake .45s linear 1.45s both}
@keyframes ba2Shake{0%,100%{transform:none}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}
  75%{transform:translate(2px,1px)}}
[data-c="ba-2"] .ba2-snap{width:0;height:4px;border-radius:2px;background:var(--accent);margin-top:18px}
[data-c="ba-2"] .b1.on .ba2-snap{animation:ba2Snap .45s cubic-bezier(.16,1.3,.3,1) 1.5s forwards}
@keyframes ba2Snap{from{width:0}to{width:150px}}
[data-c="ba-2"] .ba2-unit{margin-top:16px;font-size:17px;font-weight:600;color:var(--text-mid)}
[data-c="ba-2"] .b1.on .ba2-unit{animation:ba2Up .5s ease-out 1.75s both}
[data-c="ba-2"] .ba2-did{margin-top:20px;font-size:21px;font-weight:750;letter-spacing:-.02em;color:var(--accent)}
[data-c="ba-2"] .b1.on .ba2-did{animation:ba2Slam .5s cubic-bezier(.16,1.35,.3,1) 2s both}
@keyframes ba2Slam{from{opacity:0;transform:scale(1.4)}to{opacity:1;transform:scale(1)}}
@keyframes ba2Up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

[data-c="ba-2"] .ba2-cost{font-size:19px;line-height:2.05;color:var(--text-mid)}
[data-c="ba-2"] .ba2-cost b{color:var(--text-hi);font-size:26px;font-variant-numeric:tabular-nums}
[data-c="ba-2"] .b2.on .ba2-cost{animation:ba2Up .55s ease-out .15s both}

[data-c="ba-2"] .ba2-line{font-size:28px;font-weight:750;letter-spacing:-.03em;max-width:11ch;color:var(--text-hi)}
[data-c="ba-2"] .b3.on .ba2-line{animation:ba2Up .5s ease-out .15s both}
[data-c="ba-2"] .ba2-rem{margin-top:14px;font-size:14px;color:var(--text-mid)}
[data-c="ba-2"] .b3.on .ba2-rem{animation:ba2Up .5s ease-out .55s both}
@media (prefers-reduced-motion:reduce){
  [data-c="ba-2"] .ba2fw{display:none}
  [data-c="ba-2"] .ba2-from,[data-c="ba-2"] .ba2-hero,[data-c="ba-2"] .ba2-unit,
  [data-c="ba-2"] .ba2-did,[data-c="ba-2"] .ba2-cost,[data-c="ba-2"] .ba2-line,
  [data-c="ba-2"] .ba2-rem{opacity:1;transform:none;animation:none}
  [data-c="ba-2"] .ba2-pulse{opacity:0;animation:none}
  [data-c="ba-2"] .ba2-snap{width:150px;animation:none}
  [data-c="ba-2"] .ba2-stage{animation:none}
}
[data-c="ba-2"] .ba2fw{position:absolute;left:50%;top:24%;width:0;height:0}
[data-c="ba-2"] .ba2fw i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0}
[data-c="ba-2"] .ba2fw i:nth-child(2n){background:#fff}
[data-c="ba-2"] .b1.on .ba2fw i{animation:ba2Spk 1s cubic-bezier(.15,.6,.3,1) 1.5s both}
@keyframes ba2Spk{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
</style>
<div class="ph" data-c="ba-2">
  <div class="st">

    <div class="b b1" data-confetti>
      <div class="ba2-pulse"></div>
            <div class="ba2fw" aria-hidden="true">
        <i style="--dx:-52px;--dy:-36px"></i><i style="--dx:50px;--dy:-40px"></i><i style="--dx:-60px;--dy:14px"></i>
        <i style="--dx:58px;--dy:18px"></i><i style="--dx:-22px;--dy:-56px"></i><i style="--dx:24px;--dy:-54px"></i>
        <i style="--dx:-40px;--dy:46px"></i><i style="--dx:42px;--dy:48px"></i><i style="--dx:0px;--dy:-64px"></i>
      </div>
      <div class="ba2-stage">
        <div class="ba2-from">From 230.</div>
        <div class="ba2-clip"><div class="ba2-hero">200</div></div>
        <div class="ba2-snap" aria-hidden="true"></div>
        <div class="ba2-unit">lbs. The number you named.</div>
        <div class="ba2-did">You actually did it.</div>
      </div>
    </div>

    <div class="b b2">
      <div class="ba2-cost"><b data-count="0|126">126</b> days.<br><b data-count="0|215">215</b> weigh-ins.<br>230 &rarr; <b>200</b>.</div>
    </div>

    <div class="b b3">
      <div class="ba2-line">Lost 30 lbs.</div>
      <div class="ba2-rem">Sealed into your Memento.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
