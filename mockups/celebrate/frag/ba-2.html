<style>
/* ba-2 "The Return". The WHOLE SCREEN replays the journey: it washes cyan
   (the day you found clarity), white (the day you moved), green (the days
   you kept going), then floods THEIR colour and stays, the M landing dark
   on it. His original arc, full bleed. Then the receipts, then the seal. */
[data-c="ba-2"] .ba2-wash{position:absolute;inset:0;opacity:0}
[data-c="ba-2"] .b1.on .ba2-w1{animation:ba2Wash 1.15s ease-in-out .5s both;background:#2bd4d4}
[data-c="ba-2"] .b1.on .ba2-w2{animation:ba2Wash 1.15s ease-in-out 1.55s both;background:#eef1f8}
[data-c="ba-2"] .b1.on .ba2-w3{animation:ba2Wash 1.15s ease-in-out 2.6s both;background:#3fd94e}
[data-c="ba-2"] .b1.on .ba2-w4{animation:ba2Stay .8s cubic-bezier(.2,.8,.3,1) 3.65s both;background:var(--accent)}
@keyframes ba2Wash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
@keyframes ba2Stay{from{opacity:0}to{opacity:1}}
[data-c="ba-2"] .ba2-chap{position:relative;font-size:14.5px;font-weight:600;color:var(--text-hi);
  min-height:20px}
[data-c="ba-2"] .ba2-c{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;opacity:0}
[data-c="ba-2"] .b1.on .ba2-c1{animation:ba2Cap 1.15s ease-in-out .5s both}
[data-c="ba-2"] .b1.on .ba2-c2{animation:ba2Cap 1.15s ease-in-out 1.55s both;color:#0b0e12}
[data-c="ba-2"] .b1.on .ba2-c3{animation:ba2Cap 1.15s ease-in-out 2.6s both;color:#0b0e12}
@keyframes ba2Cap{0%{opacity:0;transform:translate(-50%,7px)}30%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
[data-c="ba-2"] .ba2-m{position:relative;width:70px;height:70px;fill:#0b0e12;margin-bottom:24px;opacity:0}
[data-c="ba-2"] .b1.on .ba2-m{animation:ba2MIn .6s cubic-bezier(.16,1.2,.3,1) 3.9s both}
@keyframes ba2MIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
[data-c="ba-2"] .ba2-now{position:relative;font-size:30px;font-weight:750;letter-spacing:-.035em;
  color:#0b0e12;opacity:0;max-width:11ch}
[data-c="ba-2"] .b1.on .ba2-now{animation:ba2MIn .55s cubic-bezier(.16,1.2,.3,1) 4.25s both}

[data-c="ba-2"] .ba2-cost{font-size:19px;line-height:2.05;color:var(--text-mid)}
[data-c="ba-2"] .ba2-cost b{color:var(--text-hi);font-size:26px;font-variant-numeric:tabular-nums}
[data-c="ba-2"] .b2.on .ba2-cost{animation:ba2Up .55s ease-out .2s both}
[data-c="ba-2"] .ba2-line{font-size:30px;font-weight:750;letter-spacing:-.032em;max-width:11ch;color:var(--text-hi)}
[data-c="ba-2"] .b3.on .ba2-line{animation:ba2Up .5s ease-out .15s both}
[data-c="ba-2"] .ba2-rem{margin-top:15px;font-size:14px;color:var(--text-mid)}
[data-c="ba-2"] .b3.on .ba2-rem{animation:ba2Up .5s ease-out .55s both}
@keyframes ba2Up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  [data-c="ba-2"] .ba2-wash,[data-c="ba-2"] .ba2-c{opacity:0;animation:none}
  [data-c="ba-2"] .ba2-w4{opacity:1}
  [data-c="ba-2"] .ba2-m,[data-c="ba-2"] .ba2-now,[data-c="ba-2"] .ba2-cost,
  [data-c="ba-2"] .ba2-line,[data-c="ba-2"] .ba2-rem{opacity:1;transform:none;animation:none}
}
</style>
<div class="ph" data-c="ba-2">
  <div class="st">

    <div class="b b1" data-confetti>
      <div class="ba2-wash ba2-w1"></div>
      <div class="ba2-wash ba2-w2"></div>
      <div class="ba2-wash ba2-w3"></div>
      <div class="ba2-wash ba2-w4"></div>
      <svg class="ba2-m" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
      <div class="ba2-now">Lost 30 lbs.</div>
      <div class="ba2-chap">
        <span class="ba2-c ba2-c1">The day you saw it.</span>
        <span class="ba2-c ba2-c2">The day you moved.</span>
        <span class="ba2-c ba2-c3">The days you kept going.</span>
      </div>
    </div>

    <div class="b b2">
      <div class="ba2-cost"><b data-count="0|126">126</b> days.<br><b data-count="0|215">215</b> weigh-ins.<br>230 &rarr; <b>200</b>.</div>
    </div>

    <div class="b b3">
      <div class="ba2-line">Lost 30 lbs.</div>
      <div class="ba2-rem">Your Memento remembers how.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
