<style>
/* ba-10 "The Monument". The M itself is the ceremony: it starts as a seed
   of light in the dark and GROWS, hundreds of times over, the glow behind
   it climbing, until it stands enormous, and the screen ignites around it.
   The goal line lands across its base. The brand IS the trophy; a
   screenshot of this one advertises both the win and Memento. */
[data-c="ba-10"] .ba10-glow{position:absolute;left:50%;top:44%;width:340px;height:340px;margin:-170px 0 0 -170px;
  border-radius:50%;background:radial-gradient(circle, rgba(var(--accent-rgb),.4), rgba(var(--accent-rgb),0) 70%);
  opacity:0}
[data-c="ba-10"] .b1.on .ba10-glow{animation:ba10Glow 2.4s cubic-bezier(.4,0,.6,1) .3s both}
@keyframes ba10Glow{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
[data-c="ba-10"] .ba10-mm{position:relative;width:210px;height:210px;fill:var(--accent)}
[data-c="ba-10"] .b1.on .ba10-mm{animation:ba10Grow 2.5s cubic-bezier(.3,0,.25,1) .25s both}
@keyframes ba10Grow{0%{opacity:0;transform:scale(.08)}18%{opacity:1}
  82%{transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
/* the ignition */
[data-c="ba-10"] .ba10-flood{position:absolute;inset:0;background:var(--accent);opacity:0}
[data-c="ba-10"] .b1.on .ba10-flood{animation:ba10Flood .35s cubic-bezier(.2,.8,.3,1) 2.9s forwards}
@keyframes ba10Flood{from{opacity:0}to{opacity:1}}
[data-c="ba-10"] .ba10-fw{position:absolute;width:0;height:0}
[data-c="ba-10"] .ba10-w1{left:24%;top:22%}
[data-c="ba-10"] .ba10-w2{left:76%;top:20%}
[data-c="ba-10"] .ba10-w3{left:50%;top:14%}
[data-c="ba-10"] .ba10-fw i{position:absolute;width:6px;height:6px;border-radius:50%;background:#0b0e12;opacity:0}
[data-c="ba-10"] .ba10-fw i:nth-child(2n){background:#fff}
[data-c="ba-10"] .b1.on .ba10-w1 i{animation:ba10Spark 1s cubic-bezier(.15,.6,.3,1) 3.1s both}
[data-c="ba-10"] .b1.on .ba10-w2 i{animation:ba10Spark 1s cubic-bezier(.15,.6,.3,1) 3.3s both}
[data-c="ba-10"] .b1.on .ba10-w3 i{animation:ba10Spark 1s cubic-bezier(.15,.6,.3,1) 3.5s both}
@keyframes ba10Spark{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
[data-c="ba-10"] .ba10-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;opacity:0;padding:34px}
[data-c="ba-10"] .b1.on .ba10-stage{animation:ba10In .01s linear 3.05s forwards, ba10Shake .45s linear 3.07s}
@keyframes ba10In{to{opacity:1}}
@keyframes ba10Shake{0%,100%{transform:none}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}
  75%{transform:translate(2px,1px)}}
[data-c="ba-10"] .ba10-m2{width:120px;height:120px;fill:#0b0e12}
[data-c="ba-10"] .b1.on .ba10-m2{animation:ba10MSlam .55s cubic-bezier(.16,1.3,.3,1) 3.07s both}
@keyframes ba10MSlam{from{opacity:0;transform:scale(1.8)}to{opacity:1;transform:scale(1)}}
[data-c="ba-10"] .ba10-line{margin-top:24px;font-size:42px;font-weight:750;letter-spacing:-.04em;
  line-height:1.05;color:#0b0e12;max-width:10ch}
[data-c="ba-10"] .b1.on .ba10-line{animation:ba10Slam .5s cubic-bezier(.16,1.3,.3,1) 3.35s both}
@keyframes ba10Slam{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:scale(1)}}
[data-c="ba-10"] .ba10-monu{margin-top:18px;font-size:14.5px;font-weight:650;color:rgba(11,14,18,.78)}
[data-c="ba-10"] .b1.on .ba10-monu{animation:ba10Up .5s ease-out 3.75s both}
@keyframes ba10Up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

[data-c="ba-10"] .ba10-cost{font-size:19px;line-height:2.05;color:var(--text-mid)}
[data-c="ba-10"] .ba10-cost b{color:var(--text-hi);font-size:26px;font-variant-numeric:tabular-nums}
[data-c="ba-10"] .b2.on .ba10-cost{animation:ba10Up .55s ease-out .15s both}
[data-c="ba-10"] .ba10-fin{font-size:28px;font-weight:750;letter-spacing:-.03em;max-width:11ch;color:var(--text-hi)}
[data-c="ba-10"] .b3.on .ba10-fin{animation:ba10Up .5s ease-out .15s both}
[data-c="ba-10"] .ba10-close{margin-top:14px;font-size:14px;color:var(--text-mid)}
[data-c="ba-10"] .b3.on .ba10-close{animation:ba10Up .5s ease-out .55s both}
@media (prefers-reduced-motion:reduce){
  [data-c="ba-10"] .ba10-glow,[data-c="ba-10"] .ba10-mm,[data-c="ba-10"] .ba10-fw{display:none}
  [data-c="ba-10"] .ba10-flood{opacity:1;animation:none}
  [data-c="ba-10"] .ba10-stage{opacity:1;animation:none}
  [data-c="ba-10"] .ba10-m2,[data-c="ba-10"] .ba10-line,[data-c="ba-10"] .ba10-monu,
  [data-c="ba-10"] .ba10-cost,[data-c="ba-10"] .ba10-fin,[data-c="ba-10"] .ba10-close{opacity:1;transform:none;animation:none}
}
/* THE ENGRAVING: the M built from dots, their work in the mark. */
[data-c="ba-10"] .b2{padding:26px}
[data-c="ba-10"] .ba10-wall{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
[data-c="ba-10"] .ba10-eng{opacity:0}
[data-c="ba-10"] .b2.on .ba10-eng{animation:ba10E 1s cubic-bezier(.2,.8,.3,1) .1s both}
@keyframes ba10E{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
[data-c="ba-10"] .ba10-under{margin-top:24px;text-align:center;opacity:0}
[data-c="ba-10"] .ba10-under b{font-size:40px;font-weight:750;letter-spacing:-.04em;color:var(--text-hi);
  font-variant-numeric:tabular-nums}
[data-c="ba-10"] .ba10-under span{display:block;margin-top:7px;font-size:12px;color:var(--text-lo)}
[data-c="ba-10"] .b2.on .ba10-under{animation:ba10Up .5s ease-out .9s both}
@media (prefers-reduced-motion:reduce){ [data-c="ba-10"] .ba10-eng,[data-c="ba-10"] .ba10-under{opacity:1;transform:none;animation:none} }
</style>
<div class="ph" data-c="ba-10">
  <div class="st">

    <div class="b b1" data-confetti>
      <div class="ba10-glow" aria-hidden="true"></div>
      <svg class="ba10-mm" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
      <div class="ba10-flood"></div>
      <div class="ba10-fw ba10-w1" aria-hidden="true">
        <i style="--dx:-40px;--dy:-34px"></i><i style="--dx:42px;--dy:-30px"></i><i style="--dx:-48px;--dy:10px"></i>
        <i style="--dx:46px;--dy:14px"></i><i style="--dx:-16px;--dy:-48px"></i><i style="--dx:18px;--dy:-46px"></i>
        <i style="--dx:-30px;--dy:38px"></i><i style="--dx:32px;--dy:40px"></i>
      </div>
      <div class="ba10-fw ba10-w2" aria-hidden="true">
        <i style="--dx:-40px;--dy:-34px"></i><i style="--dx:42px;--dy:-30px"></i><i style="--dx:-48px;--dy:10px"></i>
        <i style="--dx:46px;--dy:14px"></i><i style="--dx:-16px;--dy:-48px"></i><i style="--dx:18px;--dy:-46px"></i>
        <i style="--dx:-30px;--dy:38px"></i><i style="--dx:32px;--dy:40px"></i>
      </div>
      <div class="ba10-fw ba10-w3" aria-hidden="true">
        <i style="--dx:-40px;--dy:-34px"></i><i style="--dx:42px;--dy:-30px"></i><i style="--dx:-48px;--dy:10px"></i>
        <i style="--dx:46px;--dy:14px"></i><i style="--dx:-16px;--dy:-48px"></i><i style="--dx:18px;--dy:-46px"></i>
        <i style="--dx:-30px;--dy:38px"></i><i style="--dx:32px;--dy:40px"></i>
      </div>
      <div class="ba10-stage">
        <svg class="ba10-m2" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
        <div class="ba10-line">Lost 30 lbs.</div>
        <div class="ba10-monu">Set in the mark, for good.</div>
      </div>
    </div>

    <div class="b b2">
      <div class="ba10-wall">
        <svg class="ba10-eng" width="240" height="240" viewBox="0 0 512 512" aria-hidden="true">
          <defs><pattern id="ba10dots" width="17" height="17" patternUnits="userSpaceOnUse">
            <circle cx="8" cy="8" r="4.4" fill="var(--accent)"/></pattern></defs>
          <path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z" fill="url(#ba10dots)"/>
        </svg>
        <div class="ba10-under"></div>
      </div>
    </div>

    <div class="b b3">
      <div class="ba10-fin">Lost 30 lbs.</div>
      <div class="ba10-close">This goal closes. The record stays.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
