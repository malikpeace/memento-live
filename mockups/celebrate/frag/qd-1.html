<style>
/* qd-1 REBUILT to mirror qu-1 (Malik 2026-08-16: "basically the same as
   qu-1 just reversed"). Big current number on top, then the SAME distance
   axis below: sharp opaque ticks rooted on the baseline, growing along the
   road, quarter labels, the accent tick at today, no number repeated on the
   line. The only difference from qu-1 is the road runs from the START weight
   on the left to the GOAL weight on the right, so travel reads left to right
   as the number falls. */
[data-c="qd-1"] .qd1-hero{font-size:104px}
[data-c="qd-1"] .qd1-hero2{font-size:72px}
[data-c="qd-1"] .qd1-sub2{margin-bottom:26px}

[data-c="qd-1"] .qd1-axis{position:relative;width:302px;margin:2px auto 24px}
[data-c="qd-1"] .qd1-rail{position:relative;height:34px}
[data-c="qd-1"] .qd1-base{position:absolute;left:0;right:0;bottom:0;height:2.5px;
  background:rgba(var(--ink),.16)}
[data-c="qd-1"] .qd1-gone{position:absolute;left:0;bottom:0;height:2.5px;
  background:rgba(var(--ink),.48)}
[data-c="qd-1"] .qd1-t{position:absolute;bottom:0;width:2px;transform:translateX(-50%);
  background:var(--tick,#6b7180)}
[data-c="qd-1"] .qd1-t.is-past{background:var(--tick-past,#9aa0ad)}
[data-c="qd-1"] .qd1-t.is-now{width:3px;background:var(--accent)}
@media (prefers-color-scheme:light){
  [data-c="qd-1"]{--tick:#c2c7d0;--tick-past:#8b93a1}
}
[data-c="qd-1"] .qd1-labels{position:relative;height:36px;margin-top:8px;font-size:var(--lfs,13px)}
[data-c="qd-1"] .qd1-l{position:absolute;top:0;transform:translateX(-50%);text-align:center;white-space:nowrap}
[data-c="qd-1"] .qd1-l--a{transform:none;text-align:left}
[data-c="qd-1"] .qd1-l--z{transform:translateX(-100%);text-align:right}
[data-c="qd-1"] .qd1-num{font-size:inherit;font-weight:650;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;color:var(--text-lo)}
[data-c="qd-1"] .qd1-l.is-past .qd1-num{color:rgba(var(--ink),.62)}
[data-c="qd-1"] .qd1-date{font-size:10.5px;color:var(--text-lo);margin-top:4px;font-variant-numeric:tabular-nums}
[data-c="qd-1"] .b3{padding-bottom:96px}
[data-c="qd-1"] .deposit{text-wrap:balance}

[data-c="qd-1"] .b.on .qd1-t{animation:qd1Rise .44s cubic-bezier(.2,.8,.3,1) var(--d,0s) both}
@keyframes qd1Rise{from{opacity:0;transform:translateX(-50%) translateY(6px)}
  to{opacity:1;transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){
  [data-c="qd-1"] .b.on .qd1-t{animation:none}
}
</style>
<div class="ph" data-c="qd-1">
  <div class="st">

    <div class="b b1">
      <div class="n qd1-hero" data-count="270|262">262</div>
      <div class="sub">on the scale today.</div>
    </div>

    <div class="b b2">
      <div class="n qd1-hero2" data-count="270|262">262</div>
      <div class="sub qd1-sub2">lbs</div>
      <div class="qd1-axis">
        <div class="qd1-rail">
          <div class="qd1-base"></div>
          <div class="qd1-gone"></div>
        </div>
        <div class="qd1-labels"></div>
      </div>
      <div class="cap qd1-cap">12 to go.</div>
    </div>

    <div class="b b3">
      <div class="deposit">On this day, the scale read <b>262</b>. Down 8 from where you started.</div>
      <svg class="mark--foot" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
