<style>
/* qd-1 RESTYLED to The Gap, reversed (Malik 2026-08-16: same as qu-1, the
   road just runs from the START weight down to the GOAL). The gap's exact
   recipe: dotted road, the closed ground coloured, ghost tick at the last
   mark, white tick where the number stands today. Big number on top, what's
   left at the bottom. */
[data-c="qd-1"] .qd1-hero{font-size:104px}
[data-c="qd-1"] .qd1-hero2{font-size:72px}
[data-c="qd-1"] .qd1-sub2{margin-bottom:34px}

[data-c="qd-1"] .gp{width:100%;max-width:302px;display:flex;flex-direction:column;align-items:center}
[data-c="qd-1"] .gp__scale{display:flex;justify-content:space-between;width:100%;
  margin:0 0 10px;font-size:11px;color:var(--text-lo);font-variant-numeric:tabular-nums}
[data-c="qd-1"] .gp__rail{position:relative;width:100%;height:2px;border-radius:2px;
  background:repeating-linear-gradient(90deg,
    rgba(var(--ink),.20) 0 3px, rgba(var(--ink),0) 3px 8px)}
[data-c="qd-1"] .gp__fill{position:absolute;left:0;top:-1px;bottom:-1px;width:60%;
  border-radius:2px;background:var(--accent);
  transform-origin:left center;transform:scaleX(var(--gpFrom,.6667))}
[data-c="qd-1"] .b2.on .gp__fill{animation:qd1GapFill 950ms cubic-bezier(.2,.85,.25,1) .3s forwards}
@keyframes qd1GapFill{from{transform:scaleX(var(--gpFrom,.6667))}to{transform:scaleX(1)}}
[data-c="qd-1"] .gp__was{position:absolute;left:40%;top:-5px;width:1px;height:12px;
  background:rgba(var(--ink),.45)}
[data-c="qd-1"] .gp__now{position:absolute;left:60%;top:-8px;width:2px;height:18px;
  margin-left:-1px;border-radius:1px;background:var(--text-hi);
  opacity:0;transform:scaleY(.25);transform-origin:center}
[data-c="qd-1"] .b2.on .gp__now{animation:qd1GapTick 420ms cubic-bezier(.2,.85,.25,1) 1.15s forwards}
@keyframes qd1GapTick{from{opacity:0;transform:scaleY(.25)}to{opacity:1;transform:scaleY(1)}}
[data-c="qd-1"] .gp__row{display:flex;justify-content:space-between;width:100%;
  margin-top:19px;font-size:14.5px;color:var(--text-mid);letter-spacing:-.01em;opacity:0}
[data-c="qd-1"] .gp__row b{color:var(--text-hi);font-weight:700;font-variant-numeric:tabular-nums}
[data-c="qd-1"] .b2.on .gp__row{animation:qd1GapUp 460ms ease-out 1.28s forwards}
[data-c="qd-1"] .gp__cost{margin-top:30px;opacity:0}
[data-c="qd-1"] .b2.on .gp__cost{animation:qd1GapUp 460ms ease-out 1.5s forwards}
@keyframes qd1GapUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
[data-c="qd-1"] .b3{padding-bottom:96px}
[data-c="qd-1"] .deposit{text-wrap:balance}

@media (prefers-reduced-motion:reduce){
  [data-c="qd-1"] .gp__fill{transform:scaleX(1);animation:none}
  [data-c="qd-1"] .gp__now{opacity:1;transform:scaleY(1);animation:none}
  [data-c="qd-1"] .gp__row,[data-c="qd-1"] .gp__cost{opacity:1;transform:none;animation:none}
}
</style>
<div class="ph" data-c="qd-1">
  <div class="st">

    <div class="b b1">
      <div class="n qd1-hero" data-count="270|262">262</div>
      <div class="sub">on the scale today.</div>
    </div>

    <div class="b b2">
      <div class="n qd1-hero2" data-count="270|262">262</div>
      <div class="sub qd1-sub2">lbs</div>
      <div class="gp">
        <div class="gp__scale"><span>270</span><span>250</span></div>
        <div class="gp__rail">
          <span class="gp__fill"></span>
          <span class="gp__was"></span>
          <span class="gp__now"></span>
        </div>
        <div class="gp__row">
          <span><b>8</b> down</span>
          <span><b>12</b> to go</span>
        </div>
        <div class="sub gp__cost"><b>26 days</b> for the last 4.</div>
      </div>
    </div>

    <div class="b b3">
      <div class="deposit">On this day, the scale read <b>262</b>. Down 8 from where you started.</div>
      <svg class="mark--foot" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
