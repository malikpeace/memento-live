<style>
[data-c="qd-1"] .lead{display:flex;align-items:baseline;gap:11px}
[data-c="qd-1"] .lead .of{font-size:24px;font-weight:650;letter-spacing:-.02em;
  color:var(--text-mid);font-variant-numeric:tabular-nums}

[data-c="qd-1"] .rail{position:relative;width:78px;height:238px;
  display:grid;grid-template-rows:repeat(5,1fr);margin-bottom:8px}
[data-c="qd-1"] .rail::before{content:"";position:absolute;left:0;top:10%;bottom:10%;
  width:1px;background:rgba(var(--ink),.10)}
[data-c="qd-1"] .rail::after{content:"";position:absolute;left:0;top:10%;height:20%;
  width:1px;background:rgba(var(--ink),.32)}

[data-c="qd-1"] .mk{display:grid;grid-template-columns:52px auto;align-items:center;
  opacity:0;transform:translateY(5px)}
[data-c="qd-1"] .mk i{display:block;width:20px;height:1px;background:rgba(var(--ink),.18)}
[data-c="qd-1"] .mk span{justify-self:start;font-size:16px;font-weight:700;letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;color:var(--text-lo)}
[data-c="qd-1"] .mk--done i{background:rgba(var(--ink),.30)}
[data-c="qd-1"] .mk--done span{color:rgba(var(--ink),.60)}
[data-c="qd-1"] .mk--now i{width:42px;height:2px;background:var(--accent);
  box-shadow:0 0 18px rgba(var(--accent-rgb),.55)}
[data-c="qd-1"] .mk--now span{font-size:22px;color:var(--text-hi)}

[data-c="qd-1"] .b.on .mk{animation:qd1mk .5s cubic-bezier(.2,.8,.3,1) forwards}
[data-c="qd-1"] .b.on .mk:nth-child(1){animation-delay:.05s}
[data-c="qd-1"] .b.on .mk:nth-child(2){animation-delay:.12s}
[data-c="qd-1"] .b.on .mk:nth-child(3){animation-delay:.19s}
[data-c="qd-1"] .b.on .mk:nth-child(4){animation-delay:.26s}
[data-c="qd-1"] .b.on .mk:nth-child(5){animation-delay:.33s}
@keyframes qd1mk{to{opacity:1;transform:translateY(0)}}

[data-c="qd-1"] .sub{text-wrap:balance}
[data-c="qd-1"] .sub + .sub{margin-top:7px}

[data-c="qd-1"] .deposit{text-wrap:balance}
@media (prefers-reduced-motion:reduce){
  [data-c="qd-1"] .mk{opacity:1;transform:none}
}
</style>
<div class="ph" data-c="qd-1">
  <div class="st">

    <div class="b b1">
      <div class="lead">
        <span class="n n--hero" data-count="0|8">8</span>
        <span class="of">of 20</span>
      </div>
      <div class="sub">lbs down</div>
    </div>

    <div class="b b2">
      <div class="rail">
        <div class="mk mk--done"><i></i><span>4</span></div>
        <div class="mk mk--now"><i></i><span>8</span></div>
        <div class="mk"><i></i><span>12</span></div>
        <div class="mk"><i></i><span>16</span></div>
        <div class="mk"><i></i><span>20</span></div>
      </div>
      <div class="sub">63 days made this.</div>
      <div class="sub">12 lbs still open.</div>
    </div>

    <div class="b b3">
      <div class="deposit">On this day, you reached <b>8 lbs down</b> of 20.</div>
      <svg class="mark--foot" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
