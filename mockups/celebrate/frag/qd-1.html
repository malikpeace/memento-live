<style>
/* qd-1 REBUILT (Malik: the vertical rail did not land; show the numbers on a
   slider, where they are and where they are going). One horizontal line:
   the start weight on the left, the target on the right, the real fifths as
   ticks in between, and the accent post standing where the scale is today.
   Travel toward the goal reads left to right no matter which way the number
   moves. */
[data-c="qd-1"] .lead{display:flex;align-items:baseline;gap:11px}
[data-c="qd-1"] .lead .of{font-size:24px;font-weight:650;letter-spacing:-.02em;
  color:var(--text-mid);font-variant-numeric:tabular-nums}

/* the ends are PART of the line (Malik: 270 at the line's far left, 250 at
   its far right, never under it): number - line - number, one row, the
   captions hang quietly beneath their numbers */
[data-c="qd-1"] .sl{display:flex;align-items:center;gap:12px;width:300px;margin-bottom:26px}
[data-c="qd-1"] .sl__endcol{position:relative;flex:0 0 auto}
[data-c="qd-1"] .sl__endcol b{font-size:15px;font-weight:700;letter-spacing:-.02em;
  color:var(--text-mid);font-variant-numeric:tabular-nums}
[data-c="qd-1"] .sl__endcol span{position:absolute;top:calc(100% + 4px);left:50%;
  transform:translateX(-50%);font-size:10.5px;color:var(--text-lo);white-space:nowrap}
[data-c="qd-1"] .sl__mid{position:relative;flex:1;height:74px}
/* Malik 2026-08-16: the line carries WEIGHT now, and every tick is SHARP.
   Ticks sit ON the line and grow with the distance travelled, so the road
   visibly climbs toward the goal. */
/* the axis line is centred on 50% and every tick is ROOTED on it (bottom:50%),
   so the whole thing reads as one connected graph, no gaps (Malik 2026-08-16) */
[data-c="qd-1"] .sl__track{position:absolute;left:0;right:0;top:50%;height:2.5px;
  transform:translateY(-50%);background:rgba(var(--ink),.14)}
[data-c="qd-1"] .sl__gone{position:absolute;left:0;top:50%;height:2.5px;width:40%;
  transform:translateY(-50%);background:rgba(var(--ink),.46)}
[data-c="qd-1"] .sl__t{position:absolute;bottom:50%;width:2px;height:var(--th,13px);
  background:rgba(var(--ink),.22);transform:translateX(-50%)}
[data-c="qd-1"] .sl__t.is-past{background:rgba(var(--ink),.55)}
/* interim weights ride ABOVE the line */
[data-c="qd-1"] .sl__t small{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);
  font-size:var(--lfs,11px);font-weight:650;letter-spacing:-.02em;color:var(--text-lo);
  font-variant-numeric:tabular-nums}
[data-c="qd-1"] .sl__t.is-past small{color:rgba(var(--ink),.55)}
/* today: the accent post, rooted on the line too. No number here anymore
   (it is big above); the accent post alone marks where they are. */
[data-c="qd-1"] .sl__now{position:absolute;bottom:50%;width:3px;height:24px;
  background:var(--accent);transform:translateX(-50%)}
[data-c="qd-1"] .sl__endcol b{font-size:var(--efs,15px)}

[data-c="qd-1"] .b.on .sl__gone{transform-origin:left;animation:qd1gone .7s cubic-bezier(.2,.8,.3,1) .15s both}
@keyframes qd1gone{from{transform:scaleX(0)}to{transform:scaleX(1)}}
[data-c="qd-1"] .b.on .sl__now{animation:qd1now .5s cubic-bezier(.2,.8,.3,1) .55s both}
@keyframes qd1now{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%)}}

[data-c="qd-1"] .sub{text-wrap:balance}
[data-c="qd-1"] .sub + .sub{margin-top:7px}
[data-c="qd-1"] .deposit{text-wrap:balance}
@media (prefers-reduced-motion:reduce){
  [data-c="qd-1"] .b.on .sl__gone,[data-c="qd-1"] .b.on .sl__now{animation:none}
}
</style>
<div class="ph" data-c="qd-1">
  <div class="st">

    <div class="b b1">
      <div class="lead">
        <span class="n n--hero" data-count="270|262">262</span>
        <span class="of">lbs</span>
      </div>
      <div class="sub">The scale this morning.</div>
    </div>

    <div class="b b2">
      <!-- the ticks are REAL scale weights on the way down (Malik: real
           numbers, never "X of Y down" arithmetic). Positions are simple
           percentages of |start - target|, so any weights land correctly. -->
      <div class="sl">
        <div class="sl__endcol"><b>270</b><span>started, Mar 3</span></div>
        <div class="sl__mid">
          <div class="sl__track"></div>
          <div class="sl__gone"></div>
          <div class="sl__t is-past" style="left:20%"><small>266</small></div>
          <div class="sl__now" style="left:40%"><b>262</b></div>
          <div class="sl__t" style="left:60%"><small>258</small></div>
          <div class="sl__t" style="left:80%"><small>254</small></div>
        </div>
        <div class="sl__endcol"><b>250</b><span>the goal</span></div>
      </div>
      <div class="sub">Started at 270, 63 days ago.</div>
      <div class="sub">250 is 12 away.</div>
    </div>

    <div class="b b3">
      <div class="deposit">On this day, the scale read <b>262</b>. Down 8 from where you started.</div>
      <svg class="mark--foot" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
