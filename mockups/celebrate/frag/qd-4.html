<style>
[data-c="qd-4"] .lead{display:flex;align-items:baseline;justify-content:center}
[data-c="qd-4"] .lead .cur{font-size:34px;font-weight:700;letter-spacing:-.02em;
  color:var(--text-mid);margin-right:3px}
[data-c="qd-4"] .b1 .sub{max-width:21ch}

[data-c="qd-4"] .fall{position:relative;width:210px;padding-left:26px;text-align:left;margin-bottom:12px}
[data-c="qd-4"] .fall .drop{position:absolute;left:0;top:12px;bottom:26px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,rgba(var(--accent-rgb),.16),var(--accent));
  transform-origin:50% 0;transform:scaleY(0)}
[data-c="qd-4"] .b.on .drop{animation:qd4drop .62s cubic-bezier(.2,.8,.3,1) .18s forwards}
@keyframes qd4drop{to{transform:scaleY(1)}}

[data-c="qd-4"] .frow{opacity:0;transform:translateY(5px)}
[data-c="qd-4"] .frow + .frow{margin-top:24px}
[data-c="qd-4"] .frow .v{font-size:34px;font-weight:800;letter-spacing:-.04em;
  line-height:1;font-variant-numeric:tabular-nums;color:var(--text-hi)}
[data-c="qd-4"] .frow .v--was{font-size:26px;color:rgba(var(--ink),.44)}
[data-c="qd-4"] .frow .d{font-size:12.5px;color:var(--text-lo);margin-top:5px}
[data-c="qd-4"] .b.on .frow{animation:qd4row .5s cubic-bezier(.2,.8,.3,1) forwards}
[data-c="qd-4"] .b.on .frow:nth-of-type(1){animation-delay:.05s}
[data-c="qd-4"] .b.on .frow:nth-of-type(2){animation-delay:.5s}
@keyframes qd4row{to{opacity:1;transform:translateY(0)}}

[data-c="qd-4"] .sub{text-wrap:balance}
[data-c="qd-4"] .sub + .sub{margin-top:7px}
[data-c="qd-4"] .deposit{max-width:23ch;text-wrap:balance}

@media (prefers-reduced-motion:reduce){
  [data-c="qd-4"] .frow{opacity:1;transform:none}
  [data-c="qd-4"] .fall .drop{transform:scaleY(1)}
}
</style>
<div class="ph" data-c="qd-4">
  <div class="st">

    <div class="b b1">
      <div class="lead">
        <span class="cur">$</span><span class="n n--big">29,900</span>
      </div>
      <div class="sub">left on the loan. Under 30,000 for the first time.</div>
    </div>

    <div class="b b2">
      <div class="fall">
        <i class="drop"></i>
        <div class="frow"><div class="v v--was">$34,000</div><div class="d">January 6</div></div>
        <div class="frow"><div class="v">$29,900</div><div class="d">today</div></div>
      </div>
      <div class="sub">14 payments over 7 months.</div>
      <div class="sub">$4,100 closed. $29,900 open.</div>
    </div>

    <div class="b b3">
      <div class="deposit">On this day, the balance went under <b>$30,000</b>.</div>
      <svg class="mark--foot" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
