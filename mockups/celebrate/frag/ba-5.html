<style>
/* ba-5 "The Fireworks". Night sky: their goal line quiet at centre while
   confetti rain already falls, then three fireworks burst above it, one
   after another, each with a soft flash; on the last one the colour sweeps
   up from the bottom like a curtain and the line goes MASSIVE with the M.
   The whole sky celebrates, then the record is put away. */
[data-c="ba-5"] .ba5-line0{font-size:20px;font-weight:650;letter-spacing:-.015em;color:var(--text-hi);
  max-width:14ch;line-height:1.4}
[data-c="ba-5"] .b1.on .ba5-line0{animation:ba5Fade .6s ease-out both, ba5Line0Out .3s ease-in 2.75s forwards}
@keyframes ba5Fade{from{opacity:0}to{opacity:1}}
@keyframes ba5Line0Out{to{opacity:0}}
/* a firework: 10 sparks radiating from a point + a soft radial flash */
[data-c="ba-5"] .ba5-fw{position:absolute;width:0;height:0}
[data-c="ba-5"] .ba5-f1{left:26%;top:24%}
[data-c="ba-5"] .ba5-f2{left:74%;top:19%}
[data-c="ba-5"] .ba5-f3{left:50%;top:30%}
[data-c="ba-5"] .ba5-fw i{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:0}
[data-c="ba-5"] .ba5-fw i:nth-child(2n){background:#fff}
[data-c="ba-5"] .ba5-fw em{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle, rgba(var(--accent-rgb),.5), rgba(var(--accent-rgb),0) 70%);opacity:0}
[data-c="ba-5"] .b1.on .ba5-f1 i{animation:ba5Spark 1s cubic-bezier(.15,.6,.3,1) .5s both}
[data-c="ba-5"] .b1.on .ba5-f2 i{animation:ba5Spark 1s cubic-bezier(.15,.6,.3,1) 1.3s both}
[data-c="ba-5"] .b1.on .ba5-f3 i{animation:ba5Spark 1s cubic-bezier(.15,.6,.3,1) 2.1s both}
[data-c="ba-5"] .b1.on .ba5-f1 em{animation:ba5Flash .8s ease-out .5s both}
[data-c="ba-5"] .b1.on .ba5-f2 em{animation:ba5Flash .8s ease-out 1.3s both}
[data-c="ba-5"] .b1.on .ba5-f3 em{animation:ba5Flash .8s ease-out 2.1s both}
@keyframes ba5Spark{0%{opacity:1;transform:translate(0,0)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
@keyframes ba5Flash{0%{opacity:0;transform:scale(.3)}25%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
/* the curtain: colour sweeps UP and holds */
[data-c="ba-5"] .ba5-curtain{position:absolute;inset:0;background:var(--accent);transform:translateY(101%)}
[data-c="ba-5"] .b1.on .ba5-curtain{animation:ba5Curtain .55s cubic-bezier(.2,.8,.25,1) 2.85s forwards}
@keyframes ba5Curtain{to{transform:none}}
[data-c="ba-5"] .ba5-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;opacity:0;padding:34px}
[data-c="ba-5"] .b1.on .ba5-stage{animation:ba5StageIn .01s linear 3.3s forwards, ba5Shake .45s linear 3.35s}
@keyframes ba5StageIn{to{opacity:1}}
@keyframes ba5Shake{0%,100%{transform:none}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}
  75%{transform:translate(2px,1px)}}
[data-c="ba-5"] .ba5-m{width:80px;height:80px;fill:#0b0e12}
[data-c="ba-5"] .b1.on .ba5-m{animation:ba5MSlam .5s cubic-bezier(.16,1.35,.3,1) 3.35s both}
@keyframes ba5MSlam{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:scale(1)}}
[data-c="ba-5"] .ba5-line{margin-top:22px;font-size:42px;font-weight:750;letter-spacing:-.04em;
  line-height:1.05;color:#0b0e12;max-width:10ch}
[data-c="ba-5"] .b1.on .ba5-line{animation:ba5Slam .5s cubic-bezier(.16,1.3,.3,1) 3.6s both}
@keyframes ba5Slam{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:scale(1)}}
[data-c="ba-5"] .ba5-once{margin-top:18px;font-size:14.5px;font-weight:650;color:rgba(11,14,18,.78)}
[data-c="ba-5"] .b1.on .ba5-once{animation:ba5Up .5s ease-out 4s both}
@keyframes ba5Up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

[data-c="ba-5"] .ba5-cost{font-size:19px;line-height:2.05;color:var(--text-mid)}
[data-c="ba-5"] .ba5-cost b{color:var(--text-hi);font-size:26px;font-variant-numeric:tabular-nums}
[data-c="ba-5"] .b2.on .ba5-cost{animation:ba5Up .55s ease-out .15s both}
[data-c="ba-5"] .ba5-fin{font-size:28px;font-weight:750;letter-spacing:-.03em;max-width:11ch;color:var(--text-hi)}
[data-c="ba-5"] .b3.on .ba5-fin{animation:ba5Up .5s ease-out .15s both}
[data-c="ba-5"] .ba5-close{margin-top:14px;font-size:14px;color:var(--text-mid)}
[data-c="ba-5"] .b3.on .ba5-close{animation:ba5Up .5s ease-out .55s both}
@media (prefers-reduced-motion:reduce){
  [data-c="ba-5"] .ba5-line0,[data-c="ba-5"] .ba5-fw{display:none}
  [data-c="ba-5"] .ba5-curtain{transform:none;animation:none}
  [data-c="ba-5"] .ba5-stage{opacity:1;animation:none}
  [data-c="ba-5"] .ba5-m,[data-c="ba-5"] .ba5-line,[data-c="ba-5"] .ba5-once,
  [data-c="ba-5"] .ba5-cost,[data-c="ba-5"] .ba5-fin,[data-c="ba-5"] .ba5-close{opacity:1;transform:none;animation:none}
}
/* THE FIELD: the dot flower at monument scale, one dot per move. */
[data-c="ba-5"] .b2{padding:24px}
[data-c="ba-5"] .ba5-wall{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
[data-c="ba-5"] .ba5-svg{display:block;overflow:visible;opacity:0}
[data-c="ba-5"] .b2.on .ba5-svg{animation:ba5Bloom 1.2s cubic-bezier(.2,.8,.3,1) .1s both}
@keyframes ba5Bloom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
[data-c="ba-5"] .ba5-under{margin-top:20px;text-align:center;opacity:0}
[data-c="ba-5"] .ba5-under b{font-size:40px;font-weight:750;letter-spacing:-.04em;color:var(--text-hi);
  font-variant-numeric:tabular-nums}
[data-c="ba-5"] .ba5-under span{display:block;margin-top:6px;font-size:12px;color:var(--text-lo)}
[data-c="ba-5"] .b2.on .ba5-under{animation:ba5Up .5s ease-out 1s both}
@media (prefers-reduced-motion:reduce){ [data-c="ba-5"] .ba5-svg,[data-c="ba-5"] .ba5-under{opacity:1;transform:none;animation:none} }
</style>
<div class="ph" data-c="ba-5">
  <div class="st">

    <div class="b b1" data-confetti>
      <div class="ba5-line0">Lost 30 lbs.</div>
      <div class="ba5-fw ba5-f1" aria-hidden="true"><em></em>
        <i style="--dx:-46px;--dy:-30px"></i><i style="--dx:44px;--dy:-34px"></i><i style="--dx:-52px;--dy:12px"></i>
        <i style="--dx:50px;--dy:16px"></i><i style="--dx:-20px;--dy:-52px"></i><i style="--dx:22px;--dy:-50px"></i>
        <i style="--dx:-34px;--dy:40px"></i><i style="--dx:36px;--dy:42px"></i><i style="--dx:0px;--dy:-58px"></i>
        <i style="--dx:2px;--dy:52px"></i>
      </div>
      <div class="ba5-fw ba5-f2" aria-hidden="true"><em></em>
        <i style="--dx:-46px;--dy:-30px"></i><i style="--dx:44px;--dy:-34px"></i><i style="--dx:-52px;--dy:12px"></i>
        <i style="--dx:50px;--dy:16px"></i><i style="--dx:-20px;--dy:-52px"></i><i style="--dx:22px;--dy:-50px"></i>
        <i style="--dx:-34px;--dy:40px"></i><i style="--dx:36px;--dy:42px"></i><i style="--dx:0px;--dy:-58px"></i>
        <i style="--dx:2px;--dy:52px"></i>
      </div>
      <div class="ba5-fw ba5-f3" aria-hidden="true"><em></em>
        <i style="--dx:-46px;--dy:-30px"></i><i style="--dx:44px;--dy:-34px"></i><i style="--dx:-52px;--dy:12px"></i>
        <i style="--dx:50px;--dy:16px"></i><i style="--dx:-20px;--dy:-52px"></i><i style="--dx:22px;--dy:-50px"></i>
        <i style="--dx:-34px;--dy:40px"></i><i style="--dx:36px;--dy:42px"></i><i style="--dx:0px;--dy:-58px"></i>
        <i style="--dx:2px;--dy:52px"></i>
      </div>
      <div class="ba5-curtain"></div>
      <div class="ba5-stage">
        <svg class="ba5-m" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
        <div class="ba5-line">Lost 30 lbs.</div>
        <div class="ba5-once">A year of showing up, paid in full.</div>
      </div>
    </div>

    <div class="b b2">
      <div class="ba5-wall">
        <svg class="ba5-svg" width="300" height="300" viewBox="-105 -105 210 210" aria-hidden="true"></svg>
        <div class="ba5-under"></div>
      </div>
    </div>

    <div class="b b3">
      <div class="ba5-fin">Lost 30 lbs.</div>
      <div class="ba5-close">This goal closes. The record stays.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
