<style>
[data-c="op-5"] .op5-quote{width:100%;max-width:300px;text-align:left;margin:0;font-size:20.5px;
  font-weight:500;line-height:1.5;letter-spacing:-.015em;color:var(--text-hi)}
[data-c="op-5"] .op5-when{width:100%;max-width:300px;text-align:left;font-size:12px;
  color:var(--text-lo);margin-top:16px}
[data-c="op-5"] .op5-line{position:absolute;left:50%;top:calc(50% + 128px);bottom:26px;width:1.5px;
  border-radius:1px;pointer-events:none;transform:translateX(-50%);transform-origin:50% 0;
  background:linear-gradient(180deg,var(--accent),rgba(var(--accent-rgb),.55) 46%,rgba(var(--accent-rgb),0))}
[data-c="op-5"] .b.on .op5-line{animation:op5drop .8s cubic-bezier(.2,.8,.3,1) .28s backwards}
@keyframes op5drop{from{transform:translateX(-50%) scaleY(0)}to{transform:translateX(-50%) scaleY(1)}}
[data-c="op-5"] .op5-note{max-width:27ch;font-size:14.5px;line-height:1.55;color:var(--text-mid);margin-top:22px}
[data-c="op-5"] .op5-note{opacity:0;transform:translateY(8px)}
[data-c="op-5"] .b.on .op5-note{animation:op5rise .6s cubic-bezier(.2,.8,.3,1) .55s forwards}
@keyframes op5rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  [data-c="op-5"] .op5-note{opacity:1;transform:none}
  [data-c="op-5"] .op5-line{transform:translateX(-50%)}
}
</style>
<div class="ph" data-c="op-5">
  <div class="st">

    <div class="b b1">
      <p class="op5-quote">“I want to stop deciding things out of fear. I don't know how to measure that and I don't really care.”</p>
      <div class="op5-when">Written August 9, last year</div>
      <div class="op5-line" aria-hidden="true"></div>
    </div>

    <div class="b b2">
      <div class="n n--big" data-count="0|365">365</div>
      <div class="sub">days since you wrote that</div>
      <div class="op5-note">There is no finish on this one. The days are the record.</div>
    </div>

    <div class="b b3">
      <div class="deposit"><b>Day 365.</b> Still open.</div>
      <svg class="mark--foot" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
