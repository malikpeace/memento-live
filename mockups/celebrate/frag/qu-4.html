<style>
/* qu-4. twenty marks. Far from the target, so nothing empty is ever drawn.
   It counts what exists, one stroke per person. */
[data-c="qu-4"] .qu4-hero{position:relative;display:flex;flex-direction:column;align-items:center}
[data-c="qu-4"] .qu4-hero::before{content:'';position:absolute;left:50%;top:46px;
  width:300px;height:300px;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle,
    rgba(var(--accent-rgb),.42) 0%,
    rgba(var(--accent-rgb),.15) 32%,
    rgba(var(--accent-rgb),0) 66%)}
[data-c="qu-4"] .qu4-hero .n,[data-c="qu-4"] .qu4-hero .sub{position:relative}
[data-c="qu-4"] .qu4-n{font-size:104px}
[data-c="qu-4"] .qu4-tally{display:flex;justify-content:center;gap:8px;height:38px;
  align-items:flex-end;width:300px;margin:0 auto 24px}
[data-c="qu-4"] .qu4-t{width:3px;height:30px;border-radius:1.5px;background:rgba(var(--ink),.52)}
[data-c="qu-4"] .qu4-t:nth-child(5n){margin-right:12px}
[data-c="qu-4"] .qu4-t:last-child{margin-right:0}
[data-c="qu-4"] .qu4-t.is-last{height:38px;background:rgba(var(--ink),.96)}
[data-c="qu-4"] .qu4-sub{max-width:24ch}
[data-c="qu-4"] .qu4-cap{max-width:24ch}
[data-c="qu-4"] .b3{padding-bottom:96px}

[data-c="qu-4"] .b.on .qu4-hero::before{animation:qu4Bloom .9s cubic-bezier(.2,.8,.3,1) both}
[data-c="qu-4"] .b.on .qu4-t{animation:qu4Mark .34s cubic-bezier(.2,.8,.3,1) both}
[data-c="qu-4"] .b.on .qu4-t:nth-child(1){animation-delay:.00s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(2){animation-delay:.03s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(3){animation-delay:.06s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(4){animation-delay:.09s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(5){animation-delay:.12s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(6){animation-delay:.15s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(7){animation-delay:.18s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(8){animation-delay:.21s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(9){animation-delay:.24s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(10){animation-delay:.27s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(11){animation-delay:.30s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(12){animation-delay:.33s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(13){animation-delay:.36s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(14){animation-delay:.39s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(15){animation-delay:.42s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(16){animation-delay:.45s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(17){animation-delay:.48s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(18){animation-delay:.51s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(19){animation-delay:.54s}
[data-c="qu-4"] .b.on .qu4-t:nth-child(20){animation-delay:.60s}
@keyframes qu4Bloom{from{opacity:0;transform:translate(-50%,-50%) scale(.84)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes qu4Mark{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

<div class="ph" data-c="qu-4">
  <div class="st">

    <div class="b b1">
      <div class="qu4-hero">
        <div class="n qu4-n" data-count="0|20">20</div>
        <div class="sub">paying users.</div>
      </div>
    </div>

    <div class="b b2">
      <div class="qu4-tally">
        <div class="qu4-t"></div><div class="qu4-t"></div><div class="qu4-t"></div>
        <div class="qu4-t"></div><div class="qu4-t"></div><div class="qu4-t"></div>
        <div class="qu4-t"></div><div class="qu4-t"></div><div class="qu4-t"></div>
        <div class="qu4-t"></div><div class="qu4-t"></div><div class="qu4-t"></div>
        <div class="qu4-t"></div><div class="qu4-t"></div><div class="qu4-t"></div>
        <div class="qu4-t"></div><div class="qu4-t"></div><div class="qu4-t"></div>
        <div class="qu4-t"></div><div class="qu4-t is-last"></div>
      </div>
      <div class="sub qu4-sub">46 days ago there were none.</div>
      <div class="cap qu4-cap">80 still open.</div>
    </div>

    <div class="b b3">
      <div class="deposit">On this day, you reached <b>20</b> paying users.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
