<style>
/* ba-0 "The Grand Finale". Malik's own fusion, refined 2026-08-16:
   - beat 1: the M simply FADES IN with colour (no fill-from-below), rings of
     their colour collapsing into it.
   - the tap floats the M UP and the next page arrives around it, so the mark
     never jumps: beat 2 opens with the M at the same spot, rising to the top.
   - beat 2: the goal line sits in the MIDDLE (the most important thing), the
     firework celebrates below, no count text on this page.
   - beat 3: swipe between a slowly turning 3D SPHERE of their moves and the
     numbers. No labels, no Keep. */

/* ---- BEAT 1: the M fades in with colour, rings collapse into it ---- */
[data-c="ba-0"] .ba0-open{position:relative;display:flex;flex-direction:column;align-items:center}
[data-c="ba-0"] .ba0-m0{width:98px;height:98px;fill:var(--accent);opacity:0}
[data-c="ba-0"] .b1.on .ba0-m0{animation:ba0Soft 2.1s cubic-bezier(.4,0,.5,1) .3s both}
[data-c="ba-0"] .ba0-ring{position:absolute;left:50%;top:49px;width:66px;height:66px;margin:-33px 0 0 -33px;
  border-radius:50%;border:2px solid rgba(var(--accent-rgb),.7);opacity:0}
[data-c="ba-0"] .b1.on .ba0-rg1{animation:ba0In 1.1s cubic-bezier(.45,0,.7,.55) .6s both}
[data-c="ba-0"] .b1.on .ba0-rg2{animation:ba0In 1.1s cubic-bezier(.45,0,.7,.55) 1.25s both}
[data-c="ba-0"] .b1.on .ba0-rg3{animation:ba0In 1.05s cubic-bezier(.45,0,.7,.55) 1.9s both}
@keyframes ba0In{0%{opacity:0;transform:scale(5)}35%{opacity:.85}100%{opacity:0;transform:scale(.35)}}
[data-c="ba-0"] .ba0-guess{margin-top:34px;font-size:24px;font-weight:650;letter-spacing:-.02em;
  color:var(--text-hi);opacity:0}
[data-c="ba-0"] .b1.on .ba0-guess{animation:ba0Soft .7s ease-out 2.7s both}
[data-c="ba-0"] .ba0-tap{margin-top:14px;font-size:11.5px;letter-spacing:.03em;color:var(--text-lo);opacity:0}
[data-c="ba-0"] .b1.on .ba0-tap{animation:ba0Soft .6s ease-out 3.2s both}
@keyframes ba0Soft{from{opacity:0}to{opacity:1}}

/* ---- BEAT 2: flood, the M rises to the top, the line lands in the middle ---- */
[data-c="ba-0"] .ba0-flood{position:absolute;inset:0;background:var(--accent)}
[data-c="ba-0"] .b2.on .ba0-flood{animation:ba0Flood .22s cubic-bezier(.2,.8,.3,1) both}
@keyframes ba0Flood{from{opacity:0}to{opacity:1}}
[data-c="ba-0"] .ba0-sh{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;
  border-radius:50%;border:2.5px solid rgba(11,14,18,.4);opacity:0}
[data-c="ba-0"] .b2.on .ba0-s1{animation:ba0Ring 1s cubic-bezier(.2,.7,.3,1) .06s both}
[data-c="ba-0"] .b2.on .ba0-s2{animation:ba0Ring 1.1s cubic-bezier(.2,.7,.3,1) .28s both}
@keyframes ba0Ring{0%{opacity:.65;transform:scale(.2)}100%{opacity:0;transform:scale(8)}}
/* the M starts where beat 1 left it (screen centre) and floats up to the top */
[data-c="ba-0"] .ba0-m2{position:absolute;left:50%;top:12%;width:98px;height:98px;margin-left:-49px;fill:#0b0e12}
[data-c="ba-0"] .b2.on .ba0-m2{animation:ba0Rise2 .7s cubic-bezier(.3,.7,.3,1) .05s both}
@keyframes ba0Rise2{from{opacity:0;transform:translateY(31vh)}to{opacity:1;transform:translateY(0)}}
[data-c="ba-0"] .ba0-line{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;
  padding:0 26px;font-size:44px;font-weight:750;letter-spacing:-.04em;line-height:1.05;color:#0b0e12;opacity:0}
[data-c="ba-0"] .b2.on .ba0-line{animation:ba0LineIn .55s cubic-bezier(.2,.8,.3,1) .75s both}
@keyframes ba0LineIn{from{opacity:0;transform:translateY(calc(-50% + 12px))}to{opacity:1;transform:translateY(-50%)}}
/* the big firework, lower half */
[data-c="ba-0"] .ba0-big{position:absolute;left:50%;top:74%;width:0;height:0}
[data-c="ba-0"] .ba0-big .tr{position:absolute;left:-1.5px;top:0;width:3px;height:150px;border-radius:2px;
  transform-origin:50% 100%;background:linear-gradient(to top,rgba(11,14,18,0),rgba(11,14,18,.72));opacity:0}
[data-c="ba-0"] .b2.on .ba0-big .tr{animation:ba0Launch .55s cubic-bezier(.25,.7,.4,1) 1.5s both}
@keyframes ba0Launch{0%{opacity:0;transform:translateY(220px) scaleY(.4)}25%{opacity:1}72%{opacity:1}
  100%{opacity:0;transform:translateY(0) scaleY(1)}}
[data-c="ba-0"] .ba0-big .fl{position:absolute;left:-70px;top:-70px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 64%);opacity:0}
[data-c="ba-0"] .b2.on .ba0-big .fl{animation:ba0Flash .6s ease-out 2.03s both}
@keyframes ba0Flash{0%{opacity:0;transform:scale(.1)}20%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
[data-c="ba-0"] .ba0-big .sp{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;
  background:rgba(11,14,18,.86);opacity:0}
[data-c="ba-0"] .ba0-big .sp:nth-child(3n){background:#fff}
[data-c="ba-0"] .b2.on .ba0-big .sp{animation:ba0Spark 1.7s cubic-bezier(.1,.62,.28,1) 2.05s both}
@keyframes ba0Spark{0%{opacity:0;transform:translate(0,0) scale(.5)}
  6%{opacity:1;transform:translate(calc(var(--dx)*.22),calc(var(--dy)*.22)) scale(1.15)}
  55%{opacity:1;transform:translate(calc(var(--dx)*.86),calc(var(--dy)*.86 + 14px)) scale(.9)}
  100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 96px)) scale(.45)}}

/* ---- BEAT 3: swipe the sphere and the numbers, the M crowning both ---- */
[data-c="ba-0"] .b3{padding:0}
[data-c="ba-0"] .ba0-stats{position:absolute;inset:0;display:flex;flex-direction:column}
[data-c="ba-0"] .ba0-crown{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:32px 0 4px}
[data-c="ba-0"] .ba0-mc{width:52px;height:52px;fill:#0b0e12}
[data-c="ba-0"] .b3.on .ba0-mc{animation:ba0Soft .6s ease-out .1s both}
[data-c="ba-0"] .ba0-pager{flex:1 1 auto;position:relative;overflow:hidden}
[data-c="ba-0"] .ba0-track{display:flex;width:200%;height:100%;transition:transform .38s cubic-bezier(.3,.7,.3,1)}
[data-c="ba-0"] .ba0-slide{width:50%;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:6px 22px 8px}
/* slide A: a slowly turning 3D sphere of their moves */
[data-c="ba-0"] .ba0-cv{width:262px;height:280px;max-width:100%;display:block}
[data-c="ba-0"] .ba0-acount{margin-top:10px;text-align:center}
[data-c="ba-0"] .ba0-acount b{font-size:40px;font-weight:750;letter-spacing:-.04em;color:#0b0e12;
  font-variant-numeric:tabular-nums}
[data-c="ba-0"] .ba0-acount span{display:block;margin-top:5px;font-size:12px;color:rgba(11,14,18,.7)}
/* slide B: the numbers */
[data-c="ba-0"] .ba0-wall{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
[data-c="ba-0"] .ba0-cell{padding:15px 14px;border-radius:13px;background:rgba(11,14,18,.06);
  box-shadow:inset 0 1px 0 rgba(11,14,18,.05);text-align:left}
[data-c="ba-0"] .ba0-cell b{display:block;font-size:34px;font-weight:750;letter-spacing:-.04em;line-height:1;
  color:#0b0e12;font-variant-numeric:tabular-nums}
[data-c="ba-0"] .ba0-cell span{display:block;margin-top:6px;font-size:11px;color:rgba(11,14,18,.62)}
[data-c="ba-0"] .ba0-cell--hero{grid-column:1/-1}
[data-c="ba-0"] .ba0-cell--hero b{font-size:52px}
[data-c="ba-0"] .ba0-dots{flex:0 0 auto;display:flex;gap:8px;justify-content:center;padding:8px 0 30px}
[data-c="ba-0"] .ba0-dot{width:7px;height:7px;border-radius:50%;background:rgba(11,14,18,.28);transition:background .2s,width .2s}
[data-c="ba-0"] .ba0-dot.on{width:20px;border-radius:4px;background:rgba(11,14,18,.7)}

@media (min-width:768px){ [data-c="ba-0"] .ba0-wall{max-width:420px;margin:0 auto} }
@media (prefers-reduced-motion:reduce){
  [data-c="ba-0"] .ba0-ring,[data-c="ba-0"] .ba0-sh,[data-c="ba-0"] .ba0-big{display:none}
  [data-c="ba-0"] .ba0-m0,[data-c="ba-0"] .ba0-guess,[data-c="ba-0"] .ba0-tap,[data-c="ba-0"] .ba0-m2,
  [data-c="ba-0"] .ba0-line,[data-c="ba-0"] .ba0-mc{opacity:1;transform:translateY(-50%);animation:none}
  [data-c="ba-0"] .ba0-m0,[data-c="ba-0"] .ba0-guess,[data-c="ba-0"] .ba0-tap,[data-c="ba-0"] .ba0-m2,
  [data-c="ba-0"] .ba0-mc{transform:none}
}
</style>
<div class="ph" data-c="ba-0">
  <div class="st">

    <div class="b b1">
      <div class="ba0-open">
        <svg class="ba0-m0" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
        <div class="ba0-ring ba0-rg1"></div>
        <div class="ba0-ring ba0-rg2"></div>
        <div class="ba0-ring ba0-rg3"></div>
        <div class="ba0-guess">Guess what&hellip;</div>
        <div class="ba0-tap">Tap.</div>
      </div>
    </div>

    <div class="b b2" data-confetti>
      <div class="ba0-flood"></div>
      <div class="ba0-sh ba0-s1"></div>
      <div class="ba0-sh ba0-s2"></div>
      <svg class="ba0-m2" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
      <div class="ba0-line"></div>
      <div class="ba0-big" aria-hidden="true"><i class="tr"></i><em class="fl"></em></div>
    </div>

    <div class="b b3">
      <div class="ba0-stats">
        <div class="ba0-crown">
          <svg class="ba0-mc" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
        </div>
        <div class="ba0-pager">
          <div class="ba0-track">
            <div class="ba0-slide">
              <canvas class="ba0-cv" aria-hidden="true"></canvas>
              <div class="ba0-acount"></div>
            </div>
            <div class="ba0-slide">
              <div class="ba0-wall"></div>
            </div>
          </div>
        </div>
        <div class="ba0-dots">
          <span class="ba0-dot on"></span><span class="ba0-dot"></span>
        </div>
      </div>
    </div>

  </div>
  <div class="hint">swipe the stats &middot; tap to replay</div>
</div>
