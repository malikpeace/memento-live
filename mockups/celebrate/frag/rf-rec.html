<style>
/* rf-rec. The Record: twelve weeks of days, the ones they showed up lighting
   in the order they happened. The grid is evidence they kept. One accent
   moment: today's square, the last one to land. */
[data-c="rf-rec"] .rc{display:flex;flex-direction:column;align-items:center;width:100%}

[data-c="rf-rec"] .rc__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
  width:184px;margin-bottom:32px}
[data-c="rf-rec"] .rc__d{position:relative;aspect-ratio:1;border-radius:2px;
  background:rgba(var(--ink),.07)}
[data-c="rf-rec"] .rc__f{position:absolute;inset:0;border-radius:2px;display:block;
  background:rgba(var(--ink),.34);opacity:0;transform:scale(.62)}
[data-c="rf-rec"] .b2.on .rc__f{animation:rfRecOn 360ms cubic-bezier(.2,.8,.3,1) forwards;
  animation-delay:var(--d)}
@keyframes rfRecOn{from{opacity:0;transform:scale(.62)}to{opacity:1;transform:scale(1)}}

[data-c="rf-rec"] .rc__f--now{background:var(--accent)}
[data-c="rf-rec"] .b2.on .rc__f--now{animation:rfRecNow 520ms cubic-bezier(.2,.8,.3,1) forwards;
  animation-delay:var(--d)}
@keyframes rfRecNow{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}

[data-c="rf-rec"] .rc__cost{opacity:0}
[data-c="rf-rec"] .b2.on .rc__cost{animation:rfRecUp 520ms ease-out .26s forwards}
@keyframes rfRecUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

[data-c="rf-rec"] .rc__note{margin-top:11px;font-size:13px;color:var(--text-mid);
  letter-spacing:-.01em;opacity:0}
[data-c="rf-rec"] .b2.on .rc__note{animation:rfRecUp 520ms ease-out 1.28s forwards}

@media (prefers-reduced-motion:reduce){
  [data-c="rf-rec"] .rc__f{opacity:1;transform:none}
  [data-c="rf-rec"] .rc__cost,
  [data-c="rf-rec"] .rc__note{opacity:1;transform:none}
}
</style>
