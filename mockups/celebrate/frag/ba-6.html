<style>
/* ba-6 "The Countdown". 3... 2... 1... each number PUNCHES the screen,
   bigger and closer, and on zero the whole thing blasts: flood, M, the
   goal line, fireworks. The oldest trick in celebration and it still
   spikes the heart rate, because the blast is earned by the wait. */
[data-c="ba-6"] .ba6-n{position:absolute;left:0;right:0;top:38%;text-align:center;opacity:0;
  font-size:120px;font-weight:750;letter-spacing:-.05em;color:var(--text-hi);
  font-variant-numeric:tabular-nums}
[data-c="ba-6"] .b1.on .ba6-n1{animation:ba6Punch .72s cubic-bezier(.16,1.2,.3,1) .2s both}
[data-c="ba-6"] .b1.on .ba6-n2{animation:ba6Punch .72s cubic-bezier(.16,1.2,.3,1) .95s both}
[data-c="ba-6"] .b1.on .ba6-n3{animation:ba6Punch .72s cubic-bezier(.16,1.2,.3,1) 1.7s both}
@keyframes ba6Punch{0%{opacity:0;transform:scale(2.1)}22%{opacity:1;transform:scale(1)}
  80%{opacity:1;transform:scale(.96)}100%{opacity:0;transform:scale(.9)}}
/* THE BLAST */
[data-c="ba-6"] .ba6-flood{position:absolute;inset:0;background:var(--accent);opacity:0}
[data-c="ba-6"] .b1.on .ba6-flood{animation:ba6Flood .25s cubic-bezier(.2,.8,.3,1) 2.5s forwards}
@keyframes ba6Flood{from{opacity:0}to{opacity:1}}
[data-c="ba-6"] .ba6-fw{position:absolute;width:0;height:0;opacity:1}
[data-c="ba-6"] .ba6-w1{left:25%;top:22%}
[data-c="ba-6"] .ba6-w2{left:75%;top:26%}
[data-c="ba-6"] .ba6-fw i{position:absolute;width:6px;height:6px;border-radius:50%;background:#0b0e12;opacity:0}
[data-c="ba-6"] .ba6-fw i:nth-child(2n){background:#fff}
[data-c="ba-6"] .b1.on .ba6-w1 i{animation:ba6Spark 1s cubic-bezier(.15,.6,.3,1) 2.65s both}
[data-c="ba-6"] .b1.on .ba6-w2 i{animation:ba6Spark 1s cubic-bezier(.15,.6,.3,1) 2.85s both}
@keyframes ba6Spark{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
[data-c="ba-6"] .ba6-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;opacity:0;padding:34px}
[data-c="ba-6"] .b1.on .ba6-stage{animation:ba6In .01s linear 2.6s forwards, ba6Shake .45s linear 2.62s}
@keyframes ba6In{to{opacity:1}}
@keyframes ba6Shake{0%,100%{transform:none}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}
  75%{transform:translate(2px,1px)}}
[data-c="ba-6"] .ba6-m{width:82px;height:82px;fill:#0b0e12}
[data-c="ba-6"] .b1.on .ba6-m{animation:ba6MSlam .5s cubic-bezier(.16,1.35,.3,1) 2.62s both}
@keyframes ba6MSlam{from{opacity:0;transform:scale(2.3)}to{opacity:1;transform:scale(1)}}
[data-c="ba-6"] .ba6-line{margin-top:22px;font-size:42px;font-weight:750;letter-spacing:-.04em;
  line-height:1.05;color:#0b0e12;max-width:10ch}
[data-c="ba-6"] .b1.on .ba6-line{animation:ba6Slam .5s cubic-bezier(.16,1.3,.3,1) 2.85s both}
@keyframes ba6Slam{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:scale(1)}}
[data-c="ba-6"] .ba6-zero{margin-top:18px;font-size:14.5px;font-weight:650;color:rgba(11,14,18,.78)}
[data-c="ba-6"] .b1.on .ba6-zero{animation:ba6Up .5s ease-out 3.25s both}
@keyframes ba6Up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

[data-c="ba-6"] .ba6-cost{font-size:19px;line-height:2.05;color:var(--text-mid)}
[data-c="ba-6"] .ba6-cost b{color:var(--text-hi);font-size:26px;font-variant-numeric:tabular-nums}
[data-c="ba-6"] .b2.on .ba6-cost{animation:ba6Up .55s ease-out .15s both}
[data-c="ba-6"] .ba6-fin{font-size:28px;font-weight:750;letter-spacing:-.03em;max-width:11ch;color:var(--text-hi)}
[data-c="ba-6"] .b3.on .ba6-fin{animation:ba6Up .5s ease-out .15s both}
[data-c="ba-6"] .ba6-close{margin-top:14px;font-size:14px;color:var(--text-mid)}
[data-c="ba-6"] .b3.on .ba6-close{animation:ba6Up .5s ease-out .55s both}
@media (prefers-reduced-motion:reduce){
  [data-c="ba-6"] .ba6-n,[data-c="ba-6"] .ba6-fw{display:none}
  [data-c="ba-6"] .ba6-flood{opacity:1;animation:none}
  [data-c="ba-6"] .ba6-stage{opacity:1;animation:none}
  [data-c="ba-6"] .ba6-m,[data-c="ba-6"] .ba6-line,[data-c="ba-6"] .ba6-zero,
  [data-c="ba-6"] .ba6-cost,[data-c="ba-6"] .ba6-fin,[data-c="ba-6"] .ba6-close{opacity:1;transform:none;animation:none}
}
/* THE ODOMETER WALL: every total counting up at once, huge. */
[data-c="ba-6"] .b2{padding:30px 26px}
[data-c="ba-6"] .ba6-wall{width:100%;display:flex;flex-direction:column;gap:22px;text-align:left}
[data-c="ba-6"] .ba6-row b{display:block;font-size:62px;font-weight:750;letter-spacing:-.05em;line-height:1;
  color:var(--text-hi);font-variant-numeric:tabular-nums}
[data-c="ba-6"] .ba6-row.hot b{color:var(--accent)}
[data-c="ba-6"] .ba6-row span{display:block;margin-top:6px;font-size:12px;color:var(--text-lo)}
[data-c="ba-6"] .ba6-row{opacity:0}
[data-c="ba-6"] .b2.on .ba6-row{animation:ba6Up .5s ease-out calc(.1s + var(--i)*.18s) both}
@media (prefers-reduced-motion:reduce){ [data-c="ba-6"] .ba6-row{opacity:1;animation:none} }
</style>
<div class="ph" data-c="ba-6">
  <div class="st">

    <div class="b b1" data-confetti>
      <div class="ba6-n ba6-n1">3</div>
      <div class="ba6-n ba6-n2">2</div>
      <div class="ba6-n ba6-n3">1</div>
      <div class="ba6-flood"></div>
      <div class="ba6-fw ba6-w1" aria-hidden="true">
        <i style="--dx:-40px;--dy:-34px"></i><i style="--dx:42px;--dy:-30px"></i><i style="--dx:-48px;--dy:10px"></i>
        <i style="--dx:46px;--dy:14px"></i><i style="--dx:-16px;--dy:-48px"></i><i style="--dx:18px;--dy:-46px"></i>
        <i style="--dx:-30px;--dy:38px"></i><i style="--dx:32px;--dy:40px"></i>
      </div>
      <div class="ba6-fw ba6-w2" aria-hidden="true">
        <i style="--dx:-40px;--dy:-34px"></i><i style="--dx:42px;--dy:-30px"></i><i style="--dx:-48px;--dy:10px"></i>
        <i style="--dx:46px;--dy:14px"></i><i style="--dx:-16px;--dy:-48px"></i><i style="--dx:18px;--dy:-46px"></i>
        <i style="--dx:-30px;--dy:38px"></i><i style="--dx:32px;--dy:40px"></i>
      </div>
      <div class="ba6-stage">
        <svg class="ba6-m" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
        <div class="ba6-line">Lost 30 lbs!</div>
        <div class="ba6-zero">Zero left to lose!</div>
      </div>
    </div>

    <div class="b b2">
      <div class="ba6-wall"></div>
    </div>

    <div class="b b3">
      <div class="ba6-fin">Lost 30 lbs!</div>
      <div class="ba6-close">This goal closes. The record stays.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
