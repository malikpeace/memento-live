<style>
/* ms-4 "The fork". The milestone whose outcome was a decision rather than
   an achievement.
   The line you were on keeps going; the other branch stops. Accent moment:
   the branch you took. */
[data-c="ms-4"] .ms4-word{font-size:56px;font-weight:800;letter-spacing:-.045em;line-height:.94;
  color:var(--text-hi)}

[data-c="ms-4"] .ms4-fig{position:relative;width:300px;height:140px}
[data-c="ms-4"] .ms4-svg{display:block;width:300px;height:140px}
[data-c="ms-4"] .ms4-stem,[data-c="ms-4"] .ms4-drop,[data-c="ms-4"] .ms4-stop{
  fill:none;stroke:rgba(235,238,248,.26);stroke-width:1.5;stroke-linecap:round}
[data-c="ms-4"] .ms4-take{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
[data-c="ms-4"] .ms4-lab{position:absolute;font-size:12px;font-weight:500;letter-spacing:-.01em;
  color:var(--text-lo)}
[data-c="ms-4"] .ms4-lab--a{right:46px;top:0}
[data-c="ms-4"] .ms4-lab--b{right:2px;top:88px;color:var(--text-mid);font-weight:650}
[data-c="ms-4"] .b2.on .ms4-take,[data-c="ms-4"] .b2.on .ms4-lab--b{
  animation:ms4Take .5s cubic-bezier(.2,.8,.3,1) .44s both}
@keyframes ms4Take{from{opacity:0}to{opacity:1}}
[data-c="ms-4"] .b2.on .ms4-fig{animation:ms4Fig .55s cubic-bezier(.2,.8,.3,1) both}
@keyframes ms4Fig{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

[data-c="ms-4"] .ms4-cost{margin-top:26px;padding-top:18px;border-top:1px solid var(--hairline);
  font-size:15px;font-weight:500;line-height:1.7;color:var(--text-mid);letter-spacing:-.01em}
[data-c="ms-4"] .ms4-cost b{font-variant-numeric:tabular-nums;font-weight:650;color:var(--text-hi)}
[data-c="ms-4"] .b2.on .ms4-cost{animation:ms4Cost .5s cubic-bezier(.2,.8,.3,1) .62s both}
@keyframes ms4Cost{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

[data-c="ms-4"] .ms4-rule{width:36px;height:1px;background:rgba(235,238,248,.18);margin-bottom:20px}
[data-c="ms-4"] .ms4-closed{margin-top:14px;font-size:13.5px;font-weight:500;color:var(--text-mid);
  letter-spacing:-.01em}
</style>
<div class="ph" data-c="ms-4">
  <div class="st">

    <div class="b b1">
      <div class="ms4-word">Decided.</div>
      <div class="sub">You're staying in Chicago.</div>
    </div>

    <div class="b b2">
      <div class="ms4-fig">
        <svg class="ms4-svg" viewBox="0 0 300 140" aria-hidden="true">
          <path class="ms4-stem" d="M4 78 L118 78"/>
          <path class="ms4-drop" d="M118 78 L246 26"/>
          <path class="ms4-stop" d="M243.7 20.4 L248.3 31.6"/>
          <path class="ms4-take" d="M118 78 L296 78"/>
        </svg>
        <div class="ms4-lab ms4-lab--a">Lisbon</div>
        <div class="ms4-lab ms4-lab--b">Chicago</div>
      </div>
      <div class="ms4-cost"><b data-count="0|143">143</b> days carrying the question.<br>11 notes. 2 trips.</div>
    </div>

    <div class="b b3">
      <div class="ms4-rule"></div>
      <div class="deposit">On this day, <b>you decided not to move.</b></div>
      <div class="ms4-closed">The question is closed.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
