<style>
/* ms-4 REBUILT (Malik: the fork diagram was meh). A decision milestone told
   with the two names themselves: the one you chose stays solid, the one you
   released lets go and dims. No diagram to decode; the typography IS the
   decision. Land beat floods their colour like the rest of the family. */
[data-c="ms-4"] .ms4-word{font-size:52px;font-weight:800;letter-spacing:-.045em;line-height:.96;color:#0b0e12}
[data-c="ms-4"] .b--flood .sub{margin-top:16px}

[data-c="ms-4"] .ms4-pair{display:flex;flex-direction:column;gap:18px;margin-bottom:30px}
[data-c="ms-4"] .ms4-name{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--text-hi)}
[data-c="ms-4"] .ms4-name--gone{color:rgba(var(--ink),.26);font-weight:700;position:relative}
[data-c="ms-4"] .ms4-name--gone::after{content:'';position:absolute;left:-4px;right:-4px;top:52%;
  height:1.5px;background:rgba(var(--ink),.30);transform:scaleX(0);transform-origin:0 50%}
[data-c="ms-4"] .b2.on .ms4-name--gone::after{animation:ms4Strike .5s cubic-bezier(.2,.8,.3,1) .85s forwards}
@keyframes ms4Strike{to{transform:scaleX(1)}}
[data-c="ms-4"] .b2.on .ms4-name{animation:ms4In .5s cubic-bezier(.2,.8,.3,1) backwards}
[data-c="ms-4"] .b2.on .ms4-name--gone{animation-delay:.2s}
@keyframes ms4In{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

[data-c="ms-4"] .ms4-cost{margin-top:6px;font-size:15px;font-weight:500;line-height:1.75;
  color:var(--text-mid);letter-spacing:-.01em}
[data-c="ms-4"] .ms4-cost b{color:var(--text-hi);font-variant-numeric:tabular-nums;font-weight:700}
[data-c="ms-4"] .b2.on .ms4-cost{animation:ms4In .5s cubic-bezier(.2,.8,.3,1) 1.2s backwards}

[data-c="ms-4"] .ms4-rule{width:36px;height:1px;background:rgba(var(--ink),.18);margin-bottom:20px}
[data-c="ms-4"] .ms4-closed{margin-top:12px;font-size:12.5px;color:var(--text-lo)}
[data-c="ms-4"] .deposit{max-width:24ch}
</style>
<div class="ph" data-c="ms-4">
  <div class="st">

    <div class="b b1 b--flood">
      <svg class="flood-m" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
      <div class="ms4-word">Decided.</div>
      <div class="sub">You're staying in Chicago.</div>
    </div>

    <div class="b b2">
      <div class="ms4-pair">
        <div class="ms4-name">Chicago</div>
        <div class="ms4-name ms4-name--gone">Lisbon</div>
      </div>
      <div class="ms4-cost"><b data-count="0|143">143</b> days carrying the question.<br>11 notes. 2 trips.</div>
    </div>

    <div class="b b3">
      <div class="ms4-rule"></div>
      <div class="deposit">On this day, <b>you decided not to move.</b></div>
      <div class="ms4-closed">The question is closed.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
