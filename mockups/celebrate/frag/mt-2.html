<style>
/* mt-2 : held to the date. Hold-until-deadline completion, the goal closes. */
[data-c="mt-2"] .b1.on .n--hero{animation:mt2land .55s cubic-bezier(.2,.8,.3,1) both}
@keyframes mt2land{from{opacity:0;transform:scale(.955)}to{opacity:1;transform:none}}
[data-c="mt-2"] .b1.on .sub{animation:mt2sub .5s cubic-bezier(.2,.8,.3,1) .26s both}
@keyframes mt2sub{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

[data-c="mt-2"] .mt2-rail{position:relative;width:268px;height:12px}
[data-c="mt-2"] .mt2-track{position:absolute;left:0;right:0;top:5px;height:2px;background:rgba(var(--ink),.13)}
[data-c="mt-2"] .mt2-fill{position:absolute;left:0;right:0;top:5px;height:2px;
  background:var(--accent);transform-origin:0 50%}
[data-c="mt-2"] .b2.on .mt2-fill{animation:mt2fill 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes mt2fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
[data-c="mt-2"] .mt2-start{position:absolute;left:0;top:2px;width:2px;height:8px;background:rgba(var(--ink),.40)}
[data-c="mt-2"] .mt2-end{position:absolute;right:0;top:0;width:2px;height:12px;
  background:rgba(var(--ink),.62);transform-origin:50% 50%}
[data-c="mt-2"] .b2.on .mt2-end{animation:mt2end .38s cubic-bezier(.2,.8,.3,1) .86s both}
@keyframes mt2end{from{opacity:0;transform:scaleY(.25)}to{opacity:1;transform:none}}

[data-c="mt-2"] .mt2-dates{display:flex;justify-content:space-between;width:268px;margin-top:11px;
  font-size:11.5px;color:var(--text-lo);font-variant-numeric:tabular-nums}

[data-c="mt-2"] .mt2-line2{font-size:13px;line-height:1.5;color:var(--text-mid);
  max-width:29ch;margin-top:9px;letter-spacing:-.005em}
[data-c="mt-2"] .mt2-note{font-size:13.5px;line-height:1.55;color:var(--text-mid);
  max-width:26ch;margin-top:18px;letter-spacing:-.005em}
</style>

<div class="ph" data-c="mt-2">
  <div class="st">

    <div class="b b1" data-confetti>
      <div class="n n--hero" data-count="0|365">0</div>
      <div class="sub">days held</div>
    </div>

    <div class="b b2">
      <div class="mt2-rail">
        <span class="mt2-track"></span>
        <span class="mt2-fill"></span>
        <span class="mt2-start"></span>
        <span class="mt2-end"></span>
      </div>
      <div class="mt2-dates"><span>Aug 10, 2025</span><span>Aug 9, 2026</span></div>
      <div class="sub">Twelve months. Nothing bought outside food, rent and fuel.</div>
      <div class="mt2-line2">You picked the end date yourself. It arrived with the rule intact.</div>
    </div>

    <div class="b b3">
      <div class="deposit"><b>Day 365!</b> The year held. The goal is complete.</div>
      <div class="mt2-note">It closes here. There is nothing left to hold.</div>
      <svg class="mark--foot" viewBox="0 0 512 512" aria-hidden="true">
        <path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/>
      </svg>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
