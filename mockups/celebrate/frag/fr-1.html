<style>
[data-c="fr-1"] .fr1-count{display:flex;align-items:baseline;gap:15px}
[data-c="fr-1"] .fr1-of{font-size:40px;font-weight:800;letter-spacing:-.04em;
  color:var(--text-mid);font-variant-numeric:tabular-nums;line-height:.9}
[data-c="fr-1"] .fr1-sub{max-width:22ch}

[data-c="fr-1"] .fr1-week{display:flex;gap:12px;align-items:flex-end;margin-bottom:30px}
[data-c="fr-1"] .fr1-day{display:flex;flex-direction:column;align-items:center;gap:11px}
[data-c="fr-1"] .fr1-col{width:22px;height:96px;border-radius:7px;
  background:rgba(var(--ink),.07);transform-origin:50% 100%}
[data-c="fr-1"] .fr1-day.is-run .fr1-col{background:rgba(var(--ink),.80)}
[data-c="fr-1"] .fr1-day.is-close .fr1-col{background:var(--accent);
  box-shadow:0 0 22px rgba(var(--accent-rgb),.42)}
[data-c="fr-1"] .fr1-lab{font-size:11px;color:var(--text-lo);letter-spacing:.02em}
[data-c="fr-1"] .fr1-day.is-run .fr1-lab{color:var(--text-mid)}

[data-c="fr-1"] .b2.on .fr1-col{animation:fr1Rise .46s cubic-bezier(.2,.8,.3,1) backwards}
[data-c="fr-1"] .b2.on .fr1-day:nth-child(1) .fr1-col{animation-delay:.02s}
[data-c="fr-1"] .b2.on .fr1-day:nth-child(2) .fr1-col{animation-delay:.07s}
[data-c="fr-1"] .b2.on .fr1-day:nth-child(3) .fr1-col{animation-delay:.12s}
[data-c="fr-1"] .b2.on .fr1-day:nth-child(4) .fr1-col{animation-delay:.17s}
[data-c="fr-1"] .b2.on .fr1-day:nth-child(5) .fr1-col{animation-delay:.22s}
[data-c="fr-1"] .b2.on .fr1-day:nth-child(6) .fr1-col{animation-delay:.27s}
[data-c="fr-1"] .b2.on .fr1-day:nth-child(7) .fr1-col{animation-delay:.32s}
@keyframes fr1Rise{from{transform:scaleY(.10);opacity:0}to{transform:scaleY(1);opacity:1}}

[data-c="fr-1"] .b3.on .deposit{animation:fr1Settle .5s cubic-bezier(.2,.8,.3,1) .1s backwards}
@keyframes fr1Settle{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
</style>

<div class="ph" data-c="fr-1"><div class="st">

  <div class="b b1">
    <div class="fr1-count">
      <span class="n n--hero" data-count="0|4">4</span>
      <span class="fr1-of">of 4</span>
    </div>
    <div class="sub fr1-sub">Runs this week.</div>
  </div>

  <div class="b b2">
    <div class="fr1-week">
      <div class="fr1-day is-run"><div class="fr1-col"></div><div class="fr1-lab">M</div></div>
      <div class="fr1-day"><div class="fr1-col"></div><div class="fr1-lab">T</div></div>
      <div class="fr1-day is-run"><div class="fr1-col"></div><div class="fr1-lab">W</div></div>
      <div class="fr1-day"><div class="fr1-col"></div><div class="fr1-lab">T</div></div>
      <div class="fr1-day is-run"><div class="fr1-col"></div><div class="fr1-lab">F</div></div>
      <div class="fr1-day is-run is-close"><div class="fr1-col"></div><div class="fr1-lab">S</div></div>
      <div class="fr1-day"><div class="fr1-col"></div><div class="fr1-lab">S</div></div>
    </div>
    <div class="sub fr1-sub">18.2 miles. 2 hours 47 minutes on your feet.</div>
    <div class="cap">Saturday closed the week.</div>
  </div>

  <div class="b b3">
    <div class="deposit">This week, you ran <b>4 of 4</b>.</div>
    <div class="cap">Week of March 3</div>
  </div>

</div>
<div class="keepbtn">Keep</div><div class="hint">Tap to replay</div></div>
