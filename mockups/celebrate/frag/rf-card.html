<style>
/* rf-card. The Card Takes It: the Memento is presented as a real object,
   light crosses its face, and when the light leaves the card is holding a cut
   it did not have before. Beat 3 is where the deposit lands, so the card is
   the thing that receives it. One accent moment: the new cut. */
[data-c="rf-card"] .cd__land{font-size:41px;font-weight:800;letter-spacing:-.035em;
  line-height:1.06;color:var(--text-hi);max-width:9ch}

[data-c="rf-card"] .cd__stage{position:relative;perspective:1000px;
  display:flex;align-items:center;justify-content:center}

/* the shallow pool of light the object sits in. radial, so it can never
   show an edge. */
[data-c="rf-card"] .cd__amb{position:absolute;left:50%;top:50%;width:430px;height:430px;
  transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,
    rgba(255,255,255,.062), rgba(255,255,255,.022) 44%, rgba(255,255,255,0) 74%)}
[data-c="rf-card"] .b3.on .cd__amb{animation:rfCardAmb 900ms ease-out .12s forwards}
@keyframes rfCardAmb{from{opacity:0}to{opacity:1}}

/* shell carries the outside shadow, the face carries the clip. splitting them
   is the only way a clipped card keeps its cast shadow. */
[data-c="rf-card"] .cd__shell{position:relative;border-radius:18px;
  box-shadow:0 30px 64px rgba(0,0,0,.72), 0 8px 20px rgba(0,0,0,.55);
  opacity:0;transform:translateY(15px) rotateX(7deg) scale(.972)}
[data-c="rf-card"] .b3.on .cd__shell{animation:rfCardIn 800ms cubic-bezier(.2,.8,.28,1) forwards}
@keyframes rfCardIn{
  from{opacity:0;transform:translateY(15px) rotateX(7deg) scale(.972)}
  to  {opacity:1;transform:translateY(0) rotateX(0deg) scale(1)}
}

[data-c="rf-card"] .cd{position:relative;width:224px;height:315px;border-radius:18px;
  clip-path:inset(0 round 18px);contain:paint;
  display:flex;align-items:center;justify-content:center;
  background:
    linear-gradient(157deg,
      rgba(255,255,255,.052) 0%, rgba(255,255,255,.014) 36%,
      rgba(255,255,255,.004) 62%, rgba(255,255,255,.028) 100%),
    radial-gradient(130% 82% at 50% -18%, rgba(255,255,255,.05), rgba(255,255,255,0) 60%),
    linear-gradient(180deg, #0e1116 0%, #08090c 58%, #0b0d11 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    inset 0 -1px 0 rgba(0,0,0,.7),
    inset 0 0 0 1px rgba(255,255,255,.045)}
/* a whisper of grain, so the face is material and not a flat fill */
[data-c="rf-card"] .cd::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(112deg,
    rgba(255,255,255,.007) 0 1px, rgba(255,255,255,0) 1px 6px)}

[data-c="rf-card"] .cd__m{width:64px;height:64px;fill:rgba(255,255,255,.22);
  margin-bottom:16px;opacity:.5}
[data-c="rf-card"] .b3.on .cd__m{animation:rfCardCatch 900ms ease-out .5s forwards}
@keyframes rfCardCatch{0%{opacity:.5}52%{opacity:1}100%{opacity:1}}

/* the cuts already in the card, and the one being made now. centred at the
   foot so they read as marks in the material, not as a corner indicator. */
[data-c="rf-card"] .cd__cuts{position:absolute;left:50%;bottom:22px;
  transform:translateX(-50%);display:flex;align-items:flex-end;gap:9px}
[data-c="rf-card"] .cd__cuts i{display:block;width:2px;height:12px;border-radius:1px;
  background:rgba(255,255,255,.13);box-shadow:1px 0 0 rgba(0,0,0,.6)}
[data-c="rf-card"] .cd__cuts i.new{background:var(--accent);
  box-shadow:0 0 14px rgba(var(--accent-rgb),.78);
  opacity:0;transform:scaleY(.12);transform-origin:bottom}
[data-c="rf-card"] .b3.on .cd__cuts i.new{animation:rfCardCut 500ms cubic-bezier(.2,.85,.25,1) .82s forwards}
@keyframes rfCardCut{from{opacity:0;transform:scaleY(.12)}to{opacity:1;transform:scaleY(1)}}

/* the light. it crosses once and leaves. */
[data-c="rf-card"] .cd__sweep{position:absolute;left:-62%;top:-42%;width:82%;height:184%;
  pointer-events:none;opacity:0;transform:rotate(18deg) translateX(-40px);
  background:linear-gradient(90deg,
    rgba(255,255,255,0) 0%, rgba(255,255,255,.035) 30%, rgba(255,255,255,.10) 44%,
    rgba(255,255,255,.30) 50%, rgba(255,255,255,.10) 56%,
    rgba(255,255,255,.035) 70%, rgba(255,255,255,0) 100%)}
[data-c="rf-card"] .b3.on .cd__sweep{animation:rfCardSweep 1150ms cubic-bezier(.36,0,.26,1) .42s forwards}
@keyframes rfCardSweep{
  0%  {opacity:0;transform:rotate(18deg) translateX(-40px)}
  11% {opacity:1}
  84% {opacity:1}
  100%{opacity:0;transform:rotate(18deg) translateX(330px)}
}

[data-c="rf-card"] .cd__dep{margin-top:32px;opacity:0}
[data-c="rf-card"] .b3.on .cd__dep{animation:rfCardDep 520ms ease-out 1.76s forwards}
@keyframes rfCardDep{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

[data-c="rf-card"] .cd__cost{margin-top:14px}

@media (prefers-reduced-motion:reduce){
  [data-c="rf-card"] .cd__amb{opacity:1}
  [data-c="rf-card"] .cd__shell{opacity:1;transform:none}
  [data-c="rf-card"] .cd__m{opacity:1}
  [data-c="rf-card"] .cd__cuts i.new{opacity:1;transform:none}
  [data-c="rf-card"] .cd__sweep{opacity:0}
  [data-c="rf-card"] .cd__dep{opacity:1;transform:none}
}
</style>
<div class="ph" data-c="rf-card">
  <div class="st">

    <div class="b b1">
      <div class="cd__land">You passed the bar.</div>
    </div>

    <div class="b b2">
      <div class="n n--big" data-count="0|640">0</div>
      <div class="sub">hours of study behind it</div>
      <div class="sub cd__cost">Over fourteen months.</div>
    </div>

    <div class="b b3">
      <div class="cd__stage">
        <span class="cd__amb"></span>
        <div class="cd__shell">
          <div class="cd">
            <svg class="cd__m" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
            <span class="cd__cuts"><i></i><i></i><i></i><i></i><i class="new"></i></span>
            <span class="cd__sweep"></span>
          </div>
        </div>
      </div>
      <div class="deposit cd__dep">On this day at 4:12pm, you <b>passed the bar</b>.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
