<style>
/* ms-3 "Early by". The deadline variant, shown as a plain subtraction
   instead of a bar. Two dates, a rule, the margin. Accent moment: the
   margin, because the margin is the whole story. */
[data-c="ms-3"] .ms3-word{font-size:56px;font-weight:800;letter-spacing:-.045em;line-height:.94;
  color:var(--text-hi)}

[data-c="ms-3"] .ms3-calc{width:100%;max-width:268px;margin-top:2px}
[data-c="ms-3"] .ms3-row{display:flex;align-items:baseline;justify-content:space-between;
  padding:9px 0;font-size:15px;font-weight:500;letter-spacing:-.01em;color:var(--text-mid)}
[data-c="ms-3"] .ms3-v{font-variant-numeric:tabular-nums;font-weight:650;color:var(--text-hi)}
[data-c="ms-3"] .ms3-hr{height:1px;background:rgba(235,238,248,.16);margin:7px 0 3px}
[data-c="ms-3"] .ms3-sum{font-variant-numeric:tabular-nums;font-size:21px;font-weight:700;
  letter-spacing:-.03em;color:var(--accent)}
[data-c="ms-3"] .b2.on .ms3-hr{animation:ms3Hr .5s cubic-bezier(.2,.8,.3,1) .3s both}
@keyframes ms3Hr{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:scaleX(1)}}
[data-c="ms-3"] .b2.on .ms3-row--sum{animation:ms3Sum .52s cubic-bezier(.2,.8,.3,1) .42s both}
@keyframes ms3Sum{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

[data-c="ms-3"] .ms3-cost{margin-top:24px;font-size:14.5px;font-weight:500;color:var(--text-mid);
  letter-spacing:-.01em}
[data-c="ms-3"] .b2.on .ms3-cost{animation:ms3Cost .5s cubic-bezier(.2,.8,.3,1) .6s both}
@keyframes ms3Cost{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

[data-c="ms-3"] .ms3-rule{width:36px;height:1px;background:rgba(235,238,248,.18);margin-bottom:20px}
[data-c="ms-3"] .b--flood .ms3-word{color:#0b0e12}
</style>
<div class="ph" data-c="ms-3">
  <div class="st">

    <div class="b b1 b--flood">
      <svg class="flood-m" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
      <div class="ms3-word">Finished.</div>
      <div class="sub">The manuscript is done.</div>
    </div>

    <div class="b b2">
      <div class="ms3-calc">
        <div class="ms3-row"><span>Your deadline</span><span class="ms3-v">Aug 15</span></div>
        <div class="ms3-row"><span>You finished</span><span class="ms3-v">Aug 6</span></div>
        <div class="ms3-hr"></div>
        <div class="ms3-row ms3-row--sum"><span>Early by</span><span class="ms3-sum">9 days</span></div>
      </div>
      <div class="ms3-cost">246 days of writing. 71,400 words.</div>
    </div>

    <div class="b b3">
      <div class="ms3-rule"></div>
      <div class="deposit">On this day, <b>you finished the manuscript</b>, 9 days before your deadline.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
