<style>
/* mt-1 : the ledger of days. 100 days held, no end date in sight. */
[data-c="mt-1"] .b1.on .n--hero{animation:mt1land .55s cubic-bezier(.2,.8,.3,1) both}
@keyframes mt1land{from{opacity:0;transform:scale(.955)}to{opacity:1;transform:none}}
[data-c="mt-1"] .b1.on .sub{animation:mt1sub .5s cubic-bezier(.2,.8,.3,1) .26s both}
@keyframes mt1sub{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

[data-c="mt-1"] .mt1-field{display:flex;flex-direction:column;gap:10px;align-items:center}
[data-c="mt-1"] .mt1-row{width:225px;height:18px;
  background:repeating-linear-gradient(90deg,rgba(var(--accent-rgb),.78) 0 3px,transparent 3px 9px)}
[data-c="mt-1"] .b2.on .mt1-row{animation:mt1row .5s cubic-bezier(.2,.8,.3,1) both}
[data-c="mt-1"] .b2.on .mt1-row:nth-child(2){animation-delay:.09s}
[data-c="mt-1"] .b2.on .mt1-row:nth-child(3){animation-delay:.18s}
[data-c="mt-1"] .b2.on .mt1-row:nth-child(4){animation-delay:.27s}
@keyframes mt1row{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

[data-c="mt-1"] .mt1-note{font-size:13.5px;line-height:1.55;color:var(--text-mid);
  max-width:27ch;margin-top:18px;letter-spacing:-.005em}
</style>

<div class="ph" data-c="mt-1">
  <div class="st">

    <div class="b b1" data-confetti>
      <div class="n n--hero" data-count="0|100">0</div>
      <div class="sub">days sober</div>
    </div>

    <div class="b b2">
      <div class="mt1-field">
        <div class="mt1-row"></div>
        <div class="mt1-row"></div>
        <div class="mt1-row"></div>
        <div class="mt1-row"></div>
      </div>
      <div class="sub">You made the same call on a hundred separate days.</div>
      <div class="cap">May 2 to Aug 9</div>
    </div>

    <div class="b b3">
      <div class="deposit"><b>Day 100!</b> The line held.</div>
      <div class="mt1-note">No end date on this one. The hundred days are in the record now, and nothing later takes them out.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
