<style>
/* mt-4 : the first seven. The smallest maintenance marker, treated seriously. */
[data-c="mt-4"] .mt4-hero{position:relative;display:flex;align-items:center;justify-content:center}[data-c="mt-4"] .b1.on .mt4-glow{animation:mt4glow .9s cubic-bezier(.2,.8,.3,1) both}
@keyframes mt4glow{from{opacity:0;transform:translate(-50%,-50%) scale(.86)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
[data-c="mt-4"] .mt4-hero .n--hero{position:relative}
[data-c="mt-4"] .b1.on .n--hero{animation:mt4land .55s cubic-bezier(.2,.8,.3,1) both}
@keyframes mt4land{from{opacity:0;transform:scale(.955)}to{opacity:1;transform:none}}
[data-c="mt-4"] .b1.on .sub{animation:mt4sub .5s cubic-bezier(.2,.8,.3,1) .3s both}
@keyframes mt4sub{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

[data-c="mt-4"] .mt4-week{display:flex;gap:16px;align-items:center}
[data-c="mt-4"] .mt4-week span{display:block;width:2px;height:28px;background:rgba(var(--ink),.44)}
[data-c="mt-4"] .b2.on .mt4-week span{animation:mt4tick .42s cubic-bezier(.2,.8,.3,1) both}
[data-c="mt-4"] .b2.on .mt4-week span:nth-child(2){animation-delay:.07s}
[data-c="mt-4"] .b2.on .mt4-week span:nth-child(3){animation-delay:.14s}
[data-c="mt-4"] .b2.on .mt4-week span:nth-child(4){animation-delay:.21s}
[data-c="mt-4"] .b2.on .mt4-week span:nth-child(5){animation-delay:.28s}
[data-c="mt-4"] .b2.on .mt4-week span:nth-child(6){animation-delay:.35s}
[data-c="mt-4"] .b2.on .mt4-week span:nth-child(7){animation-delay:.42s}
@keyframes mt4tick{from{opacity:0;transform:scaleY(.3)}to{opacity:1;transform:none}}

[data-c="mt-4"] .mt4-note{font-size:13.5px;line-height:1.55;color:var(--text-mid);
  max-width:26ch;margin-top:18px;letter-spacing:-.005em}
</style>

<div class="ph" data-c="mt-4">
  <div class="st">

    <div class="b b1" data-confetti>
      <div class="mt4-hero">
        <span class="mt4-glow"></span>
        <div class="n n--hero" data-count="0|7">0</div>
      </div>
      <div class="sub">days</div>
    </div>

    <div class="b b2">
      <div class="mt4-week">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="sub">Seven nights, seven times you left it in the kitchen.</div>
      <div class="cap">Aug 3 to Aug 9</div>
    </div>

    <div class="b b3">
      <div class="deposit"><b>Day 7.</b> The line held.</div>
      <div class="mt4-note">Seven days are in the record. The visible part comes later.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
