<style>
/* rf-fall. The Fall: the number they actually carry, what is LEFT, dropping
   and settling onto a line that takes the weight. One accent moment: the
   landing line at the moment of impact. */
[data-c="rf-fall"] .fl{display:flex;flex-direction:column;align-items:center;width:100%}
/* the shelf and its line add height under the number, so the landing beat is
   offset to keep the hero number on the same line as every other screen */
[data-c="rf-fall"] .b1 .fl{margin-top:30px}

[data-c="rf-fall"] .fl__n{display:block;transform:translateY(-26px);opacity:0}
[data-c="rf-fall"] .b1.on .fl__n{animation:rfFallDrop 1400ms cubic-bezier(.5,.02,.32,1) forwards}
@keyframes rfFallDrop{
  0%  {opacity:0;transform:translateY(-26px)}
  16% {opacity:1}
  86% {opacity:1;transform:translateY(0)}
  92% {opacity:1;transform:translateY(4px)}
  100%{opacity:1;transform:translateY(0)}
}

[data-c="rf-fall"] .fl__shelf{position:relative;width:190px;height:1px;margin-top:22px;
  background:rgba(var(--ink),.13)}
[data-c="rf-fall"] .fl__lit{position:absolute;left:0;right:0;top:-.5px;height:2px;
  border-radius:1px;background:var(--accent);
  opacity:0;transform:scaleX(.24)}
[data-c="rf-fall"] .b1.on .fl__lit{animation:rfFallLand 460ms cubic-bezier(.2,.85,.25,1) 1.2s forwards}
@keyframes rfFallLand{from{opacity:0;transform:scaleX(.24)}to{opacity:1;transform:scaleX(1)}}[data-c="rf-fall"] .b1.on .fl__bloom{animation:rfFallBloom 760ms ease-out 1.2s forwards}
@keyframes rfFallBloom{0%{opacity:0}34%{opacity:1}100%{opacity:.46}}

[data-c="rf-fall"] .fl__sub{margin-top:20px}

/* beat 2: the descent, as a ledger. every floor already passed, and the days
   each one took. */
[data-c="rf-fall"] .fl__led{width:100%;max-width:272px}
[data-c="rf-fall"] .fl__hd{display:flex;justify-content:space-between;align-items:baseline;
  padding:0 2px 9px;font-size:11.5px;color:var(--text-lo)}
[data-c="rf-fall"] .fl__row{display:flex;justify-content:space-between;align-items:baseline;
  padding:11px 2px;border-top:1px solid var(--hairline);opacity:0}
[data-c="rf-fall"] .fl__day{font-size:12.5px;color:rgba(var(--ink),.52);
  font-variant-numeric:tabular-nums}
[data-c="rf-fall"] .fl__v{font-size:21px;font-weight:700;letter-spacing:-.03em;
  color:var(--text-mid);font-variant-numeric:tabular-nums}
[data-c="rf-fall"] .fl__row--now .fl__day{color:var(--text-mid)}
[data-c="rf-fall"] .fl__row--now .fl__v{font-size:27px;color:var(--text-hi)}
[data-c="rf-fall"] .b2.on .fl__row{animation:rfFallRow 440ms ease-out forwards;animation-delay:var(--d)}
@keyframes rfFallRow{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}

[data-c="rf-fall"] .fl__cost{margin-top:28px;opacity:0}
[data-c="rf-fall"] .b2.on .fl__cost{animation:rfFallRow 480ms ease-out .68s forwards}

@media (prefers-reduced-motion:reduce){
  [data-c="rf-fall"] .fl__n{opacity:1;transform:none}
  [data-c="rf-fall"] .fl__lit{opacity:1;transform:none}
  [data-c="rf-fall"] .fl__bloom{opacity:.46}
  [data-c="rf-fall"] .fl__row,
  [data-c="rf-fall"] .fl__cost{opacity:1;transform:none}
}
</style>
<div class="ph" data-c="rf-fall">
  <div class="st">

    <div class="b b1">
      <div class="fl">
        <div class="n n--hero fl__n" data-count="16|12">16</div>
        <div class="fl__shelf">
          <span class="fl__bloom"></span>
          <span class="fl__lit"></span>
        </div>
        <div class="sub fl__sub">lbs to go</div>
      </div>
    </div>

    <div class="b b2">
      <div class="fl">
        <div class="fl__led">
          <div class="fl__hd"><span></span><span>lbs left</span></div>
          <div class="fl__row" style="--d:60ms"><span class="fl__day">Day 1</span><span class="fl__v">24</span></div>
          <div class="fl__row" style="--d:170ms"><span class="fl__day">Day 26</span><span class="fl__v">20</span></div>
          <div class="fl__row" style="--d:280ms"><span class="fl__day">Day 58</span><span class="fl__v">16</span></div>
          <div class="fl__row fl__row--now" style="--d:430ms"><span class="fl__day">Day 84</span><span class="fl__v">12</span></div>
        </div>
        <div class="sub fl__cost">The last four took <b>26 days</b>.</div>
      </div>
    </div>

    <div class="b b3">
      <div class="deposit">On this day, you crossed halfway. <b>12 lbs left</b>.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
