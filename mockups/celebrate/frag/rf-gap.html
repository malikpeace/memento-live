<style>
/* rf-gap. The Gap: the distance closing, the distance still open stated next
   to it at the same weight. One accent moment: the closed rail. */
[data-c="rf-gap"] .gp{width:100%;display:flex;flex-direction:column;align-items:center}

[data-c="rf-gap"] .gp__scale{display:flex;justify-content:space-between;width:100%;
  margin:0 0 10px;font-size:11px;color:var(--text-lo);font-variant-numeric:tabular-nums;
  letter-spacing:0}

[data-c="rf-gap"] .gp__rail{position:relative;width:100%;height:2px;border-radius:2px;
  background:repeating-linear-gradient(90deg,
    rgba(var(--ink),.20) 0 3px, rgba(var(--ink),0) 3px 8px)}

/* the ground already closed. THE one coloured thing on this screen. */
[data-c="rf-gap"] .gp__fill{position:absolute;left:0;top:-1px;bottom:-1px;width:60%;
  border-radius:2px;background:var(--accent);
  box-shadow:0 0 14px rgba(var(--accent-rgb),.50);
  transform-origin:left center;transform:scaleX(.6667)}
[data-c="rf-gap"] .b2.on .gp__fill{animation:rfGapFill 950ms cubic-bezier(.2,.85,.25,1) .3s forwards}
@keyframes rfGapFill{from{transform:scaleX(.6667)}to{transform:scaleX(1)}}

/* where they stood at the last marker, and where they stand now */
[data-c="rf-gap"] .gp__was{position:absolute;left:40%;top:-5px;width:1px;height:12px;
  background:rgba(var(--ink),.45)}
[data-c="rf-gap"] .gp__now{position:absolute;left:60%;top:-8px;width:2px;height:18px;
  margin-left:-1px;border-radius:1px;background:var(--text-hi);
  opacity:0;transform:scaleY(.25);transform-origin:center}
[data-c="rf-gap"] .b2.on .gp__now{animation:rfGapTick 420ms cubic-bezier(.2,.85,.25,1) 1.15s forwards}
@keyframes rfGapTick{from{opacity:0;transform:scaleY(.25)}to{opacity:1;transform:scaleY(1)}}

[data-c="rf-gap"] .gp__row{display:flex;justify-content:space-between;width:100%;
  margin-top:19px;font-size:14.5px;color:var(--text-mid);letter-spacing:-.01em;
  opacity:0}
[data-c="rf-gap"] .gp__row b{color:var(--text-hi);font-weight:700;font-variant-numeric:tabular-nums}
[data-c="rf-gap"] .b2.on .gp__row{animation:rfGapUp 460ms ease-out 1.28s forwards}

[data-c="rf-gap"] .gp__cost{margin-top:30px;opacity:0}
[data-c="rf-gap"] .b2.on .gp__cost{animation:rfGapUp 460ms ease-out 1.5s forwards}
@keyframes rfGapUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

[data-c="rf-gap"] .gp__open{margin-top:20px;font-size:13.5px;color:var(--text-mid);
  font-variant-numeric:tabular-nums;opacity:0}
[data-c="rf-gap"] .b3.on .gp__open{animation:rfGapUp 480ms ease-out .34s forwards}

@media (prefers-reduced-motion:reduce){
  [data-c="rf-gap"] .gp__fill{transform:scaleX(1)}
  [data-c="rf-gap"] .gp__now{opacity:1;transform:scaleY(1)}
  [data-c="rf-gap"] .gp__row,
  [data-c="rf-gap"] .gp__cost,
  [data-c="rf-gap"] .gp__open{opacity:1;transform:none}
}
</style>
<div class="ph" data-c="rf-gap">
  <div class="st">

    <div class="b b1">
      <div class="n n--hero" data-count="40|60">40</div>
      <div class="sub">paying users</div>
    </div>

    <div class="b b2">
      <div class="gp">
        <div class="gp__scale"><span>0</span><span>100</span></div>
        <div class="gp__rail">
          <span class="gp__fill"></span>
          <span class="gp__was"></span>
          <span class="gp__now"></span>
        </div>
        <div class="gp__row">
          <span><b>60</b> closed</span>
          <span><b>40</b> to go</span>
        </div>
        <div class="sub gp__cost"><b>26 days</b> closed the last 20.</div>
      </div>
    </div>

    <div class="b b3">
      <div class="deposit">On this day, you passed <b>60 paying users</b>.</div>
      <div class="gp__open">40 to go.</div>
    </div>

  </div>
  <div class="keepbtn">Keep</div>
  <div class="hint">Tap to replay</div>
</div>
