<style>
[data-c="l-horizon"]{--ink:235,238,248;--day-rgb:63,217,78}
[data-c="l-horizon"] .core{position:relative;z-index:2;margin-bottom:var(--lift)}
[data-c="l-horizon"] .num{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.045em;
  line-height:.88;font-size:var(--ns);color:rgba(var(--ink),.96)}
[data-c="l-horizon"] .line{font-size:16px;font-weight:500;letter-spacing:-.012em;margin-top:22px;
  color:rgba(var(--ink),.90)}
[data-c="l-horizon"] .line b{font-weight:700;color:rgba(var(--ink),.99)}
[data-c="l-horizon"] .date{font-size:12.5px;font-weight:400;margin-top:9px;color:rgba(var(--ink),.50)}

/* the light. every layer is a radial that reaches full transparency well inside
   its own box, or a line whose ends fade to zero, so no straight edge is
   geometrically possible. */
[data-c="l-horizon"] .hz{position:absolute;left:0;right:0;bottom:var(--hy);height:0;z-index:1;
  pointer-events:none}
[data-c="l-horizon"] .hz i{position:absolute;left:50%;display:block}
[data-c="l-horizon"] .sky{margin-left:calc(var(--sw) / -2);bottom:calc(var(--so) - var(--sh) / 2);
  width:var(--sw);height:var(--sh);transform-origin:50% 100%;
  background:radial-gradient(50% 50% at 50% 50%,
    rgba(var(--day-rgb),var(--sa)) 0%, rgba(var(--day-rgb),0) 70%)}
[data-c="l-horizon"] .glow{margin-left:calc(var(--gw) / -2);bottom:calc(var(--go) - var(--gh) / 2);
  width:var(--gw);height:var(--gh);transform-origin:50% 100%;
  background:radial-gradient(50% 50% at 50% 50%,
    rgba(var(--day-rgb),var(--ga)) 0%, rgba(var(--day-rgb),0) 70%)}
[data-c="l-horizon"] .ln{margin-left:calc(var(--lw) / -2);bottom:0;width:var(--lw);height:var(--lh);
  border-radius:2px;transform-origin:50% 50%;
  background:linear-gradient(90deg, rgba(var(--day-rgb),0) 0%,
    rgba(var(--day-rgb),calc(var(--la) * .34)) 16%, rgba(var(--day-rgb),var(--la)) 50%,
    rgba(var(--day-rgb),calc(var(--la) * .34)) 84%, rgba(var(--day-rgb),0) 100%)}
/* strata: a layer of light for each stretch of time behind them. one at day 1,
   two at week 1, three at month 1. */
[data-c="l-horizon"] .st2{margin-left:calc(var(--lw) * -.31);bottom:19px;width:calc(var(--lw) * .62);
  height:1px;transform-origin:50% 50%;
  background:linear-gradient(90deg, rgba(var(--day-rgb),0) 0%,
    rgba(var(--day-rgb),calc(var(--la) * .40)) 50%, rgba(var(--day-rgb),0) 100%)}
[data-c="l-horizon"] .st3{margin-left:calc(var(--lw) * -.17);bottom:41px;width:calc(var(--lw) * .34);
  height:1px;transform-origin:50% 50%;
  background:linear-gradient(90deg, rgba(var(--day-rgb),0) 0%,
    rgba(var(--day-rgb),calc(var(--la) * .26)) 50%, rgba(var(--day-rgb),0) 100%)}

/* the horizon rises, widens, brightens and gains strata as the days bank up */
[data-c="l-horizon"][data-state="d1"]{--ns:96px; --lift:122px;--hy:104px;--lw:112px;--la:.60;--lh:1px;
  --gw:190px;--gh:62px; --go:5px; --ga:.17; --sw:224px;--sh:150px;--so:52px; --sa:.05}
[data-c="l-horizon"][data-state="w1"]{--ns:104px;--lift:142px;--hy:130px;--lw:206px;--la:.74;--lh:1.5px;
  --gw:262px;--gh:78px; --go:7px; --ga:.19; --sw:290px;--sh:200px;--so:76px; --sa:.07}
[data-c="l-horizon"][data-state="m1"]{--ns:112px;--lift:160px;--hy:164px;--lw:286px;--la:.95;--lh:2px;
  --gw:316px;--gh:98px; --go:9px; --ga:.23; --sw:330px;--sh:246px;--so:98px; --sa:.09}

[data-c="l-horizon"].on .num {animation:kRiseLH .62s cubic-bezier(.2,.9,.25,1) both}
[data-c="l-horizon"].on .line{animation:kFadeLH .5s ease-out .30s both}
[data-c="l-horizon"].on .date{animation:kFadeLH .5s ease-out .44s both}
[data-c="l-horizon"].on .sky {animation:kDawnLH 1.1s cubic-bezier(.16,.84,.3,1) .22s both}
[data-c="l-horizon"].on .glow{animation:kDawnLH .95s cubic-bezier(.16,.84,.3,1) .18s both}
[data-c="l-horizon"].on .ln  {animation:kEdgeLH .85s cubic-bezier(.16,.84,.3,1) .24s both}
[data-c="l-horizon"].on .st2 {animation:kEdgeLH .8s cubic-bezier(.16,.84,.3,1) .40s both}
[data-c="l-horizon"].on .st3 {animation:kEdgeLH .8s cubic-bezier(.16,.84,.3,1) .52s both}
@keyframes kRiseLH{from{opacity:0;transform:translateY(12px) scale(.965)}to{opacity:1;transform:none}}
@keyframes kFadeLH{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes kDawnLH{from{opacity:0;transform:translateY(14px) scaleY(.55)}to{opacity:1;transform:none}}
@keyframes kEdgeLH{from{opacity:0;transform:scaleX(.28)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  [data-c="l-horizon"] *{animation:none!important}
  [data-c="l-horizon"] .num,[data-c="l-horizon"] .line,[data-c="l-horizon"] .date,
  [data-c="l-horizon"] .hz i{opacity:1!important;transform:none!important}
}
</style>
<div class="ph" data-c="l-horizon" data-state="d1"><div class="dst">
  <div class="hz"><i class="sky"></i><i class="glow"></i><i class="ln"></i></div>
  <div class="core">
    <div class="num">1</div>
    <div class="line"><b>1 day</b> is in.</div>
    <div class="date">February 13</div>
  </div>
</div><div class="hint">Tap to replay</div></div>
<div class="ph" data-c="l-horizon" data-state="w1"><div class="dst">
  <div class="hz"><i class="sky"></i><i class="glow"></i><i class="ln"></i><i class="st2"></i></div>
  <div class="core">
    <div class="num">7</div>
    <div class="line"><b>7 days</b> are in.</div>
    <div class="date">February 19</div>
  </div>
</div><div class="hint">Tap to replay</div></div>
<div class="ph" data-c="l-horizon" data-state="m1"><div class="dst">
  <div class="hz"><i class="sky"></i><i class="glow"></i><i class="ln"></i><i class="st2"></i><i class="st3"></i></div>
  <div class="core">
    <div class="num">30</div>
    <div class="line"><b>30 days</b> are in.</div>
    <div class="date">March 14</div>
  </div>
</div><div class="hint">Tap to replay</div></div>
