<style>
[data-c="n-ring"]{--d:#3fd94e;--ink:235,238,248}
[data-c="n-ring"] .rg-wrap{display:grid;place-items:center}
[data-c="n-ring"] .rg-wrap>*{grid-area:1/1}
[data-c="n-ring"] .rg-svg{display:block}
[data-c="n-ring"] .rg-seam{transform-box:fill-box;transform-origin:50% 50%}
[data-c="n-ring"] .rg-mid{text-align:center;transform:translateY(6px)}
[data-c="n-ring"] .rg-n{font-size:64px;font-weight:700;letter-spacing:-.05em;line-height:1;
  font-variant-numeric:tabular-nums;color:rgba(var(--ink),.96)}
[data-c="n-ring"] .rg-u{font-size:13px;font-weight:500;color:rgba(var(--ink),.62);margin-top:9px;letter-spacing:-.005em}
[data-c="n-ring"] .rg-cap{font-size:14px;font-weight:500;color:rgba(var(--ink),.62);letter-spacing:-.005em;margin-top:38px}

[data-c="n-ring"].on .rg-past{animation:kRgPastNRG .54s ease-out .06s both}
[data-c="n-ring"].on .rg-live{animation:kRgDrawNRG .82s cubic-bezier(.2,.86,.3,1) .2s both}
[data-c="n-ring"].on .rg-seam{animation:kRgSeamNRG .26s ease-out .98s both}
[data-c="n-ring"].on .rg-mid{animation:kRgMidNRG .5s cubic-bezier(.2,.8,.28,1) .12s both}
[data-c="n-ring"].on .rg-cap{animation:kRgCapNRG .5s ease-out 1.06s both}
@keyframes kRgPastNRG{from{opacity:0}to{opacity:1}}
@keyframes kRgDrawNRG{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:0}}
@keyframes kRgSeamNRG{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes kRgMidNRG{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(6px)}}
@keyframes kRgCapNRG{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){[data-c="n-ring"] *{animation:none!important}
  [data-c="n-ring"] .rg-past,[data-c="n-ring"] .rg-seam,[data-c="n-ring"] .rg-cap{opacity:1!important;transform:none!important}
  [data-c="n-ring"] .rg-mid{opacity:1!important;transform:translateY(6px)!important}
  [data-c="n-ring"] .rg-live{stroke-dashoffset:0!important}}
</style>
