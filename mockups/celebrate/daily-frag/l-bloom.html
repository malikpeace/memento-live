<style>
[data-c="l-bloom"]{--ink:235,238,248;--day-rgb:63,217,78}
[data-c="l-bloom"] .core{position:relative;z-index:2}
[data-c="l-bloom"] .nw{position:relative;display:flex;align-items:center;justify-content:center}
[data-c="l-bloom"] .num{position:relative;z-index:2;font-variant-numeric:tabular-nums;font-weight:700;
  letter-spacing:-.05em;line-height:.86;font-size:var(--ns);color:rgba(var(--ink),.97)}
[data-c="l-bloom"] .line{font-size:16px;font-weight:500;letter-spacing:-.012em;margin-top:30px;
  color:rgba(var(--ink),.90)}
[data-c="l-bloom"] .line b{font-weight:700;color:rgba(var(--ink),.99)}
[data-c="l-bloom"] .date{font-size:12.5px;font-weight:400;margin-top:9px;color:rgba(var(--ink),.50)}
[data-c="l-bloom"] .mk{position:absolute;bottom:54px;left:50%;margin-left:-8px;width:16px;height:16px;
  z-index:2;fill:rgba(var(--ink),.14)}

/* pure circles that hit zero alpha long before their own bounds, so nothing can
   ever form a straight edge against the phone. the very centre dips so the
   number stays crisp instead of sitting in fog. */
[data-c="l-bloom"] .bl{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);
  margin-left:calc(var(--s) / -2);margin-top:calc(var(--s) / -2);border-radius:50%;
  transform-origin:50% 50%;pointer-events:none;z-index:1}
[data-c="l-bloom"] .bl-c{--s:var(--sc);opacity:.86;
  background:radial-gradient(circle at 50% 50%, rgba(var(--day-rgb),var(--ac0)) 0%,
    rgba(var(--day-rgb),var(--ac)) 34%, rgba(var(--day-rgb),calc(var(--ac) * .42)) 54%,
    rgba(var(--day-rgb),0) 72%)}
[data-c="l-bloom"] .bl-w{--s:var(--sw);opacity:.86;
  background:radial-gradient(circle at 50% 50%, rgba(var(--day-rgb),.13) 0%,
    rgba(var(--day-rgb),0) 60%)}
[data-c="l-bloom"] .bl-f{--s:var(--sf);opacity:.86;
  background:radial-gradient(circle at 50% 50%, rgba(var(--day-rgb),.075) 0%,
    rgba(var(--day-rgb),0) 54%)}

/* the number itself is the accumulation. the light gains a whole layer behind
   it at each stage. */
[data-c="l-bloom"][data-state="d1"]{--ns:96px; --sc:186px;--ac0:.12;--ac:.20}
[data-c="l-bloom"][data-state="w1"]{--ns:118px;--sc:228px;--ac0:.145;--ac:.25;--sw:330px}
[data-c="l-bloom"][data-state="m1"]{--ns:146px;--sc:276px;--ac0:.175;--ac:.30;--sw:400px;--sf:512px}

[data-c="l-bloom"].on .num {animation:kRiseBL .58s cubic-bezier(.2,.9,.25,1) both}
[data-c="l-bloom"].on .line{animation:kFadeBL .5s ease-out .32s both}
[data-c="l-bloom"].on .date{animation:kFadeBL .5s ease-out .46s both}
[data-c="l-bloom"].on .mk  {animation:kFadeBL .5s ease-out .64s both}
[data-c="l-bloom"].on .bl-c{animation:kBloomBL .95s cubic-bezier(.16,.86,.28,1) .10s both}
[data-c="l-bloom"].on .bl-w{animation:kBloomBL 1.15s cubic-bezier(.16,.86,.28,1) .18s both}
[data-c="l-bloom"].on .bl-f{animation:kBloomBL 1.35s cubic-bezier(.16,.86,.28,1) .26s both}
@keyframes kRiseBL{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes kFadeBL{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes kBloomBL{0%{opacity:0;transform:scale(.28)}58%{opacity:1;transform:scale(1.04)}
  100%{opacity:.86;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  [data-c="l-bloom"] *{animation:none!important}
  [data-c="l-bloom"] .num,[data-c="l-bloom"] .line,[data-c="l-bloom"] .date,
  [data-c="l-bloom"] .mk{opacity:1!important;transform:none!important}
  [data-c="l-bloom"] .bl{opacity:.86!important;transform:none!important}
}
</style>
<div class="ph" data-c="l-bloom" data-state="d1"><div class="dst">
  <div class="core">
    <div class="nw"><div class="bl bl-c"></div><div class="num">1</div></div>
    <div class="line"><b>1 day</b> of showing up.</div>
    <div class="date">February 13</div>
  </div>
  <svg class="mk" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
</div><div class="hint">Tap to replay</div></div>
<div class="ph" data-c="l-bloom" data-state="w1"><div class="dst">
  <div class="core">
    <div class="nw"><div class="bl bl-w"></div><div class="bl bl-c"></div><div class="num">7</div></div>
    <div class="line"><b>7 days</b> of showing up.</div>
    <div class="date">February 19</div>
  </div>
  <svg class="mk" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
</div><div class="hint">Tap to replay</div></div>
<div class="ph" data-c="l-bloom" data-state="m1"><div class="dst">
  <div class="core">
    <div class="nw"><div class="bl bl-f"></div><div class="bl bl-w"></div><div class="bl bl-c"></div><div class="num">30</div></div>
    <div class="line"><b>30 days</b> of showing up.</div>
    <div class="date">March 14</div>
  </div>
  <svg class="mk" viewBox="0 0 512 512" aria-hidden="true"><path d="M150 146 L256 252 L362 146 L362 366 L150 366 Z"/></svg>
</div><div class="hint">Tap to replay</div></div>
