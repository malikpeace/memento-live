<style>
[data-c="n-ghost"]{--d:#3fd94e;--ink:235,238,248}
[data-c="n-ghost"] .gh-col{height:180px;width:100%;display:flex;flex-direction:column;
  justify-content:flex-end;align-items:center}
[data-c="n-ghost"] .gh-past{font-weight:600;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;color:rgba(var(--ink),.96)}
[data-c="n-ghost"] .gh-first{font-size:12.5px;font-weight:500;color:rgba(var(--ink),.42);margin-bottom:20px}
[data-c="n-ghost"] .gh-row{display:flex;align-items:baseline;justify-content:center;gap:11px;
  transform:translateX(10px)}
[data-c="n-ghost"] .gh-new{font-size:96px;font-weight:700;letter-spacing:-.05em;line-height:1;
  font-variant-numeric:tabular-nums;color:rgba(var(--ink),.96)}
[data-c="n-ghost"] .gh-dot{width:10px;height:10px;border-radius:50%;background:var(--d);flex:0 0 10px}
[data-c="n-ghost"] .gh-cap{font-size:14px;font-weight:500;color:rgba(var(--ink),.62);
  letter-spacing:-.005em;margin:24px 0 56px}

[data-c="n-ghost"].on .gh-past{animation:kGhFarNGH .6s ease-out .3s both}
[data-c="n-ghost"].on .gh-past--y{animation:kGhUpNGH .78s cubic-bezier(.18,.84,.28,1) .06s both}
[data-c="n-ghost"].on .gh-first{animation:kGhFadeNGH .5s ease-out .8s both}
[data-c="n-ghost"].on .gh-new{animation:kGhNewNGH .54s cubic-bezier(.2,.8,.28,1) .24s both}
[data-c="n-ghost"].on .gh-dot{animation:kGhDotNGH .3s cubic-bezier(.2,.9,.3,1) .7s both}
[data-c="n-ghost"].on .gh-cap{animation:kGhFadeNGH .5s ease-out .8s both}
@keyframes kGhFarNGH{from{opacity:0}}
@keyframes kGhUpNGH{from{opacity:.92;transform:translateY(82px) scale(2.4)}to{opacity:.30;transform:none}}
@keyframes kGhNewNGH{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes kGhDotNGH{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@keyframes kGhFadeNGH{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){[data-c="n-ghost"] *{animation:none!important}
  [data-c="n-ghost"] .gh-new,[data-c="n-ghost"] .gh-dot,[data-c="n-ghost"] .gh-cap,
  [data-c="n-ghost"] .gh-first{opacity:1!important;transform:none!important}
  [data-c="n-ghost"] .gh-past{transform:none!important}
  [data-c="n-ghost"] .gh-row{transform:translateX(10px)!important}}
</style>
<div class="ph" data-c="n-ghost" data-state="d1"><div class="dst">
  <div class="gh-col"><div class="gh-first">Nothing above this one yet.</div></div>
  <div class="gh-row"><span class="gh-new">1</span><i class="gh-dot"></i></div>
  <div class="gh-cap">day banked</div>
</div><div class="hint">Tap to replay</div></div>
<div class="ph" data-c="n-ghost" data-state="w1"><div class="dst">

  </div>
  <div class="gh-row"><span class="gh-new">7</span><i class="gh-dot"></i></div>
  <div class="gh-cap">days banked</div>
</div><div class="hint">Tap to replay</div></div>
<div class="ph" data-c="n-ghost" data-state="m1"><div class="dst">
  <div class="gh-col">
    <div class="gh-past" style="font-size:15px;opacity:.050;margin-bottom:5px">25</div>
    <div class="gh-past" style="font-size:19px;opacity:.075;margin-bottom:6px">26</div>
    <div class="gh-past" style="font-size:24px;opacity:.110;margin-bottom:8px">27</div>
    <div class="gh-past" style="font-size:31px;opacity:.170;margin-bottom:10px">28</div>
    <div class="gh-past gh-past--y" style="font-size:40px;opacity:.30;margin-bottom:14px">29</div>

  <div class="gh-row"><span class="gh-new">30</span><i class="gh-dot"></i></div>

</div><div class="hint">Tap to replay</div></div>
