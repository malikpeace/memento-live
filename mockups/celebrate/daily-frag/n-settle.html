<style>
[data-c="n-settle"]{--d:#3fd94e;--d-rgb:63,217,78;--ink:235,238,248}
[data-c="n-settle"] .st-row{display:flex;align-items:baseline;justify-content:center;gap:12px}
[data-c="n-settle"] .st-n{font-size:100px;font-weight:700;letter-spacing:-.05em;line-height:1;
  font-variant-numeric:tabular-nums;color:rgba(var(--ink),.96)}
[data-c="n-settle"] .st-u{font-size:16px;font-weight:500;color:rgba(var(--ink),.62);letter-spacing:-.01em}
[data-c="n-settle"] .st-pile{margin-top:32px;display:flex;flex-direction:column;align-items:center}
[data-c="n-settle"] .st-today{position:relative;height:2px;width:150px;margin-bottom:3.4px}
[data-c="n-settle"] .st-bar{position:absolute;inset:0;border-radius:1px;background:var(--d);opacity:.94}
[data-c="n-settle"] .st-wash{position:absolute;left:-50px;right:-50px;top:-13px;height:28px;opacity:0;
  background:radial-gradient(50% 50% at 50% 50%,rgba(var(--d-rgb),.28),rgba(var(--d-rgb),0) 72%)}
[data-c="n-settle"] .st-past{display:flex;flex-direction:column;align-items:center;gap:3px;
  -webkit-mask-image:linear-gradient(180deg,#000 78%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 78%,transparent 100%)}
[data-c="n-settle"] .st-past i{display:block;width:132px;height:1.2px;border-radius:1px;background:rgb(var(--ink))}
[data-c="n-settle"] .st-cap{font-size:14px;font-weight:500;color:rgba(var(--ink),.62);letter-spacing:-.005em;margin-top:36px}

[data-c="n-settle"].on .st-row{animation:kStDropNST .56s cubic-bezier(.22,.86,.24,1) .12s both}
[data-c="n-settle"].on .st-past{animation:kStPastNST .44s ease-out .08s both,kStTakeNST .32s ease-out .6s both}
[data-c="n-settle"].on .st-bar{animation:kStBarNST .34s cubic-bezier(.2,.9,.25,1) .58s both}
[data-c="n-settle"].on .st-wash{animation:kStWashNST .78s ease-out .58s both}
[data-c="n-settle"].on .st-u{animation:kStFadeNST .45s ease-out .52s both}
[data-c="n-settle"].on .st-cap{animation:kStFadeNST .5s ease-out .84s both}
@keyframes kStDropNST{0%{opacity:0;transform:translateY(-44px)}60%{opacity:1}
  82%{transform:translateY(2.5px)}100%{opacity:1;transform:none}}
@keyframes kStPastNST{from{opacity:0}to{opacity:1}}
@keyframes kStTakeNST{0%{transform:translateY(0)}45%{transform:translateY(2px)}100%{transform:translateY(0)}}
@keyframes kStBarNST{from{opacity:0;transform:scaleX(.16)}to{opacity:.94;transform:none}}
@keyframes kStWashNST{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
@keyframes kStFadeNST{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){[data-c="n-settle"] *{animation:none!important}
  [data-c="n-settle"] .st-row,[data-c="n-settle"] .st-past,[data-c="n-settle"] .st-u,
  [data-c="n-settle"] .st-cap{opacity:1!important;transform:none!important}
  [data-c="n-settle"] .st-bar{opacity:.94!important;transform:none!important}
  [data-c="n-settle"] .st-wash{opacity:0!important}}
</style>
<div class="ph" data-c="n-settle" data-state="d1"><div class="dst">
  <div class="st-row"><span class="st-n">1</span><span class="st-u">day</span></div>
  <div class="st-pile">
    <div class="st-today"><span class="st-wash"></span><span class="st-bar"></span></div>
    <div class="st-past"></div>
  </div>
  <div class="st-cap">Set down. It stays.</div>
</div><div class="hint">Tap to replay</div></div>
