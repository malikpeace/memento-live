<style>
/* o-thread THE THREAD. A single line, drawn one day-length longer every time they
   show up, folding at the edge so it never leaves the frame. It is the same
   line on day 1 and on day 300: today is the bright tip, everything before it
   is the dim body, and the small node marks where it began. Every day is
   worth exactly the same length, which is the honest way to draw this, and a
   day that never happened simply added nothing, so nothing is ever missing
   from the line. Rows run 150 units, folds are r13, a day is 30 units, so
   five days fill a row and every phone here is drawn at the same scale, so
   the growth between them is real and measured rather than a zoom. */
[data-c="o-thread"] .otline{font-size:17px;font-weight:500;letter-spacing:-.015em;
  color:rgba(var(--ink),.80);opacity:0;margin-bottom:28px}
[data-c="o-thread"] .otline b{color:var(--text-hi);font-weight:650;font-variant-numeric:tabular-nums}
[data-c="o-thread"] .otsvg{display:block;overflow:visible}
[data-c="o-thread"] .otold{fill:none;stroke:rgba(var(--day-rgb),.28);stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round;opacity:0}
[data-c="o-thread"] .otnode{fill:rgba(var(--day-rgb),.55);opacity:0}
[data-c="o-thread"] .othalo{fill:none;stroke:rgba(var(--day-rgb),.13);stroke-width:9;
  stroke-linecap:round}
[data-c="o-thread"] .otnew{fill:none;stroke:var(--day);stroke-width:3;stroke-linecap:round}
[data-c="o-thread"] .otcap{margin-top:28px;font-size:12.5px;color:var(--text-lo);opacity:0}

[data-c="o-thread"].on .otold{animation:k_othr_show .55s ease-out both}
[data-c="o-thread"].on .otnode{animation:k_othr_show .55s ease-out .1s both}
[data-c="o-thread"].on .otnew{animation:k_othr_draw .62s cubic-bezier(.24,.8,.3,1) .34s both}
[data-c="o-thread"].on .othalo{animation:k_othr_draw .62s cubic-bezier(.24,.8,.3,1) .34s both}
[data-c="o-thread"].on .otline{animation:k_othr_text .45s ease-out .06s both}
[data-c="o-thread"].on .otcap{animation:k_othr_text .45s ease-out .96s both}
@keyframes k_othr_show{from{opacity:0}to{opacity:1}}
@keyframes k_othr_draw{from{stroke-dasharray:0 9999}to{stroke-dasharray:30 9999}}
@keyframes k_othr_text{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  [data-c="o-thread"] *{animation:none!important;transition:none!important}
  [data-c="o-thread"] .otold,[data-c="o-thread"] .otnode,[data-c="o-thread"] .otline,
  [data-c="o-thread"] .otcap{opacity:1!important;transform:none!important}
  [data-c="o-thread"] .otnew,[data-c="o-thread"] .othalo{stroke-dasharray:30 9999!important}}
</style>
