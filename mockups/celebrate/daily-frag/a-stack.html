<style>
[data-c="a-stack"]{--day:#3fd94e}
[data-c="a-stack"] .stk-num{display:flex;align-items:baseline;justify-content:center;
  margin-bottom:26px;opacity:0}
[data-c="a-stack"] .stk-n{font-size:50px;font-weight:700;letter-spacing:-.045em;line-height:.9;
  color:rgba(235,238,248,.96);font-variant-numeric:tabular-nums}
[data-c="a-stack"] .stk-u{font-size:16px;font-weight:500;letter-spacing:-.01em;margin-left:7px;
  color:rgba(235,238,248,.58)}
[data-c="a-stack"] .stk-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
[data-c="a-stack"] .stk-breath{position:absolute;left:50%;top:0;width:190px;height:190px;
  transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(63,217,78,.10),rgba(63,217,78,.035) 30%,transparent 62%)}
[data-c="a-stack"] .stk-bars{position:relative;display:flex;flex-direction:column-reverse;
  align-items:center;gap:3px}
[data-c="a-stack"] .stk-bar{height:5px;border-radius:2px;background:rgba(235,238,248,.28);opacity:0}
[data-c="a-stack"] .stk-bar--grp{margin-bottom:7px}
[data-c="a-stack"] .stk-bar--now{height:6px;background:var(--day)}
[data-c="a-stack"] .stk-floor{margin-top:12px;width:198px;height:1px;
  background:rgba(235,238,248,.13);opacity:0}
[data-c="a-stack"] .stk-cap{margin:26px 0 0;font-size:14.5px;font-weight:500;letter-spacing:-.005em;
  color:rgba(235,238,248,.80);opacity:0}

[data-c="a-stack"].on .stk-floor{animation:stkFloor-a-stack .40s ease-out .02s both}
[data-c="a-stack"].on .stk-bar{animation:stkBar-a-stack .30s cubic-bezier(.22,.9,.3,1) both;
  animation-delay:calc(var(--i) * 6ms + 90ms)}
[data-c="a-stack"].on .stk-bar--now{animation:stkDrop-a-stack .36s cubic-bezier(.2,.86,.3,1) both;
  animation-delay:calc(var(--td) * 1ms)}
[data-c="a-stack"].on .stk-breath{animation:stkBreath-a-stack .72s ease-out both;
  animation-delay:calc(var(--td) * 1ms)}
[data-c="a-stack"].on .stk-num{animation:stkRise-a-stack .42s cubic-bezier(.22,.9,.3,1) both;
  animation-delay:calc(var(--td) * 1ms + 190ms)}
[data-c="a-stack"].on .stk-cap{animation:stkRise-a-stack .42s cubic-bezier(.22,.9,.3,1) both;
  animation-delay:calc(var(--td) * 1ms + 250ms)}
@keyframes stkBar-a-stack{from{opacity:0;transform:translateY(5px) scaleX(.94)}to{opacity:1;transform:none}}
@keyframes stkDrop-a-stack{from{opacity:0;transform:translateY(-18px) scaleX(.9)}to{opacity:1;transform:none}}
@keyframes stkFloor-a-stack{from{opacity:0;transform:scaleX(.6)}to{opacity:1;transform:none}}
@keyframes stkBreath-a-stack{from{opacity:0;transform:translate(-50%,-50%) scale(.86)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes stkRise-a-stack{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  [data-c="a-stack"] *{animation:none!important;transition:none!important}
  [data-c="a-stack"] .stk-bar,[data-c="a-stack"] .stk-floor,[data-c="a-stack"] .stk-num,
  [data-c="a-stack"] .stk-cap{opacity:1!important;transform:none!important}
  [data-c="a-stack"] .stk-breath{opacity:1!important;transform:translate(-50%,-50%)!important}
}
</style>
