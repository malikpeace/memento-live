<style>
[data-c="a-rings"]{--day:#3fd94e}
[data-c="a-rings"] .rng-stage{position:relative;display:flex;align-items:center;justify-content:center}
[data-c="a-rings"] .rng-breath{position:absolute;inset:-26px;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(63,217,78,.075),rgba(63,217,78,.03) 32%,transparent 62%)}
[data-c="a-rings"] .rng-svg{position:relative;display:block;overflow:visible}
[data-c="a-rings"] .rng-old{fill:none}
[data-c="a-rings"] .rng-pith{fill:rgba(235,238,248,.30)}
[data-c="a-rings"] .rng-now{fill:none;stroke:var(--day);stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
[data-c="a-rings"] .rng-body{opacity:0;transform-box:fill-box;transform-origin:center}
[data-c="a-rings"] .rng-num{margin-top:30px;display:flex;align-items:baseline;justify-content:center;opacity:0}
[data-c="a-rings"] .rng-n{font-size:50px;font-weight:700;letter-spacing:-.045em;line-height:.9;
  color:rgba(235,238,248,.96);font-variant-numeric:tabular-nums}
[data-c="a-rings"] .rng-u{font-size:16px;font-weight:500;letter-spacing:-.01em;margin-left:7px;
  color:rgba(235,238,248,.58)}
[data-c="a-rings"] .rng-cap{margin:12px 0 0;font-size:14.5px;font-weight:500;letter-spacing:-.005em;
  color:rgba(235,238,248,.80);opacity:0}

[data-c="a-rings"].on .rng-body{animation:rngBody-a-rings .48s cubic-bezier(.22,.9,.3,1) .04s both}
[data-c="a-rings"].on .rng-now{animation:rngDraw-a-rings .60s cubic-bezier(.24,.86,.26,1) both;
  animation-delay:calc(var(--td) * 1ms)}
[data-c="a-rings"].on .rng-breath{animation:rngBreath-a-rings .80s ease-out both;
  animation-delay:calc(var(--td) * 1ms + 80ms)}
[data-c="a-rings"].on .rng-num{animation:rngRise-a-rings .42s cubic-bezier(.22,.9,.3,1) both;
  animation-delay:calc(var(--td) * 1ms + 420ms)}
[data-c="a-rings"].on .rng-cap{animation:rngRise-a-rings .42s cubic-bezier(.22,.9,.3,1) both;
  animation-delay:calc(var(--td) * 1ms + 480ms)}
@keyframes rngBody-a-rings{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes rngDraw-a-rings{from{opacity:1;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes rngBreath-a-rings{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}
@keyframes rngRise-a-rings{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  [data-c="a-rings"] *{animation:none!important;transition:none!important}
  [data-c="a-rings"] .rng-body,[data-c="a-rings"] .rng-now,[data-c="a-rings"] .rng-num,
  [data-c="a-rings"] .rng-cap,[data-c="a-rings"] .rng-breath{opacity:1!important;transform:none!important}
  [data-c="a-rings"] .rng-now{stroke-dashoffset:0!important}
}
</style>
