<style>
[data-c="l-pulse"]{--ink:235,238,248;--day:#3fd94e;--day-rgb:63,217,78}
[data-c="l-pulse"] .core{position:relative;z-index:2;display:flex;flex-direction:column;
  align-items:center}
[data-c="l-pulse"] .num{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.05em;
  line-height:.88;font-size:var(--ns);color:rgba(var(--ink),.96)}
[data-c="l-pulse"] .trace{display:block;width:min(306px, calc(100% - 6px));height:auto;
  margin:34px 0 4px;overflow:visible}
[data-c="l-pulse"] .tb{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
[data-c="l-pulse"] .tp{fill:none;stroke:var(--day);stroke-width:2.6;stroke-linecap:round;
  stroke-linejoin:round;transform-box:fill-box;transform-origin:50% 100%}
[data-c="l-pulse"] .td{fill:var(--day);transform-box:fill-box;transform-origin:50% 50%}
[data-c="l-pulse"] .line{font-size:16px;font-weight:500;letter-spacing:-.012em;margin-top:26px;
  color:rgba(var(--ink),.90)}
[data-c="l-pulse"] .line b{font-weight:700;color:rgba(var(--ink),.99)}
[data-c="l-pulse"] .date{font-size:12.5px;font-weight:400;margin-top:9px;color:rgba(var(--ink),.50)}
[data-c="l-pulse"] .mk{position:absolute;bottom:54px;left:50%;margin-left:-8px;width:16px;height:16px;
  z-index:2;fill:rgba(var(--ink),.14)}
[data-c="l-pulse"][data-state="d1"]{--ns:96px}
[data-c="l-pulse"][data-state="w1"]{--ns:104px}
[data-c="l-pulse"][data-state="m1"]{--ns:112px}

[data-c="l-pulse"].on .num {animation:kRisePU .6s cubic-bezier(.2,.9,.25,1) both}
[data-c="l-pulse"].on .tb  {animation:kLinePU .6s cubic-bezier(.2,.9,.25,1) .16s both}
[data-c="l-pulse"].on .tp  {animation:kBeatPU .48s cubic-bezier(.2,.92,.3,1) .38s both}
[data-c="l-pulse"].on .td  {animation:kDotPU .3s cubic-bezier(.2,.9,.25,1) .58s both}
[data-c="l-pulse"].on .line{animation:kFadePU .5s ease-out .5s both}
[data-c="l-pulse"].on .date{animation:kFadePU .5s ease-out .62s both}
[data-c="l-pulse"].on .mk  {animation:kFadePU .5s ease-out .78s both}
@keyframes kRisePU{from{opacity:0;transform:translateY(11px) scale(.97)}to{opacity:1;transform:none}}
@keyframes kFadePU{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes kLinePU{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes kBeatPU{from{opacity:.2;transform:scaleY(.04)}to{opacity:1;transform:none}}
@keyframes kDotPU{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  [data-c="l-pulse"] *{animation:none!important}
  [data-c="l-pulse"] .num,[data-c="l-pulse"] .line,[data-c="l-pulse"] .date,
  [data-c="l-pulse"] .tb,[data-c="l-pulse"] .tp,[data-c="l-pulse"] .td,
  [data-c="l-pulse"] .mk{opacity:1!important;transform:none!important}
}
</style>
