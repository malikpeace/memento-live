<style>
[data-c="t-steps"]{--day:#3fd94e;--day-rgb:63,217,78;--ink:235,238,248}
[data-c="t-steps"] .tk{position:relative;display:flex;flex-direction:column;align-items:center}
[data-c="t-steps"] .tk-breath{position:absolute;left:50%;top:-92px;width:280px;height:280px;
  margin-left:-140px;pointer-events:none;opacity:0;
  background:radial-gradient(circle closest-side,rgba(var(--day-rgb),.085),rgba(var(--day-rgb),.028) 44%,transparent 72%)}
[data-c="t-steps"] .tk-field{position:relative}
[data-c="t-steps"] .tk-s{position:absolute;opacity:0;
  border-top:var(--tw) solid rgba(var(--day-rgb),.34);
  border-left:var(--rw) solid rgba(var(--day-rgb),.16)}
[data-c="t-steps"] .tk-riser{position:absolute;width:var(--rw);background:rgba(var(--day-rgb),.55);
  transform:scaleY(0);transform-origin:50% 100%}
[data-c="t-steps"] .tk-tread{position:absolute;height:3px;border-radius:2px;background:var(--day);
  transform:scaleX(0);transform-origin:0 50%}
[data-c="t-steps"] .tk-ground{position:absolute;left:-12px;right:-12px;bottom:0;height:1px;
  background:rgba(var(--ink),.14);transform:scaleX(0)}
[data-c="t-steps"] .tk-here{position:absolute;left:0;right:0;bottom:calc(100% + 11px);text-align:right;
  font-size:11.5px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;
  color:rgba(var(--ink),.52);opacity:0}
[data-c="t-steps"][data-state="d1"] .tk-here{text-align:left}
[data-c="t-steps"] .tk-count{position:relative;display:flex;flex-direction:column;align-items:center;
  margin-top:44px;opacity:0}
[data-c="t-steps"] .tk-n{font-size:52px;font-weight:800;line-height:.9;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;color:rgba(var(--ink),.96)}
[data-c="t-steps"] .tk-u{font-size:14.5px;font-weight:500;letter-spacing:-.01em;color:rgba(var(--ink),.62);
  margin-top:12px}
[data-c="t-steps"] .tk-mark{position:absolute;left:50%;bottom:50px;width:14px;height:14px;margin-left:-7px;
  fill:rgba(var(--ink),.13);opacity:0}

[data-c="t-steps"].on .tk-breath{animation:tkBreath_tsteps 900ms ease-out 260ms both}
[data-c="t-steps"].on .tk-ground{animation:tkDraw_tsteps 420ms cubic-bezier(.2,.9,.25,1) both}
[data-c="t-steps"].on .tk-s{animation:tkRise_tsteps 280ms ease-out both;animation-delay:calc(110ms + var(--i) * 4ms)}
[data-c="t-steps"].on .tk-riser{animation:tkClimb_tsteps 220ms cubic-bezier(.3,.8,.4,1) both;
  animation-delay:calc(160ms + var(--i) * 4ms)}
[data-c="t-steps"].on .tk-tread{animation:tkLay_tsteps 320ms cubic-bezier(.2,.9,.25,1) both;
  animation-delay:calc(300ms + var(--i) * 4ms)}
[data-c="t-steps"].on .tk-here{animation:tkRise_tsteps 340ms ease-out both;animation-delay:calc(440ms + var(--i) * 4ms)}
[data-c="t-steps"].on .tk-count{animation:tkRise_tsteps 420ms cubic-bezier(.2,.9,.25,1) 620ms both}
[data-c="t-steps"].on .tk-mark{animation:tkFade_tsteps 460ms ease-out 780ms both}
@keyframes tkFade_tsteps{from{opacity:0}to{opacity:1}}
@keyframes tkRise_tsteps{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes tkBreath_tsteps{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes tkDraw_tsteps{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tkClimb_tsteps{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes tkLay_tsteps{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){
  [data-c="t-steps"] *{animation:none!important}
  [data-c="t-steps"] .tk-breath,[data-c="t-steps"] .tk-s,[data-c="t-steps"] .tk-here,
  [data-c="t-steps"] .tk-count,[data-c="t-steps"] .tk-mark{opacity:1!important;transform:none!important}
  [data-c="t-steps"] .tk-ground,[data-c="t-steps"] .tk-riser,
  [data-c="t-steps"] .tk-tread{transform:none!important}
}
</style>
