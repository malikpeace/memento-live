<style>
[data-c="a-tally"]{--day:#3fd94e}
[data-c="a-tally"] .tal-stage{opacity:0}
[data-c="a-tally"] .tal-svg{display:block;overflow:visible}
[data-c="a-tally"] .tal-rule path{stroke:rgba(235,238,248,.13);stroke-width:1;fill:none}
[data-c="a-tally"] .tal-mark{stroke:rgba(235,238,248,.46);stroke-width:2.3;stroke-linecap:round;fill:none;opacity:0}
[data-c="a-tally"] .tal-now{stroke:var(--day);stroke-width:2.8;stroke-linecap:round;fill:none;
  stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
[data-c="a-tally"] .tal-num{margin-top:30px;display:flex;align-items:baseline;justify-content:center;opacity:0}
[data-c="a-tally"] .tal-n{font-size:50px;font-weight:700;letter-spacing:-.045em;line-height:.9;
  color:rgba(235,238,248,.96);font-variant-numeric:tabular-nums}
[data-c="a-tally"] .tal-u{font-size:16px;font-weight:500;letter-spacing:-.01em;margin-left:7px;
  color:rgba(235,238,248,.58)}
[data-c="a-tally"] .tal-cap{margin:12px 0 0;font-size:14.5px;font-weight:500;letter-spacing:-.005em;
  color:rgba(235,238,248,.80);opacity:0}

[data-c="a-tally"].on .tal-stage{animation:talRise-a-tally .36s ease-out .04s both}
[data-c="a-tally"].on .tal-mark{animation:talInk-a-tally .26s ease-out both;
  animation-delay:calc(var(--i) * 7ms + 80ms)}
[data-c="a-tally"].on .tal-now{animation:talDraw-a-tally .44s cubic-bezier(.22,.9,.28,1) both;
  animation-delay:calc(var(--td) * 1ms)}
[data-c="a-tally"].on .tal-num{animation:talRise-a-tally .42s cubic-bezier(.22,.9,.3,1) both;
  animation-delay:calc(var(--td) * 1ms + 200ms)}
[data-c="a-tally"].on .tal-cap{animation:talRise-a-tally .42s cubic-bezier(.22,.9,.3,1) both;
  animation-delay:calc(var(--td) * 1ms + 265ms)}
@keyframes talRise-a-tally{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes talInk-a-tally{from{opacity:0}to{opacity:1}}
@keyframes talDraw-a-tally{from{opacity:1;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  [data-c="a-tally"] *{animation:none!important;transition:none!important}
  [data-c="a-tally"] .tal-stage,[data-c="a-tally"] .tal-mark,[data-c="a-tally"] .tal-now,
  [data-c="a-tally"] .tal-num,[data-c="a-tally"] .tal-cap{opacity:1!important;transform:none!important}
  [data-c="a-tally"] .tal-now{stroke-dashoffset:0!important}
}
</style>
