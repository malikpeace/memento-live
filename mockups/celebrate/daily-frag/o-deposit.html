<style>
/* o-deposit THE DEPOSIT. Today arrives as a whole plate, drops, and sets into
   the record as one thin line that will never move again. The record is a
   stack of those lines resting on a floor, so the height of the stack is the
   count, and the newest line is always the one on top. Day one is a single
   line resting on the floor, which is the truth about day one. Every seventh
   line sits a shade brighter, so a month reads as a measure rather than a
   smear, and the rhythm is a ruler, never something that can be broken. */
[data-c="o-deposit"] .odwrap{position:relative;display:flex;flex-direction:column;
  align-items:center;gap:4px}
[data-c="o-deposit"] .odbreath{position:absolute;left:50%;top:50%;width:300px;height:230px;
  transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  background:radial-gradient(50% 50% at 50% 50%,rgba(var(--day-rgb),.075),rgba(var(--day-rgb),0) 66%)}
[data-c="o-deposit"] .odslot{position:relative;z-index:2;width:168px;height:3px}
[data-c="o-deposit"] .odbar{width:168px;height:2px;border-radius:1px;
  background:linear-gradient(90deg,rgba(var(--ink),.02),rgba(var(--ink),.13) 15%,
    rgba(var(--ink),.13) 85%,rgba(var(--ink),.02))}
[data-c="o-deposit"] .odbar--wk{background:linear-gradient(90deg,rgba(var(--ink),.03),
  rgba(var(--ink),.24) 15%,rgba(var(--ink),.24) 85%,rgba(var(--ink),.03))}
[data-c="o-deposit"] .odbar--new{position:absolute;inset:0;width:auto;height:auto;
  border-radius:1.5px;opacity:0;
  background:linear-gradient(90deg,rgba(var(--day-rgb),.5),var(--day) 14%,
    var(--day) 86%,rgba(var(--day-rgb),.5))}
[data-c="o-deposit"] .odbar--new::after{content:"";position:absolute;left:-26px;right:-26px;
  top:-13px;bottom:-13px;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%,rgba(var(--day-rgb),.19),rgba(var(--day-rgb),0) 70%)}
/* the plate: today, whole, before it is filed. No backdrop-filter, there is
   nothing behind it but black, and blurred layers under transform cost iOS. */
[data-c="o-deposit"] .odplate{position:absolute;left:-8px;right:-8px;top:50%;height:46px;
  margin-top:-23px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(-108px);
  background:linear-gradient(168deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 16px 34px rgba(0,0,0,.6)}
[data-c="o-deposit"] .odpd{font-size:13.5px;font-weight:550;letter-spacing:-.005em;
  color:rgba(var(--ink),.80);font-variant-numeric:tabular-nums}
[data-c="o-deposit"] .odstack{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px}
[data-c="o-deposit"] .odfloor{position:relative;width:208px;height:1px;
  background:rgba(var(--ink),.18);transform:scaleX(.3);opacity:0}
[data-c="o-deposit"] .odflash{position:absolute;left:0;right:0;top:-1px;height:3px;opacity:0;
  background:linear-gradient(90deg,rgba(var(--day-rgb),0),rgba(var(--day-rgb),.85) 50%,
    rgba(var(--day-rgb),0))}
[data-c="o-deposit"] .odline{margin-top:32px;font-size:17px;font-weight:500;letter-spacing:-.015em;
  color:rgba(var(--ink),.80);opacity:0}
[data-c="o-deposit"] .odline b{color:var(--text-hi);font-weight:650;font-variant-numeric:tabular-nums}
[data-c="o-deposit"] .odcap{margin-top:9px;font-size:12.5px;color:var(--text-lo);opacity:0}

[data-c="o-deposit"][data-state="d1"]{--odbr:.5}
[data-c="o-deposit"][data-state="w1"]{--odbr:.72}
[data-c="o-deposit"][data-state="m1"]{--odbr:1}

[data-c="o-deposit"].on .odstack{animation:k_odep_in .5s ease-out both}
[data-c="o-deposit"].on .odfloor{animation:k_odep_floor .5s cubic-bezier(.2,.85,.28,1) .06s both}
[data-c="o-deposit"].on .odbreath{animation:k_odep_breath 1.1s ease-out .3s both}
[data-c="o-deposit"].on .odplate{animation:k_odep_drop .46s cubic-bezier(.32,.86,.3,1) .18s both,
  k_odep_set .24s cubic-bezier(.4,0,.2,1) .64s forwards}
[data-c="o-deposit"].on .odpd{animation:k_odep_out .16s ease-in .6s both}
[data-c="o-deposit"].on .odbar--new{animation:k_odep_in .24s ease-out .7s both}
[data-c="o-deposit"].on .odflash{animation:k_odep_flash .55s ease-out .7s both}
[data-c="o-deposit"].on .odwrap{animation:k_odep_thud .24s ease-out .68s both}
[data-c="o-deposit"].on .odline{animation:k_odep_text .45s ease-out .84s both}
[data-c="o-deposit"].on .odcap{animation:k_odep_text .45s ease-out .98s both}
@keyframes k_odep_in{from{opacity:0}to{opacity:1}}
@keyframes k_odep_out{from{opacity:1}to{opacity:0}}
@keyframes k_odep_floor{from{opacity:0;transform:scaleX(.3)}to{opacity:1;transform:scaleX(1)}}
@keyframes k_odep_breath{from{opacity:0;transform:translate(-50%,-50%) scale(.78)}
  to{opacity:var(--odbr);transform:translate(-50%,-50%) scale(1)}}
@keyframes k_odep_drop{from{opacity:0;transform:translateY(-108px)}
  30%{opacity:1}to{opacity:1;transform:translateY(0)}}
@keyframes k_odep_set{from{opacity:1;transform:translateY(0) scaleY(1)}
  to{opacity:0;transform:translateY(0) scaleY(.065)}}
@keyframes k_odep_flash{0%{opacity:0;transform:scaleX(.3)}34%{opacity:1;transform:scaleX(1)}
  100%{opacity:0;transform:scaleX(1)}}
@keyframes k_odep_thud{0%{transform:translateY(0)}42%{transform:translateY(2px)}
  100%{transform:translateY(0)}}
@keyframes k_odep_text{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  [data-c="o-deposit"] *{animation:none!important;transition:none!important}
  [data-c="o-deposit"] .odstack,[data-c="o-deposit"] .odbar--new,[data-c="o-deposit"] .odline,
  [data-c="o-deposit"] .odcap{opacity:1!important;transform:none!important}
  [data-c="o-deposit"] .odfloor{opacity:1!important;transform:scaleX(1)!important}
  [data-c="o-deposit"] .odbreath{opacity:var(--odbr)!important}
  [data-c="o-deposit"] .odplate{opacity:0!important}}
</style>
