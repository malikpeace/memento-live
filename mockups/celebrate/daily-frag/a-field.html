<style>
[data-c="a-field"]{--day:#3fd94e}
[data-c="a-field"] .fld-stage{position:relative;display:flex;align-items:center;justify-content:center}
[data-c="a-field"] .fld-breath{position:absolute;width:140px;height:140px;margin:-70px 0 0 -70px;
  pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(63,217,78,.09),rgba(63,217,78,.032) 30%,transparent 62%)}
[data-c="a-field"] .fld-svg{position:relative;display:block;overflow:visible}
[data-c="a-field"] .fld-dot{fill:rgba(235,238,248,.34);opacity:0;transform-box:fill-box;transform-origin:center}
[data-c="a-field"] .fld-now{fill:var(--day);opacity:0;transform-box:fill-box;transform-origin:center}
[data-c="a-field"] .fld-halo{fill:none;stroke:var(--day);stroke-width:1;opacity:0;
  transform-box:fill-box;transform-origin:center}
[data-c="a-field"] .fld-ring{fill:none;stroke:var(--day);stroke-width:1.3;opacity:0;
  transform-box:fill-box;transform-origin:center}
[data-c="a-field"] .fld-num{margin-top:30px;opacity:0}
[data-c="a-field"] .fld-n{font-size:58px;font-weight:700;letter-spacing:-.05em;line-height:.9;
  color:rgba(235,238,248,.96);font-variant-numeric:tabular-nums}
[data-c="a-field"] .fld-unit{margin-top:9px;font-size:15px;font-weight:500;letter-spacing:-.005em;
  color:rgba(235,238,248,.58);opacity:0}
[data-c="a-field"] .fld-cap{margin:15px 0 0;font-size:14.5px;font-weight:500;letter-spacing:-.005em;
  color:rgba(235,238,248,.80);opacity:0}

[data-c="a-field"].on .fld-dot{animation:fldDot-a-field .34s cubic-bezier(.22,.9,.3,1) both;
  animation-delay:calc(var(--i) * 5ms + 50ms)}
[data-c="a-field"].on .fld-now{animation:fldNow-a-field .40s cubic-bezier(.2,.86,.28,1) both;
  animation-delay:calc(var(--td) * 1ms)}
[data-c="a-field"].on .fld-halo{animation:fldHalo-a-field .44s ease-out both;
  animation-delay:calc(var(--td) * 1ms + 90ms)}
[data-c="a-field"].on .fld-ring{animation:fldRing-a-field .70s cubic-bezier(.16,.7,.3,1) both;
  animation-delay:calc(var(--td) * 1ms + 40ms)}
[data-c="a-field"].on .fld-breath{animation:fldBreath-a-field .78s ease-out both;
  animation-delay:calc(var(--td) * 1ms)}
[data-c="a-field"].on .fld-num{animation:fldRise-a-field .42s cubic-bezier(.22,.9,.3,1) both;
  animation-delay:calc(var(--td) * 1ms + 205ms)}
[data-c="a-field"].on .fld-unit{animation:fldRise-a-field .42s cubic-bezier(.22,.9,.3,1) both;
  animation-delay:calc(var(--td) * 1ms + 250ms)}
[data-c="a-field"].on .fld-cap{animation:fldRise-a-field .42s cubic-bezier(.22,.9,.3,1) both;
  animation-delay:calc(var(--td) * 1ms + 300ms)}
@keyframes fldDot-a-field{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes fldNow-a-field{from{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.14)}
  to{opacity:1;transform:none}}
@keyframes fldHalo-a-field{from{opacity:0;transform:scale(.72)}to{opacity:.5;transform:none}}
@keyframes fldRing-a-field{from{opacity:.5;transform:scale(.55)}to{opacity:0;transform:scale(2.3)}}
@keyframes fldBreath-a-field{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes fldRise-a-field{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  [data-c="a-field"] *{animation:none!important;transition:none!important}
  [data-c="a-field"] .fld-dot,[data-c="a-field"] .fld-now,[data-c="a-field"] .fld-num,
  [data-c="a-field"] .fld-unit,[data-c="a-field"] .fld-cap,
  [data-c="a-field"] .fld-breath{opacity:1!important;transform:none!important}
  [data-c="a-field"] .fld-halo{opacity:.5!important;transform:none!important}
  [data-c="a-field"] .fld-ring{opacity:0!important}
}
</style>
