<style>
/* o-card THE CARD GAINS WEIGHT. The Memento itself is the reward surface.
   Light has gathered in the bottom of the object, and there is a little more
   of it every day, so the card they already own is visibly heavier than it
   was. A sharp waterline reads the level, the light below it is soft. The
   level rises on a flattening curve and never reaches the top, so the object
   can keep taking days forever without ever looking finished. The glow lives
   INSIDE a hard-clipped card (clip-path + contain:paint) and the bloom
   outside it is radial to transparent, so neither can draw a straight edge. */
[data-c="o-card"] .ocstage{position:relative;display:flex;align-items:center;justify-content:center}
[data-c="o-card"] .ocglow{position:absolute;left:50%;bottom:-24px;width:300px;height:196px;
  transform:translateX(-50%);pointer-events:none;opacity:0;
  background:radial-gradient(50% 50% at 50% 50%,rgba(var(--day-rgb),.15),rgba(var(--day-rgb),0) 68%)}
[data-c="o-card"] .occard{position:relative;width:176px;height:238px;border-radius:16px;
  overflow:hidden;clip-path:inset(0 round 16px);contain:paint;opacity:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(166deg,#101318 0%,#0a0c10 44%,#06070a 100%);
  box-shadow:var(--ocsh)}
/* the material's edge: a light rim, brightest where the light would fall */
[data-c="o-card"] .occard::before{content:"";position:absolute;inset:0;border-radius:16px;padding:1px;
  z-index:4;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.20),rgba(255,255,255,.035) 28%,
    rgba(255,255,255,.01) 56%,rgba(255,255,255,.05) 84%,rgba(255,255,255,.13));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude}
/* the light in the object, gathered from below and hard-clipped by the card */
[data-c="o-card"] .ocpool{position:absolute;left:0;right:0;bottom:0;height:var(--oclev);
  z-index:1;pointer-events:none;opacity:0;
  background:
    linear-gradient(to top,rgba(var(--day-rgb),.24),rgba(var(--day-rgb),.09) 44%,
      rgba(var(--day-rgb),.03) 84%,rgba(var(--day-rgb),0)),
    radial-gradient(76% 122% at 50% 118%,rgba(var(--day-rgb),.30),rgba(var(--day-rgb),0) 72%)}
/* the waterline: the one sharp thing, and the thing that has moved today */
[data-c="o-card"] .ocpool::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,rgba(var(--day-rgb),0),rgba(var(--day-rgb),.58) 24%,
    rgba(var(--day-rgb),.78) 50%,rgba(var(--day-rgb),.58) 76%,rgba(var(--day-rgb),0))}
[data-c="o-card"] .octint{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;
  background:radial-gradient(126% 100% at 50% 126%,rgba(var(--day-rgb),var(--octint)),
    rgba(var(--day-rgb),0) 68%)}
[data-c="o-card"] .ocm{position:relative;z-index:3;width:40px;height:40px;fill:rgba(255,255,255,.18)}
[data-c="o-card"] .ocline{margin-top:32px;font-size:17px;font-weight:500;letter-spacing:-.015em;
  color:rgba(var(--ink),.80);opacity:0}
[data-c="o-card"] .ocline b{color:var(--text-hi);font-weight:650;font-variant-numeric:tabular-nums}
[data-c="o-card"] .occap{margin-top:9px;font-size:12.5px;color:var(--text-lo);opacity:0}

/* the level, on a flattening curve: a day is never nothing, and the card is
   never full. 1 -> 34, 7 -> 86, 30 -> 138, and a year would still leave air. */
[data-c="o-card"][data-state="d1"]{--oclev:34px;--octint:.020;--ocbloom:.30;
  --ocsh:0 16px 38px rgba(0,0,0,.55)}
[data-c="o-card"][data-state="w1"]{--oclev:86px;--octint:.045;--ocbloom:.58;
  --ocsh:0 22px 52px rgba(0,0,0,.62)}
[data-c="o-card"][data-state="m1"]{--oclev:138px;--octint:.075;--ocbloom:.92;
  --ocsh:0 30px 68px rgba(0,0,0,.70)}

[data-c="o-card"].on .occard{animation:k_ocard_lift .55s cubic-bezier(.2,.85,.28,1) both}
[data-c="o-card"].on .ocpool{animation:k_ocard_rise .8s cubic-bezier(.16,.84,.3,1) .2s both}
[data-c="o-card"].on .octint{animation:k_ocard_tint .9s ease-out .28s both}
[data-c="o-card"].on .ocglow{animation:k_ocard_bloom 1.05s ease-out .22s both}
[data-c="o-card"].on .ocline{animation:k_ocard_text .45s ease-out .6s both}
[data-c="o-card"].on .occap{animation:k_ocard_text .45s ease-out .76s both}
@keyframes k_ocard_lift{from{opacity:0;transform:translateY(12px) scale(.965)}to{opacity:1;transform:none}}
@keyframes k_ocard_rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
@keyframes k_ocard_tint{from{opacity:0}to{opacity:1}}
@keyframes k_ocard_bloom{from{opacity:0;transform:translateX(-50%) scale(.74)}
  to{opacity:var(--ocbloom);transform:translateX(-50%) scale(1)}}
@keyframes k_ocard_text{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  [data-c="o-card"] *{animation:none!important;transition:none!important}
  [data-c="o-card"] .occard,[data-c="o-card"] .ocpool,[data-c="o-card"] .octint,
  [data-c="o-card"] .ocline,[data-c="o-card"] .occap{opacity:1!important;transform:none!important}
  [data-c="o-card"] .ocglow{opacity:var(--ocbloom)!important;transform:translateX(-50%)!important}}
</style>
