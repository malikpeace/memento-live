<style>
/* REBUILT. The original measured the CALENDAR month in the grid while the
   number measured total days. Those two decouple the moment a month
   ends: on the 1st a 400 day user would see one lit cell and a page of blanks,
   so the visual collapsed backwards. It also drew every un-shown day as a
   numbered empty box, which renders absence and makes a missed day look like
   a hole in a checklist.
   This version is a ROLLING WINDOW of the last thirty days. Days shown up are
   lit, the rest are quiet unnumbered ground rather than accusations, today
   lands last, and the total underneath is free to exceed the window forever. */
[data-c="t-month"] .tw-wrap{display:flex;flex-direction:column;align-items:center}
[data-c="t-month"] .tw-cap{font-size:12px;font-weight:500;color:rgba(235,238,248,.40);
  letter-spacing:-.005em;margin-bottom:16px}
[data-c="t-month"] .tw-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;width:262px}
[data-c="t-month"] .tw-c{width:100%;aspect-ratio:1;border-radius:5px;
  background:rgba(235,238,248,.055)}
[data-c="t-month"] .tw-c--f{background:rgba(63,217,78,.34)}
[data-c="t-month"] .tw-c--t{background:rgba(63,217,78,.30);
  box-shadow:0 0 0 1.5px rgba(63,217,78,.92);opacity:0}
[data-c="t-month"] .tw-n{font-size:64px;font-weight:700;letter-spacing:-.045em;line-height:1;
  color:rgba(235,238,248,.96);font-variant-numeric:tabular-nums;margin-top:30px}
[data-c="t-month"] .tw-u{font-size:14.5px;font-weight:500;color:rgba(235,238,248,.62);margin-top:11px}
[data-c="t-month"] .tw-u b{color:rgba(235,238,248,.96);font-weight:650}
[data-c="t-month"] .tw-date{font-size:12px;color:rgba(235,238,248,.40);margin-top:9px}
[data-c="t-month"] .tw-mk{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);
  width:15px;height:15px;fill:rgba(255,255,255,.11)}

[data-c="t-month"].on .tw-cap{animation:kTwFade_tmonth .45s ease-out both}
[data-c="t-month"].on .tw-c{animation:kTwCell_tmonth .4s ease-out both}
[data-c="t-month"].on .tw-c--t{animation:kTwLand_tmonth .52s cubic-bezier(.2,.9,.25,1) .34s both}
[data-c="t-month"].on .tw-n{animation:kTwRise_tmonth .5s cubic-bezier(.2,.9,.25,1) .42s both}
[data-c="t-month"].on .tw-u{animation:kTwFade_tmonth .45s ease-out .58s both}
[data-c="t-month"].on .tw-date{animation:kTwFade_tmonth .45s ease-out .68s both}
[data-c="t-month"].on .tw-mk{animation:kTwFade_tmonth .6s ease-out .84s both}
@keyframes kTwFade_tmonth{from{opacity:0}to{opacity:1}}
@keyframes kTwCell_tmonth{from{opacity:0}to{opacity:1}}
@keyframes kTwRise_tmonth{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes kTwLand_tmonth{0%{opacity:0;transform:scale(.45)}62%{opacity:1;transform:scale(1.16)}
  100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  [data-c="t-month"] *{animation:none!important}
  [data-c="t-month"] .tw-cap,[data-c="t-month"] .tw-c,[data-c="t-month"] .tw-n,
  [data-c="t-month"] .tw-u,[data-c="t-month"] .tw-date,[data-c="t-month"] .tw-mk,
  [data-c="t-month"] .tw-c--t{opacity:1!important;transform:none!important}
}
</style>
