<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050607">
  <link rel="icon" href="data:,">
  <title>Codex Memento Wrapped Mockups</title>
  <style>
    @font-face{font-family:Geist;src:url('../fonts/geist-400.otf') format('opentype');font-weight:400;font-display:swap}
    @font-face{font-family:Geist;src:url('../fonts/geist-500.otf') format('opentype');font-weight:500;font-display:swap}
    @font-face{font-family:Geist;src:url('../fonts/geist-700.otf') format('opentype');font-weight:700;font-display:swap}
    :root{color-scheme:dark;--bg:#050607;--surface:rgba(255,255,255,.05);--line:rgba(255,255,255,.11);--hi:#f3f5f7;--mid:rgba(243,245,247,.66);--lo:rgba(243,245,247,.38);--cyan:#3ad9f5;--green:#3fd94e}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--hi);font-family:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button{font:inherit}
    .shell{min-height:100svh;display:grid;grid-template-rows:auto 1fr}
    .top{position:relative;z-index:20;padding:calc(env(safe-area-inset-top) + 14px) 18px 13px;border-bottom:1px solid var(--line);background:rgba(5,6,7,.92);backdrop-filter:blur(30px) saturate(1.35)}
    .top__inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:18px}
    .brand{min-width:176px}
    .eyebrow{display:block;color:var(--lo);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:4px 0 0;font-size:17px;line-height:1.15;letter-spacing:-.025em}
    .switcher{display:flex;gap:5px;margin-left:auto;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
    .switcher button{border:0;border-radius:8px;background:transparent;color:var(--mid);padding:9px 12px;font-size:12px;font-weight:650;cursor:pointer;transition:background .18s ease,color .18s ease}
    .switcher button[aria-selected="true"]{background:var(--hi);color:#080a0b}
    .main{min-height:0;display:grid;grid-template-columns:minmax(220px,310px) minmax(390px,430px);justify-content:center;align-items:center;gap:48px;padding:34px 24px 54px}
    .copy{align-self:center}
    .count{color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
    .copy h2{margin:13px 0 12px;font-size:clamp(34px,4vw,54px);line-height:.98;letter-spacing:-.055em}
    .copy p{margin:0;color:var(--mid);font-size:15px;line-height:1.55;max-width:31ch}
    .instruction{display:flex;align-items:center;gap:9px;margin-top:24px;color:var(--lo);font-size:12px}
    .instruction__mark{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;color:var(--hi)}
    .phone{width:390px;height:min(844px,calc(100svh - 128px));min-height:620px;justify-self:center;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:#020303;box-shadow:0 34px 100px rgba(0,0,0,.58)}
    .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;opacity:0;pointer-events:none;transform:translateX(18px);transition:opacity .22s ease,transform .22s ease}
    .screen::-webkit-scrollbar{display:none}
    .screen.is-active{opacity:1;pointer-events:auto;transform:none}
    .screen img{width:100%;height:auto;display:block}
    .screen:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
    .mobile-meta{display:none}
    .dots{position:absolute;z-index:8;right:12px;top:50%;transform:translateY(-50%);display:grid;gap:8px;padding:9px 7px;border:1px solid var(--line);border-radius:999px;background:rgba(5,6,7,.74);backdrop-filter:blur(20px)}
    .dot{width:5px;height:5px;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.28);cursor:pointer;transition:height .18s ease,background .18s ease}
    .dot.is-on{height:16px;border-radius:4px;background:var(--hi)}
    .next{position:absolute;z-index:8;left:50%;bottom:12px;transform:translateX(-50%);border:1px solid var(--line);border-radius:10px;background:rgba(5,6,7,.82);backdrop-filter:blur(22px);color:var(--hi);font-size:12px;font-weight:650;padding:10px 13px;cursor:pointer;opacity:.18;transition:opacity .18s ease}
    .phone:hover .next,.next:focus-visible{opacity:1}
    @media(max-width:760px){
      .shell{height:100svh;overflow:hidden}.top{padding-left:12px;padding-right:12px}.top__inner{display:block}.brand{display:none}.switcher{margin:0;width:100%;overflow-x:auto;scrollbar-width:none}.switcher::-webkit-scrollbar{display:none}.switcher button{flex:1;white-space:nowrap;padding-left:9px;padding-right:9px}
      .main{display:block;min-height:0;height:100%;padding:0}.copy{display:none}.phone{width:100%;height:100%;min-height:0;border:0;border-radius:0;box-shadow:none}.screen{padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}.dots{right:9px}.next{bottom:calc(env(safe-area-inset-bottom) + 9px)}
      .mobile-meta{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;color:var(--mid);font-size:11px;background:rgba(5,6,7,.82);backdrop-filter:blur(22px);border-bottom:1px solid rgba(255,255,255,.07)}.mobile-meta b{color:var(--hi);font-weight:650}
    }
    @media(prefers-reduced-motion:reduce){.screen,.dot,.switcher button{transition:none}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="top__inner">
        <div class="brand"><span class="eyebrow">Codex mockups</span><h1>Memento Wrapped</h1></div>
        <nav class="switcher" aria-label="Choose a design style">
          <button type="button" data-style="0" aria-selected="true">Story</button>
          <button type="button" data-style="1" aria-selected="false">Map</button>
          <button type="button" data-style="2" aria-selected="false">Documentary</button>
        </nav>
      </div>
    </header>
    <main class="main">
      <section class="copy" aria-live="polite">
        <span class="count" id="count">Style 01 of 03</span>
        <h2 id="title">The year you kept going.</h2>
        <p id="description">A cinematic, swipeable recap. Big truths first, then the goals, actions, changes, and returns that prove them.</p>
        <div class="instruction"><span class="instruction__mark">↕</span><span>Scroll the phone. Switch styles above.</span></div>
      </section>
      <section class="phone" aria-label="Interactive Memento Wrapped mockup">
        <article class="screen is-active" tabindex="0" data-name="Story"><div class="mobile-meta"><b>Story</b><span>Scroll to explore</span></div><img src="assets/year-you-kept-going.png" alt="Cinematic Memento Wrapped summary showing changed goals, actions, and returns"></article>
        <article class="screen" tabindex="0" data-name="Map"><div class="mobile-meta"><b>Map</b><span>Scroll to explore</span></div><img src="assets/map-of-your-year.png" alt="A visual map of goals completed, changed, and still in progress"></article>
        <article class="screen" tabindex="0" data-name="Documentary"><div class="mobile-meta"><b>Documentary</b><span>Scroll to explore</span></div><img src="assets/documentary-of-you.png" alt="A documentary-style Memento summary showing a goal changing after a setback"></article>
        <div class="dots" aria-label="Design styles">
          <button class="dot is-on" type="button" data-style="0" aria-label="Story style"></button>
          <button class="dot" type="button" data-style="1" aria-label="Map style"></button>
          <button class="dot" type="button" data-style="2" aria-label="Documentary style"></button>
        </div>
        <button class="next" type="button">Next style</button>
      </section>
    </main>
  </div>
  <script>
    const styles=[
      {title:'The year you kept going.',description:'A cinematic, swipeable recap. Big truths first, then the goals, actions, changes, and returns that prove them.'},
      {title:'The shape of your year.',description:'An explorable map of what finished, what changed, and how every small action moved a real goal.'},
      {title:'The documentary of you.',description:'A personal film made from turning points. It explains not only what changed, but why the change mattered.'}
    ];
    const screens=[...document.querySelectorAll('.screen')];
    const controls=[...document.querySelectorAll('[data-style]')];
    let active=0;
    function selectStyle(index){
      active=(index+styles.length)%styles.length;
      screens.forEach((screen,i)=>{screen.classList.toggle('is-active',i===active);if(i===active)screen.scrollTop=0});
      controls.forEach(control=>{const on=Number(control.dataset.style)===active;control.classList.toggle('is-on',on);if(control.matches('.switcher button'))control.setAttribute('aria-selected',String(on))});
      document.getElementById('count').textContent=`Style 0${active+1} of 03`;
      document.getElementById('title').textContent=styles[active].title;
      document.getElementById('description').textContent=styles[active].description;
      history.replaceState(null,'',`#${screens[active].dataset.name.toLowerCase()}`);
    }
    controls.forEach(control=>control.addEventListener('click',()=>selectStyle(Number(control.dataset.style))));
    document.querySelector('.next').addEventListener('click',()=>selectStyle(active+1));
    document.addEventListener('keydown',event=>{if(event.key==='ArrowRight')selectStyle(active+1);if(event.key==='ArrowLeft')selectStyle(active-1)});
    let startX=0;
    document.querySelector('.phone').addEventListener('touchstart',event=>{startX=event.changedTouches[0].clientX},{passive:true});
    document.querySelector('.phone').addEventListener('touchend',event=>{const delta=event.changedTouches[0].clientX-startX;if(Math.abs(delta)>64)selectStyle(active+(delta<0?1:-1))},{passive:true});
    const hash=location.hash.slice(1);const hashIndex=screens.findIndex(screen=>screen.dataset.name.toLowerCase()===hash);if(hashIndex>=0)selectStyle(hashIndex);
  </script>
</body>
</html>
