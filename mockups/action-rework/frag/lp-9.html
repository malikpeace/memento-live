<!-- ARCHETYPES, the surviving set: lp-1 full-bleed statement type | lp-6 vertical descent rail | lp-7 poster ceiling number |
     lp-8 hundred-mark field | lp-9 ruled ledger book | lp-10 receipt tape | lp-12 full-height week columns |
     lp-15 bottom sheet first | lp-16 horizontal corridor band | lp-17 declarative sentence over account rows |
     lp-18 centered monolith numeral -->
<section class="cell" data-k="lp-9">
<!-- PURITY: Action, so the book holds today and their own raw entries only.
     No "to go" headline, no target, no seven day average: reading a measured
     number against the goal is Clarity's face, one swipe away. What is left is
     the ritual: write today's number, choose today's size, see what that size
     costs, write it in. -->
<style>
[data-k=lp-9] .ph{font-variant-numeric:tabular-nums}

/* the book */
[data-k=lp-9] .book{position:absolute;left:12px;right:12px;top:20px;bottom:12px;display:flex;flex-direction:column;
  padding:12px 12px 13px;border-radius:14px;background:rgba(22,25,31,.955);
  -webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.075),0 20px 40px rgba(0,0,0,.52)}

/* --- today: the one row still open, and it is an entry field ------------- */
[data-k=lp-9] .open{position:relative;padding:0 0 0 12px}
[data-k=lp-9] .open:before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:2px;background:#3fd94e}
[data-k=lp-9] .ask{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 7px}
[data-k=lp-9] .ask b{font-size:14px;font-weight:700;letter-spacing:-.012em;color:rgba(var(--ink),.97)}
[data-k=lp-9] .ask span{font-size:11.5px;color:rgba(var(--ink),.90)}

/* the slot they write into: same material every past weight is shown in */
[data-k=lp-9] .slot{position:relative;display:flex;align-items:center;height:58px;border-radius:12px;padding:0 14px;
  background:rgba(var(--ink),.075);box-shadow:inset 0 1px 0 rgba(var(--ink),.09);cursor:text}
[data-k=lp-9] .slot input{width:100%;height:100%;border:0;outline:0;background:transparent;padding:0;
  font:700 33px/1 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:rgba(var(--ink),.98);
  caret-color:#3fd94e}
[data-k=lp-9] .slot input::-webkit-outer-spin-button,[data-k=lp-9] .slot input::-webkit-inner-spin-button{display:none}
[data-k=lp-9] .slot .ghost{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;
  font-size:15px;font-weight:500;color:rgba(var(--ink),.92)}
[data-k=lp-9] .slot .ghost:after{content:"";display:inline-block;vertical-align:-3px;margin-left:8px;width:2px;height:17px;
  background:#3fd94e;animation:l9c 1.05s step-end infinite}
@keyframes l9c{0%,50%{opacity:1}50.01%,100%{opacity:0}}
[data-k=lp-9] .slot .unit{margin-left:auto;padding-left:10px;font-size:14px;font-weight:500;color:rgba(var(--ink),.90)}
[data-k=lp-9] .slot.filled .ghost{display:none}
[data-k=lp-9] .calc{margin:8px 0 0;font-size:12px;line-height:1.4;color:rgba(var(--ink),.90);min-height:17px}
[data-k=lp-9] .calc b{font-weight:700;color:rgba(var(--ink),.97)}

/* the action for the day, still inside the open row */
[data-k=lp-9] .act{margin:11px 0 0;font-size:15.5px;font-weight:700;line-height:1.3;letter-spacing:-.015em;
  color:rgba(var(--ink),.97);min-height:38px}
[data-k=lp-9] .seg{display:flex;gap:3px;margin:9px 0 0;padding:3px;border-radius:11px;background:rgba(var(--ink),.055)}
[data-k=lp-9] .seg button{flex:1;font:500 12.5px var(--font);color:rgba(var(--ink),.80);background:transparent;border:0;
  border-radius:8px;padding:8px 0;cursor:pointer}
[data-k=lp-9] .seg button.on{background:rgba(var(--ink),.13);color:rgba(var(--ink),.97);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.10)}
[data-k=lp-9] .seg.lock button{cursor:default}
[data-k=lp-9] .cons{margin:9px 0 0;font-size:12px;line-height:1.4;color:rgba(var(--ink),.90);min-height:34px}

[data-k=lp-9] .cta{width:100%;margin:10px 0 0;padding:14px;border:0;border-radius:13px;
  font:700 15px var(--font);letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  color:#0b0c10;background:rgba(235,238,248,.94);cursor:pointer;transition:background .18s ease-out,color .18s ease-out}
[data-k=lp-9] .cta:active{background:rgba(235,238,248,.82)}
[data-k=lp-9] .cta[disabled]{background:rgba(var(--ink),.09);color:rgba(var(--ink),.90);cursor:default;
  box-shadow:inset 0 1px 0 rgba(var(--ink),.07)}
[data-k=lp-9] .wrote{width:100%;margin:10px 0 0;padding:13px;border-radius:13px;display:none;
  align-items:center;justify-content:center;gap:8px;white-space:nowrap;font:500 12.5px var(--font);font-variant-numeric:tabular-nums;
  color:rgba(var(--ink),.95);background:rgba(63,217,78,.14);box-shadow:inset 0 1px 0 rgba(var(--ink),.09)}
[data-k=lp-9] .wrote svg{flex:0 0 auto;width:13px;height:13px;fill:none;stroke:#3fd94e;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
[data-k=lp-9] .done .cta{display:none}
[data-k=lp-9] .done .wrote{display:flex}
[data-k=lp-9] .done .slot{cursor:default}

/* --- the numbers they already wrote -------------------------------------- */
[data-k=lp-9] .pastwrap{margin:16px 0 0}
[data-k=lp-9] .rw{display:grid;grid-template-columns:1fr 68px 52px;align-items:center;gap:6px;padding-left:12px}
[data-k=lp-9] .rw>span:not(:first-child){text-align:right}
[data-k=lp-9] .colh{padding-bottom:7px;font-size:10.5px;color:rgba(var(--ink),.62)}
[data-k=lp-9] .colh .yw{color:rgba(var(--ink),.90)}
[data-k=lp-9] .past .rw+.rw{margin-top:4px}
[data-k=lp-9] .past .d{font-size:12.5px;color:rgba(var(--ink),.90)}
/* their own number, shown in the same slot material they typed it into */
[data-k=lp-9] .past .v{font-size:13px;font-weight:700;color:rgba(var(--ink),.96);
  border-radius:7px;padding:5px 8px;background:rgba(var(--ink),.075);box-shadow:inset 0 1px 0 rgba(var(--ink),.07)}
/* the change column is never coloured: a day up and a day down look the same
   in the book, whichever direction the goal happens to run */
[data-k=lp-9] .past .c{font-size:12.5px;color:rgba(var(--ink),.86)}
[data-k=lp-9] .foot{margin:auto 0 0;padding-top:11px;font-size:11.5px;line-height:1.45;color:rgba(var(--ink),.90)}
@media (prefers-reduced-motion:reduce){[data-k=lp-9] .slot .ghost:after{animation:none}}
</style>
<h3>The weight book</h3><p class="cap">A ruled ledger where today is the one row still open, and that row is the writing slot itself: the number is not shown to you, you put it in, and every past weight sits in the same slot you typed it into.</p>
<div class="bk" role="group" aria-label="which way this goal runs">
  <i>Body</i>
  <button type="button" class="on" data-b="down" aria-pressed="true">Weight down</button>
  <button type="button" data-b="up" aria-pressed="false">Weight up</button>
</div>
<div class="ph">
  <div class="grid"></div>

  <div class="book" id="l9book">
    <div class="open">
      <div class="ask"><b>Write today's weight</b><span id="l9when">Tue 11, still open</span></div>
      <label class="slot" id="l9slot" for="l9in">
        <input id="l9in" type="text" inputmode="decimal" autocomplete="off" aria-label="today's weight in pounds">
        <span class="ghost" id="l9ghost">Tap and type it</span>
        <span class="unit">lb</span>
      </label>
      <p class="calc" id="l9calc"></p>

      <p class="act" id="l9act"></p>
      <div class="seg" id="l9seg" role="group" aria-label="how big today"></div>
      <p class="cons" id="l9cons"></p>
      <button class="cta" id="l9cta" disabled>Write today's weight first</button>
      <div class="wrote" id="l9wr"><svg viewBox="0 0 24 24"><path d="M4 13l5 5L20 7"/></svg><span id="l9wrt">Written</span></div>
    </div>

    <div class="pastwrap">
      <div class="rw colh"><span>day</span><span class="yw">you wrote</span><span>change</span></div>
      <div class="past" id="l9past"></div>
    </div>

    <p class="foot" id="l9foot"></p>
  </div>
</div>
<script>(function(){var r=document.querySelector('[data-k="lp-9"]');if(!r)return;

/* Two directions, one book. The days before today are the only raw numbers in
   either context, and the only arithmetic on them is yesterday's change. No
   target lives here: what the numbers mean against the goal is Clarity's job. */
var CTX={
  down:{
    H:[244.6,244.2,244.5,243.9,244.1,243.6,243.4,243.0,243.2,242.5,242.8,242.2],
    acts:[
      {t:'Light',a:'20 minutes walking.',
       c:'Holds you about where you are. Some days that is the work.'},
      {t:'Steady',a:'40 minutes walking. No bread with dinner.',
       c:'At this size the plan reckons about half a pound a week off.'},
      {t:'Hard',a:'60 minutes walking. No bread, no late snack.',
       c:'At this size the plan reckons closer to a pound a week off, as long as you sleep tonight.'}
    ],pick:1
  },
  up:{
    H:[148.6,149.0,148.8,149.6,150.2,150.0,150.6,151.0,150.7,151.4,151.8,151.6],
    acts:[
      {t:'Light',a:'Three full meals. No skipped lunch.',
       c:'Holds you about where you are. Some days that is the work.'},
      {t:'Steady',a:'Three meals and a shake. Push session, 45 minutes.',
       c:'At this size the plan reckons about half a pound a week on.'},
      {t:'Hard',a:'Four meals, two shakes. Heavy session, 60 minutes.',
       c:'At this size the plan reckons closer to a pound a week on, as long as you sleep tonight.'}
    ],pick:1
  }
};
var DAYS=['Wed 5','Thu 6','Fri 7','Sat 8','Sun 9','Mon 10'],ROWS=DAYS.length;

var act=r.querySelector('#l9act'),cons=r.querySelector('#l9cons'),seg=r.querySelector('#l9seg'),
    book=r.querySelector('#l9book'),slot=r.querySelector('#l9slot'),inp=r.querySelector('#l9in'),
    calc=r.querySelector('#l9calc'),cta=r.querySelector('#l9cta'),foot=r.querySelector('#l9foot'),
    past=r.querySelector('#l9past'),when=r.querySelector('#l9when'),wrt=r.querySelector('#l9wrt'),
    C=CTX.down,pick=1,written=false;

function r1(n){return (Math.round(n*10)/10).toFixed(1)}
function sgn(n){return (n>0?'+':'')+r1(n)}
function val(){var v=parseFloat(inp.value);return (v>=80&&v<=700)?v:null}

function drawSeg(){
  seg.textContent='';
  C.acts.forEach(function(o,i){
    var b=document.createElement('button');
    b.type='button';b.textContent=o.t;
    if(i===pick){b.className='on';b.setAttribute('aria-pressed','true');}
    else b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){
      if(written)return;
      [].forEach.call(seg.children,function(z){z.classList.remove('on');z.setAttribute('aria-pressed','false')});
      b.classList.add('on');b.setAttribute('aria-pressed','true');
      pick=i;act.textContent=o.a;cons.textContent=o.c;
    });
    seg.appendChild(b);
  });
}

function drawPast(){
  past.textContent='';
  /* newest first, all of it their own typed numbers plus the day's change */
  var n=C.H.length,i;
  for(i=n-1;i>=n-ROWS;i--){
    var row=document.createElement('div');row.className='rw';
    row.innerHTML='<span class="d">'+DAYS[i-(n-ROWS)]+'</span><span class="v">'+r1(C.H[i])+
      '</span><span class="c">'+sgn(C.H[i]-C.H[i-1])+'</span>';
    past.appendChild(row);
  }
}

inp.addEventListener('input',function(){
  if(written)return;
  slot.classList.toggle('filled',inp.value.length>0);
  var v=val();
  if(v===null){calc.textContent='';cta.disabled=true;cta.textContent="Write today's weight first";return;}
  calc.innerHTML='That is <b>'+sgn(v-C.H[C.H.length-1])+'</b> on yesterday.';
  cta.disabled=false;cta.textContent='Write '+r1(v)+' into the book';});

cta.addEventListener('click',function(){
  var v=val();if(written||v===null)return;
  written=true;book.classList.add('done');seg.classList.add('lock');inp.readOnly=true;
  var d=v-C.H[C.H.length-1];
  when.textContent='Tue 11, written';
  wrt.textContent='Written in: '+r1(v)+' lb, '+sgn(d)+' on yesterday';
  calc.textContent='';
  cons.textContent='Tomorrow opens a new row at midnight.';
  var row=document.createElement('div');row.className='rw';
  row.innerHTML='<span class="d">Today</span><span class="v">'+r1(v)+'</span><span class="c">'+sgn(d)+'</span>';
  past.insertBefore(row,past.firstElementChild);
  past.removeChild(past.lastElementChild);
  foot.textContent='Today is written in. Every number in that column is one you typed.';});

/* --- swapping the direction: same book, the goal's own numbers and words -- */
function render(key){
  C=CTX[key];pick=C.pick;written=false;
  book.classList.remove('done');seg.classList.remove('lock');
  inp.readOnly=false;inp.value='';slot.classList.remove('filled');
  cta.disabled=true;cta.textContent="Write today's weight first";
  when.textContent='Tue 11, still open';wrt.textContent='Written';
  calc.textContent='';
  act.textContent=C.acts[pick].a;cons.textContent=C.acts[pick].c;
  foot.textContent='You typed every number in that column.';
  drawSeg();drawPast();
}
r.querySelectorAll('.bk button').forEach(function(b){
  b.addEventListener('click',function(){
    r.querySelectorAll('.bk button').forEach(function(z){
      z.classList.remove('on');z.setAttribute('aria-pressed','false')});
    b.classList.add('on');b.setAttribute('aria-pressed','true');
    render(b.dataset.b);
  });
});
render('down');
})();</script>
</section>
