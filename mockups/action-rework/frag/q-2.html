<!-- ARCHETYPE, the surviving refine step: q-2 one question full-bleed, answered in tappable slabs,
     and the fourth question IS the pulse (pu-1's poster field), so the flow ends on the number. -->
<section class="cell" data-k="q-2">
<style>
/* TYPE LADDER (the set's, not its own): question 19px/500 like pu-1 .q and the lp/mx verbs,
   answers 14.5px/500, quiet meta at var(--text-lo), one white CTA at 15.5px/700.
   SELECTION follows the app: quiet dark glass at rest, solid white with near-black text when
   chosen. No tick, no green, the fill IS the feedback. */
[data-k="q-2"] .q2-wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:26px 20px 20px}

/* ---- header: back chevron + progress + counter ---- */
[data-k="q-2"] .q2-top{display:flex;align-items:center;gap:10px;height:30px;flex:none}
[data-k="q-2"] .q2-back{flex:none;width:30px;height:30px;padding:0;border:0;border-radius:9px;display:flex;
  align-items:center;justify-content:center;background:rgba(22,25,31,.94);
  backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.08);cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background .16s ease,transform .16s ease}
[data-k="q-2"] .q2-back svg{display:block}
[data-k="q-2"] .q2-back:hover{background:rgba(30,34,42,.95)}
[data-k="q-2"] .q2-back:active{transform:scale(.94);background:rgba(34,38,47,.96)}
[data-k="q-2"] .q2-back.ghost{visibility:hidden;pointer-events:none}
[data-k="q-2"] .q2-bar{display:flex;gap:5px;align-items:center;flex:1;min-width:0}
/* each segment is a track that FILLS as its question gets answered, so progress is earned, not
   counted. Kept deliberately quiet: 2px, low ink, never a bright bar competing with the question. */
[data-k="q-2"] .q2-seg{position:relative;height:2px;flex:1;border-radius:999px;overflow:hidden;
  background:rgba(var(--ink),.10);transition:background .3s ease}
[data-k="q-2"] .q2-seg.now{background:rgba(var(--ink),.14)}
[data-k="q-2"] .q2-seg i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;
  background:rgba(var(--ink),.30);transition:width .42s cubic-bezier(.2,.7,.2,1),background .3s ease}
[data-k="q-2"] .q2-seg.now i{width:18%;background:rgba(var(--ink),.52)}
[data-k="q-2"] .q2-seg.now.ans i{width:100%}
[data-k="q-2"] .q2-seg.done i{width:100%}
[data-k="q-2"] .q2-n{flex:none;font-size:12px;font-weight:500;color:var(--text-lo);
  font-variant-numeric:tabular-nums;letter-spacing:.005em}

/* ---- the question: bottom aligned in its reserve, so a two line question drops its last line
       on the SAME baseline as a one line question and nothing below ever shifts ---- */
[data-k="q-2"] .q2-q{margin:24px 0 0;font-size:19px;line-height:1.22;font-weight:500;letter-spacing:-.02em;
  color:rgba(var(--ink),.96);min-height:47px;flex:none;display:flex;align-items:flex-end}
[data-k="q-2"] .q2-q.fade{animation:q2q .34s cubic-bezier(.2,.7,.2,1) both}
/* the unit slot exists on every step, empty on the three refine questions, so the four beats
   share one skeleton and the CTA sits on one baseline throughout */
[data-k="q-2"] .q2-unit{margin:7px 0 0;min-height:17px;flex:none;font-size:12px;line-height:1.4;
  color:rgba(var(--ink),.90)}
[data-k="q-2"] .q2-unit b{font-weight:400;white-space:nowrap}
[data-k="q-2"] .q2-unit em{font-style:normal;color:rgba(var(--ink),.38)}

/* ---- the answer body: slabs on 1 to 3, the poster field on 4, both optically centred ---- */
[data-k="q-2"] .q2-as{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
[data-k="q-2"] .q2-as.enter{animation:q2q .36s cubic-bezier(.2,.7,.2,1) .06s both}
[data-k="q-2"] .q2-a{position:relative;display:flex;align-items:center;width:100%;text-align:left;min-height:52px;
  padding:13px 15px;border:0;border-radius:13px;font-family:inherit;font-size:14.5px;font-weight:500;
  line-height:1.3;letter-spacing:-.012em;color:rgba(var(--ink),.96);cursor:pointer;
  -webkit-tap-highlight-color:transparent;background:rgba(22,25,31,.94);
  backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.08);
  transition:background .18s ease,color .18s ease,transform .13s cubic-bezier(.2,.7,.3,1),box-shadow .18s ease}
[data-k="q-2"] .q2-a:hover{background:rgba(30,34,42,.95)}
[data-k="q-2"] .q2-a:active{transform:scale(.985);background:rgba(34,38,47,.96)}
[data-k="q-2"] .q2-a:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:2px}
/* chosen = the same solid white the CTA is made of, near black text, no indicator */
[data-k="q-2"] .q2-a.on{background:rgba(235,238,248,.94);color:#0b0c10;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none}
[data-k="q-2"] .q2-a.on:hover{background:rgba(240,243,251,.96)}
[data-k="q-2"] .q2-a.on:active{background:rgba(214,218,231,.95)}

/* ---- the pulse field, pu-1's design ported: a pen on a line, not a box ---- */
[data-k="q-2"] .q2-pulse{display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums}
[data-k="q-2"] .q2-field{width:fit-content;min-width:150px;margin:0 auto}
[data-k="q-2"] .q2-set{display:flex;align-items:baseline;justify-content:center;gap:2px}
[data-k="q-2"] .q2-pre{font-size:20px;font-weight:500;line-height:1;letter-spacing:-.01em;
  color:rgba(var(--ink),.82)}
[data-k="q-2"] .q2-num{-webkit-appearance:none;appearance:none;border:0;outline:0;background:transparent;
  padding:0;margin:0;width:120px;text-align:center;font-family:inherit;font-weight:700;font-size:88px;
  line-height:1;letter-spacing:-.055em;color:rgba(var(--ink),1);font-variant-numeric:tabular-nums;
  caret-color:rgba(var(--ink),.92);transition:font-size .14s ease-out}
[data-k="q-2"] .q2-num::placeholder{color:rgba(var(--ink),.20)}
[data-k="q-2"] .q2-num::-webkit-outer-spin-button,[data-k="q-2"] .q2-num::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
[data-k="q-2"] .q2-rule{height:1px;width:100%;margin-top:10px;background:rgba(var(--ink),.28);
  transition:background .18s ease-out}
[data-k="q-2"] .q2-field:focus-within .q2-rule{background:rgba(var(--ink),.55)}
[data-k="q-2"] .q2-wrap.written .q2-rule{background:rgba(var(--ink),.10)}
[data-k="q-2"] .q2-mirror{position:absolute;left:-9999px;top:0;white-space:pre;visibility:hidden;
  font-family:inherit;font-weight:700;letter-spacing:-.055em;font-variant-numeric:tabular-nums}

/* ---- footer: free field + the CTA ---- */
[data-k="q-2"] .q2-foot{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:10px;flex:none}
[data-k="q-2"] .q2-own{display:flex;align-items:center;gap:9px;padding:0 15px;height:46px;border-radius:12px;
  background:rgba(18,20,25,.94);backdrop-filter:blur(22px) saturate(1.35);
  -webkit-backdrop-filter:blur(22px) saturate(1.35);box-shadow:inset 0 1px 0 rgba(var(--ink),.06);
  transition:box-shadow .18s ease,background .18s ease}
[data-k="q-2"] .q2-own.lit{background:rgba(24,27,33,.96);box-shadow:inset 0 1px 0 rgba(var(--ink),.10)}
/* the field answers back: the mark brightens on focus so it reads as a place to write, not a caption */
[data-k="q-2"] .q2-own:focus-within{background:rgba(26,30,37,.97);box-shadow:inset 0 1px 0 rgba(var(--ink),.13)}
/* hidden, not removed, on the pulse step: the CTA must not move between beats */
[data-k="q-2"] .q2-own.gone{visibility:hidden;pointer-events:none}
[data-k="q-2"] .q2-own i{flex:none;display:block;width:1.5px;height:15px;border-radius:1px;
  background:rgba(var(--ink),.55);transition:background .18s ease,height .18s ease}
[data-k="q-2"] .q2-own:focus-within i,[data-k="q-2"] .q2-own.lit i{background:rgba(var(--ink),.95);height:17px}
[data-k="q-2"] .q2-own input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;
  font-family:inherit;font-size:13.5px;letter-spacing:-.008em;color:rgba(var(--ink),.96)}
[data-k="q-2"] .q2-own input::placeholder{color:rgba(var(--ink),.66)}
[data-k="q-2"] .q2-cta{display:block;width:100%;height:52px;padding:15px 16px;border:0;border-radius:14px;
  font-family:inherit;font-size:15.5px;font-weight:700;letter-spacing:-.014em;
  background:rgba(235,238,248,.94);color:#0b0c10;cursor:pointer;-webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;
  transition:background .2s ease,color .2s ease,transform .14s ease,box-shadow .2s ease}
[data-k="q-2"] .q2-cta:hover{background:rgba(240,243,251,.97)}
[data-k="q-2"] .q2-cta:active{transform:scale(.985);background:rgba(235,238,248,.84)}
[data-k="q-2"] .q2-cta:focus-visible{outline:2px solid rgba(var(--ink),.65);outline-offset:2px}
[data-k="q-2"] .q2-cta[disabled]{background:rgba(22,25,31,.92);backdrop-filter:blur(22px) saturate(1.35);
  -webkit-backdrop-filter:blur(22px) saturate(1.35);box-shadow:inset 0 1px 0 rgba(var(--ink),.08);
  color:rgba(var(--ink),.62);cursor:default;transform:none}
[data-k="q-2"] .q2-cta.sec{background:rgba(22,25,31,.92);backdrop-filter:blur(22px) saturate(1.35);
  -webkit-backdrop-filter:blur(22px) saturate(1.35);box-shadow:inset 0 1px 0 rgba(var(--ink),.08);
  color:rgba(var(--ink),.94);font-weight:500;font-size:13px}
[data-k="q-2"] .q2-cta.sec:hover{background:rgba(30,34,42,.94)}

@keyframes q2q{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  [data-k="q-2"] .q2-q.fade,[data-k="q-2"] .q2-as.enter{animation:none}
  [data-k="q-2"] *{transition:none}
}
</style>
<h3>One at a time</h3><p class="cap">The refine step as a conversation: one question owns the screen, the answers are slabs you can hit without looking, and the fourth question is the pulse itself, so the flow ends on their own number and one button.</p>
<div class="bk"><i>All seven buckets</i></div>
<div class="ph">
  <div class="grid"></div>
  <div class="q2-wrap">
    <div class="q2-top">
      <button type="button" class="q2-back ghost" aria-label="Back">
        <svg width="7" height="12" viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M6 1 1.2 6 6 11" stroke="rgba(235,238,248,.82)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="q2-bar">
        <div class="q2-seg"><i></i></div><div class="q2-seg"><i></i></div><div class="q2-seg"><i></i></div><div class="q2-seg"><i></i></div>
      </div>
      <div class="q2-n">1 of 4</div>
    </div>
    <div class="q2-q"></div>
    <p class="q2-unit"></p>
    <div class="q2-as"></div>
    <div class="q2-foot">
      <div class="q2-own"><i></i><input placeholder="In your own words"></div>
      <button type="button" class="q2-cta" disabled>Continue</button>
    </div>
  </div>
</div>
<script>
(function(){
  var r=document.querySelector('[data-k="q-2"]'); if(!r) return;
  /* Three refine questions, then the pulse. PROVENANCE: every value here is typed by the
     person on this screen. Memento measures nothing and knows nothing else. */
  var D=[
    {q:"What have you already done toward this?",
     a:["Nothing yet, this is day one","I have had the idea a while","I've made a little progress","I do it, just not consistently"]},
    {q:"What do you think it actually takes?",
     a:["Talking to more people","A better offer","Showing up every day","I honestly do not know"]},
    {q:"How much time do you have on a normal day?",
     a:["Under 30 minutes","About an hour","Two to three hours","Most of the day"]}
  ];
  var PULSE={q:"Where are you today?",unit:["Dollars this month","0 is a real answer"],pre:"$"};
  var LAST=D.length; /* index 3 = the pulse step */
  var i=0, picked=[null,null,null], typed=['','',''], pulse='', written=false;
  var wrap=r.querySelector('.q2-wrap'), q=r.querySelector('.q2-q'), unit=r.querySelector('.q2-unit'),
      as=r.querySelector('.q2-as'), n=r.querySelector('.q2-n'), own=r.querySelector('.q2-own'),
      inp=own.querySelector('input'), back=r.querySelector('.q2-back'), cta=r.querySelector('.q2-cta'),
      segs=r.querySelectorAll('.q2-seg');
  var mirror=document.createElement('span'); mirror.className='q2-mirror'; r.appendChild(mirror);
  var num=null;

  /* drop the entry animation once it has played: a held fill would pin a layer and fight the press
     transforms. the timer is belt and braces, some engines never deliver animationend offscreen */
  var enterT=0;
  function clearEnter(){ clearTimeout(enterT); as.classList.remove('enter'); }
  as.addEventListener('animationend',function(e){ if(e.target===as) clearEnter(); });

  function answeredAt(k){
    if(k===LAST) return pulse.length>0;
    return picked[k]!==null || typed[k].trim().length>1;
  }
  function answered(){ return answeredAt(i); }
  function segSync(){
    for(var k=0;k<segs.length;k++){
      var s=segs[k];
      s.classList.toggle('done', k<i);
      s.classList.toggle('now', k===i);
      s.classList.toggle('ans', answeredAt(k));
    }
  }
  function syncCta(){
    if(i===LAST){
      cta.disabled = !written && pulse.length===0;
      cta.classList.toggle('sec', written);
      cta.textContent = written ? 'Start over' : 'Create action plan';
    }else{
      cta.classList.remove('sec');
      cta.disabled = !answered();
      cta.textContent = 'Continue';
    }
    segSync();
  }
  function marks(){
    var kids=as.children;
    for(var k=0;k<kids.length;k++) kids[k].classList.toggle('on',picked[i]===k);
  }
  /* money: whole dollars, grouped as they type */
  function clean(raw){ return raw.replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,''); }
  function shown(v){ return v ? v.replace(/\B(?=(\d{3})+(?!\d))/g,',') : ''; }
  function fit(){
    if(!num) return;
    var t=num.value||num.placeholder, L=t.length,
        px=L<=3?88:L===4?80:L===5?70:L===6?60:52;
    num.style.fontSize=px+'px';
    mirror.style.fontSize=px+'px'; mirror.textContent=t;
    num.style.width=Math.max(56,Math.ceil(mirror.getBoundingClientRect().width)+8)+'px';
  }
  function buildSlabs(){
    D[i].a.forEach(function(t,k){
      var b=document.createElement('button'); b.type='button'; b.className='q2-a';
      b.appendChild(document.createTextNode(t));
      b.addEventListener('click',function(){
        picked[i] = (picked[i]===k ? null : k);
        if(picked[i]!==null){ typed[i]=''; inp.value=''; own.classList.remove('lit'); }
        marks(); syncCta();
      });
      as.appendChild(b);
    });
    marks();
  }
  function buildPulse(){
    as.classList.add('q2-pulse');
    var f=document.createElement('div'); f.className='q2-field';
    var set=document.createElement('div'); set.className='q2-set';
    var pre=document.createElement('span'); pre.className='q2-pre'; pre.textContent=PULSE.pre;
    num=document.createElement('input');
    num.className='q2-num'; num.type='text'; num.setAttribute('inputmode','numeric');
    num.autocomplete='off'; num.placeholder='0'; num.setAttribute('aria-label',"today's number");
    num.value=shown(pulse); num.readOnly=written;
    num.addEventListener('input',function(){
      pulse=clean(num.value); num.value=shown(pulse); fit(); syncCta();
    });
    num.addEventListener('keydown',function(e){
      if(e.key==='Enter'){ e.preventDefault(); num.blur(); if(!cta.disabled) cta.click(); }
    });
    set.appendChild(pre); set.appendChild(num);
    var rule=document.createElement('div'); rule.className='q2-rule';
    f.appendChild(set); f.appendChild(rule); as.appendChild(f);
    fit();
  }
  function render(anim){
    var pulseStep = (i===LAST);
    q.classList.remove('fade');
    if(anim){ void q.offsetWidth; q.classList.add('fade'); }
    q.textContent = pulseStep ? PULSE.q : D[i].q;
    /* the separator binds to the phrase AFTER it, so a wrapped line never ends on a dangling dot */
    unit.innerHTML = pulseStep
      ? '<b>'+PULSE.unit[0]+'</b> <em>&middot;&nbsp;</em><b>'+PULSE.unit[1]+'</b>' : '';
    num=null;
    as.className='q2-as'; as.innerHTML='';
    if(anim){ void as.offsetWidth; as.classList.add('enter');
      clearTimeout(enterT); enterT=setTimeout(clearEnter,560); }
    if(pulseStep) buildPulse(); else buildSlabs();
    own.classList.toggle('gone',pulseStep);
    wrap.classList.toggle('written',pulseStep&&written);
    if(!pulseStep){ inp.value=typed[i]; own.classList.toggle('lit',typed[i].trim().length>0); }
    back.classList.toggle('ghost', i===0);
    n.textContent=(i+1)+' of 4';
    syncCta();
  }
  cta.addEventListener('click',function(){
    if(cta.disabled) return;
    if(i===LAST){
      if(written){ /* replay the flow from the top */
        i=0; picked=[null,null,null]; typed=['','','']; pulse=''; written=false;
        inp.value=''; own.classList.remove('lit'); render(true); return;
      }
      written=true; if(num) num.readOnly=true; wrap.classList.add('written'); syncCta(); return;
    }
    i++; render(true);
  });
  back.addEventListener('click',function(){
    if(i===0) return;
    if(i===LAST) written=false;
    i--; render(true);
  });
  inp.addEventListener('input',function(){
    typed[i]=inp.value;
    own.classList.toggle('lit',inp.value.trim().length>0);
    if(inp.value.trim().length>0 && picked[i]!==null){ picked[i]=null; marks(); }
    syncCta();
  });
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); if(!cta.disabled) cta.click(); } });
  render(false);
})();
</script>
</section>
