<!-- ARCHETYPES, the surviving set: ob-1 full-bleed monumental type | ob-6 sequenced ledger reveal | ob-7 why-first inverted hierarchy | ob-8 single compact plate | ob-9 live countdown row | ob-10 pressed engraved slots.
     All six are one concept, the wall of intent, delivered six ways. -->
<section class="cell" data-k="ob-10">
<style>
[data-k=ob-10] .o10-wrap{position:absolute;left:22px;right:22px;top:0;bottom:126px;
  display:flex;flex-direction:column;justify-content:center}
[data-k=ob-10] .o10-lead{font-size:13px;font-weight:400;line-height:1.45;color:rgba(var(--ink),.90);margin:0 0 18px;max-width:27ch}
[data-k=ob-10] .o10-slot{display:block;width:100%;text-align:left;border:0;font-family:inherit;cursor:pointer;
  border-radius:14px;padding:15px 16px;background:rgba(18,21,26,.94);
  -webkit-backdrop-filter:blur(24px) saturate(1.35);backdrop-filter:blur(24px) saturate(1.35);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.07),inset 0 -1px 0 rgba(0,0,0,.5),0 8px 18px rgba(0,0,0,.35);
  transition:box-shadow .22s ease-out,transform .22s ease-out,background .22s ease-out}
[data-k=ob-10] .o10-slot+.o10-slot{margin-top:10px}
[data-k=ob-10] .o10-slot:active{transform:scale(.992)}
[data-k=ob-10] .o10-slot.set{background:rgba(13,15,19,.96);transform:translateY(1px);
  box-shadow:inset 0 3px 7px rgba(0,0,0,.65),inset 0 -1px 0 rgba(var(--ink),.06),0 2px 6px rgba(0,0,0,.2)}
[data-k=ob-10] .o10-lab{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:rgba(var(--ink),.62);margin-bottom:6px}
[data-k=ob-10] .o10-lab svg{width:12px;height:12px;opacity:0;transform:scale(.7);color:rgba(var(--ink),.90);
  transition:opacity .22s ease-out,transform .22s cubic-bezier(.2,.7,.3,1)}
[data-k=ob-10] .o10-slot.set .o10-lab svg{opacity:1;transform:none}
[data-k=ob-10] .o10-lab u{text-decoration:none;margin-left:auto;font-size:11.5px;color:rgba(var(--ink),.62)}
[data-k=ob-10] .o10-slot.set .o10-lab u{opacity:0}
[data-k=ob-10] .o10-val{display:block;font-size:26px;font-weight:700;line-height:1.08;letter-spacing:-.035em;
  color:var(--text-hi);font-variant-numeric:tabular-nums}
[data-k=ob-10] .o10-val.sm{font-size:21px;font-weight:500;letter-spacing:-.024em}
[data-k=ob-10] .o10-val em{font-style:normal;font-size:14px;font-weight:500;color:rgba(var(--ink),.72);margin-left:7px}
[data-k=ob-10] .o10-foot{position:absolute;left:22px;right:22px;bottom:30px}
[data-k=ob-10] .o10-cta{display:block;width:100%;border:0;border-radius:14px;font-family:inherit;font-weight:500;
  font-size:15.5px;letter-spacing:-.01em;padding:15px 16px;text-align:center;cursor:default;
  background:rgba(22,25,31,.92);-webkit-backdrop-filter:blur(28px) saturate(1.4);backdrop-filter:blur(28px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.07);color:rgba(var(--ink),.90);
  transition:background .22s ease-out,color .22s ease-out,transform .16s ease-out}
[data-k=ob-10] .o10-cta.live{background:rgba(235,238,248,.94);color:#0b0c10;font-weight:700;cursor:pointer;box-shadow:none}
[data-k=ob-10] .o10-cta.live:active{transform:scale(.985);background:rgba(235,238,248,.84)}
[data-k=ob-10] .o10-foot p{margin:11px 0 0;text-align:center;font-size:12px;color:rgba(var(--ink),.62)}
@media (prefers-reduced-motion:reduce){
  [data-k=ob-10] .o10-slot,[data-k=ob-10] .o10-cta,[data-k=ob-10] .o10-lab svg{transition:none}}
</style>
<h3>Wall you press in</h3><p class="cap">The facts arrive raised off the grid and each one you touch sinks into it, so agreeing is a physical act and the button only comes alive once the whole wall is set.</p>
<div class="ph">
  <div class="grid"></div>
  <div class="o10-wrap">
    <p class="o10-lead">Clarity wrote these. Press each one to set it.</p>
    <button class="o10-slot" type="button">
      <span class="o10-lab">The goal
        <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 6.3l2.6 2.6L10 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <u>press</u></span>
      <span class="o10-val">$3,000 a month</span>
    </button>
    <button class="o10-slot" type="button">
      <span class="o10-lab">The reason
        <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 6.3l2.6 2.6L10 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <u>press</u></span>
      <span class="o10-val sm">Quit the warehouse</span>
    </button>
    <!-- deadline slot: rendered ONLY when intake returned a date -->
    <button class="o10-slot" type="button">
      <span class="o10-lab">By when
        <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 6.3l2.6 2.6L10 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <u>press</u></span>
      <span class="o10-val sm">March 1<em>201 days</em></span>
    </button>
  </div>
  <div class="o10-foot">
    <button class="o10-cta" type="button">Press all three to go on</button>
    <p class="o10-note">Wording stays as Clarity wrote it</p>
  </div>
</div>
<script>
(function(){
  var r=document.querySelector('[data-k=ob-10]'); if(!r||r.dataset.wired) return; r.dataset.wired=1;
  var slots=[].slice.call(r.querySelectorAll('.o10-slot')), cta=r.querySelector('.o10-cta'),
      note=r.querySelector('.o10-note');
  function sync(){
    var n=slots.filter(function(s){return s.classList.contains('set');}).length;
    if(n===slots.length){ cta.classList.add('live'); cta.textContent='Build my plan'; note.textContent='Wording stays as Clarity wrote it'; }
    else { cta.classList.remove('live');
      cta.textContent = n===0 ? 'Press all three to go on'
        : (slots.length-n)+' left to press';
      note.textContent='Tap a line to set it'; }
  }
  slots.forEach(function(s){ s.addEventListener('click',function(){ s.classList.toggle('set'); sync(); }); });
  sync();
})();
</script>
</section>
