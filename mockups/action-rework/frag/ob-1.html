<!-- ARCHETYPE: full-bleed monumental type you press in. The only onboarding screen (Malik, 2026-08-13: the five
     variants are dead, this is it). Polish pass only: type rhythm, dim-to-lit states, spacing, deadline row, CTA.
     Structure is frozen: three press zones, one rule, one source note, one CTA. -->
<section class="cell" data-k="ob-1">
<style>
[data-k=ob-1] .o1-halo{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(var(--ink),1) 1px,transparent 1px),
    linear-gradient(90deg,rgba(var(--ink),1) 1px,transparent 1px);
  background-size:26px 26px;opacity:.11;
  -webkit-mask-image:radial-gradient(circle at 50% 36%,#000 0,rgba(0,0,0,.55) 32%,transparent 64%);
  mask-image:radial-gradient(circle at 50% 36%,#000 0,rgba(0,0,0,.55) 32%,transparent 64%)}
[data-k=ob-1] .o1-type{position:absolute;left:22px;right:22px;top:22px;bottom:118px;
  display:flex;flex-direction:column;justify-content:center}
[data-k=ob-1] .o1-sm{font-size:17px;font-weight:400;line-height:1.22;color:rgba(var(--ink),.90);letter-spacing:-.012em}
[data-k=ob-1] .o1-num{font-size:62px;font-weight:700;line-height:.94;letter-spacing:-.05em;
  color:var(--text-hi);font-variant-numeric:tabular-nums;margin:7px 0 0 -4.5px}
[data-k=ob-1] .o1-mid{font-size:28px;font-weight:500;line-height:1.05;letter-spacing:-.03em;color:var(--text-hi);margin:5px 0 0 -1px}
[data-k=ob-1] .o1-so{margin-top:28px}
[data-k=ob-1] .o1-big{font-size:37px;font-weight:700;line-height:1.04;letter-spacing:-.04em;color:var(--text-hi);margin:5px 0 0 -1.5px}
[data-k=ob-1] .o1-rule{width:34px;height:1px;background:rgba(var(--ink),.30);margin:24px 0 0}
/* deadline row: rendered ONLY when intake returned a date. Nothing else moves when it is absent. */
[data-k=ob-1] .o1-when{display:flex;align-items:baseline;gap:8px;margin-top:18px}
[data-k=ob-1] .o1-when i{font-style:normal;font-size:12.5px;font-weight:500;color:rgba(var(--ink),.66);letter-spacing:.005em}
[data-k=ob-1] .o1-when b{font-size:18px;font-weight:500;letter-spacing:-.02em;color:var(--text-hi);font-variant-numeric:tabular-nums}
[data-k=ob-1] .o1-when s{text-decoration:none;font-size:12.5px;color:rgba(var(--ink),.66);font-variant-numeric:tabular-nums;margin-left:3px}
[data-k=ob-1] .o1-note{font-size:12px;font-weight:400;line-height:1.4;color:rgba(var(--ink),.66);margin-top:20px;
  display:flex;align-items:center;gap:6px}
[data-k=ob-1] .o1-note svg{flex:none;width:11px;height:13px;color:rgba(var(--ink),.55)}

/* ---- the press: each fact is a zone of the wall you can sink in. No box, no chrome, the type itself moves. ---- */
[data-k=ob-1] .o1-z{position:relative;display:flex;flex-direction:column;align-items:stretch;width:100%;
  margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  transition:transform .2s cubic-bezier(.2,.7,.3,1),filter .2s ease-out}
[data-k=ob-1] .o1-z:focus-visible{outline:2px solid rgba(var(--ink),.5);outline-offset:6px;border-radius:6px}
[data-k=ob-1] .o1-z:active{transform:translateY(1.5px) scale(.997)}
[data-k=ob-1] .o1-z>*{transition:text-shadow .24s ease-out,color .24s ease-out,opacity .26s ease-out}
/* unconfirmed facts rest DIM: the tap confirms by bringing the words to full
   light (deliberate interaction state, not resting body copy). */
[data-k=ob-1] .o1-z:not(.set)>*{opacity:.42}
/* the smallest line cannot afford the full dim, or the date stops being readable at all */
[data-k=ob-1] .o1-z.o1-zw:not(.set)>*{opacity:.52}
[data-k=ob-1] .o1-z.set>*{opacity:1}
@media (hover:hover){[data-k=ob-1] .o1-z:not(.set):hover>*{opacity:.62}}
[data-k=ob-1] .o1-z.o1-so{margin-top:28px}
/* the zone owns the gap, not its first line, so the mark can sit on that first line */
[data-k=ob-1] .o1-z.o1-zw{margin-top:18px}
[data-k=ob-1] .o1-z .o1-when{margin-top:0}
[data-k=ob-1] .o1-z.set{transform:translateY(1px)}
/* engraved: a dark bite above the strokes and a hair of light under them, so the words read cut into the wall */
[data-k=ob-1] .o1-z.set .o1-num,[data-k=ob-1] .o1-z.set .o1-mid,[data-k=ob-1] .o1-z.set .o1-big,
[data-k=ob-1] .o1-z.set .o1-when b{color:rgba(var(--ink),.98);
  text-shadow:0 -1px 0 rgba(0,0,0,.95),0 1px 0 rgba(var(--ink),.26)}
[data-k=ob-1] .o1-z.set .o1-sm,[data-k=ob-1] .o1-z.set .o1-when i,[data-k=ob-1] .o1-z.set .o1-when s{
  text-shadow:0 -1px 0 rgba(0,0,0,.9),0 1px 0 rgba(var(--ink),.16)}
/* lit keeps the hierarchy: the fact goes to full light, its small words stay one step behind */
[data-k=ob-1] .o1-z.set .o1-when i,[data-k=ob-1] .o1-z.set .o1-when s{color:rgba(var(--ink),.72)}

[data-k=ob-1] .o1-foot{position:absolute;left:22px;right:22px;bottom:30px}
[data-k=ob-1] .o1-cta{display:block;width:100%;border:0;border-radius:13px;background:rgba(19,22,28,.94);
  -webkit-backdrop-filter:blur(28px) saturate(1.4);backdrop-filter:blur(28px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.06);color:rgba(var(--ink),.90);
  font-family:inherit;font-weight:500;font-size:16px;letter-spacing:-.015em;padding:16px;
  font-variant-numeric:tabular-nums;
  text-align:center;cursor:default;transition:background .22s ease-out,color .22s ease-out,box-shadow .22s ease-out,transform .16s ease-out}
[data-k=ob-1] .o1-cta.live{background:rgba(235,238,248,.94);color:#0b0c10;font-weight:700;letter-spacing:-.02em;cursor:pointer;box-shadow:none}
[data-k=ob-1] .o1-cta.live:active{transform:scale(.985);background:rgba(235,238,248,.84)}
[data-k=ob-1] .o1-foot p{margin:12px 0 0;text-align:center;font-size:12px;letter-spacing:-.005em;color:rgba(var(--ink),.66)}
@media (prefers-reduced-motion:reduce){
  [data-k=ob-1] .o1-cta,[data-k=ob-1] .o1-z,[data-k=ob-1] .o1-z>*,
  [data-k=ob-1] .o1-m,[data-k=ob-1] .o1-m svg{transition:none}}
</style>
<h3>Wall of intent</h3><p class="cap">No card, no container: the star is the screen, each line rests dim until you press it into the wall, and the button only lives once all three are lit.</p>
<div class="bk"><i>All seven buckets</i></div>
<div class="ph">
  <div class="grid"></div>
  <div class="o1-halo"></div>
  <div class="o1-type">
    <button class="o1-z" type="button" aria-pressed="false">
      <span class="o1-sm">I will get to</span>
      <span class="o1-num">$3,000</span>
      <span class="o1-mid">a month</span>
    </button>
    <button class="o1-z o1-so" type="button" aria-pressed="false">
      <span class="o1-sm">so I can</span>
      <span class="o1-big">quit the<br>warehouse</span>
    </button>
    <span class="o1-rule"></span>
    <button class="o1-z o1-zw" type="button" aria-pressed="false">
      <span class="o1-when"><i>by</i><b>March 1</b><s>201 days</s></span>
    </button>
    <p class="o1-note">
      <svg viewBox="0 0 12 14" fill="none" aria-hidden="true"><path d="M2.7 6.2V4.3a3.3 3.3 0 0 1 6.6 0v1.9" stroke="currentColor" stroke-width="1.3"/><rect x="1.2" y="6.2" width="9.6" height="7" rx="1.8" fill="currentColor" opacity=".7"/></svg>
      Your words, from Clarity
    </p>
  </div>
  <div class="o1-foot">
    <button class="o1-cta" type="button">3 lines left</button>
    <p class="o1-sub">Tap each line to confirm</p>
  </div>
</div>
<script>
(function(){
  var r=document.querySelector('[data-k=ob-1]'); if(!r||r.dataset.wired) return; r.dataset.wired=1;
  var zs=[].slice.call(r.querySelectorAll('.o1-z')), cta=r.querySelector('.o1-cta'), sub=r.querySelector('.o1-sub');
  function sync(){
    var n=zs.filter(function(z){return z.classList.contains('set');}).length, left=zs.length-n;
    if(left===0){ cta.classList.add('live'); cta.textContent='This is it'; sub.textContent='Change it later in Clarity'; }
    else{ cta.classList.remove('live');
      /* the button carries state only, the one instruction sentence lives under it and never changes */
      cta.textContent = left+(left===1?' line left':' lines left');
      sub.textContent = 'Tap each line to confirm'; }
  }
  zs.forEach(function(z){ z.addEventListener('click',function(){
    var on=!z.classList.contains('set');
    z.classList.toggle('set',on); z.setAttribute('aria-pressed',on?'true':'false'); sync();
  }); });
  sync();
})();
</script>
</section>
