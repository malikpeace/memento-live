<!-- ARCHETYPE: full-bleed monumental type you press in. The only onboarding screen (Malik, 2026-08-13: the five
     variants are dead, this is it). BEAUTY PASS 2026-08-13: one type ladder (16 / 27 / 64, nothing else),
     one spacing rhythm (4 / 8 / 20 / 30), ONE focal point (the number), and the confirm is now a HOLD
     (gesture law: no bare tap confirms anywhere). Unconfirmed lines sit dim AND soft; pressing one pulls it
     into focus and lifts the wall's own light a step, so the screen finishes brighter than it started.
     Structure is frozen: three press zones, one rule, one source note, one CTA. -->
<section class="cell" data-k="ob-1">
<style>
/* TYPE LADDER: 16/400 connective, 27/500 words, 64/700 the number. Nothing else exists.
   SPACING: 4 / 8 / 20 / 30. Every gap on this screen is one of those four. */
/* the halo speaks the ROOM's language now: dots, not lines (Points is the
   chosen room, 2026-08-16). Same 26px lattice, same press-to-brighten, the
   pool shape carried by a second mask layered over the dot mask. */
[data-k=ob-1] .o1-halo{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(var(--ink),.9) 1.4px,transparent 1.4px);
  background-size:26px 26px;background-position:12px 12px;
  opacity:.10;transition:opacity .6s cubic-bezier(.2,.7,.3,1);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 1.4px,transparent 1.4px),
    radial-gradient(circle at 50% 40%,#000 0,rgba(0,0,0,.55) 34%,transparent 66%);
  mask-image:linear-gradient(90deg,transparent 0,#000 1.4px,transparent 1.4px),
    radial-gradient(circle at 50% 40%,#000 0,rgba(0,0,0,.55) 34%,transparent 66%);
  -webkit-mask-size:26px 26px,100% 100%;mask-size:26px 26px,100% 100%;
  -webkit-mask-position:12px 12px,0 0;mask-position:12px 12px,0 0;
  -webkit-mask-composite:source-in;mask-composite:intersect}
/* the wall lights as it is pressed: dot brightness only, never a hue (room law) */
[data-k=ob-1] .ph[data-lit="1"] .o1-halo{opacity:.13}
[data-k=ob-1] .ph[data-lit="2"] .o1-halo{opacity:.16}
[data-k=ob-1] .ph[data-lit="3"] .o1-halo{opacity:.20}

[data-k=ob-1] .o1-type{position:absolute;left:24px;right:24px;top:24px;bottom:126px;
  display:flex;flex-direction:column;justify-content:center}
[data-k=ob-1] .o1-sm{font-size:16px;font-weight:400;line-height:1.2;color:rgba(var(--ink),.90);letter-spacing:-.01em}
[data-k=ob-1] .o1-num{font-size:64px;font-weight:700;line-height:.92;letter-spacing:-.052em;
  color:var(--text-hi);font-variant-numeric:tabular-nums;margin:4px 0 0 -4px}
[data-k=ob-1] .o1-mid,[data-k=ob-1] .o1-big{font-size:27px;font-weight:500;line-height:1.1;
  letter-spacing:-.028em;color:var(--text-hi);margin:4px 0 0 -1px}
[data-k=ob-1] .o1-rule{width:32px;height:1px;background:rgba(var(--ink),.26);margin:30px 0 0}
/* deadline row: rendered ONLY when intake returned a date. Nothing else moves when it is absent. */
[data-k=ob-1] .o1-when{display:flex;align-items:baseline;gap:8px}
[data-k=ob-1] .o1-when i{font-style:normal;font-size:14px;font-weight:400;color:rgba(var(--ink),.90)}
[data-k=ob-1] .o1-when b{font-size:19px;font-weight:500;letter-spacing:-.022em;color:var(--text-hi);font-variant-numeric:tabular-nums}
[data-k=ob-1] .o1-when s{text-decoration:none;font-size:13px;color:rgba(var(--ink),.90);font-variant-numeric:tabular-nums}
[data-k=ob-1] .o1-note{font-size:12px;font-weight:400;line-height:1.3;color:rgba(var(--ink),.62);margin:30px 0 0;
  display:flex;align-items:center;gap:6px}
[data-k=ob-1] .o1-note svg{flex:none;width:10px;height:12px;color:rgba(var(--ink),.5)}

/* ---- the press: each fact is a zone of the wall you can sink in. No box, no chrome, the type itself moves. ---- */
[data-k=ob-1] .o1-z{position:relative;display:flex;flex-direction:column;align-items:stretch;width:100%;
  margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  transition:transform .22s cubic-bezier(.2,.7,.3,1)}
[data-k=ob-1] .o1-z:focus-visible{outline:2px solid rgba(var(--ink),.5);outline-offset:6px;border-radius:6px}
[data-k=ob-1] .o1-z:active{transform:translateY(1.5px)}
[data-k=ob-1] .o1-z>*{transition:text-shadow .3s ease-out,color .3s ease-out,opacity .32s ease-out,filter .32s ease-out}
/* Unconfirmed facts rest DIM: pressing pulls the words into the light. This is a
   deliberate interaction state, not resting body copy, so the dim/lit gap has to be
   unmistakable at a glance or the screen looks like everything is already confirmed.
   (A beauty pass raised the rest state to .58 to stop it "arriving blurry" and left a
   broken comment here, which killed this rule outright and lit every line. Malik caught
   it. The fix: the blur is what read as broken, so it is nearly gone; the OPACITY now
   carries the whole signal, .42 to 1.) */
[data-k=ob-1] .o1-z:not(.set)>*{opacity:.24;filter:blur(.2px)}
/* the smallest line cannot afford the full dim, or the date stops being readable at all */
[data-k=ob-1] .o1-z.o1-zw:not(.set)>*{opacity:.3;filter:blur(.15px)}
[data-k=ob-1] .o1-z.set>*{opacity:1;filter:none}
@media (hover:hover){[data-k=ob-1] .o1-z:not(.set):hover>*{opacity:.42;filter:none}}
[data-k=ob-1] .o1-z.o1-so{margin-top:30px}
/* the zone owns the gap, not its first line, so the mark can sit on that first line */
[data-k=ob-1] .o1-z.o1-zw{margin-top:20px}
[data-k=ob-1] .o1-z.set{transform:translateY(1px)}
/* engraved: a dark bite above the strokes and a hair of light under them, so the words read cut into the wall */
[data-k=ob-1] .o1-z.set .o1-num,[data-k=ob-1] .o1-z.set .o1-mid,[data-k=ob-1] .o1-z.set .o1-big,
[data-k=ob-1] .o1-z.set .o1-when b{color:rgba(var(--ink),.98);
  text-shadow:0 -1px 0 rgba(0,0,0,.95),0 1px 0 rgba(var(--ink),.19)}
[data-k=ob-1] .o1-z.set .o1-sm,[data-k=ob-1] .o1-z.set .o1-when i,[data-k=ob-1] .o1-z.set .o1-when s{
  text-shadow:0 -1px 0 rgba(0,0,0,.9),0 1px 0 rgba(var(--ink),.16)}

/* ---- the foot: one hold, one line under it, nothing else ---- */
[data-k=ob-1] .o1-foot{position:absolute;left:24px;right:24px;bottom:32px}
[data-k=ob-1] .o1-cta{position:relative;display:block;width:100%;height:54px;overflow:hidden;
  /* no backdrop-filter here on purpose: a blurred backdrop inside an overflow-clipped button
     drops the radius on WebKit, and at .94 over near-black it buys nothing */
  border:0;border-radius:14px;background:rgba(19,22,28,.94);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.06);
  font-family:inherit;padding:0;cursor:default;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  transition:background .24s ease-out,box-shadow .24s ease-out,transform .16s cubic-bezier(.2,.7,.3,1)}
[data-k=ob-1] .o1-cta.live{cursor:pointer}
[data-k=ob-1] .o1-cta:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:3px}
/* the hold: light fills the button left to right, the label inverts exactly where the light has reached.
   letting go before it lands takes the light straight back. */
[data-k=ob-1] .o1-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(235,238,248,.94);
  transition:width .2s cubic-bezier(.2,.7,.3,1)}
[data-k=ob-1] .o1-lab{position:relative;display:flex;align-items:center;justify-content:center;
  height:100%;font-size:16px;font-weight:500;letter-spacing:-.015em;color:rgba(var(--ink),.72);
  transition:color .24s ease-out}
[data-k=ob-1] .o1-cta.live .o1-lab{color:rgba(var(--ink),.96);font-weight:700;letter-spacing:-.02em}
[data-k=ob-1] .o1-inv{position:absolute;left:0;top:0;bottom:0;width:0;overflow:hidden;pointer-events:none;
  transition:width .2s cubic-bezier(.2,.7,.3,1)}
[data-k=ob-1] .o1-inv span{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;
  justify-content:center;color:#0b0c10;font-size:16px;font-weight:700;letter-spacing:-.02em}
[data-k=ob-1] .o1-cta.holding .o1-fill,[data-k=ob-1] .o1-cta.holding .o1-inv{width:100%;transition:width .78s linear}
[data-k=ob-1] .o1-cta.done{background:rgba(235,238,248,.94);box-shadow:none}
[data-k=ob-1] .o1-cta.done .o1-fill,[data-k=ob-1] .o1-cta.done .o1-inv{width:100%;transition:none}
[data-k=ob-1] .o1-cta.done{transform:scale(.995)}
[data-k=ob-1] .o1-foot p{margin:14px 0 0;text-align:center;font-size:12.5px;letter-spacing:-.005em;
  color:rgba(var(--ink),.62);transition:color .24s ease-out}
@media (prefers-reduced-motion:reduce){
  [data-k=ob-1] .o1-cta,[data-k=ob-1] .o1-z,[data-k=ob-1] .o1-z>*,
  [data-k=ob-1] .o1-halo,[data-k=ob-1] .o1-lab{transition:none}
  [data-k=ob-1] .o1-cta.holding .o1-fill,[data-k=ob-1] .o1-cta.holding .o1-inv{transition:width .78s linear}}
</style>
<h3>Wall of intent</h3><p class="cap">No card, no container: the star is the screen. Each line rests dim and out of focus until you press it into the wall, and the wall itself lights a step brighter each time. The confirm is a hold.</p>
<div class="bk"><i>All seven buckets</i></div>
<div class="ph" data-lit="0">
  <div class="grid"></div>
  <div class="o1-halo"></div>
  <div class="o1-type">
    <button class="o1-z" type="button" aria-pressed="false">
      <span class="o1-sm">I will get to</span>
      <span class="o1-num">$3,000</span>
      <span class="o1-mid">a month</span>
    </button>
    <button class="o1-z o1-so" type="button" aria-pressed="false">
      <span class="o1-sm">so I can</span>
      <span class="o1-big">quit the warehouse</span>
    </button>
    <span class="o1-rule"></span>
    <button class="o1-z o1-zw" type="button" aria-pressed="false">
      <span class="o1-when"><i>by</i><b>March 1</b><s>201 days</s></span>
    </button>
    <p class="o1-note">
      <svg viewBox="0 0 12 14" fill="none" aria-hidden="true"><path d="M2.7 6.2V4.3a3.3 3.3 0 0 1 6.6 0v1.9" stroke="currentColor" stroke-width="1.3"/><rect x="1.2" y="6.2" width="9.6" height="7" rx="1.8" fill="currentColor" opacity=".7"/></svg>
      From Clarity
    </p>
  </div>
  <div class="o1-foot">
    <button class="o1-cta" type="button" aria-disabled="true">
      <span class="o1-fill" aria-hidden="true"></span>
      <span class="o1-lab">Confirm</span>
      <span class="o1-inv" aria-hidden="true"><span>Confirm</span></span>
    </button>
    <p class="o1-sub">Tap each line to confirm</p>
  </div>
</div>
<script>
(function(){
  var r=document.querySelector('[data-k=ob-1]'); if(!r||r.dataset.wired) return; r.dataset.wired=1;
  var ph=r.querySelector('.ph'),
      zs=[].slice.call(r.querySelectorAll('.o1-z')), cta=r.querySelector('.o1-cta'),
      sub=r.querySelector('.o1-sub'), fill=r.querySelector('.o1-fill'),
      inv=r.querySelector('.o1-inv'), invLab=inv.firstElementChild;
  var holding=false, done=false;

  function measure(){ invLab.style.width=cta.offsetWidth+'px'; }
  function lit(){ return zs.filter(function(z){return z.classList.contains('set');}).length; }
  function sync(){
    var n=lit(), ready=(n===zs.length);
    ph.setAttribute('data-lit',String(n));
    cta.classList.toggle('live',ready&&!done);
    cta.setAttribute('aria-disabled',ready?'false':'true');
    if(done) sub.textContent='Change it later in Clarity';
    else sub.textContent = ready ? 'Press and hold' : 'Tap each line to confirm';
  }
  function stop(){ if(!holding) return; holding=false; cta.classList.remove('holding'); }
  function start(){
    if(done||!cta.classList.contains('live')||holding) return;
    measure(); holding=true;
    /* force the 0 width to commit before the long fill starts */
    void fill.offsetWidth; cta.classList.add('holding');
  }
  fill.addEventListener('transitionend',function(e){
    if(e.propertyName!=='width'||!holding) return;
    holding=false; done=true;
    cta.classList.remove('holding','live'); cta.classList.add('done');
    zs.forEach(function(z){ z.style.pointerEvents='none'; });
    sync();
  });

  cta.addEventListener('pointerdown',function(e){ e.preventDefault(); start(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    cta.addEventListener(ev,stop);
  });
  cta.addEventListener('keydown',function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); start(); } });
  cta.addEventListener('keyup',function(e){ if(e.key===' '||e.key==='Enter') stop(); });
  cta.addEventListener('blur',stop);

  zs.forEach(function(z){ z.addEventListener('click',function(){
    if(done) return;
    var on=!z.classList.contains('set');
    z.classList.toggle('set',on); z.setAttribute('aria-pressed',on?'true':'false');
    if(!on){ stop(); }
    sync();
  }); });
  measure(); sync();
})();
</script>
</section>
