<!-- ARCHETYPES, the surviving set: lp-1 full-bleed statement type | lp-6 number on an open writing line | lp-7 poster ceiling number |
     lp-8 hundred-mark field | lp-9 ruled ledger book | lp-10 receipt tape | lp-12 full-height week columns |
     lp-15 bottom sheet first | lp-16 horizontal corridor band | lp-17 declarative sentence over account rows |
     lp-18 centered monolith numeral -->
<section class="cell" data-k="lp-6">
<!-- THE STRIP (Malik, 2026-08-13, twice): "it is showing where someone is along
     their overall path. it is literally just supposed to be action." The descent
     rail was a journey rail: start, marks, a marker, a distance being closed. It
     is GONE, in the Body context and in the Money one. Nothing on this screen can
     tell you how close you are to anything.
     WHAT IS LEFT, composed rather than gutted: the number they last wrote, and
     today's move. The pen stays because writing today's number IS this goal's
     daily ritual, and the contract keeps it in Action with only what writing
     needs: the current value, tap to correct, the stale mark, undo.
     ARCHITECTURE: the number sits ON a full-width writing line, alone in open
     grid, with the move waiting on a glass slab underneath. Two objects, one
     horizon between them. lp-9 hides the number and gives you a ruled book to
     write it into; this one shows the number as the whole upper screen and the
     line under it is the field.
     PROVENANCE: the number is theirs, typed. A slow number (a card balance) is
     written at the weekly confirm, so in that context the line is not a field
     and the quiet slot says where the number came from.
     GLANCE: no title, no legend, no explainer. One number, one line, one move. -->
<style>
[data-k=lp-6] .ph{font-variant-numeric:tabular-nums}

/* --- THE PEN: the number they last wrote, sitting on the line -------------
   the line runs the full width of the plate, so the screen has a horizon and
   the empty grid above it reads as room rather than as something missing. */
/* the plate's left edge is the card's TEXT edge (14 + 15 padding), so the
   number, the line and today's move all hang off one column */
[data-k=lp-6] .pen{position:absolute;left:29px;right:29px;top:154px}
[data-k=lp-6] .row{display:flex;align-items:baseline;gap:9px;min-height:66px}
[data-k=lp-6] .num{display:block;margin:0;padding:0;border:0;background:none;
  font:700 62px/1.06 var(--font);letter-spacing:-.035em;font-variant-numeric:tabular-nums;
  color:rgba(var(--ink),.97);text-align:left;-webkit-tap-highlight-color:transparent;
  transition:opacity .16s ease-out}
[data-k=lp-6] .u{font:500 16px/1 var(--font);color:rgba(var(--ink),.90)}
[data-k=lp-6] .u:empty{display:none}
[data-k=lp-6] .num.swap{opacity:.3}
[data-k=lp-6] .ph.write .num{cursor:pointer}
[data-k=lp-6] .ph.write .pen:active .num{opacity:.55}
[data-k=lp-6] .num:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:5px;border-radius:8px}

/* the field is the line itself: typing happens where the number was, no box */
[data-k=lp-6] .ed{display:none;width:150px;height:66px;margin:0;padding:0;border:0;background:transparent;
  font:700 62px/66px var(--font);letter-spacing:-.035em;font-variant-numeric:tabular-nums;
  color:rgba(var(--ink),.98);caret-color:rgba(var(--ink),.9);-webkit-appearance:none;appearance:none}
[data-k=lp-6] .ed:focus{outline:none}
/* the browser's own selection blue is a hue this set does not use */
[data-k=lp-6] .ed::selection{background:rgba(var(--ink),.20);color:rgba(var(--ink),1)}
[data-k=lp-6] .ph.pen .num{display:none}
[data-k=lp-6] .ph.pen .ed{display:block}

/* the writing line. brighter where it is a field, quiet where the number is
   only being carried (a balance written at the weekly confirm) */
[data-k=lp-6] .ln{height:1px;margin:12px 0 0;background:rgba(var(--ink),.13);
  transition:background .2s ease-out}
[data-k=lp-6] .ph.write .ln{background:rgba(var(--ink),.30)}
[data-k=lp-6] .ph.pen .ln{background:rgba(var(--ink),.55)}

/* --- ONE quiet slot under the line: the stale mark, or the undo ---------- */
[data-k=lp-6] .qt{display:flex;align-items:center;min-height:30px;margin:10px 0 0}
[data-k=lp-6] .as{margin:0;font-size:11.5px;line-height:1.35;color:rgba(var(--ink),.90)}
[data-k=lp-6] .ph.fresh .as{display:none}
[data-k=lp-6] .undo{display:none;border:0;border-radius:8px;padding:8px 12px;
  background:rgba(var(--ink),.06);box-shadow:inset 0 1px 0 rgba(var(--ink),.07);
  font:500 11.5px/1 var(--font);color:rgba(var(--ink),.90);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .16s ease-out}
[data-k=lp-6] .undo:active{background:rgba(var(--ink),.11)}
[data-k=lp-6] .undo:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:2px}
[data-k=lp-6] .ph.wrote .undo{display:block}

/* --- THE MOVE: today's action on its own slab --------------------------- */
[data-k=lp-6] .card{position:absolute;left:14px;right:14px;top:378px;bottom:14px;border-radius:16px;padding:15px;
  background:rgba(22,25,31,.95);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.07),0 20px 44px rgba(0,0,0,.55);display:flex;flex-direction:column}
[data-k=lp-6] .act{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.26;margin:0;color:rgba(var(--ink),.97)}
[data-k=lp-6] .chips{display:flex;gap:6px;margin:13px 0 0}
[data-k=lp-6] .chips button{flex:1;font:500 12.5px/1 var(--font);font-variant-numeric:tabular-nums;
  color:rgba(var(--ink),.90);background:rgba(var(--ink),.06);border:0;border-radius:10px;padding:11px 0;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(var(--ink),.06);-webkit-tap-highlight-color:transparent;
  transition:background .16s ease-out,color .16s ease-out,transform .1s ease-out}
[data-k=lp-6] .chips button:active{transform:translateY(1px)}
[data-k=lp-6] .chips button.on{background:rgba(var(--ink),.17);color:rgba(var(--ink),.97);font-weight:700}
[data-k=lp-6] .chips button:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:2px}
[data-k=lp-6] .cons{font-size:11.5px;line-height:1.45;color:rgba(var(--ink),.90);margin:11px 0 0;
  font-variant-numeric:tabular-nums;min-height:33px}

/* --- the completion: the set's one slab, 58px, 1400ms, early release aborts */
[data-k=lp-6] .hold{position:relative;margin-top:auto;width:100%;height:58px;border:0;border-radius:14px;overflow:hidden;
  background:rgba(30,34,42,.94);box-shadow:inset 0 1px 0 rgba(var(--ink),.10);cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  transition:background .28s ease-out,box-shadow .28s ease-out}
[data-k=lp-6] .hold .fl{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(63,217,78,.20)}
[data-k=lp-6] .hold.go .fl{width:100%;transition:width 1.4s linear}
[data-k=lp-6] .hold .tx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;
  font:700 14px/1 var(--font);letter-spacing:-.005em;color:rgba(var(--ink),.97);white-space:nowrap}
[data-k=lp-6] .hold svg{display:none;width:14px;height:14px;fill:none;stroke:#3fd94e;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round}
[data-k=lp-6] .hold:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:2px}
[data-k=lp-6] .ph.logged .hold{background:rgba(63,217,78,.14);box-shadow:inset 0 1px 0 rgba(63,217,78,.28);cursor:default}
[data-k=lp-6] .ph.logged .hold svg{display:block}

/* --- undo the log: the same word AND the same object as the pen's undo ---- */
[data-k=lp-6] .amend{visibility:hidden;margin:9px auto 0;border:0;border-radius:8px;padding:8px 12px;
  background:rgba(var(--ink),.06);box-shadow:inset 0 1px 0 rgba(var(--ink),.07);
  font:500 11.5px/1 var(--font);color:rgba(var(--ink),.90);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .16s ease-out}
[data-k=lp-6] .amend:active{background:rgba(var(--ink),.11)}
[data-k=lp-6] .amend:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:2px}
[data-k=lp-6] .ph.logged .amend{visibility:visible}
[data-k=lp-6] .ph.logged .chips{pointer-events:none}
[data-k=lp-6] .ph.logged .chips button{background:rgba(var(--ink),.05);color:rgba(var(--ink),.90)}
[data-k=lp-6] .ph.logged .chips button.on{background:rgba(var(--ink),.15);color:rgba(var(--ink),.96)}
@media (prefers-reduced-motion:reduce){[data-k=lp-6] *{transition:none!important}}
</style>
<h3>The line</h3><p class="cap">The number they last wrote, sitting on the line they write it on, alone in open grid with today's move underneath. Nothing is measured against it: no target, no start, no distance. A slow number is written at the weekly confirm instead, so the same line carries it without asking.</p>
<div class="bk" role="group" aria-label="which goal this screen is carrying">
  <button type="button" class="on" data-b="body" aria-pressed="true">Body</button>
  <button type="button" data-b="money" aria-pressed="false">Money</button>
</div>
<div class="ph">
  <div class="grid"></div>

  <div class="pen">
    <div class="row">
      <button type="button" class="num"><span class="v"></span></button>
      <input class="ed" type="text" inputmode="decimal" aria-label="today's number">
      <span class="u"></span>
    </div>
    <div class="ln"></div>
    <div class="qt">
      <p class="as" data-as></p>
      <button type="button" class="undo">Undo</button>
    </div>
  </div>

  <div class="card">
    <p class="act"></p>
    <div class="chips" role="group" aria-label="how big today"></div>
    <p class="cons"></p>
    <button type="button" class="hold"><i class="fl"></i><span class="tx"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l5 5L20 7"/></svg><b>Hold to confirm</b></span></button>
    <button type="button" class="amend">Undo</button>
  </div>
</div>
<script>(function(){var r=document.querySelector('[data-k="lp-6"]');if(!r)return;
var ph=r.querySelector('.ph'),HOLD_MS=1400;

/* --- THE BUCKETS (ACTION-BUCKETS.md) -------------------------------------
   Body: weight down, daily-measured, so the number itself is the pen.
   Money: a card balance down to zero, a slow number, written at the weekly
   confirm, so this screen carries it but never asks for it.
   Nothing here is a target, a start or a distance: one number they typed, and
   the move for today. */
var B={
  body:{
    now:241.4,pen:true,unit:'lb',
    val:function(x){return x.toFixed(1)},
    as:'As of Tuesday, 2 days ago.',stale:true,
    ok:function(x){return x>=150&&x<=400},
    act:function(v){return 'Today, walk '+v+' minutes after dinner.'},
    chips:[{v:25,txt:'25 min'},{v:40,txt:'40 min'},{v:60,txt:'60 min'}],pick:40,
    cons:function(v){return 'About <b>'+v+'</b> min by the plan’s estimate.'},
    did:function(v){return v+' minutes logged'}
  },
  money:{
    now:4180,pen:false,unit:'',
    val:function(x){return '$'+Math.round(x).toLocaleString('en-US')},
    as:'Card balance, as of Sunday’s confirm.',stale:false,
    ok:function(){return false},
    act:function(v){return 'Today, message '+v+' potential clients.'},
    chips:[{v:2,txt:'2 clients'},{v:3,txt:'3 clients'},{v:5,txt:'5 clients'}],pick:3,
    est:{2:18,3:25,5:40},
    cons:function(v){return 'About <b>'+this.est[v]+'</b> min by the plan’s estimate.'},
    did:function(v){return v+' messages logged'}
  }
};

var C=B.body,pick=C.pick,cur=C.now,
    chipsEl=r.querySelector('.chips'),act=r.querySelector('.act'),cons=r.querySelector('.cons'),
    pen=r.querySelector('.pen'),numEl=r.querySelector('.num'),vEl=numEl.querySelector('.v'),
    uEl=r.querySelector('.u'),ed=r.querySelector('.ed'),undo=r.querySelector('.undo'),
    asEl=r.querySelector('[data-as]'),hold=r.querySelector('.hold'),
    lab=hold.querySelector('b'),am=r.querySelector('.amend'),last=null;

function readNumber(x){
  cur=x;
  vEl.textContent=C.val(x);
  uEl.textContent=C.unit;
  numEl.setAttribute('aria-label',C.pen?C.val(x)+' '+(C.unit||'')+', tap to write today’s number':C.val(x)+' '+(C.unit||''));
}

function paintCard(){act.textContent=C.act(pick);cons.innerHTML=C.cons(pick);}

/* the slab's label is also its name: the text sits in an absolutely placed
   layer, which not every reader picks up */
function setLab(t){lab.textContent=t;hold.setAttribute('aria-label',t);}

function drawChips(){
  chipsEl.innerHTML='';
  C.chips.forEach(function(o){
    var b=document.createElement('button');b.type='button';b.dataset.v=o.v;b.textContent=o.txt;
    if(o.v===pick){b.classList.add('on');b.setAttribute('aria-pressed','true');}
    b.addEventListener('click',function(){
      chipsEl.querySelectorAll('button').forEach(function(x){x.classList.remove('on');x.removeAttribute('aria-pressed')});
      b.classList.add('on');b.setAttribute('aria-pressed','true');
      pick=+b.dataset.v;paintCard();
    });
    chipsEl.appendChild(b);
  });
}

/* --- the pen IS the number: tap the line, type over it ------------------- */
var editing=false;
function open(){
  if(!C.pen||editing)return;
  /* the field takes the number's own width so the unit never jumps sideways */
  ed.style.width=Math.max(120,Math.ceil(numEl.getBoundingClientRect().width))+'px';
  editing=true;ph.classList.add('pen');
  ed.value=C.val(cur);ed.focus();
  try{ed.setSelectionRange(0,ed.value.length)}catch(e){}
}
function close(){editing=false;ph.classList.remove('pen')}
function swapTo(x){
  numEl.classList.add('swap');
  setTimeout(function(){readNumber(x);numEl.classList.remove('swap')},110);
}
function commit(){
  if(!editing)return;
  var x=parseFloat(ed.value);
  close();
  if(!C.ok(x)||x===cur)return;
  last={prev:cur,wasStale:ph.classList.contains('stale')};
  swapTo(x);
  ph.classList.add('fresh','wrote');ph.classList.remove('stale');
}
pen.addEventListener('click',function(e){if(e.target===undo||undo.contains(e.target))return;open();});
ed.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();commit();}
  else if(e.key==='Escape'){e.preventDefault();close();}
});
ed.addEventListener('blur',commit);

/* --- undo: today's entry comes back off the line ------------------------- */
undo.addEventListener('click',function(){
  if(!last)return;
  swapTo(last.prev);
  ph.classList.remove('fresh','wrote');
  if(last.wasStale)ph.classList.add('stale');
  last=null;
});

/* --- logging the move: hold to confirm, early release aborts ------------- */
var t=null;
/* logging banks the planned size and says so, and that is the whole of it:
   no running week figure exists on this screen to move (Malik, the settled
   flow: a sum of the sessions behind them is Consistency's, not Action's) */
function finish(){t=null;hold.classList.remove('go');ph.classList.add('logged');
  setLab(C.did(pick));}
function start(){if(ph.classList.contains('logged')||t)return;hold.classList.add('go');t=setTimeout(finish,HOLD_MS);}
function stop(){if(!t)return;clearTimeout(t);t=null;hold.classList.remove('go');}
hold.addEventListener('pointerdown',start);
['pointerup','pointerleave','pointercancel'].forEach(function(e){hold.addEventListener(e,stop)});
hold.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();start();}});
hold.addEventListener('keyup',stop);
am.addEventListener('click',function(){
  ph.classList.remove('logged');setLab('Hold to confirm');paintCard();
});

/* --- swapping the bucket: the same line, that goal's own number ---------- */
function render(key){
  C=B[key];pick=C.pick;cur=C.now;last=null;
  close();
  ph.classList.remove('logged','fresh','wrote','go');
  hold.classList.remove('go');
  ph.classList.toggle('stale',!!C.stale);
  ph.classList.toggle('write',!!C.pen);
  setLab('Hold to confirm');
  numEl.disabled=!C.pen;
  asEl.textContent=C.as;
  readNumber(C.now);drawChips();paintCard();
}
r.querySelectorAll('.bk button').forEach(function(b){
  b.addEventListener('click',function(){
    r.querySelectorAll('.bk button').forEach(function(x){x.classList.remove('on');x.setAttribute('aria-pressed','false')});
    b.classList.add('on');b.setAttribute('aria-pressed','true');
    render(b.dataset.b);
  });
});
render('body');
})();</script>
</section>
