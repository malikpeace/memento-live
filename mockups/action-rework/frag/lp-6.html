<!-- ARCHETYPES, the surviving set: lp-1 full-bleed statement type | lp-6 vertical descent rail | lp-7 poster ceiling number |
     lp-8 hundred-mark field | lp-9 ruled ledger book | lp-10 receipt tape | lp-12 full-height week columns |
     lp-15 bottom sheet first | lp-16 horizontal corridor band | lp-17 declarative sentence over account rows |
     lp-18 centered monolith numeral -->
<section class="cell" data-k="lp-6">
<!-- PURITY: this is Action, so the screen carries today and the pen, nothing
     goal-relative. No start, no goal tick, no delta, no distance to a floor.
     The rail is an abstract vertical guide holding the person's own recent
     typed numbers, and the marker sits on the latest one.
     PROVENANCE: every mark is a number they typed. The pen is the number
     itself: tap it to write today's, undo puts it back. A slow number (a card
     balance) is written at the weekly confirm instead, so that bucket's number
     is not tappable and its quiet line says where it came from.
     GLANCE: no title, no legend, no explainer. Rail, one number, the action. -->
<style>
[data-k=lp-6] .ph{font-variant-numeric:tabular-nums}

/* --- the rail: an abstract guide, and their own recent marks on it -------
   it stands at the right margin so the number can hold the one type column
   the card below it also uses. The line fades out at both ends: a hairline
   that stops dead reads like a cut, not like a guide. */
[data-k=lp-6] .rail{position:absolute;left:273px;top:62px;width:1px;height:286px;
  background:linear-gradient(180deg,transparent,rgba(var(--ink),.20) 13%,rgba(var(--ink),.20) 87%,transparent)}
[data-k=lp-6] .rail .old{position:absolute;left:-8px;width:9px;height:1px;background:rgba(var(--ink),.40);transform:translateY(-50%)}
[data-k=lp-6] .rail .mk{position:absolute;left:-13px;top:0;width:14px;height:3px;border-radius:2px;
  background:#e9eefb;transform:translateY(-50%);box-shadow:0 0 18px rgba(233,238,251,.42);
  transition:top .5s cubic-bezier(.2,.7,.2,1)}

/* --- the pen: the current number, and nothing measured against it -------- */
[data-k=lp-6] .stack{position:absolute;left:27px;right:48px;top:169px;transition:top .5s cubic-bezier(.2,.7,.2,1)}
[data-k=lp-6] .num{display:block;padding:0 8px 0 0;border:0;background:none;position:relative;
  font:700 44px/1 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  color:rgba(var(--ink),.97);text-align:left;-webkit-tap-highlight-color:transparent;
  transition:opacity .16s ease-out}
[data-k=lp-6] .num em{font-style:normal;font-size:16px;font-weight:500;color:rgba(var(--ink),.90);margin-left:6px}
[data-k=lp-6] .num[data-pen]{cursor:pointer}
[data-k=lp-6] .num[data-pen]::after{content:'';position:absolute;left:0;right:8px;bottom:-6px;height:1px;
  background:rgba(var(--ink),.20)}
[data-k=lp-6] .num[data-pen]:active{opacity:.55}
[data-k=lp-6] .num:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:4px;border-radius:6px}
[data-k=lp-6] .num.swap{opacity:.35}
[data-k=lp-6] .ed{display:none;width:158px;height:54px;margin:-5px 0 0 -9px;border:0;border-radius:10px;padding:0 9px;
  background:rgba(var(--ink),.07);box-shadow:inset 0 1px 0 rgba(var(--ink),.06);
  font:700 40px/1 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  color:rgba(var(--ink),.97);-webkit-appearance:none;appearance:none}
[data-k=lp-6] .ed:focus{outline:2px solid rgba(var(--ink),.45);outline-offset:1px}
[data-k=lp-6] .ph.pen .num{display:none}
[data-k=lp-6] .ph.pen .ed{display:block}

/* --- the quiet layer: ONE line, no footnote glyph, no second sentence ---- */
[data-k=lp-6] .stack .as{margin:13px 0 0;font-size:11.5px;line-height:1.35;color:rgba(var(--ink),.90)}
[data-k=lp-6] .ph.fresh .as{display:none}

/* --- undo the entry they just wrote ------------------------------------- */
[data-k=lp-6] .undo{visibility:hidden;margin:10px 0 0;border:0;border-radius:8px;padding:7px 12px;
  background:rgba(var(--ink),.06);box-shadow:inset 0 1px 0 rgba(var(--ink),.07);
  font:500 11.5px/1 var(--font);color:rgba(var(--ink),.90);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .16s ease-out}
[data-k=lp-6] .undo:active{background:rgba(var(--ink),.11)}
[data-k=lp-6] .undo:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:2px}
[data-k=lp-6] .ph.wrote .undo{visibility:visible}

/* --- the action, logged on its own ------------------------------------- */
[data-k=lp-6] .card{position:absolute;left:14px;right:14px;top:396px;bottom:14px;border-radius:16px;padding:13px;
  background:rgba(22,25,31,.95);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.07),0 20px 44px rgba(0,0,0,.55);display:flex;flex-direction:column}
[data-k=lp-6] .card .act{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.24;margin:0;color:rgba(var(--ink),.97)}
[data-k=lp-6] .chips{display:flex;gap:6px;margin:12px 0 0}
[data-k=lp-6] .chips button{flex:1;font:500 12.5px/1 var(--font);font-variant-numeric:tabular-nums;
  color:rgba(var(--ink),.90);background:rgba(var(--ink),.06);border:0;border-radius:10px;padding:11px 0;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(var(--ink),.06);-webkit-tap-highlight-color:transparent;
  transition:background .16s ease-out,color .16s ease-out,transform .1s ease-out}
[data-k=lp-6] .chips button:active{transform:translateY(1px)}
[data-k=lp-6] .chips button.on{background:rgba(var(--ink),.17);color:rgba(var(--ink),.97);font-weight:700}
[data-k=lp-6] .chips button:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:2px}
[data-k=lp-6] .cons{font-size:11.5px;line-height:1.4;color:rgba(var(--ink),.90);margin:10px 0 0;font-variant-numeric:tabular-nums}

/* --- hold to log, with a quiet amend ----------------------------------- */
[data-k=lp-6] .hold{position:relative;margin-top:auto;width:100%;height:48px;border:0;border-radius:14px;overflow:hidden;
  cursor:pointer;background:rgba(235,238,248,.94);font:700 15px/1 var(--font);color:#0b0c10;
  -webkit-tap-highlight-color:transparent;transition:background .28s ease-out,color .28s ease-out,transform .1s ease-out}
[data-k=lp-6] .hold:active{transform:translateY(1px)}
[data-k=lp-6] .hold b{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(63,217,78,.55)}
[data-k=lp-6] .hold.go b{width:100%;transition:width 1.05s linear}
[data-k=lp-6] .hold span{position:relative}
[data-k=lp-6] .hold:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:2px}
[data-k=lp-6] .hold.done{background:rgba(63,217,78,.16);color:rgba(var(--ink),.96);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.08);cursor:default}
[data-k=lp-6] .hold.done b{width:0}
[data-k=lp-6] .amend{visibility:hidden;margin:8px auto 0;border:0;background:none;padding:1px 6px;border-radius:6px;
  font:500 11.5px/1 var(--font);color:rgba(var(--ink),.90);cursor:pointer;-webkit-tap-highlight-color:transparent}
[data-k=lp-6] .amend:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:2px}
[data-k=lp-6] .ph.logged .amend{visibility:visible}
[data-k=lp-6] .ph.logged .chips{pointer-events:none}
[data-k=lp-6] .ph.logged .chips button{background:rgba(var(--ink),.05);color:rgba(var(--ink),.90)}
[data-k=lp-6] .ph.logged .chips button.on{background:rgba(var(--ink),.15);color:rgba(var(--ink),.96)}
@media (prefers-reduced-motion:reduce){[data-k=lp-6] *{transition:none!important}}
</style>
<h3>Descent</h3><p class="cap">A down goal carried by the pen: the current number is the screen, tap it to write today's, undo puts it back, and the rail beside it is only the marks they themselves typed. A slow number is written at the weekly confirm instead, so the same rail carries it without asking.</p>
<div class="bk" role="group" aria-label="which goal this screen is carrying">
  <button type="button" class="on" data-b="body" aria-pressed="true">Body</button>
  <button type="button" data-b="money" aria-pressed="false">Money</button>
</div>
<div class="ph">
  <div class="grid"></div>

  <div class="rail"></div>

  <div class="stack">
    <button type="button" class="num" data-num><span class="v"></span><em></em></button>
    <input class="ed" type="text" inputmode="decimal" aria-label="today's number">
    <p class="as" data-as></p>
    <button type="button" class="undo">Undo</button>
  </div>

  <div class="card">
    <p class="act"></p>
    <div class="chips" role="group" aria-label="how big today"></div>
    <p class="cons"></p>
    <button type="button" class="hold"><b></b><span>Hold to log the walk</span></button>
    <button type="button" class="amend">It went differently</button>
  </div>
</div>
<script>(function(){var r=document.querySelector('[data-k="lp-6"]');if(!r)return;
var ph=r.querySelector('.ph'),TOP=62,H=286;

/* --- THE BUCKETS (ACTION-BUCKETS.md) -------------------------------------
   Body: weight down, daily-measured, so the number itself is the pen.
   Money: a card balance down to zero, a slow number, written at the weekly
   confirm, so this screen carries it but never asks for it.
   recent = the numbers THEY typed, oldest first, the last one is where they
   are now. Nothing else feeds the rail: no start, no goal, no target. */
var B={
  body:{
    recent:[246.2,245.0,244.1,243.3,241.4],now:241.4,pen:true,unit:'lb',
    val:function(x){return x.toFixed(1)},
    as:'As of Tuesday, 2 days ago.',stale:true,
    ok:function(x){return x>=150&&x<=400},
    act:function(v){return 'Today, walk '+v+' minutes after dinner.'},
    chips:[{v:25,txt:'25 min'},{v:40,txt:'40 min'},{v:60,txt:'60 min'}],pick:40,
    week:205,
    cons:function(v,w){return 'About <b>'+v+'</b> min, the plan’s estimate. Makes <b>'+(w+v)+'</b> min walked this week.'},
    idle:'Hold to log the walk',
    did:function(v){return v+' minutes logged'}
  },
  money:{
    recent:[5240,4980,4620,4180],now:4180,pen:false,unit:'',
    val:function(x){return '$'+Math.round(x).toLocaleString('en-US')},
    as:'As of Sunday’s confirm.',stale:false,
    ok:function(){return false},
    act:function(v){return 'Today, message '+v+' potential clients.'},
    chips:[{v:2,txt:'2 clients'},{v:3,txt:'3 clients'},{v:5,txt:'5 clients'}],pick:3,
    week:11,est:{2:18,3:25,5:40},
    cons:function(v,w){return 'About <b>'+this.est[v]+'</b> min, the plan’s estimate. Makes <b>'+(w+v)+'</b> messages sent this week.'},
    idle:'Hold to log the messages',
    did:function(v){return v+' messages logged'}
  }
};

var C=B.body,pick=C.pick,WEEK=C.week,cur=C.now,
    railEl=r.querySelector('.rail'),chipsEl=r.querySelector('.chips'),
    act=r.querySelector('.act'),cons=r.querySelector('.cons'),
    stack=r.querySelector('.stack'),numEl=r.querySelector('.num'),
    vEl=numEl.querySelector('.v'),uEl=numEl.querySelector('em'),
    ed=r.querySelector('.ed'),undo=r.querySelector('.undo'),
    asEl=r.querySelector('[data-as]'),
    hold=r.querySelector('.hold'),txt=hold.querySelector('span'),am=r.querySelector('.amend'),
    mk,W={hi:1,lo:0},last=null;

/* the window the rail spans is drawn from their own recent numbers, framed so
   the latest one sits a little below centre with room to keep moving */
function makeWin(){
  var v=C.recent,hi=Math.max.apply(null,v),lo=Math.min.apply(null,v),sp=(hi-lo)||1,
      top=hi+sp*.2,rng=Math.max((top-C.now)/.58,sp*1.4);
  W={hi:top,lo:top-rng};
}
function pos(v){return Math.max(0,Math.min(H,(W.hi-v)/(W.hi-W.lo)*H))}

/* the rail is drawn from the entries, so nothing survives a bucket swap that
   the new bucket's own numbers did not put there */
function drawRail(){
  var h='';
  C.recent.slice(0,-1).forEach(function(v){h+='<i class="old" style="top:'+pos(v)+'px"></i>'});
  h+='<i class="mk"></i>';
  railEl.innerHTML=h;
  mk=railEl.querySelector('.mk');
  mk.style.top=pos(cur)+'px';
}

/* the number rides the marker: writing a lower one drops it down the rail */
function place(){stack.style.top=Math.max(70,Math.min(258,Math.round(TOP+pos(cur)-22)))+'px'}

function readNumber(x){
  cur=x;
  vEl.textContent=C.val(x);
  uEl.textContent=C.unit;
  numEl.setAttribute('aria-label',C.pen?C.val(x)+' '+(C.unit||'')+', tap to write today’s number':C.val(x));
  place();
}

function paintCard(){
  act.textContent=C.act(pick);
  cons.innerHTML=C.cons(pick,WEEK);
}

function drawChips(){
  chipsEl.innerHTML='';
  C.chips.forEach(function(o){
    var b=document.createElement('button');b.type='button';b.dataset.v=o.v;b.textContent=o.txt;
    if(o.v===pick){b.classList.add('on');b.setAttribute('aria-pressed','true');}
    b.addEventListener('click',function(){
      chipsEl.querySelectorAll('button').forEach(function(x){x.classList.remove('on');x.removeAttribute('aria-pressed')});
      b.classList.add('on');b.setAttribute('aria-pressed','true');
      pick=+b.dataset.v;paintCard();
    });
    chipsEl.appendChild(b);
  });
}

/* --- the pen IS the number: tap it, type over it ------------------------- */
var editing=false;
function open(){
  if(!C.pen||editing)return;
  editing=true;ph.classList.add('pen');
  ed.value=C.val(cur);ed.focus();
  try{ed.setSelectionRange(0,ed.value.length)}catch(e){}
}
function close(){editing=false;ph.classList.remove('pen')}
function swapTo(x){
  numEl.classList.add('swap');
  setTimeout(function(){readNumber(x);numEl.classList.remove('swap')},110);
}
function commit(){
  if(!editing)return;
  var x=parseFloat(ed.value);
  close();
  if(!C.ok(x)||x===cur)return;
  /* the number they had before stays as a faint mark: the rail is a stack of entries */
  var prev=cur,wasStale=ph.classList.contains('stale'),
      old=document.createElement('i');
  old.className='old';old.style.top=pos(prev)+'px';
  railEl.appendChild(old);
  mk.style.top=pos(x)+'px';
  swapTo(x);
  ph.classList.add('fresh','wrote');ph.classList.remove('stale');
  last={prev:prev,mark:old,wasStale:wasStale};
}
numEl.addEventListener('click',open);
ed.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();commit();}
  else if(e.key==='Escape'){e.preventDefault();close();}
});
ed.addEventListener('blur',commit);

/* --- undo: the entry comes off, and so does its mark --------------------- */
undo.addEventListener('click',function(){
  if(!last)return;
  if(last.mark.parentNode)last.mark.parentNode.removeChild(last.mark);
  mk.style.top=pos(last.prev)+'px';
  swapTo(last.prev);
  ph.classList.remove('fresh','wrote');
  if(last.wasStale)ph.classList.add('stale');
  last=null;
});

/* --- logging the action, accept or amend --------------------------------- */
var t=null;
/* logging banks the planned size: the week total the line already promised
   becomes the week total on record, so the number does not jump on the tap */
function finish(){hold.classList.remove('go');hold.classList.add('done');ph.classList.add('logged');
  txt.textContent=C.did(pick);WEEK+=pick;}
function start(){if(hold.classList.contains('done'))return;hold.classList.add('go');t=setTimeout(finish,1050);}
function stop(){if(hold.classList.contains('done'))return;clearTimeout(t);hold.classList.remove('go');}
hold.addEventListener('pointerdown',start);
['pointerup','pointerleave','pointercancel'].forEach(function(e){hold.addEventListener(e,stop)});
hold.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();start();}});
hold.addEventListener('keyup',stop);
am.addEventListener('click',function(){
  WEEK-=pick;hold.classList.remove('done');ph.classList.remove('logged');
  txt.textContent=C.idle;paintCard();
});

/* --- swapping the bucket: same rail, the goal's own numbers and pen ------- */
function render(key){
  C=B[key];pick=C.pick;WEEK=C.week;cur=C.now;last=null;
  close();
  ph.classList.remove('logged','fresh','wrote');
  ph.classList.toggle('stale',!!C.stale);
  hold.classList.remove('go','done');txt.textContent=C.idle;
  if(C.pen)numEl.setAttribute('data-pen','');else numEl.removeAttribute('data-pen');
  numEl.disabled=!C.pen;
  asEl.textContent=C.as;
  makeWin();drawRail();readNumber(C.now);drawChips();paintCard();
}
r.querySelectorAll('.bk button').forEach(function(b){
  b.addEventListener('click',function(){
    r.querySelectorAll('.bk button').forEach(function(x){x.classList.remove('on');x.setAttribute('aria-pressed','false')});
    b.classList.add('on');b.setAttribute('aria-pressed','true');
    render(b.dataset.b);
  });
});
render('body');
})();</script>
</section>
