<!-- ARCHETYPES (difference law): ob-1 full-bleed monumental type | ob-2 centered engraved object | ob-3 progressive bottom-up writing | ob-4 horizon perspective terrain | ob-5 split seam contrast -->
<section class="cell" data-k="ob-4">
<style>
[data-k=ob-4] .ph{background:#050608}
/* the grid becomes ground: one plane laid flat, masked out where the road converges */
[data-k=ob-4] .grid{
  top:auto;bottom:0;left:-1350px;width:3000px;height:2400px;
  background-size:30px 30px;opacity:.15;
  transform-origin:50% 100%;
  transform:perspective(900px) rotateX(66deg);
  -webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.9) 22%,rgba(0,0,0,0) 94%);
  mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.9) 22%,rgba(0,0,0,0) 94%);
}
[data-k=ob-4] .void{position:absolute;left:0;right:0;top:0;height:400px;
  background:linear-gradient(180deg,#050608 0%,#050608 55%,rgba(5,6,8,0) 100%)}
[data-k=ob-4] .said{position:absolute;left:34px;right:34px;top:52px;margin:0;text-align:center;
  font-size:14px;line-height:1.55;color:rgba(var(--ink),.92);font-variant-numeric:tabular-nums}
[data-k=ob-4] .glow{position:absolute;left:50%;top:365px;width:200px;height:200px;transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(var(--ink),.30) 0%,rgba(var(--ink),.10) 22%,rgba(var(--ink),.025) 40%,rgba(var(--ink),0) 58%)}
[data-k=ob-4] .pt{position:absolute;left:50%;top:365px;width:7px;height:7px;transform:translate(-50%,-50%);
  border-radius:50%;background:#eef2f8;box-shadow:0 0 12px 3px rgba(var(--ink),.55)}
[data-k=ob-4] .dest{position:absolute;left:0;right:0;top:306px;text-align:center}
[data-k=ob-4] .dest b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1;
  color:rgba(var(--ink),.96);font-variant-numeric:tabular-nums}
[data-k=ob-4] .dest span{display:block;margin-top:3px;font-size:13px;color:rgba(var(--ink),.84)}
[data-k=ob-4] .road{position:absolute;inset:0;pointer-events:none}
[data-k=ob-4] .here{position:absolute;left:0;right:0;bottom:46px;text-align:center}
[data-k=ob-4] .ring{width:11px;height:11px;margin:0 auto 10px;border-radius:50%;
  background:rgba(var(--ink),.16);box-shadow:inset 0 0 0 1.5px rgba(var(--ink),.9)}
[data-k=ob-4] .here p{margin:0;font-size:12.5px;color:rgba(var(--ink),.80)}
</style>
<h3>The horizon</h3><p class="cap">The star as a place on the ground: the goal sits small and far at the horizon, the grid tips into terrain, and the only other thing on screen is where they stand today.</p>
<div class="ph">
  <div class="grid"></div>
  <div class="void"></div>
  <svg class="road" viewBox="0 0 300 650" preserveAspectRatio="none">
    <defs><linearGradient id="ob4r" x1="0" y1="650" x2="0" y2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(235,238,248,.22)"/>
      <stop offset=".55" stop-color="rgba(235,238,248,.10)"/>
      <stop offset="1" stop-color="rgba(235,238,248,0)"/>
    </linearGradient></defs>
    <path d="M96 650 L146 372" stroke="url(#ob4r)" stroke-width="1"/>
    <path d="M204 650 L154 372" stroke="url(#ob4r)" stroke-width="1"/>
  </svg>
  <p class="said">I will get to $3,000 a month<br>so I can quit the warehouse.</p>
  <div class="glow"></div>
  <div class="dest"><b>$3,000</b><span>a month</span></div>
  <div class="pt"></div>
  <div class="here"><div class="ring"></div><p>you are standing here</p></div>
</div>
</section>
