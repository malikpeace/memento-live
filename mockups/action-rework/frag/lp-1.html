<!-- ARCHETYPES, the surviving set: lp-1 full-bleed statement type | lp-6 vertical descent rail | lp-7 poster ceiling number |
     lp-8 hundred-mark field | lp-9 ruled ledger book | lp-10 receipt tape | lp-12 full-height week columns |
     lp-15 bottom sheet first | lp-16 horizontal corridor band | lp-17 declarative sentence over account rows |
     lp-18 centered monolith numeral -->
<section class="cell" data-k="lp-1">
<!-- ARCHETYPE (difference law): lp-1 full-bleed statement type.
     GLANCE LAW PASS (2026-08-13): one instruction sentence, no explainer line,
     the consequence moved into the top line itself (47 -> 52 with a ghost
     segment on the bar), the three chip boxes deleted, the NUMBER IN THE
     SENTENCE is now the control, and completion is hold, never a slider.
     MALIK ROUND 4 (2026-08-13):
     1. THE BAR carries the person's Memento accent (--acc on the phone, one
        value per bucket standing in for their chosen skin). The solid segment
        is the only coloured thing on the surface: ghost, hold and confirm are
        all neutral ink now. ONE accent per surface.
     2. THE NUMBER SCALES with the size chosen, 1..20 mapped to 40..64px on a
        log curve so 3 / 5 / 8 read visibly but not massively apart. The line
        box is reserved at the max so the sentence never shifts.
     3. THE HOLD is 1400ms and says "Hold to confirm" for every goal. Early
        release still aborts.
     BEAUTY PASS (2026-08-13), craft only, no mechanic touched:
     a. COMPOSITION. Everything used to fall to the floor: a thin header, a
        250px void, then statement and button clamped together. The void is
        now SPLIT by two weighted spacers (1.35 above, 1 below), so the
        statement sits just above centre with real air under it and the button
        stops crowding the last line.
     b. THE POPOVER. Two shadow layers, a tight contact shadow plus a wide
        ambient one, so it lifts off the statement instead of sitting on a
        single soft blur.
     MALIK ROUND 5 (2026-08-15):
     1. THE BAR IS ONE LINE. The round 4 gutter (a 3px transparent border on
        the ghost) made it read as two separate lines. Gutter gone, interior
        caps gone, and the ghost is now the SAME accent at .30 drawn under the
        solid from zero to where today lands, so the line simply grows into
        what today adds. Only the outer ends are round, from the track itself.
     2. A DEEP WORK DOOR. One quiet 30px glass pill under the sentence opens
        the timer already carrying this move and the plan's own estimate for
        the size chosen. It is a door, not a decision: the 58px hold stays the
        only focal point.
     3. NO JOURNEY. The days-left chip is gone. An Action screen says what to
        do today; where you stand and how the pattern is going belong to
        Clarity and Consistency. -->

<h3>Statement</h3><p class="cap">The instruction is the entire screen: the number inside the sentence is the control, and the line at the top already shows where today lands.</p>

<div class="ph">
  <div class="grid"></div>
  <div class="s">
    <div class="goal">
      <b class="from" data-from>47</b><em aria-hidden="true">&#8594;</em><b data-to>52</b>
      <u data-tail>of 100 clients</u>

        <path d="M6.5 4.4V7.2H8.9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>

<script>(function(){
  var r=document.currentScript.closest('.cell');if(!r)return;
  var ph=r.querySelector('.ph'),
      s=r.querySelector('.s'),n=r.querySelector('.n'),pop=r.querySelector('.pop'),
      opts=r.querySelector('.opts'),pmore=r.querySelector('.pmore'),
      solid=r.querySelector('.bar i'),ghost=r.querySelector('.bar u'),
      goal=r.querySelector('.goal'),from=r.querySelector('[data-from]'),to=r.querySelector('[data-to]'),
      tail=r.querySelector('[data-tail]'),
      srcEl=r.querySelector('[data-src]'),
      obj=r.querySelector('.obj'),vb=r.querySelector('.vb'),
      dwgo=r.querySelector('.dwgo'),dwmin=r.querySelector('[data-dwmin]'),
      dw=r.querySelector('.dw'),dwmove=r.querySelector('[data-dwmove]'),
      dwclk=r.querySelector('[data-dwclk]'),dwout=r.querySelector('.dw .out'),
      hold=r.querySelector('.hold'),fill=r.querySelector('.hold .fill'),
      lab=r.querySelector('.hold .lab'),undo=r.querySelector('.undo');

  /* --- THE BUCKETS (ACTION-BUCKETS.md) -----------------------------------
     One shape, three of the seven goals. REACHED is always the sum of things
     the person logged, TARGET is the countable target their own plan named,
     MIN is the plan's own per-unit estimate (it says "about", it is never a
     measured fact). The verb and the source line change, the provenance does
     not. */
  var B={
    money:{reached:47,target:100,tail:'of 100 clients',
      src:'From your logged messages',acc:'43,212,212',
      vb:'Message',one:'potential client.',many:'potential clients.',
      pick:5,min:5,
      three:[{n:3,role:'lighter'},{n:5,role:'today’s'},{n:8,role:'heavier'}],
      all:[1,2,3,5,8,12,16,20],
      did:function(v){return v+(v===1?' message sent':' messages sent')}},
    audience:{reached:12,target:100,tail:'of 100 videos',
      src:'From the videos you logged',acc:'255,107,157',
      vb:'Post',one:'video.',many:'videos.',
      pick:2,min:20,
      three:[{n:1,role:'lighter'},{n:2,role:'today’s'},{n:3,role:'heavier'}],
      all:[1,2,3,4,5,6],
      did:function(v){return v+(v===1?' video posted':' videos posted')}},
    ship:{reached:9,target:14,tail:'of 14 blockers',
      src:'From your own blocker list',acc:'79,140,255',
      vb:'Clear',one:'blocker.',many:'blockers.',
      pick:2,min:40,
      three:[{n:1,role:'lighter'},{n:2,role:'today’s'},{n:3,role:'heavier'}],
      all:[1,2,3,4,5],
      did:function(v){return v+(v===1?' blocker cleared':' blockers cleared')}}
  };
  /* the hold reads the same for every goal, and it is long enough to be a
     decision: early release aborts. */
  var IDLE='Hold to confirm',HOLD_MS=1400;
  var C=B.money,pick=C.pick,fine=false,done=false,timer=null;

  /* THE NUMBER IS THE SIZE. The whole ladder 1..20 maps to 40..64px on a log
     curve, so the small end has room to separate (3 / 5 / 8 read apart) and
     20 is the tallest the sentence can hold without breaking. */
  function nsz(v){
    var t=Math.log(Math.max(1,Math.min(20,v)))/Math.log(20);
    return (40+24*t).toFixed(1)+'px';
  }

  /* the plan's estimate, always hedged */
  function cost(v){
    var m=C.min*v;
    if(m<60)return 'about '+m+' min';
    var h=Math.floor(m/60),mm=m%60;
    return 'about '+h+' hr'+(mm?' '+mm+' min':'');
  }

  function buildOpts(){
    opts.innerHTML='';
    (fine?C.all:C.three).forEach(function(o){
      var v=fine?o:o.n,b=document.createElement('button');
      b.type='button';b.className='opt';b.dataset.n=v;
      b.innerHTML='<b>'+v+'</b>'+(fine?'':'<i>'+o.role+'</i>')+'<span>'+cost(v)+'</span>';
      if(v===pick)b.classList.add('on');
      b.addEventListener('click',function(){pick=v;setOpen(false);say(true);});
      opts.appendChild(b);
    });
    pmore.textContent=fine?'three sizes':'more sizes';
  }
  pmore.addEventListener('click',function(e){e.stopPropagation();fine=!fine;buildOpts();});

  function setOpen(v){
    pop.classList.toggle('open',v);
    n.setAttribute('aria-expanded',v?'true':'false');
    if(!v&&fine){fine=false;buildOpts();}
  }
  n.addEventListener('click',function(e){
    e.stopPropagation();
    if(done)return;
    setOpen(!pop.classList.contains('open'));
  });
  pop.addEventListener('click',function(e){e.stopPropagation();});
  document.addEventListener('pointerdown',function(e){
    if(!pop.classList.contains('open'))return;
    if(e.target.closest('[data-k=lp-1] .nline'))return;
    setOpen(false);
  });

  /* one render path: the sentence, the arrow number and the ghost all move together */
  function say(animate){
    if(animate){n.classList.add('swap');setTimeout(function(){
      n.textContent=pick;n.style.fontSize=nsz(pick);n.classList.remove('swap');},110);}
    else {n.textContent=pick;n.style.fontSize=nsz(pick);}
    obj.textContent=pick===1?C.one:C.many;
    var base=done?C.reached+pick:C.reached,land=C.reached+pick;
    from.textContent=C.reached;to.textContent=land;
    solid.style.width=(base/C.target*100)+'%';
    /* the ghost runs the WHOLE landing width under the solid, so the two never
       leave a subpixel seam and the line reads as one thing growing */
    ghost.style.width=(land/C.target*100)+'%';
    dwmin.textContent=cost(pick);
    dwmove.textContent=C.vb+' '+pick+' '+(pick===1?C.one:C.many);
    goal.setAttribute('aria-label',done
      ?land+' '+C.tail+'.'
      :pick+' today, '+C.reached+' to '+land+' '+C.tail+'.');
    hold.setAttribute('aria-label',done?C.did(pick):IDLE+', '+pick);
    if(!done)lab.textContent=IDLE;
    buildOpts();
  }

  function complete(){
    if(done)return;
    done=true;s.classList.add('done');
    lab.textContent=C.did(pick);
    say(false);
  }
  function reset(){
    done=false;s.classList.remove('done');
    fill.style.transition='none';fill.style.width='0';
    say(false);
  }
  undo.addEventListener('click',function(e){e.stopPropagation();reset();});

  /* --- the deep work door ------------------------------------------------
     The pill opens the timer already set to the plan's own estimate for the
     size chosen, with today's move as the one thing at the top. Nothing here
     is measured: the length is the same hedged estimate the picker shows. */
  var dwTick=null,dwLeft=0;
  function dwFmt(s){
    var h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
    return (h?h+':'+('0'+m).slice(-2):m)+':'+('0'+ss).slice(-2);
  }
  function dwOpen(){
    if(dwTick)clearInterval(dwTick);
    dwLeft=C.min*pick*60;
    dwclk.textContent=dwFmt(dwLeft);
    dw.classList.add('open');dw.setAttribute('aria-hidden','false');
    dwout.tabIndex=0;try{dwout.focus({preventScroll:true});}catch(e){}
    dwTick=setInterval(function(){
      if(dwLeft<=0){clearInterval(dwTick);dwTick=null;return;}
      dwLeft--;dwclk.textContent=dwFmt(dwLeft);
    },1000);
  }
  function dwClose(){
    if(dwTick){clearInterval(dwTick);dwTick=null;}
    var was=dw.classList.contains('open');
    dw.classList.remove('open');dw.setAttribute('aria-hidden','true');
    dwout.tabIndex=-1;
    if(was&&!done)try{dwgo.focus({preventScroll:true});}catch(e){}
  }
  dwgo.addEventListener('click',function(e){e.stopPropagation();if(!done)dwOpen();});
  dwout.addEventListener('click',function(e){e.stopPropagation();dwClose();});

  /* HOLD to complete, early release aborts */
  function start(e){
    if(done||pop.classList.contains('open'))return;
    if(e&&e.target.closest('.undo'))return;
    fill.style.transition='width '+(HOLD_MS/1000)+'s linear';fill.style.width='100%';
    timer=setTimeout(function(){timer=null;complete();},HOLD_MS);
  }
  function stop(){
    if(done)return;
    if(timer){clearTimeout(timer);timer=null;}
    fill.style.transition='width .2s ease-out';fill.style.width='0';
  }
  hold.addEventListener('pointerdown',start);
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){hold.addEventListener(ev,stop);});
  hold.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();done?reset():complete();}
  });

  /* swapping the bucket: the whole screen re-reads for that goal */
  function render(key){
    C=B[key];pick=C.pick;fine=false;done=false;
    s.classList.remove('done');setOpen(false);dwClose();
    fill.style.transition='none';fill.style.width='0';
    ph.style.setProperty('--acc',C.acc);
    tail.textContent=C.tail;srcEl.textContent=C.src;vb.textContent=C.vb;
    say(false);
  }
  r.querySelectorAll('.bk button').forEach(function(b){
    b.addEventListener('click',function(){
      r.querySelectorAll('.bk button').forEach(function(x){x.classList.remove('on');x.setAttribute('aria-pressed','false')});
      b.classList.add('on');b.setAttribute('aria-pressed','true');
      render(b.dataset.b);
    });
  });
  render('money');
})();</script>
</section>
