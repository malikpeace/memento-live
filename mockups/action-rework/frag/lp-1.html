<!-- ARCHETYPES, the surviving set: lp-1 full-bleed statement type | lp-6 vertical descent rail | lp-7 poster ceiling number |
     lp-8 hundred-mark field | lp-9 ruled ledger book | lp-10 receipt tape | lp-12 full-height week columns |
     lp-15 bottom sheet first | lp-16 horizontal corridor band | lp-17 declarative sentence over account rows |
     lp-18 centered monolith numeral -->
<section class="cell" data-k="lp-1">
<!-- ARCHETYPE (difference law): lp-1 full-bleed statement type.
     GLANCE LAW PASS (2026-08-13): one instruction sentence, no explainer line,
     the consequence moved into the top line itself (47 -> 52 with a ghost
     segment on the bar), the three chip boxes deleted, the NUMBER IN THE
     SENTENCE is now the control, and completion is hold, never a slider.
     MALIK ROUND 4 (2026-08-13):
     1. THE BAR carries the person's Memento accent (--acc on the phone, one
        value per bucket standing in for their chosen skin). The solid segment
        is the only coloured thing on the surface: ghost, hold and confirm are
        all neutral ink now. ONE accent per surface.
     2. THE NUMBER SCALES with the size chosen, 1..20 mapped to 40..64px on a
        log curve so 3 / 5 / 8 read visibly but not massively apart. The line
        box is reserved at the max so the sentence never shifts.
     3. THE HOLD is 1400ms and says "Hold to confirm" for every goal. Early
        release still aborts.
     BEAUTY PASS (2026-08-13), craft only, no mechanic touched:
     a. COMPOSITION. Everything used to fall to the floor: a thin header, a
        250px void, then statement and button clamped together. The void is
        now SPLIT by two weighted spacers (1.35 above, 1 below), so the
        statement sits just above centre with real air under it and the button
        stops crowding the last line.
     b. THE BAR. 4px on a full pill radius, and the ghost is separated from the
        solid by a 3px transparent gutter (background-clip:padding-box) so
        today's chunk reads as its own segment instead of a second colour on
        one bar. Ghost alpha up to .34 to survive next to the accent.
     c. THE POPOVER. Two shadow layers, a tight contact shadow plus a wide
        ambient one, so it lifts off the statement instead of sitting on a
        single soft blur. -->

<style>
[data-k=lp-1] .s{position:absolute;inset:0;display:flex;flex-direction:column;padding:34px 22px 20px;
  font-variant-numeric:tabular-nums}
/* THE ACCENT: the person's own Memento colour, set per phone. Demo values
   stand in for the skin each bucket's person picked. It touches exactly one
   thing on this screen, the bar's solid segment. */
[data-k=lp-1] .ph{--acc:43,212,212}

/* --- OUTPUT BAR (provenance law) ---------------------------------------
   The literal sum of the messages they logged, counted against a countable
   target their own plan named (100 clients). The GHOST segment is today's
   chosen size laid on top of that sum, so the top line reads where today
   lands before it is done. If the star were money only, with no countable
   target, this row would not exist at all. */
[data-k=lp-1] .goal{display:flex;align-items:baseline;gap:5px;font-size:12.5px;letter-spacing:-.005em;
  white-space:nowrap;color:rgba(var(--ink),.92)}
[data-k=lp-1] .goal b{font-weight:700;font-variant-numeric:tabular-nums}
[data-k=lp-1] .goal em{font-style:normal;font-weight:400;color:rgba(var(--ink),.60);padding:0 1px}
[data-k=lp-1] .goal u{text-decoration:none;font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis}
[data-k=lp-1] .s.done .goal em,[data-k=lp-1] .s.done .goal .from{display:none}

[data-k=lp-1] .bar{position:relative;margin-top:10px;height:4px;border-radius:999px;
  background:rgba(var(--ink),.10);overflow:hidden}
[data-k=lp-1] .bar i{position:absolute;left:0;top:0;bottom:0;width:47%;border-radius:999px;
  background:rgb(var(--acc));transition:width .32s cubic-bezier(.2,.7,.2,1)}
/* the ghost: today's size, not yet banked. The 3px transparent gutter on its
   left lets the track show through, so the two segments never fuse. */
[data-k=lp-1] .bar u{position:absolute;top:0;bottom:0;left:47%;width:5%;border-radius:999px;
  border-left:3px solid transparent;background-clip:padding-box;
  background:rgba(var(--ink),.34);
  transition:left .32s cubic-bezier(.2,.7,.2,1),width .32s cubic-bezier(.2,.7,.2,1),opacity .2s ease-out}
[data-k=lp-1] .s.done .bar u{opacity:0}

/* quiet layer: where the number came from, and the deadline from their star */
[data-k=lp-1] .src{display:flex;gap:10px;margin:7px 0 0;font-size:11px;line-height:1.35;
  color:rgba(var(--ink),.90)}
[data-k=lp-1] .src span:last-child{margin-left:auto;flex:none}

/* --- the statement: the whole screen ------------------------------------ */
/* the void is split, not dumped above the statement: 1.35 up, 1 down */
[data-k=lp-1] .sp{display:block}
[data-k=lp-1] .sp.a{flex:1.35 1 0}
[data-k=lp-1] .sp.b{flex:1 1 0;min-height:30px}
[data-k=lp-1] .say{margin:0;font-size:29px;line-height:1.04;letter-spacing:-.03em;font-weight:500;
  color:rgba(var(--ink),.96)}
[data-k=lp-1] .say .vb,[data-k=lp-1] .say .obj{display:block}
/* the line box is reserved at the LARGEST number so the sentence under it
   never moves: only the numeral grows, upward off a fixed baseline. */
[data-k=lp-1] .nline{display:flex;align-items:flex-end;position:relative;height:62px;padding-bottom:6px;
  margin:4px 0 14px}

/* THE PICKER IS THE NUMBER, and its SIZE IS THE SIZE. 1..20 maps to 40..64px
   (log curve), so message 1 sits small and message 20 stands tall without the
   sentence ever breaking. JS sets the size INLINE rather than through an
   unregistered custom property, so the transitioned font-size never depends on
   a var() substitution firing. Measured 1=40px, 3=48.8, 5=52.9, 16=62.2,
   20=64px, with the verb, the object line and the hold pinned at the same
   y at every size and no overflow either way. */
[data-k=lp-1] .n{-webkit-appearance:none;appearance:none;border:0;background:none;padding:0;
  margin:0 0 0 -.04em;
  font-family:var(--font);font-size:52.9px;font-weight:700;line-height:.80;letter-spacing:-.055em;
  color:rgba(var(--ink),1);font-variant-numeric:tabular-nums;cursor:pointer;display:block;
  -webkit-tap-highlight-color:transparent;
  text-decoration:underline;text-decoration-thickness:.03em;text-underline-offset:.13em;
  text-decoration-color:rgba(var(--ink),.18);
  transition:opacity .16s ease-out,font-size .2s cubic-bezier(.2,.7,.2,1),
    text-decoration-color .16s ease-out,transform .1s ease-out}
[data-k=lp-1] .n:active{transform:translateY(1px);text-decoration-color:rgba(var(--ink),.45)}
[data-k=lp-1] .n[aria-expanded=true]{text-decoration-color:rgba(var(--ink),.45)}
[data-k=lp-1] .n.swap{opacity:.35}
[data-k=lp-1] .n:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:4px;border-radius:6px}
[data-k=lp-1] .s.done .n{pointer-events:none;text-decoration-color:transparent}

/* the sizes, popped right at the number */
[data-k=lp-1] .pop{position:absolute;left:0;bottom:calc(100% + 44px);width:214px;padding:6px;
  border-radius:14px;background:rgba(22,25,31,.96);
  backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.09),0 2px 8px rgba(0,0,0,.45),0 26px 54px -10px rgba(0,0,0,.78);
  opacity:0;visibility:hidden;transform:translateY(6px) scale(.98);transform-origin:0 100%;
  transition:opacity .16s ease-out,transform .16s ease-out,visibility 0s linear .16s;z-index:3}
[data-k=lp-1] .pop.open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
[data-k=lp-1] .opts{max-height:196px;overflow:auto;-webkit-overflow-scrolling:touch}
[data-k=lp-1] .opt{display:flex;align-items:baseline;gap:8px;width:100%;height:34px;padding:0 10px;
  border:0;border-radius:9px;background:none;font-family:var(--font);cursor:pointer;text-align:left;
  -webkit-tap-highlight-color:transparent;transition:background .14s ease-out}
[data-k=lp-1] .opt b{font-size:16px;font-weight:700;color:rgba(var(--ink),.96);
  font-variant-numeric:tabular-nums;min-width:19px}
[data-k=lp-1] .opt i{font-style:normal;font-size:12px;color:rgba(var(--ink),.90)}
[data-k=lp-1] .opt span{margin-left:auto;font-size:11px;color:rgba(var(--ink),.90);flex:none}
[data-k=lp-1] .opt:active{background:rgba(var(--ink),.10)}
[data-k=lp-1] .opt.on{background:rgba(var(--ink),.13)}
[data-k=lp-1] .opt:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:-2px}
[data-k=lp-1] .pmore{display:block;width:100%;margin-top:4px;padding:9px 10px;border:0;border-radius:9px;
  background:none;box-shadow:inset 0 1px 0 rgba(var(--ink),.07);color:rgba(var(--ink),.90);
  font:400 11px/1 var(--font);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
[data-k=lp-1] .pmore:active{color:rgba(var(--ink),.96)}
[data-k=lp-1] .pmore:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:-2px}

/* --- the completion gesture: HOLD (the set's pattern) ------------------- */
[data-k=lp-1] .hold{position:relative;height:58px;border-radius:14px;overflow:hidden;
  background:rgba(22,25,31,.94);
  backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.09);cursor:pointer;touch-action:none;user-select:none;
  -webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:background .3s ease-out}
[data-k=lp-1] .hold:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:2px}
/* the hold fills in ink, not colour: the bar owns the one accent */
[data-k=lp-1] .hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(var(--ink),.14)}
[data-k=lp-1] .hold .lab{position:absolute;inset:0;display:grid;place-items:center;
  font-size:13.5px;font-weight:500;color:rgba(var(--ink),.92);transition:padding .26s ease-out}
[data-k=lp-1] .s.done .hold{background:rgba(28,32,39,.94);box-shadow:inset 0 1px 0 rgba(var(--ink),.14)}
[data-k=lp-1] .s.done .hold .fill{width:100%;background:rgba(var(--ink),.10)}
[data-k=lp-1] .s.done .lab{padding-right:74px;color:rgba(var(--ink),.96);font-weight:700}
[data-k=lp-1] .undo{position:absolute;right:6px;top:6px;bottom:6px;width:62px;border:0;border-radius:10px;
  background:rgba(22,25,31,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.10);color:rgba(var(--ink),.92);font:500 12.5px/1 var(--font);
  cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s ease-out .12s}
[data-k=lp-1] .s.done .undo{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){[data-k=lp-1] *{transition:none!important}}
</style>
<h3>Statement</h3><p class="cap">The instruction is the entire screen: the number inside the sentence is the control, and the line at the top already shows where today lands.</p>
<div class="bk" role="group" aria-label="which goal this screen is carrying">
  <button type="button" class="on" data-b="money" aria-pressed="true">Money</button>
  <button type="button" data-b="audience" aria-pressed="false">Audience</button>
  <button type="button" data-b="ship" aria-pressed="false">Ship the project</button>
</div>
<div class="ph">
  <div class="grid"></div>
  <div class="s">
    <div class="goal">
      <b class="from" data-from>47</b><em aria-hidden="true">&#8594;</em><b data-to>52</b>
      <u data-tail>of 100 clients</u>
    </div>
    <div class="bar"><i></i><u></u></div>
    <p class="src"><span data-src>From your logged messages</span><span data-left>19 days left</span></p>

    <span class="sp a"></span>
    <div class="say"><span class="vb">Message</span>
      <span class="nline">
        <button type="button" class="n" aria-haspopup="true" aria-expanded="false" aria-label="how many today">5</button>
        <div class="pop" role="group" aria-label="how many today">
          <div class="opts"></div>
          <button type="button" class="pmore">more sizes</button>
        </div>
      </span>
      <span class="obj">potential clients.</span></div>
    <span class="sp b"></span>

    <div class="hold" role="button" tabindex="0">
      <div class="fill"></div>
      <div class="lab">Hold to confirm</div>
      <button type="button" class="undo" tabindex="-1">Undo</button>
    </div>
  </div>
</div>
<script>(function(){
  var r=document.currentScript.closest('.cell');if(!r)return;
  var ph=r.querySelector('.ph'),
      s=r.querySelector('.s'),n=r.querySelector('.n'),pop=r.querySelector('.pop'),
      opts=r.querySelector('.opts'),pmore=r.querySelector('.pmore'),
      solid=r.querySelector('.bar i'),ghost=r.querySelector('.bar u'),
      goal=r.querySelector('.goal'),from=r.querySelector('[data-from]'),to=r.querySelector('[data-to]'),
      tail=r.querySelector('[data-tail]'),
      srcEl=r.querySelector('[data-src]'),leftEl=r.querySelector('[data-left]'),
      obj=r.querySelector('.obj'),vb=r.querySelector('.vb'),
      hold=r.querySelector('.hold'),fill=r.querySelector('.hold .fill'),
      lab=r.querySelector('.hold .lab'),undo=r.querySelector('.undo');

  /* --- THE BUCKETS (ACTION-BUCKETS.md) -----------------------------------
     One shape, three of the seven goals. REACHED is always the sum of things
     the person logged, TARGET is the countable target their own plan named,
     MIN is the plan's own per-unit estimate (it says "about", it is never a
     measured fact). The verb and the source line change, the provenance does
     not. */
  var B={
    money:{reached:47,target:100,tail:'of 100 clients',left:'19 days left',
      src:'From your logged messages',acc:'43,212,212',
      vb:'Message',one:'potential client.',many:'potential clients.',
      pick:5,min:5,
      three:[{n:3,role:'lighter'},{n:5,role:'today’s'},{n:8,role:'heavier'}],
      all:[1,2,3,5,8,12,16,20],
      did:function(v){return v+(v===1?' message sent':' messages sent')}},
    audience:{reached:12,target:100,tail:'of 100 videos',left:'22 weeks left',
      src:'From the videos you logged',acc:'255,107,157',
      vb:'Post',one:'video.',many:'videos.',
      pick:2,min:20,
      three:[{n:1,role:'lighter'},{n:2,role:'today’s'},{n:3,role:'heavier'}],
      all:[1,2,3,4,5,6],
      did:function(v){return v+(v===1?' video posted':' videos posted')}},
    ship:{reached:9,target:14,tail:'of 14 blockers',left:'19 days left',
      src:'From your own blocker list',acc:'79,140,255',
      vb:'Clear',one:'blocker.',many:'blockers.',
      pick:2,min:40,
      three:[{n:1,role:'lighter'},{n:2,role:'today’s'},{n:3,role:'heavier'}],
      all:[1,2,3,4,5],
      did:function(v){return v+(v===1?' blocker cleared':' blockers cleared')}}
  };
  /* the hold reads the same for every goal, and it is long enough to be a
     decision: early release aborts. */
  var IDLE='Hold to confirm',HOLD_MS=1400;
  var C=B.money,pick=C.pick,fine=false,done=false,timer=null;

  /* THE NUMBER IS THE SIZE. The whole ladder 1..20 maps to 40..64px on a log
     curve, so the small end has room to separate (3 / 5 / 8 read apart) and
     20 is the tallest the sentence can hold without breaking. */
  function nsz(v){
    var t=Math.log(Math.max(1,Math.min(20,v)))/Math.log(20);
    return (40+24*t).toFixed(1)+'px';
  }

  /* the plan's estimate, always hedged */
  function cost(v){
    var m=C.min*v;
    if(m<60)return 'about '+m+' min';
    var h=Math.floor(m/60),mm=m%60;
    return 'about '+h+' hr'+(mm?' '+mm+' min':'');
  }

  function buildOpts(){
    opts.innerHTML='';
    (fine?C.all:C.three).forEach(function(o){
      var v=fine?o:o.n,b=document.createElement('button');
      b.type='button';b.className='opt';b.dataset.n=v;
      b.innerHTML='<b>'+v+'</b>'+(fine?'':'<i>'+o.role+'</i>')+'<span>'+cost(v)+'</span>';
      if(v===pick)b.classList.add('on');
      b.addEventListener('click',function(){pick=v;setOpen(false);say(true);});
      opts.appendChild(b);
    });
    pmore.textContent=fine?'three sizes':'more sizes';
  }
  pmore.addEventListener('click',function(e){e.stopPropagation();fine=!fine;buildOpts();});

  function setOpen(v){
    pop.classList.toggle('open',v);
    n.setAttribute('aria-expanded',v?'true':'false');
    if(!v&&fine){fine=false;buildOpts();}
  }
  n.addEventListener('click',function(e){
    e.stopPropagation();
    if(done)return;
    setOpen(!pop.classList.contains('open'));
  });
  pop.addEventListener('click',function(e){e.stopPropagation();});
  document.addEventListener('pointerdown',function(e){
    if(!pop.classList.contains('open'))return;
    if(e.target.closest('[data-k=lp-1] .nline'))return;
    setOpen(false);
  });

  /* one render path: the sentence, the arrow number and the ghost all move together */
  function say(animate){
    if(animate){n.classList.add('swap');setTimeout(function(){
      n.textContent=pick;n.style.fontSize=nsz(pick);n.classList.remove('swap');},110);}
    else {n.textContent=pick;n.style.fontSize=nsz(pick);}
    obj.textContent=pick===1?C.one:C.many;
    var base=done?C.reached+pick:C.reached,land=C.reached+pick;
    from.textContent=C.reached;to.textContent=land;
    solid.style.width=(base/C.target*100)+'%';
    ghost.style.left=(C.reached/C.target*100)+'%';
    ghost.style.width=(pick/C.target*100)+'%';
    goal.setAttribute('aria-label',done
      ?land+' '+C.tail+'.'
      :pick+' today, '+C.reached+' to '+land+' '+C.tail+'.');
    hold.setAttribute('aria-label',done?C.did(pick):IDLE+', '+pick);
    if(!done)lab.textContent=IDLE;
    buildOpts();
  }

  function complete(){
    if(done)return;
    done=true;s.classList.add('done');
    lab.textContent=C.did(pick);
    say(false);
  }
  function reset(){
    done=false;s.classList.remove('done');
    fill.style.transition='none';fill.style.width='0';
    say(false);
  }
  undo.addEventListener('click',function(e){e.stopPropagation();reset();});

  /* HOLD to complete, early release aborts */
  function start(e){
    if(done||pop.classList.contains('open'))return;
    if(e&&e.target.closest('.undo'))return;
    fill.style.transition='width '+(HOLD_MS/1000)+'s linear';fill.style.width='100%';
    timer=setTimeout(function(){timer=null;complete();},HOLD_MS);
  }
  function stop(){
    if(done)return;
    if(timer){clearTimeout(timer);timer=null;}
    fill.style.transition='width .2s ease-out';fill.style.width='0';
  }
  hold.addEventListener('pointerdown',start);
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){hold.addEventListener(ev,stop);});
  hold.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();done?reset():complete();}
  });

  /* swapping the bucket: the whole screen re-reads for that goal */
  function render(key){
    C=B[key];pick=C.pick;fine=false;done=false;
    s.classList.remove('done');setOpen(false);
    fill.style.transition='none';fill.style.width='0';
    ph.style.setProperty('--acc',C.acc);
    tail.textContent=C.tail;leftEl.textContent=C.left;srcEl.textContent=C.src;vb.textContent=C.vb;
    say(false);
  }
  r.querySelectorAll('.bk button').forEach(function(b){
    b.addEventListener('click',function(){
      r.querySelectorAll('.bk button').forEach(function(x){x.classList.remove('on');x.setAttribute('aria-pressed','false')});
      b.classList.add('on');b.setAttribute('aria-pressed','true');
      render(b.dataset.b);
    });
  });
  render('money');
})();</script>
</section>
