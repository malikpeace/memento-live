<!-- ARCHETYPES, the surviving set: lp-1 full-bleed statement type | lp-6 vertical descent rail | lp-7 poster ceiling number |
     lp-8 hundred-mark field | lp-9 ruled ledger book | lp-10 receipt tape | lp-12 full-height week columns |
     lp-15 bottom sheet first | lp-16 low-anchored move over own marks | lp-17 declarative sentence over account rows |
     lp-18 centered monolith numeral -->
<section class="cell" data-k="lp-16">
<!-- MALIK, PILLAR PURITY (2026-08-13). Applied exactly:
     CUT the corridor. The floor line, the cushion lines and their tags, the
     over/under shading, the pace track ("$240 under the line for this point in
     the month") and every above/below verdict are gone. That was Clarity's face
     wearing Action's clothes.
     The money screen is now the week's move plus the check: nothing on it reads
     a position against $4,000, so there is no number to read one from.
     The band SURVIVES only in Body, and only as raw own entries: the Friday
     weigh-ins they typed, dotted between because nothing was measured in
     between. No hold line, no band edges, no in/out verdict.
     The intensity chips were "how much cushion above the floor" (a target rail).
     They are now the size of TODAY'S move, which is the one intensity Action
     owns, and the consequence is the move sentence itself changing.
     PROVENANCE: the pen's home is named once, quietly, above the swipe, so the
     screen says what logging does NOT do without ever reading a position. -->
<style>
[data-k=lp-16] .l16{position:absolute;inset:0;display:flex;flex-direction:column;padding:30px 0 22px;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
[data-k=lp-16] .l16 .pad{padding:0 20px}

[data-k=lp-16] .l16-goal{font-size:12.5px;line-height:1.35;color:rgba(var(--ink),.80)}

/* the pen, for the goal they write down themselves: the value, and when it was written */
[data-k=lp-16] .l16-pen{display:flex;align-items:baseline;gap:7px;margin-top:15px}
[data-k=lp-16] .l16-in{font-size:37px;font-weight:700;letter-spacing:-.035em;line-height:1;color:var(--text-hi)}
[data-k=lp-16] .l16-of{font-size:13.5px;white-space:nowrap;color:rgba(var(--ink),.80)}
[data-k=lp-16] .l16-when{margin-left:auto;font-size:12px;white-space:nowrap;color:rgba(var(--ink),.80)}

/* their own marks, nothing else: no line to hold, no edges, no reading */
[data-k=lp-16] .l16-band{position:relative;flex:none;height:96px;margin-top:14px;overflow:hidden;
  background:rgba(22,25,31,.95);
  -webkit-backdrop-filter:blur(24px) saturate(1.35);backdrop-filter:blur(24px) saturate(1.35);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.07),inset 0 -1px 0 rgba(var(--ink),.05)}
[data-k=lp-16] .l16-band svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* one skeleton for both goals: the move sits optically centred in the room the
   top block leaves, the swipe stays anchored to the bottom */
[data-k=lp-16] .l16-sp{flex:1;min-height:12px}
[data-k=lp-16] .l16-sp2{flex:.75;min-height:10px}

[data-k=lp-16] .l16-do{flex:none;border-radius:14px;padding:15px 15px 16px;background:rgba(22,25,31,.95);
  -webkit-backdrop-filter:blur(26px) saturate(1.35);backdrop-filter:blur(26px) saturate(1.35);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.09)}
[data-k=lp-16] .l16-do .h{display:flex;align-items:baseline;gap:9px}
[data-k=lp-16] .l16-do i{display:none;flex:none;width:8px;height:8px;border-radius:3px;background:#3fd94e;transform:translateY(-2px)}
[data-k=lp-16] .l16-do.sent i{display:block}
[data-k=lp-16] .l16-do b{display:block;font-size:17.5px;font-weight:700;letter-spacing:-.015em;line-height:1.25;color:var(--text-hi)}
[data-k=lp-16] .l16-do p{margin:7px 0 0;font-size:12px;line-height:1.5;color:rgba(var(--ink),.90)}
[data-k=lp-16] .l16-do.sent p{display:none}

[data-k=lp-16] .l16-chips{display:flex;flex:none;gap:6px;margin-top:10px}
[data-k=lp-16] .l16-chips.lock{pointer-events:none}
[data-k=lp-16] .l16-chip{flex:1;height:38px;border:0;border-radius:10px;background:rgba(22,25,31,.95);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.08);color:rgba(var(--ink),.82);font:500 13px var(--font);
  font-variant-numeric:tabular-nums;cursor:pointer;
  transition:background .16s ease-out,color .16s ease-out,box-shadow .16s ease-out,transform .09s ease-out}
[data-k=lp-16] .l16-chip:active{transform:translateY(1px);background:rgba(30,34,42,.96)}
[data-k=lp-16] .l16-chip.on{background:rgba(30,52,34,.96);color:rgba(var(--ink),.97);font-weight:700;
  box-shadow:inset 0 1px 0 rgba(63,217,78,.38)}

[data-k=lp-16] .l16-close{position:relative;flex:none;height:52px;border-radius:14px;overflow:hidden;
  background:rgba(235,238,248,.94);touch-action:none;user-select:none}
[data-k=lp-16] .l16-fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(63,217,78,.85)}
/* the label centres in the room LEFT OF the knob's own 52px, so it can never
   tuck under the knob whichever goal's words are in it */
[data-k=lp-16] .l16-lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:0 12px 0 56px;font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:#0b0c10;pointer-events:none}
[data-k=lp-16] .l16-knob{position:absolute;left:4px;top:4px;width:44px;height:44px;border-radius:11px;
  background:#0b0c10;box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:grab;display:flex;align-items:center;justify-content:center}
[data-k=lp-16] .l16-knob:active{cursor:grabbing}
[data-k=lp-16] .l16-knob svg{width:15px;height:15px;stroke:rgba(235,238,248,.94);stroke-width:2.1;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
[data-k=lp-16] .l16-close.done{background:rgba(63,217,78,.85)}
[data-k=lp-16] .l16-close.done .l16-lab{padding:0}
[data-k=lp-16] .l16-close.done .l16-knob{opacity:0;transition:opacity .16s ease-out}

/* where the pen lives, said once and quietly */
[data-k=lp-16] .l16-src{margin:10px 0 0;font-size:11.5px;line-height:1.4;color:rgba(var(--ink),.90)}
</style>
<h3>The corridor</h3>
<p class="cap">Today's move is the whole screen, sized by three chips and closed with a swipe, and for a goal you write down yourself your own typed marks sit above it as a quiet trace with nothing drawn to measure them against.</p>
<div class="bk" role="group" aria-label="which goal this screen is carrying">
  <button type="button" class="on" data-b="money" aria-pressed="true">Money</button>
  <button type="button" data-b="body" aria-pressed="false">Body</button>
</div>
<div class="ph">
  <div class="grid"></div>
  <div class="l16">
    <div class="pad">
      <div class="l16-goal"></div>
      <div class="l16-pen">
        <div class="l16-in"></div>
        <div class="l16-of"></div>
        <div class="l16-when"></div>
      </div>
    </div>

    <div class="l16-band">
      <svg viewBox="0 0 300 96" preserveAspectRatio="none" aria-hidden="true">
        <polyline class="track" points="" fill="none" stroke="rgba(235,238,248,.34)" stroke-width="1.4"
          stroke-dasharray="2 3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <g class="marks"></g>
      </svg>
    </div>

    <div class="l16-sp"></div>

    <div class="pad">
      <div class="l16-do">
        <div class="h"><i></i><b></b></div>
        <p></p>
      </div>
      <div class="l16-chips" role="group" aria-label="how big today is"></div>
      <p class="l16-src"></p>
    </div>

    <div class="l16-sp2"></div>

    <div class="pad">
      <div class="l16-close">
        <div class="l16-fill"></div>
        <div class="l16-lab"></div>
        <div class="l16-knob"><svg viewBox="0 0 24 24"><path d="M8 5l7 7-7 7"/></svg></div>
      </div>
    </div>
  </div>
</div>
<script>(function(){
  var c=document.currentScript.closest('.cell');
  var band=c.querySelector('.l16-band'),svg=band.querySelector('svg'),
      track=svg.querySelector('.track'),marks=svg.querySelector('.marks'),
      goal=c.querySelector('.l16-goal'),pen=c.querySelector('.l16-pen'),
      inEl=c.querySelector('.l16-in'),ofEl=c.querySelector('.l16-of'),whenEl=c.querySelector('.l16-when'),
      src=c.querySelector('.l16-src'),chipsEl=c.querySelector('.l16-chips'),
      doBox=c.querySelector('.l16-do'),doB=doBox.querySelector('b'),doP=doBox.querySelector('p'),
      pad=c.querySelector('.l16-close'),knob=c.querySelector('.l16-knob'),
      fill=c.querySelector('.l16-fill'),lab=c.querySelector('.l16-lab');

  var W=300,H=96;
  /* the marks sit inboard of both edges: only the Fridays they wrote, nothing ahead */
  function xb(i,n){return 26+i*((W-52)/(n-1));}

  /* THE ONLY DATA ON THIS SCREEN: ten Friday weigh-ins they typed at their own
     check. No hold value, no band, no scale drawn from a target. */
  var WB=[179.2,180.6,178.9,181.2,180.1,182.3,179.6,180.8,182.0,181.4],WSLOTS=WB.length;

  var CTX={
    money:{
      goal:'Hold a $4,000 floor, every month',
      pen:false,
      sizes:[
        {t:'1 invoice', act:'Send 1 renewal invoice.',   sub:'About 10 min, by the plan.', lab:'Swipe to log 1 invoice',  done:'1 invoice sent'},
        {t:'2 invoices',act:'Send 2 renewal invoices.',  sub:'About 20 min, by the plan.', lab:'Swipe to log 2 invoices', done:'2 invoices sent'},
        {t:'4 invoices',act:'Send 4 renewal invoices.',  sub:'About 40 min, by the plan.', lab:'Swipe to log 4 invoices', done:'4 invoices sent'}
      ],pick:1,
      src:'Your monthly total goes in at Sunday&#8217;s confirm.'
    },
    body:{
      goal:'Hold 180 lb, after the cut',
      pen:true,big:'181.4',of:'lb',when:'typed Friday',
      sizes:[
        {t:'20 min',act:'Walk 20 minutes today.',sub:'',lab:'Swipe to log the walk',done:'20 minute walk logged'},
        {t:'30 min',act:'Walk 30 minutes today.',sub:'',lab:'Swipe to log the walk',done:'30 minute walk logged'},
        {t:'45 min',act:'Walk 45 minutes today.',sub:'',lab:'Swipe to log the walk',done:'45 minute walk logged'}
      ],pick:1,
      src:'Your weight goes in at Friday&#8217;s check.'
    }
  };

  var mode='money',C=CTX.money,size=1,sent=false;

  /* the trace: their marks, scaled to their own spread, centred on their own
     middle. Nothing on the band comes from the goal. */
  function paintBand(){
    marks.textContent='';
    var lo=Math.min.apply(null,WB),hi=Math.max.apply(null,WB),mid=(lo+hi)/2,
        span=Math.max(hi-lo,.1),ppl=58/span,pts=[],i;
    function y(w){return H/2-(w-mid)*ppl;}
    for(i=0;i<WB.length;i++)pts.push(xb(i,WSLOTS).toFixed(1)+','+y(WB[i]).toFixed(1));
    track.setAttribute('points',pts.join(' '));
    for(i=0;i<WB.length;i++){
      var m=document.createElementNS('http://www.w3.org/2000/svg','circle'),last=i===WB.length-1;
      m.setAttribute('cx',xb(i,WSLOTS).toFixed(1));m.setAttribute('cy',y(WB[i]).toFixed(1));
      m.setAttribute('r',last?'3.2':'2.2');
      m.setAttribute('fill',last?'rgba(235,238,248,.94)':'rgba(235,238,248,.62)');
      marks.appendChild(m);
    }
  }

  function paintSize(){
    var s=C.sizes[size];
    doB.textContent=s.act;
    doP.textContent=s.sub;doP.style.display=s.sub?'':'none';
    if(!sent)lab.textContent=s.lab;
  }

  function drawChips(){
    chipsEl.textContent='';
    C.sizes.forEach(function(o,i){
      var b=document.createElement('button');
      b.type='button';b.className='l16-chip'+(i===size?' on':'');
      b.textContent=o.t;b.setAttribute('aria-pressed',i===size?'true':'false');
      b.addEventListener('click',function(){
        if(sent)return;
        chipsEl.querySelectorAll('button').forEach(function(z){
          z.classList.remove('on');z.setAttribute('aria-pressed','false');});
        b.classList.add('on');b.setAttribute('aria-pressed','true');
        size=i;paintSize();
      });
      chipsEl.appendChild(b);
    });
  }

  /* --- the swipe: logging the ACTION never moves a metric. The number moves
         when they write it in at their own check. ------------------------- */
  function max(){return pad.clientWidth-52;}
  var px=0,drag=false,sx=0;
  function set(v){px=Math.max(0,Math.min(max(),v));knob.style.left=(4+px)+'px';fill.style.width=(px+48)+'px';}
  function done(){
    sent=true;pad.classList.add('done');lab.textContent=C.sizes[size].done;
    doBox.classList.add('sent');chipsEl.classList.add('lock');
  }
  knob.addEventListener('pointerdown',function(e){if(sent)return;drag=true;sx=e.clientX-px;
    knob.style.transition='';fill.style.transition='';
    try{knob.setPointerCapture(e.pointerId);}catch(z){}});
  knob.addEventListener('pointermove',function(e){if(!drag)return;set(e.clientX-sx);});
  function release(){
    if(!drag)return;drag=false;
    if(px>max()*.6){knob.style.transition='left .16s ease-out';fill.style.transition='width .16s ease-out';
      set(max());setTimeout(done,140);}
    else{knob.style.transition='left .2s ease-out';fill.style.transition='width .2s ease-out';set(0);}
  }
  knob.addEventListener('pointerup',release);knob.addEventListener('pointercancel',release);

  /* --- swapping the goal: same skeleton, the goal's own words ------------- */
  function render(key){
    mode=key;C=CTX[key];size=C.pick;sent=false;
    drag=false;knob.style.transition='';fill.style.transition='';set(0);
    pad.classList.remove('done');doBox.classList.remove('sent');chipsEl.classList.remove('lock');
    goal.textContent=C.goal;
    pen.style.display=C.pen?'':'none';
    band.style.display=C.pen?'':'none';
    inEl.textContent=C.pen?C.big:'';ofEl.textContent=C.pen?C.of:'';whenEl.textContent=C.pen?C.when:'';
    src.innerHTML=C.src;
    drawChips();paintSize();
    if(C.pen)paintBand();
  }
  c.querySelectorAll('.bk button').forEach(function(b){
    b.addEventListener('click',function(){
      c.querySelectorAll('.bk button').forEach(function(z){
        z.classList.remove('on');z.setAttribute('aria-pressed','false');});
      b.classList.add('on');b.setAttribute('aria-pressed','true');
      render(b.dataset.b);
    });
  });
  render('money');
})();</script>
</section>
