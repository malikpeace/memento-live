<!-- ARCHETYPES, the surviving set: lp-1 full-bleed statement type | lp-6 vertical descent rail | lp-7 poster ceiling number |
     lp-8 hundred-mark field | lp-9 ruled ledger book | lp-10 receipt tape | lp-12 full-height week columns |
     lp-15 bottom sheet first | lp-16 wide pen band over the move | lp-17 declarative sentence over own nights |
     lp-18 centered monolith numeral -->
<section class="cell" data-k="lp-16">
<!-- TIGHTENED RULE (Malik, 2026-08-15): "it is showing too much information."
     An Action screen shows TODAY, and nothing about how far along the journey
     they are. If a person could learn how close they are to their goal from
     this screen, it is wrong.

     THE CORRIDOR IS GONE. Its whole geometry was a position along a track: a
     band you are somewhere inside, with marks laid left to right. Even stripped
     of its floor line and its cushion tags, a trace of ten weigh-ins joined by
     a dotted line is a travelled track, and the last mark on it is a position.
     Cut: the band, the polyline, the marks, the scale, and the pen readout that
     sat beside a numbered goal (181.4 lb under "Hold 180 lb" is a distance to a
     floor with the arithmetic left to the reader).

     WHAT REPLACES IT, same horizontal geometry, opposite job: the band is now
     THE PEN. It is the writing surface for the number this goal is kept by, the
     one Memento can only ever know because they typed it. It opens empty, it
     carries a green line to write on, and writing is a hold with early release
     aborting, like every other completion in the set. Written, it shows what
     they wrote, when, and an undo. Nothing else. There is no previous value, no
     trace, no target, so there is nothing on the screen to read a position off.

     The goal line keeps their words and loses its number for the same reason.
     Today's move sits under the band at three sizes, and the size's consequence
     is the move sentence itself changing, which is the only consequence Action
     owns. Two holds, two different completions: write the number, log the move. -->
<style>
/* the goal line clears the island: at padding-top 30 its ascender started on
   the island's own bottom edge, which is a safe-area miss on a real phone */
[data-k=lp-16] .l16{position:absolute;inset:0;display:flex;flex-direction:column;padding:38px 0 22px;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
[data-k=lp-16] .l16 .pad{padding:0 20px}

[data-k=lp-16] .l16-goal{font-size:12.5px;line-height:1.35;color:rgba(var(--ink),.88)}

/* --- THE BAND: full bleed across the screen, and it is a writing surface --- */
[data-k=lp-16] .l16-pen{flex:none;margin-top:15px;padding:13px 20px 13px;background:rgba(22,25,31,.955);
  -webkit-backdrop-filter:blur(28px) saturate(1.4);backdrop-filter:blur(28px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.075),inset 0 -1px 0 rgba(var(--ink),.05)}
[data-k=lp-16] .l16-hd{display:flex;align-items:baseline;gap:8px;min-height:16px}
[data-k=lp-16] .l16-lbl{font-size:13px;font-weight:700;letter-spacing:-.012em;color:rgba(var(--ink),.97)}
[data-k=lp-16] .l16-when{margin-left:auto;display:none;align-items:baseline;gap:9px;
  font-size:11.5px;color:rgba(var(--ink),.90)}
[data-k=lp-16] .l16.wrote .l16-when{display:flex}
[data-k=lp-16] .l16-undo{border:0;background:none;padding:0;cursor:pointer;font:500 11.5px var(--font);
  color:rgba(var(--ink),.92);box-shadow:inset 0 -1px 0 rgba(var(--ink),.32)}

/* the line they write on: straight, full width of the band's inner box */
[data-k=lp-16] .l16-val{position:relative;display:flex;align-items:baseline;gap:7px;padding:7px 0 11px}
[data-k=lp-16] .l16-val:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;
  background:#3fd94e;transition:background .3s ease-out}
[data-k=lp-16] .l16.wrote .l16-val:after{background:rgba(var(--ink),.12)}
[data-k=lp-16] .l16-pre,[data-k=lp-16] .l16-unit{font-size:16.5px;font-weight:500;color:rgba(var(--ink),.90)}
[data-k=lp-16] .l16-pre:empty,[data-k=lp-16] .l16-unit:empty{display:none}
[data-k=lp-16] .l16-in{border:0;outline:0;background:transparent;padding:0;width:14px;min-width:0;
  font:700 40px/1 var(--font);letter-spacing:-.035em;font-variant-numeric:tabular-nums;
  color:rgba(var(--ink),.98);caret-color:#3fd94e}
[data-k=lp-16] .l16-in::-webkit-outer-spin-button,[data-k=lp-16] .l16-in::-webkit-inner-spin-button{display:none}
[data-k=lp-16] .l16-fld{position:relative;display:inline-flex;align-items:baseline}
[data-k=lp-16] .l16-car{position:absolute;left:1px;top:5px;width:2px;height:30px;background:#3fd94e;
  animation:l16car 1.05s step-end infinite}
[data-k=lp-16] .l16.filled .l16-car{display:none}
@keyframes l16car{0%,50%{opacity:1}50.01%,100%{opacity:0}}

/* writing the number in is a completion, so it is a hold */
[data-k=lp-16] .l16-write{position:relative;height:40px;margin-top:11px;border-radius:11px;overflow:hidden;
  background:rgba(var(--ink),.05);box-shadow:inset 0 1px 0 rgba(var(--ink),.07);
  cursor:default;touch-action:none;-webkit-user-select:none;user-select:none;
  transition:background .26s ease-out,box-shadow .26s ease-out}
[data-k=lp-16] .l16-write .fl{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(63,217,78,.20)}
[data-k=lp-16] .l16-write .tx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:13px;font-weight:500;color:rgba(var(--ink),.90);white-space:nowrap}
[data-k=lp-16] .l16-write.rdy{background:rgba(30,34,42,.94);box-shadow:inset 0 1px 0 rgba(var(--ink),.10);cursor:pointer}
[data-k=lp-16] .l16-write.rdy .tx{color:rgba(var(--ink),.97);font-weight:700}
[data-k=lp-16] .l16.wrote .l16-write{background:rgba(63,217,78,.13);box-shadow:inset 0 1px 0 rgba(63,217,78,.26)}
[data-k=lp-16] .l16.wrote .l16-write .tx{color:rgba(var(--ink),.97);font-weight:700}
[data-k=lp-16] .l16-write svg{display:none;width:13px;height:13px;fill:none;stroke:#3fd94e;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round}
[data-k=lp-16] .l16.wrote .l16-write svg{display:block}

/* one skeleton: the move sits optically centred in the room the band leaves,
   the gesture stays anchored to the bottom */
[data-k=lp-16] .l16-sp{flex:1;min-height:14px}
[data-k=lp-16] .l16-sp2{flex:1.15;min-height:12px}

[data-k=lp-16] .l16-do{flex:none;margin:0 -6px;border-radius:14px;padding:17px 21px 18px;background:rgba(22,25,31,.95);
  -webkit-backdrop-filter:blur(26px) saturate(1.35);backdrop-filter:blur(26px) saturate(1.35);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.09)}
[data-k=lp-16] .l16-do .h{display:flex;align-items:baseline;gap:9px}
[data-k=lp-16] .l16-do i{display:none;flex:none;width:8px;height:8px;border-radius:3px;background:#3fd94e;transform:translateY(-2px)}
[data-k=lp-16] .l16-do.sent i{display:block}
[data-k=lp-16] .l16-do b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.24;color:var(--text-hi)}
[data-k=lp-16] .l16-do p{margin:7px 0 0;font-size:12px;line-height:1.5;color:rgba(var(--ink),.90)}
[data-k=lp-16] .l16-do.sent p{display:none}

[data-k=lp-16] .l16-chips{display:flex;flex:none;gap:6px;margin:8px -6px 0}
[data-k=lp-16] .l16-chips.lock{pointer-events:none}
[data-k=lp-16] .l16-chip{flex:1;height:38px;border:0;border-radius:10px;background:rgba(22,25,31,.95);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.08);color:rgba(var(--ink),.82);font:500 13px var(--font);
  font-variant-numeric:tabular-nums;cursor:pointer;
  transition:background .16s ease-out,color .16s ease-out,box-shadow .16s ease-out,transform .09s ease-out}
[data-k=lp-16] .l16-chip:active{transform:translateY(1px);background:rgba(30,34,42,.96)}
[data-k=lp-16] .l16-chip.on{background:rgba(30,52,34,.96);color:rgba(var(--ink),.97);font-weight:700;
  box-shadow:inset 0 1px 0 rgba(63,217,78,.38)}

[data-k=lp-16] .l16-close{position:relative;flex:none;display:block;width:calc(100% + 12px);height:52px;margin:0 -6px;border:0;
  border-radius:14px;overflow:hidden;cursor:pointer;background:rgba(235,238,248,.94);
  touch-action:none;-webkit-user-select:none;user-select:none;font-family:var(--font)}
[data-k=lp-16] .l16-fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(63,217,78,.55)}
[data-k=lp-16] .l16-close.go .l16-fill{width:100%;transition:width 1.05s linear}
[data-k=lp-16] .l16-lab{position:relative;display:flex;align-items:center;justify-content:center;height:100%;
  padding:0 14px;font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:#0b0c10}
[data-k=lp-16] .l16-close:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:2px}
[data-k=lp-16] .l16-close.done{background:rgba(63,217,78,.16)}
[data-k=lp-16] .l16-close.done .l16-fill{display:none}
[data-k=lp-16] .l16-close.done .l16-lab{color:rgba(var(--ink),.96)}
@media (prefers-reduced-motion:reduce){[data-k=lp-16] .l16-car{animation:none}
  [data-k=lp-16] *{transition:none!important}}
</style>
<h3>The pen band</h3>
<p class="cap">A band across the top is the pen: the number this goal is kept by gets written on the green line and held in, and today's move sits under it at three sizes. Nothing is drawn against the goal, so there is no position to read.</p>
<div class="bk" role="group" aria-label="which goal this screen is carrying">
  <button type="button" class="on" data-b="money" aria-pressed="true">Money</button>
  <button type="button" data-b="body" aria-pressed="false">Body</button>
</div>
<div class="ph">
  <div class="grid"></div>
  <div class="l16">
    <div class="pad"><div class="l16-goal"></div></div>

    <div class="l16-pen">
      <div class="l16-hd">
        <span class="l16-lbl"></span>
        <span class="l16-when"><span class="wt"></span><button type="button" class="l16-undo">undo</button></span>
      </div>
      <label class="l16-val">
        <span class="l16-pre"></span>
        <span class="l16-fld"><input class="l16-in" type="text" inputmode="decimal" autocomplete="off"><span class="l16-car" aria-hidden="true"></span></span>
        <span class="l16-unit"></span>
      </label>
      <div class="l16-write" role="button" tabindex="0" aria-disabled="true">
        <span class="fl"></span>
        <span class="tx"><svg viewBox="0 0 24 24"><path d="M4 13l5 5L20 7"/></svg><b class="wl"></b></span>
      </div>
    </div>

    <div class="l16-sp"></div>

    <div class="pad">
      <div class="l16-do">
        <div class="h"><i></i><b></b></div>
        <p></p>
      </div>
      <div class="l16-chips" role="group" aria-label="how big today is"></div>
    </div>

    <div class="l16-sp2"></div>

    <div class="pad">
      <button type="button" class="l16-close">
        <span class="l16-fill"></span>
        <span class="l16-lab"></span>
      </button>
    </div>
  </div>
</div>
<script>(function(){
  var c=document.currentScript.closest('.cell');
  var root=c.querySelector('.l16'),goal=c.querySelector('.l16-goal'),
      lbl=c.querySelector('.l16-lbl'),whenT=c.querySelector('.l16-when .wt'),undo=c.querySelector('.l16-undo'),
      pre=c.querySelector('.l16-pre'),unit=c.querySelector('.l16-unit'),inp=c.querySelector('.l16-in'),
      wr=c.querySelector('.l16-write'),wfl=wr.querySelector('.fl'),wl=c.querySelector('.wl'),
      chipsEl=c.querySelector('.l16-chips'),
      doBox=c.querySelector('.l16-do'),doB=doBox.querySelector('b'),doP=doBox.querySelector('p'),
      pad=c.querySelector('.l16-close'),lab=c.querySelector('.l16-lab');

  /* PROVENANCE: every number here is one they typed on this screen, or a word
     from their own star. Nothing is measured, nothing is remembered from before. */
  var CTX={
    money:{
      goal:'Hold the floor under the business',
      lbl:'This week&#8217;s money in',pre:'$',unit:'',idle:'Write the week in first',
      lo:1,hi:999999,dec:0,
      sizes:[
        {t:'1 invoice', act:'Send 1 renewal invoice.',  sub:'About 10 min, by the plan.', lab:'Hold to log 1 invoice',  done:'1 invoice sent'},
        {t:'2 invoices',act:'Send 2 renewal invoices.', sub:'About 20 min, by the plan.', lab:'Hold to log 2 invoices', done:'2 invoices sent'},
        {t:'4 invoices',act:'Send 4 renewal invoices.', sub:'About 40 min, by the plan.', lab:'Hold to log 4 invoices', done:'4 invoices sent'}
      ],pick:1
    },
    body:{
      goal:'Hold the weight you cut to',
      lbl:'Friday&#8217;s weigh-in',pre:'',unit:'lb',idle:'Write Friday in first',
      lo:80,hi:700,dec:1,
      sizes:[
        {t:'20 min',act:'Walk 20 minutes today.',sub:'',lab:'Hold to log the walk',done:'20 minute walk logged'},
        {t:'30 min',act:'Walk 30 minutes today.',sub:'',lab:'Hold to log the walk',done:'30 minute walk logged'},
        {t:'45 min',act:'Walk 45 minutes today.',sub:'',lab:'Hold to log the walk',done:'45 minute walk logged'}
      ],pick:1
    }
  };

  var C=CTX.money,size=1,sent=false,wrote=false,ready=false,WHOLD=1300,wt=null;

  function group(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');}
  function show(v){return C.dec?v.toFixed(1):group(Math.round(v));}
  function val(){var v=parseFloat(String(inp.value).replace(/,/g,''));
    return (isFinite(v)&&v>=C.lo&&v<=C.hi)?v:null;}
  /* the field is exactly as wide as what they typed, measured in the field's own
     type, so the unit and the caret always sit right against the number */
  var sizer=document.createElement('span');
  sizer.setAttribute('aria-hidden','true');
  sizer.style.cssText='position:absolute;left:0;top:0;visibility:hidden;white-space:pre;pointer-events:none;'+
    'font:700 40px/1 var(--font);letter-spacing:-.035em;font-variant-numeric:tabular-nums';
  c.querySelector('.l16-fld').appendChild(sizer);
  function fit(){sizer.textContent=inp.value||'';
    inp.style.width=Math.max(sizer.getBoundingClientRect().width+1,14)+'px';}

  function setReady(v){
    ready=v;wr.classList.toggle('rdy',v);wr.setAttribute('aria-disabled',v?'false':'true');
    wl.textContent=v?('Hold to write '+C.pre+show(val())+(C.unit?' '+C.unit:'')+' in'):C.idle;
  }
  inp.addEventListener('input',function(){
    if(wrote)return;
    root.classList.toggle('filled',inp.value.length>0);
    fit();setReady(val()!==null);
  });

  function writeIn(){
    wt=null;var v=val();if(wrote||v===null)return;
    wrote=true;root.classList.add('wrote');inp.readOnly=true;inp.value=show(v);fit();
    wfl.style.transition='width .24s ease-out';wfl.style.width='0';
    wl.textContent='Written in';whenT.textContent='typed just now';
  }
  function wStart(e){
    if(wrote||!ready)return;if(e&&e.preventDefault)e.preventDefault();
    wfl.style.transition='width '+WHOLD+'ms linear';wfl.style.width='100%';
    wt=setTimeout(writeIn,WHOLD);
  }
  function wAbort(){
    if(wrote||!wt)return;clearTimeout(wt);wt=null;
    wfl.style.transition='width .18s ease-out';wfl.style.width='0';
  }
  wr.addEventListener('pointerdown',wStart);
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){wr.addEventListener(ev,wAbort)});
  wr.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!e.repeat)wStart(e)});
  wr.addEventListener('keyup',wAbort);
  undo.addEventListener('click',function(){if(!wrote)return;clearPen();inp.focus();});

  function clearPen(){
    wrote=false;ready=false;root.classList.remove('wrote','filled');
    clearTimeout(wt);wt=null;wfl.style.transition='none';wfl.style.width='0';
    inp.readOnly=false;inp.value='';fit();
    wr.classList.remove('rdy');wr.setAttribute('aria-disabled','true');
    wl.textContent=C.idle;whenT.textContent='';
  }

  function paintSize(){
    var s=C.sizes[size];
    doB.textContent=s.act;
    doP.textContent=s.sub;doP.style.display=s.sub?'':'none';
    if(!sent)lab.textContent=s.lab;
  }
  function drawChips(){
    chipsEl.textContent='';
    C.sizes.forEach(function(o,i){
      var b=document.createElement('button');
      b.type='button';b.className='l16-chip'+(i===size?' on':'');
      b.textContent=o.t;b.setAttribute('aria-pressed',i===size?'true':'false');
      b.addEventListener('click',function(){
        if(sent)return;
        chipsEl.querySelectorAll('button').forEach(function(z){
          z.classList.remove('on');z.setAttribute('aria-pressed','false');});
        b.classList.add('on');b.setAttribute('aria-pressed','true');
        size=i;paintSize();
      });
      chipsEl.appendChild(b);
    });
  }

  /* --- the move's own hold: logging the ACTION never moves the number ------ */
  var ht=null;
  function done(){
    sent=true;pad.classList.remove('go');pad.classList.add('done');
    lab.textContent=C.sizes[size].done;
    doBox.classList.add('sent');chipsEl.classList.add('lock');
  }
  function holdOn(e){
    if(sent)return;
    if(e&&e.pointerId!=null){try{pad.setPointerCapture(e.pointerId)}catch(z){}}
    pad.classList.add('go');ht=setTimeout(done,1050);
  }
  function holdOff(){if(sent)return;clearTimeout(ht);pad.classList.remove('go');}
  pad.addEventListener('pointerdown',holdOn);
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){pad.addEventListener(ev,holdOff)});
  pad.addEventListener('keydown',function(e){
    if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();holdOn();}});
  pad.addEventListener('keyup',holdOff);

  /* --- swapping the goal: same skeleton, the goal's own words -------------- */
  function render(key){
    C=CTX[key];size=C.pick;sent=false;
    clearTimeout(ht);pad.classList.remove('done','go');
    doBox.classList.remove('sent');chipsEl.classList.remove('lock');
    goal.textContent=C.goal.replace(/&#8217;/g,'’');
    lbl.innerHTML=C.lbl;pre.textContent=C.pre;unit.textContent=C.unit;
    inp.setAttribute('aria-label',key==='money'?"write this week's money in":"write Friday's weight in");
    clearPen();drawChips();paintSize();
  }
  c.querySelectorAll('.bk button').forEach(function(b){
    b.addEventListener('click',function(){
      c.querySelectorAll('.bk button').forEach(function(z){
        z.classList.remove('on');z.setAttribute('aria-pressed','false');});
      b.classList.add('on');b.setAttribute('aria-pressed','true');
      render(b.dataset.b);
    });
  });
  render('money');
})();</script>
</section>
