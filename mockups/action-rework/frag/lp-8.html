<!-- ARCHETYPES, the surviving set: lp-1 full-bleed statement type | lp-6 vertical descent rail | lp-7 poster ceiling number |
     lp-8 hundred-mark field | lp-9 ruled ledger book | lp-10 receipt tape | lp-12 full-height week columns |
     lp-15 bottom sheet first | lp-16 horizontal corridor band | lp-17 declarative sentence over account rows |
     lp-18 centered monolith numeral -->
<section class="cell" data-k="lp-8">
<!-- PROVENANCE: every mark is one logged action, nothing else. One mark is one
     graph-paper cell at every size, so the record is drawn at its own scale
     and a small week is never inflated to look big.

     TIGHTENED RULE (Malik, 2026-08-15). "It is showing too much information."
     An Action screen shows TODAY, never how far along the journey they are.
     This screen was the worst offender in the set: it drew the whole target as
     empty cells, so the goal was literally a progress bar you could count.
     CUT: the empty cells (100, 120, 60 of them), the two bright centre rules
     that made the target read as four countable blocks, the "37 of 100" and
     "of 120 this term" readouts, the goal amount in the header, and the finish
     estimates ("the last mark lights around March"), which were arrival dates.
     THE SETTLED FLOW (Malik, 2026-08-14) then took the rest of the record.
     The marks already made were the book drawn instead of listed: forty cells
     you can count is the ledger, and the figure under them ("$1,850 moved so
     far") was that count said out loud. A number that only ever grows is a
     distance travelled, which is Consistency's face and Clarity's standing.
     LEFT: blank paper, and TONIGHT'S marks on it. The field starts empty every
     day, the size chosen says how many marks tonight has, and the wipe or the
     hold lights them one at a time until the day is written.
     KEPT: today's move, the sizes and what tonight costs at each. -->
<style>
[data-k=lp-8] .ph{font-variant-numeric:tabular-nums}
/* the field IS the grid: every mark sits in one graph-paper cell, at every size */
[data-k=lp-8] .grid{background-position:20px 84px}

/* header block sits a graph row above the field, and clear of the Dynamic
   Island: at top:24 its box ran under it */
[data-k=lp-8] .hd{position:absolute;left:20px;right:20px;top:34px}
[data-k=lp-8] .hd b{display:block;font-size:17px;font-weight:700;letter-spacing:-.015em;color:rgba(var(--ink),.96)}

/* --- the marks they made, and blank paper where the record stops --------- */
/* no empty cells are drawn: an outline for every mark the goal still wants is
   a progress bar, and counting it is exactly what this screen may not offer */
[data-k=lp-8] .field{position:absolute;left:20px;top:84px;
  width:calc(var(--cols,10) * 26px);height:calc(var(--rows,10) * 26px);
  display:grid;grid-template-columns:repeat(auto-fill,26px);grid-auto-rows:26px;
  touch-action:none;-webkit-tap-highlight-color:transparent}
[data-k=lp-8] .field i{width:26px;height:26px;background-repeat:no-repeat;background-position:center;
  background-size:14px 14px;background-image:none;
  transition:background-size .22s cubic-bezier(.2,.8,.3,1),background-image .26s ease-out}
/* the banked marks read at .70, not .88: at full brightness the field
   out-shouted the one instruction on the screen */
[data-k=lp-8] .field i.lit{background-image:linear-gradient(rgba(var(--ink),.70),rgba(var(--ink),.70))}
[data-k=lp-8] .field i.pend{cursor:pointer;background-size:10px 10px;
  background-image:linear-gradient(rgba(63,217,78,.95),rgba(63,217,78,.95));
  filter:drop-shadow(0 0 8px rgba(63,217,78,.45))}
[data-k=lp-8] .field i.pend:hover{background-size:13px 13px}
[data-k=lp-8] .field i.just{background-size:19px 19px;filter:drop-shadow(0 0 10px rgba(63,217,78,.55));
  background-image:linear-gradient(rgba(63,217,78,.95),rgba(63,217,78,.95))}
[data-k=lp-8] .field:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:6px;border-radius:4px}

/* --- today -------------------------------------------------------------- */
/* left:6 + padding:14 puts the card's text on the same 20px column as the header */
[data-k=lp-8] .card{position:absolute;left:6px;right:6px;top:408px;bottom:16px;border-radius:16px;
  padding:14px 14px 15px;
  background:rgba(22,25,31,.95);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.07),0 18px 40px rgba(0,0,0,.5);display:flex;flex-direction:column}
[data-k=lp-8] .card .act{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.24;color:rgba(var(--ink),.97)}
[data-k=lp-8] .card .sub{margin:8px 0 0;font-size:12.5px;line-height:1.4;color:rgba(var(--ink),.90)}
[data-k=lp-8] .card .sub:empty{display:none}
[data-k=lp-8] .chips{display:flex;gap:6px;margin:14px 0 0}
[data-k=lp-8] .chips button{flex:1;border:0;border-radius:10px;padding:8px 0 9px;cursor:pointer;font:inherit;
  background:rgba(var(--ink),.06);box-shadow:inset 0 1px 0 rgba(var(--ink),.06);-webkit-tap-highlight-color:transparent;
  transition:background .16s ease-out,transform .1s ease-out}
[data-k=lp-8] .chips button:active{transform:translateY(1px)}
[data-k=lp-8] .chips button em{display:block;font-style:normal;font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums;color:rgba(var(--ink),.92)}
[data-k=lp-8] .chips button u{display:block;text-decoration:none;font-size:10.5px;margin-top:3px;color:rgba(var(--ink),.72)}
[data-k=lp-8] .chips button.on{background:rgba(var(--ink),.17)}
[data-k=lp-8] .chips button.on em{color:rgba(var(--ink),.98)}
[data-k=lp-8] .chips button.on u{color:rgba(var(--ink),.90)}
[data-k=lp-8] .chips button:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:2px}
/* the consequence line carries what tonight COSTS at this size, never where
   that size lands the goal */
[data-k=lp-8] .cons{margin:11px 0 0;font-size:12px;line-height:1.4;color:rgba(var(--ink),.90)}
[data-k=lp-8] .cons:empty{display:none}
/* the completion is a HOLD (Malik, 2026-08-13): the marks light while the
   press fills, and letting go early puts every one of them back */
[data-k=lp-8] .fill{position:relative;margin-top:auto;width:100%;height:50px;border:0;border-radius:14px;
  overflow:hidden;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;
  background:rgba(235,238,248,.94);color:#0b0c10;font:700 15.5px/1 var(--font);font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;transition:background .26s ease-out,color .26s ease-out,transform .1s ease-out}
[data-k=lp-8] .fill b{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(63,217,78,.55)}
[data-k=lp-8] .fill span{position:relative}
[data-k=lp-8] .fill:active{transform:translateY(1px)}
[data-k=lp-8] .fill:focus-visible{outline:2px solid rgba(var(--ink),.55);outline-offset:2px}
[data-k=lp-8] .fill.done{background:rgba(63,217,78,.16);color:rgba(var(--ink),.96);
  box-shadow:inset 0 1px 0 rgba(var(--ink),.08);cursor:default}
[data-k=lp-8] .fill.done b{display:none}
[data-k=lp-8] .ph.logged .chips{pointer-events:none}
[data-k=lp-8] .ph.logged .chips button{background:rgba(var(--ink),.05)}
[data-k=lp-8] .ph.logged .chips button.on{background:rgba(var(--ink),.15)}
@media (prefers-reduced-motion:reduce){[data-k=lp-8] *{transition:none!important}}
</style>
<h3>The marks</h3><p class="cap">One logged action, one mark, one cell of the graph paper. The page is blank every morning and only tonight's marks land on it, wiped across or filled by the hold one at a time, so the paper shows tonight's work and never the distance.</p>
<div class="bk" role="group" aria-label="which goal this screen is carrying">
  <button type="button" class="on" data-b="money" aria-pressed="true">Money</button>
  <button type="button" data-b="body" aria-pressed="false">Body</button>
  <button type="button" data-b="school" aria-pressed="false">School &amp; career</button>
</div>
<div class="ph">
  <div class="grid"></div>
  <div class="hd"><b data-legend>Every mark is $50 moved.</b></div>

  <div class="field" tabindex="0" role="button" aria-label="wipe across tonight's marks to fill them"></div>

  <div class="card">
    <p class="act"></p>
    <p class="sub"></p>
    <div class="chips" role="group" aria-label="tonight's size"></div>
    <p class="cons"></p>
    <button type="button" class="fill"><b></b><span></span></button>
  </div>
</div>
<script>(function(){var r=document.querySelector('[data-k="lp-8"]');if(!r)return;
var ph=r.querySelector('.ph'),field=r.querySelector('.field'),
    cons=r.querySelector('.cons'),act=r.querySelector('.act'),sub=r.querySelector('.sub'),
    chipsEl=r.querySelector('.chips'),btn=r.querySelector('.fill'),
    bar=btn.querySelector('b'),btnT=btn.querySelector('span'),
    legend=r.querySelector('[data-legend]');

/* --- THE BUCKETS (ACTION-BUCKETS.md) -------------------------------------
   Same paper, three goals whose marks mean three different things. cols/rows
   only rule the paper: every mark is exactly one 26px graph cell at every
   size. Nothing is drawn until tonight's marks are, and no count of any kind
   is carried on this screen. */
var B={
  money:{cols:10,rows:5,
    legend:'Every mark is $50 moved.',
    sub:'Friday is the transfer day.',
    chips:[{n:2,em:'$100',u:'2 marks'},{n:4,em:'$200',u:'4 marks'},{n:7,em:'$350',u:'7 marks'}],pick:1,
    act:function(c){return 'Move $'+(c.n*50)+' into savings.'},
    cons:function(){return ''},
    did:function(c){return '$'+(c.n*50)+' moved into savings.'}},
  body:{cols:10,rows:4,
    legend:'Every mark is one session.',
    sub:'',
    /* length is the dial here, not marks: a session is a session, and the
       screen says so by leaving the mark count alone while the minutes move */
    chips:[{n:1,mins:30,em:'30 min',u:'easy'},{n:1,mins:45,em:'45 min',u:'normal'},{n:1,mins:70,em:'70 min',u:'long'}],pick:1,
    act:function(c){return 'Run '+c.mins+' minutes, easy pace.'},
    cons:function(c){return 'About '+c.mins+' min, the plan’s estimate.'},
    did:function(c){return c.mins+' minutes logged.'}},
  school:{cols:6,rows:5,
    legend:'Every mark is one study block.',
    sub:'Phone in another room.',
    chips:[{n:1,em:'1 block',u:'1 mark'},{n:2,em:'2 blocks',u:'2 marks'},{n:3,em:'3 blocks',u:'3 marks'}],pick:1,
    act:function(c){return ({1:'One study block.',2:'Two study blocks.',3:'Three study blocks.'})[c.n]},
    cons:function(c){return 'About '+({1:'90 min',2:'3 hours',3:'four and a half hours'})[c.n]+' tonight, the plan’s estimate.'},
    did:function(c){return c.n+(c.n===1?' block logged.':' blocks logged.')}}
};

var C=B.money,chip=C.chips[C.pick],cells=[],filled=0,logged=false;
function step(){return chip.n}
function lit(){return filled}
function left(){return step()-filled}

/* the button says what is left to fill TONIGHT, never how many the goal wants */
function label(){
  return left()?'Hold to fill '+left()+(left()===1?' mark':' marks')
    :'Logged, '+step()+(step()===1?' mark':' marks')+' tonight';
}
function paint(){
  cells.forEach(function(c,i){
    c.classList.toggle('lit',i<lit());
    c.classList.toggle('pend',!logged&&i>=lit()&&i<step());
  });
  btnT.textContent=label();
}
function done(){
  logged=true;clearHold();bar.style.transition='none';bar.style.width='0';
  btn.classList.add('done');ph.classList.add('logged');
  act.textContent=C.did(chip);
  paint();
}
function light(upTo){
  if(logged)return;
  var from=lit(),to=Math.min(step(),upTo+1);
  if(to<=from)return;
  for(var i=from;i<to;i++){(function(c,k){
    c.classList.remove('pend');c.classList.add('just');
    setTimeout(function(){c.classList.add('lit');c.classList.remove('just')},170+k*55);
  })(cells[i],i-from);}
  filled=to;
  btnT.textContent=label();
  if(!left())setTimeout(done,220+(to-from)*55);
}

/* --- the hold: the press fills the button and lights the marks with it,
       and an early release puts every mark back where it was -------------- */
var HOLD=1000,timers=[],from0=0;
function setLit(n){
  for(var i=0;i<step();i++){
    var on=i<n;
    cells[i].classList.toggle('lit',on);
    cells[i].classList.toggle('pend',!on);
  }
  filled=n;
}
function clearHold(){timers.forEach(clearTimeout);timers=[];}
function holdStart(e){
  if(logged)return;
  if(e&&e.pointerId!=null){try{btn.setPointerCapture(e.pointerId)}catch(z){}}
  clearHold();from0=filled;
  var n=step()-from0;if(n<=0)return;
  bar.style.transition='none';bar.style.width='0';
  void bar.offsetWidth;
  bar.style.transition='width '+HOLD+'ms linear';bar.style.width='100%';
  for(var i=1;i<=n;i++)(function(k){
    timers.push(setTimeout(function(){
      setLit(from0+k);
      btnT.textContent=label();
      if(k===n)done();
    },Math.round(HOLD*k/n)));
  })(i);
}
function holdStop(){
  if(logged)return;
  clearHold();
  bar.style.transition='width .18s ease-out';bar.style.width='0';
  setLit(from0);paint();
}
btn.addEventListener('pointerdown',holdStart);
['pointerup','pointerleave','pointercancel'].forEach(function(ev){btn.addEventListener(ev,holdStop)});
btn.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();holdStart();}});
btn.addEventListener('keyup',holdStop);

function drawChips(){
  chipsEl.innerHTML='';
  C.chips.forEach(function(o,i){
    var b=document.createElement('button');b.type='button';b.dataset.i=i;
    b.innerHTML='<em>'+o.em+'</em><u>'+o.u+'</u>';
    if(i===C.pick){b.classList.add('on');b.setAttribute('aria-pressed','true');}
    b.addEventListener('click',function(){
      if(logged||filled)return;
      chipsEl.querySelectorAll('button').forEach(function(x){x.classList.remove('on');x.removeAttribute('aria-pressed')});
      b.classList.add('on');b.setAttribute('aria-pressed','true');
      chip=C.chips[+b.dataset.i];
      act.textContent=C.act(chip);cons.textContent=C.cons(chip);paint();
    });
    chipsEl.appendChild(b);
  });
}

function markAt(x,y){var el=document.elementFromPoint(x,y);
  return el&&el.parentNode===field?cells.indexOf(el):-1;}
var wiping=false;
field.addEventListener('pointerdown',function(e){
  if(logged)return;var i=markAt(e.clientX,e.clientY);
  if(i<lit()||i>=step())return;
  wiping=true;try{field.setPointerCapture(e.pointerId);}catch(x){}light(i);});
field.addEventListener('pointermove',function(e){
  if(!wiping||logged)return;var i=markAt(e.clientX,e.clientY);
  if(i>=lit()&&i<step())light(i);});
['pointerup','pointercancel'].forEach(function(ev){field.addEventListener(ev,function(){wiping=false})});
field.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){e.preventDefault();light(step()-1);}});

/* --- swapping the bucket: the paper re-rules itself ---------------------- */
function render(key){
  C=B[key];chip=C.chips[C.pick];filled=0;logged=false;
  clearHold();bar.style.transition='none';bar.style.width='0';from0=0;
  btn.classList.remove('done');ph.classList.remove('logged');
  ['cols','rows'].forEach(function(k){ph.style.setProperty('--'+k,C[k])});
  legend.textContent=C.legend;
  sub.textContent=C.sub;
  field.setAttribute('aria-label','wipe across tonight’s marks to fill them');
  /* the cells are the paper's ruling, invisible until a mark is made in one:
     nothing is ever drawn for a mark that has not happened */
  var n=C.cols*C.rows,h='';for(var i=0;i<n;i++)h+='<i></i>';
  field.innerHTML=h;cells=[].slice.call(field.children);
  act.textContent=C.act(chip);cons.textContent=C.cons(chip);
  drawChips();paint();
}
r.querySelectorAll('.bk button').forEach(function(b){
  b.addEventListener('click',function(){
    r.querySelectorAll('.bk button').forEach(function(x){x.classList.remove('on');x.setAttribute('aria-pressed','false')});
    b.classList.add('on');b.setAttribute('aria-pressed','true');
    render(b.dataset.b);
  });
});
render('money');
})();</script>
</section>
